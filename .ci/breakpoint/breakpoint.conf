#!/bin/bash
# THE per-repository edit point for breakpoint.
#
# This is the ONLY file in .ci/breakpoint/ that is expected to differ between
# repositories, which is exactly why it is excluded from MANIFEST.sha256. Edit
# this; do not edit the scripts. If you find yourself needing to edit a script,
# that is a signal the value belongs here instead -- raise it upstream in
# BREAKPOINT_UPSTREAM_REPO rather than forking the copy (see README.md).
#
# Every value below is optional. With this file absent entirely, breakpoint
# still works in its zero-config shape: quick tunnel, no email, no Access.

# shellcheck disable=SC2034  # consumed by scripts that source this file

# =============================================================================
# PROVENANCE
# =============================================================================
# Where the canonical copy lives. Used by check-breakpoint-drift.sh:
#   --write             refuses to run unless the current repo IS this repo
#   --verify-upstream   fetches this repo's manifest to detect "console moved on"
BREAKPOINT_UPSTREAM_REPO="rediacc/console"

# =============================================================================
# TUNNEL
# =============================================================================
# The zone that named-mode hostnames are created under. Hostnames are
# FIRST-LEVEL by necessity: Cloudflare's Universal SSL covers the apex and one
# level of subdomain only, so `rdc-ci-123.rediacc.io` is free while
# `rdc-ci-123.ci.rediacc.io` would need Advanced Certificate Manager at
# $10/month/zone. Do not add a middle label here.
BREAKPOINT_TUNNEL_ZONE="rediacc.io"

# Allowed hostname prefixes. This is a CLOSED SET on purpose: the nightly
# sweeper finds orphans by matching tunnel names against this list, so a label
# used but not listed here is invisible to cleanup FOREVER. Adding a label means
# adding it here AND to the workflow's `tunnel-label` choice input.
BREAKPOINT_TUNNEL_LABELS="rdc-ci rdc-dev rdc-demo"

# =============================================================================
# ACCESS DELIVERY
# =============================================================================
# On a PUBLIC repository the quick-mode tunnel URL is a bearer credential:
# anyone reading the Actions log can reach a runner that holds the repo source,
# the app token, and (with debug-shell) an interactive shell. Email is what
# keeps that URL out of a world-readable log, so it is the DEFAULT channel and
# not an extra.
#
# actor=email pairs, comma-separated. An actor with no mapping is not an error;
# it falls through to the logs channel, loudly.
#
# This lives in conf rather than in a `case` inside the script (which is where
# the deleted send-access-email.sh had it) purely so the folder can be copied
# into a repo with different people. Console's mappings are unchanged.
BREAKPOINT_ACTOR_EMAILS="mfbayraktar=muhammed@rediacc.com,HamzaOzsarac=hamza@rediacc.com,04yuksel05=yuksel@rediacc.com,mehmethelveci=mehmet@rediacc.com,anilkartal=anil@rediacc.com,oiseguven=omer@rediacc.com"

# Which regional SES identity to send from. The AWS_SES_* org secrets are
# `visibility: selected` and, as of 2026-07-26, console is the only repo on the
# selected list -- so renet/account/elite take the LOGS channel until someone
# adds them. That is a working configuration, not a broken one.
BREAKPOINT_SES_REGION_VAR="AWS_SES_REGION_EU"

# =============================================================================
# EXTRA PACKAGES ON THE BOX
# =============================================================================
# Space-separated apt packages installed into every session before the tunnel
# comes up. This is the list to edit when you find yourself repeatedly
# apt-installing the same tool after SSHing in.
#
# It lives HERE, in the one file excluded from MANIFEST.sha256, precisely so
# adding a tool is not a code change: no drift-gate regeneration, no re-vendor,
# and every repo can carry its own list.
#
# Use the EXACT apt package name. There is deliberately no fallback if a name is
# wrong: install-extra-packages.sh fails the session and names the package,
# because a silently-missing tool is discovered at the worst possible moment --
# when you are already on the box trying to use it.
#
#   btm  - `bottom`, a system/process/network monitor (htop's nicer cousin).
#          NOTE the apt package really is called `btm` on Ubuntu 24.04, not
#          `bottom`; verified against the runner image's package index.
BREAKPOINT_EXTRA_PACKAGES="btm"

# =============================================================================
# ACCESS CONTROL
# =============================================================================
# Space-separated GitHub logins permitted to dispatch a session. EMPTY MEANS
# ANYONE WHO CAN DISPATCH THE WORKFLOW, which is correct for a single-operator
# repo and probably wrong for a repo with outside contributors. A breakpoint
# session is a tunnel plus a shell on a runner holding your source, so this is
# a real control and it is deliberately explicit rather than inherited.
BREAKPOINT_ALLOWED_ACTORS=""
