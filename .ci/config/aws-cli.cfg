# The aws CLI configuration every R2 call runs under (rediacc_ci.core.awscli.r2_env, .github/actions/setup-aws).
# classic, not the auto default: 2.38.1 resolves auto to the CRT client for a single process, and the first CI runs on it failed R2 multipart syncs (InvalidPart, FIRST_BYTE_TIMEOUT; run 39311676492, 2026-10-19) where the runner image's aws, on the classic client, had passed.
[default]
s3 =
  preferred_transfer_client = classic
