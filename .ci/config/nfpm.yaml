# nfpm package configuration template
# Used by build-linux-pkg.sh to create deb, rpm, apk, and archlinux packages.
# Values are injected via environment variables at build time.
#
# Docs: https://nfpm.goreleaser.com/docs/configuration/

name: "${PKG_NAME}"
arch: "${NFPM_ARCH}"
platform: linux
version: "${VERSION}"
section: "${PKG_SECTION}"
priority: "${PKG_PRIORITY}"
maintainer: "${PKG_MAINTAINER}"
description: "${PKG_DESCRIPTION}"
homepage: "${PKG_HOMEPAGE}"
license: "Proprietary"
vendor: "Rediacc"

contents:
  - src: "${BINARY_PATH}"
    dst: "/usr/local/bin/${PKG_BINARY_NAME}"
    expand: true
    file_info:
      mode: 0755

# ---------------------------------------------------------------------------
# Format-specific overrides
# ---------------------------------------------------------------------------

rpm:
  group: "Applications/System"
  compression: zstd
  signature:
    # key_file is set via NFPM_RPM_KEY_FILE env var from build-linux-pkg.sh.
    # Passphrase via $NFPM_RPM_PASSPHRASE. When key_file is empty, nfpm skips signing.
    key_file: "${NFPM_RPM_KEY_FILE}"

deb:
  compression: zstd
  signature:
    # key_file is set via NFPM_DEB_KEY_FILE env var from build-linux-pkg.sh.
    # Passphrase via $NFPM_DEB_PASSPHRASE. When key_file is empty, nfpm skips signing.
    key_file: "${NFPM_DEB_KEY_FILE}"
    type: origin

apk:
  signature:
    # key_file is set via NFPM_APK_KEY_FILE env var from build-linux-pkg.sh.
    # Uses RSA keys (not GPG). Passphrase via $NFPM_APK_PASSPHRASE.
    #
    # NO KEY EXISTS YET, so nfpm skips signing and the .apk ships unsigned. That is
    # recorded as a declared exemption in check-release-signing-coverage.sh; it is
    # the KEY that is missing, not the capability (verified by building both ways:
    # with a key the archive carries a .SIGN.RSA.*.rsa.pub member, without one it
    # carries none).
    key_file: "${NFPM_APK_KEY_FILE}"
    # PINNED, NOT DEFAULTED, and this is the one thing to get right before a key
    # ever exists. nfpm defaults key_name to the maintainer email, and APKv2 matches
    # the public key by FILENAME -- apk-keys(5): "APKv2 packages require the public
    # key filename to match the signing key name within the package". So leaving it
    # defaulted means changing PKG_MAINTAINER silently invalidates every
    # /etc/apk/keys/<name>.rsa.pub already deployed on user machines, and the
    # failure is a trust error nobody would trace back to a maintainer edit.
    key_name: "releases@rediacc.com"

archlinux:
  # NO `signature:` BLOCK, AND ONE CANNOT BE ADDED. Every other format here has one;
  # this is the odd block out, so the reason lives where the edit would be tried.
  #
  # 1. nfpm cannot sign archlinux at all. Adding `signature: {key_file: ...}` fails at
  #    CONFIG LOAD, before any build: `yaml: unmarshal errors: field signature not
  #    found in type nfpm.ArchLinux`. Upstream goreleaser/nfpm#628 is open and PR
  #    #1065 unmerged, so no pinned version supports it.
  # 2. Signing it by hand would BREAK EXISTING USERS, which is the reason that
  #    actually decides it. pacman.conf(5) defines SigLevel Optional -- what Arch
  #    ships as LocalFileSigLevel -- as "An invalid signature is a fatal error, as is
  #    a signature from a key not in the keyring." So publishing a detached .sig
  #    signed by a key no user holds turns a working `pacman -U` into a hard failure.
  #    A keyring rollout has to land FIRST (Arch Linux ARM and Chaotic-AUR both do it
  #    that way).
  #
  # Tracked as a declared exemption in .ci/scripts/quality/check-release-signing-coverage.sh,
  # which refuses an exemption for a format that IS guarded, so this cannot rot.
  pkgbase: "${PKG_NAME}"
  packager: "${PKG_MAINTAINER}"

# ---------------------------------------------------------------------------
# Per-format dependency overrides
# ---------------------------------------------------------------------------
# The 'depends' field is overridable — use 'overrides' to set format-specific
# dependencies without affecting other formats.

overrides:
  apk:
    # The CLI APK is built from a musl-linked SEA binary (node:22-alpine).
    # Only libstdc++ is needed — no glibc shim required.
    depends:
      - libstdc++
