# Docker Compose for the CI ACCOUNT-SERVER harness.
#
# Despite living under a directory called "ci", this file defines exactly one
# thing: the account server CI talks to (:3000, SQLite at /data/account.db).
#
# Usage:
#   source .ci/scripts/infra/ci-env.sh
#   docker compose -f .ci/docker/ci/docker-compose.yml up -d account-server
#
# Driven by .ci/scripts/infra/ci-start-account.sh (invoked from ci.yml) and torn
# down by ci-stop.sh.
#
# A `web:` SERVICE WAS REMOVED FROM HERE, and issue #533 is why it looked like it
# belonged. It was never started by anything: the live driver brings up
# account-server ALONE (ci-start-account.sh: `up -d account-server`), and the only
# thing that ever started `web` was ci-start.sh, which had zero execution sites
# and is deleted with it. It could not have run in CI regardless, because it named
# ${DOCKER_REGISTRY}/web with `pull_policy: never` while CI only ever publishes
# ghcr.io/rediacc/server.
#
# Deleting it also removed two collisions that no comment documented:
#   - it published :80/:443, the ports private/elite binds, so the two stacks
#     were silently mutually exclusive;
#   - it created a network literally named `rediacc_internet`, which is exactly
#     what elite standalone creates with an empty INSTANCE_NAME, so whichever
#     project came second failed to come up.
# The surviving network is namespaced `rediacc_ci_intranet` for the same reason.
# The in-network ALIAS stays `account-server`, which is load-bearing: ci-env.sh
# sets ACCOUNT_SERVER_URL=http://account-server:3000.

services:
  account-server:
    build:
      context: ../../..
      dockerfile: private/account/Dockerfile
    container_name: rediacc-account-server
    hostname: rediacc-account-server
    ports:
      - "${ACCOUNT_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/account.db
      - ED25519_PRIVATE_KEY=${ED25519_PRIVATE_KEY}
      - ED25519_PUBLIC_KEY=${ED25519_PUBLIC_KEY}
      - X25519_PRIVATE_KEY=${X25519_PRIVATE_KEY:-}
      - X25519_PUBLIC_KEY=${X25519_PUBLIC_KEY:-}
      - API_KEY=${ACCOUNT_SERVER_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - account_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      intranet:
        aliases:
          - account-server
    restart: unless-stopped

# Created by compose (not external) for standalone CI mode. The global name is
# namespaced so it cannot collide with the `rediacc_intranet` that private/elite
# creates in standalone mode; the alias above is what consumers actually resolve.
networks:
  intranet:
    name: rediacc_ci_intranet

volumes:
  account_data:
