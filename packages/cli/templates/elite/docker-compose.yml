services:
  web:
    image: ${ELITE_IMAGE:-ghcr.io/rediacc/server:${TAG}}
    pull_policy: never
    container_name: elite-web
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - ENABLE_HTTPS=false
      - DATABASE_PATH=${DATABASE_PATH:-/data/account.db}
      - DELEGATION_CERT_PATH=${DELEGATION_CERT_PATH:-/data/delegation-cert.json}
      - CONFIG_R2_ENDPOINT=${CONFIG_R2_ENDPOINT:-http://${RUSTFS_IP}:9000}
      - CONFIG_R2_BUCKET=${CONFIG_R2_BUCKET:-rediacc-configs}
      - CONFIG_R2_ACCESS_KEY_ID=${CONFIG_R2_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:?set in secrets.env}}
      - CONFIG_R2_SECRET_ACCESS_KEY=${CONFIG_R2_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:?set in secrets.env}}
      - ACCOUNT_CONFIG_SERVER_KEY=${ACCOUNT_CONFIG_SERVER_KEY:?set in secrets.env}
      - ACCOUNT_BACKUP_S3_ENDPOINT=${ACCOUNT_BACKUP_S3_ENDPOINT:-http://${RUSTFS_IP}:9000}
      - ACCOUNT_BACKUP_S3_BUCKET=${ACCOUNT_BACKUP_S3_BUCKET:-rediacc-backups}
      - ACCOUNT_BACKUP_S3_ACCESS_KEY_ID=${ACCOUNT_BACKUP_S3_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:?set in secrets.env}}
      - ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY=${ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:?set in secrets.env}}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://${ELITE_DOMAIN}}
      - ACCOUNT_BACKUP_S3_PUBLIC_ENDPOINT=${ACCOUNT_BACKUP_S3_PUBLIC_ENDPOINT:-https://${ELITE_STORE_DOMAIN}}
      - BACKUP_MAINTENANCE_INTERVAL_MS=${BACKUP_MAINTENANCE_INTERVAL_MS:-21600000}
      - ACCOUNT_ED25519_PRIVATE_KEY=${ACCOUNT_ED25519_PRIVATE_KEY:-}
      - ACCOUNT_ED25519_PUBLIC_KEY=${ACCOUNT_ED25519_PUBLIC_KEY:-}
      - ACCOUNT_X25519_PRIVATE_KEY=${ACCOUNT_X25519_PRIVATE_KEY:-}
      - ACCOUNT_X25519_PUBLIC_KEY=${ACCOUNT_X25519_PUBLIC_KEY:-}
      - ACCOUNT_SERVER_API_KEY=${ACCOUNT_SERVER_API_KEY:-}
      - ACCOUNT_JWT_SECRET=${ACCOUNT_JWT_SECRET:-}
      - DELEGATION_CERT_BASE64=${DELEGATION_CERT_BASE64:-}
      - UPSTREAM_PUBLIC_KEY=${UPSTREAM_PUBLIC_KEY:-}
      - UPSTREAM_URL=${UPSTREAM_URL:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ROOT_EMAIL=${ROOT_EMAIL:-}
      - ON_PREMISE_MODE=${ON_PREMISE_MODE:-true}
      - ON_PREMISE_PRIVATE_KEY=${ON_PREMISE_PRIVATE_KEY:-}
      - ON_PREMISE_PUBLIC_KEY=${ON_PREMISE_PUBLIC_KEY:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/web:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - "rediacc.service_name=web"
      - "rediacc.service_port=80"
      - "rediacc.domain=${ELITE_DOMAIN}"
      - "rediacc.tls=${ELITE_TLS:-}"

  # Pinned by digest: this holds customer data, so an unattended pull must not swap the engine.
  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    container_name: elite-rustfs
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?set in secrets.env}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?set in secrets.env}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data/rustfs:/data
    restart: unless-stopped
    healthcheck:
      # No -f: RustFS answers 403 to anonymous GET /, and any HTTP response means the port is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      - "rediacc.service_name=rustfs"
      - "rediacc.service_port=9000"
      - "rediacc.domain=${ELITE_STORE_DOMAIN}"
      - "rediacc.tls=${ELITE_TLS:-}"

  # Creates both buckets once the store is up; 200, 204 and 409 count as success.
  rustfs-init:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    container_name: elite-rustfs-init
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        for bucket in "$${CONFIG_BUCKET}" "$${BACKUP_BUCKET}"; do
          code=$$(curl -s -o /tmp/out -w '%{http_code}' -X PUT \
            --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user "$${AWS_ACCESS_KEY_ID}:$${AWS_SECRET_ACCESS_KEY}" \
            "$${S3_ENDPOINT}/$${bucket}")
          case "$$code" in
            200|204|409) echo "bucket $$bucket ok (HTTP $$code)" ;;
            *) echo "bucket $$bucket FAILED (HTTP $$code)"; cat /tmp/out; exit 1 ;;
          esac
        done
        echo "rustfs-init: buckets ready"
    environment:
      - S3_ENDPOINT=http://${RUSTFS_IP}:9000
      - CONFIG_BUCKET=${CONFIG_R2_BUCKET:-rediacc-configs}
      - BACKUP_BUCKET=${ACCOUNT_BACKUP_S3_BUCKET:-rediacc-backups}
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY:?set in secrets.env}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY:?set in secrets.env}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    labels:
      - "rediacc.service_name=rustfs-init"
