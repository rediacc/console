<svg width="800" height="430" viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Java4Shell needs every link in the chain</title>
  <desc id="d">Three conditions must all hold for Java4Shell. One: an x86-64 CPU with AVX-512 VBMI. On our server this holds: the AMD EPYC 9354P has avx512f, avx512bw, avx512vbmi and bmi2. Two: an affected JDK, 17.0.6 or newer, or 21, 25 or 27, before the .1 fix releases. On our server this fails: none of the 43 containers, the host, or the stopped repositories has a Java runtime. Three: an app path that decodes attacker-controlled Base64 after the JIT has compiled the decoder. With no Java, this step never comes up. The chain breaks at step two, so there was nothing to patch on the server.</desc>
  <defs>
    <marker id="arrowGray" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#3d3d3d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="430" fill="#f5f5f5"/>
  <text x="400" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Java4Shell needs all three. Our server had one.</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="220" height="190" rx="10" fill="#fff" stroke="#a02828" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. The CPU</text>
  <text x="140" y="124" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">x86-64 with AVX-512 VBMI</text>
  <text x="140" y="148" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">avx512f, avx512bw,</text>
  <text x="140" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">avx512vbmi, bmi2</text>
  <rect x="50" y="190" width="180" height="50" rx="8" fill="rgba(160,40,40,0.10)" stroke="#a02828" stroke-width="1"/>
  <text x="140" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#a02828">YES</text>
  <text x="140" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#a02828">AMD EPYC 9354P has all four</text>

  <line x1="252" y1="165" x2="286" y2="165" stroke="#3d3d3d" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- Step 2 -->
  <rect x="290" y="70" width="220" height="190" rx="10" fill="#fff" stroke="#556b2f" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. The JDK</text>
  <text x="400" y="124" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">17.0.6+, 21, 25 or 27,</text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#555">before the .1 fix builds</text>
  <text x="400" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">(Java 8 and 11: not affected)</text>
  <rect x="310" y="190" width="180" height="50" rx="8" fill="rgba(85,107,47,0.15)" stroke="#556b2f" stroke-width="1.5"/>
  <text x="400" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#556b2f">NO</text>
  <text x="400" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#556b2f">0 of 43 containers run Java</text>

  <!-- break mark -->
  <line x1="512" y1="165" x2="546" y2="165" stroke="#999" stroke-width="2.5" stroke-dasharray="4 4"/>
  <text x="529" y="152" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#556b2f">X</text>

  <!-- Step 3 -->
  <rect x="550" y="70" width="220" height="190" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#shadow)"/>
  <text x="660" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#999">3. The input path</text>
  <text x="660" y="124" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#999">app decodes Base64</text>
  <text x="660" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#999">from an attacker,</text>
  <text x="660" y="156" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#999">after the JIT warmed up</text>
  <rect x="570" y="190" width="180" height="50" rx="8" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
  <text x="660" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#999">NEVER REACHED</text>
  <text x="660" y="228" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#999">no Java, no decoder</text>

  <!-- Bottom note -->
  <rect x="80" y="300" width="640" height="96" rx="8" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="328" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#3d3d3d">The CPU check alone said "exposed". The runtime check said "nothing to patch".</text>
  <text x="400" y="352" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#3d3d3d">A probe that finds nothing is only trusted after a control finds something:</text>
  <text x="400" y="376" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#556b2f">the same loop, asked for python3, found it in every ERPNext container.</text>
</svg>
