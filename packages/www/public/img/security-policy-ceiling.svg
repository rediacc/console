<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#556b2f"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#f5f5f5"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">What an agent may do</text>
  <rect x="40" y="50" width="240" height="60" rx="8" fill="#ffffff" stroke="#a33a2a" stroke-width="2"/>
  <text x="160.0" y="77.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Organization policy</text>
  <text x="160.0" y="94.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">The ceiling</text>
  <rect x="360" y="50" width="240" height="60" rx="8" fill="#ffffff" stroke="#6f8243" stroke-width="2"/>
  <text x="480.0" y="77.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Team policy</text>
  <text x="480.0" y="94.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Narrows further</text>
  <line x1="160" y1="110" x2="260" y2="158" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="110" x2="380" y2="158" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="160" width="200" height="50" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="320.0" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Effective ceiling</text>
  <rect x="40" y="260" width="240" height="60" rx="8" fill="#ffffff" stroke="#6f8243" stroke-width="2"/>
  <text x="160.0" y="287.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Human opt-in</text>
  <text x="160.0" y="304.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Per action</text>
  <rect x="360" y="260" width="240" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480.0" y="295.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Effective ceiling</text>
  <line x1="280" y1="290" x2="303" y2="290" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="290" x2="337" y2="290" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">AND</text>
  <text x="320" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666666">Locked keys in the organization policy are ignored in a team policy.</text>
</svg>
