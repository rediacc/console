<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#556b2f"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#f5f5f5"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Three encryption layers</text>
  <rect x="40" y="50" width="560" height="70" rx="8" fill="#ffffff" stroke="#a33a2a" stroke-width="2"/>
  <text x="320.0" y="82.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">SDK layer</text>
  <text x="320.0" y="99.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Keyed by the server</text>
  <rect x="40" y="140" width="560" height="70" rx="8" fill="#ffffff" stroke="#a33a2a" stroke-width="2"/>
  <text x="320.0" y="172.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Org passphrase layer</text>
  <text x="320.0" y="189.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Keyed by the server (Worker secret)</text>
  <rect x="40" y="230" width="560" height="70" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="3"/>
  <text x="320.0" y="262.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">CEK layer</text>
  <text x="320.0" y="279.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Opens only with a slot secret held by a member</text>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666666">Red: the server holds the key. Green: only key-slot holders can unwrap it.</text>
</svg>
