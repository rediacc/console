<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">A pinned tag froze the JDK; floating tags got the fix by themselves</title>
  <desc id="d">Two lanes on a timeline from November 2023 to 20 November 2026. Top lane: the Elasticsearch template pinned elasticsearch:8.11.0, an image built on 4 November 2023 with bundled JDK 21.0.1. It never changes, so it still carries the vulnerable JDK in November 2026, and Elastic has no fixed release yet. Bottom lane: the Cassandra, Neo4j and Solr templates use floating tags 5.0, 5-community and 9-slim. Their images were rebuilt on 20 November 2026 with patched JDKs 17.0.21.1, 21.0.13.1 and 17.0.21.1, so a fresh deploy gets the fix with no change on our side.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="#f5f5f5"/>
  <text x="400" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Pinned versus floating, measured on our own templates</text>

  <!-- timeline axis -->
  <line x1="190" y1="330" x2="760" y2="330" stroke="#999" stroke-width="1.5"/>
  <line x1="220" y1="324" x2="220" y2="336" stroke="#999" stroke-width="1.5"/>
  <text x="220" y="354" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">Nov 2023</text>
  <line x1="560" y1="324" x2="560" y2="336" stroke="#999" stroke-width="1.5"/>
  <text x="560" y="354" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">17 Nov 2026: fix released</text>
  <line x1="720" y1="324" x2="720" y2="336" stroke="#999" stroke-width="1.5"/>
  <text x="720" y="354" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">20 Nov 2026</text>
  <line x1="560" y1="60" x2="560" y2="324" stroke="#a02828" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- lane labels -->
  <text x="30" y="122" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">Pinned</text>
  <text x="30" y="142" font-family="Arial, sans-serif" font-size="11" fill="#555">elasticsearch:8.11.0</text>
  <text x="30" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">Floating</text>
  <text x="30" y="262" font-family="Arial, sans-serif" font-size="11" fill="#555">cassandra:5.0</text>
  <text x="30" y="278" font-family="Arial, sans-serif" font-size="11" fill="#555">neo4j:5-community</text>
  <text x="30" y="294" font-family="Arial, sans-serif" font-size="11" fill="#555">solr:9-slim</text>

  <!-- pinned lane bar -->
  <rect x="220" y="100" width="500" height="46" rx="6" fill="rgba(160,40,40,0.10)" stroke="#a02828" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="121" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#a02828">same image since 4 Nov 2023, bundled JDK 21.0.1</text>
  <text x="470" y="138" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#a02828">vulnerable; no fixed Elastic release yet</text>
  <rect x="600" y="152" width="170" height="40" rx="6" fill="#fff" stroke="#7a5a2f" stroke-width="1.5"/>
  <text x="685" y="169" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#7a5a2f">our change: add the flag</text>
  <text x="685" y="184" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7a5a2f">-XX:-UseBASE64Intrinsics</text>

  <!-- floating lane bars -->
  <rect x="220" y="225" width="500" height="34" rx="6" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <text x="400" y="246" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">the tag moves with every upstream rebuild</text>
  <rect x="640" y="262" width="130" height="50" rx="6" fill="#556b2f" filter="url(#shadow)"/>
  <text x="705" y="282" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">rebuilt 20 Nov</text>
  <text x="705" y="299" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#e6efd8">JDK 17.0.21.1 / 21.0.13.1</text>
</svg>
