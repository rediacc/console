<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#556b2f"/>
    </marker>
  </defs>
  <rect width="680" height="390" fill="#f5f5f5"/>
  <text x="340" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">Remote MCP call</text>
  <rect x="20" y="60" width="130" height="60" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="2"/>
  <text x="85.0" y="87.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Client</text>
  <text x="85.0" y="104.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">OAuth or bearer</text>
  <rect x="190" y="60" width="140" height="60" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="2"/>
  <text x="260.0" y="87.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">MCP Worker</text>
  <text x="260.0" y="104.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Split secret</text>
  <rect x="370" y="60" width="150" height="60" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="3"/>
  <text x="445.0" y="87.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Org executor</text>
  <text x="445.0" y="104.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">CEK in RAM only</text>
  <rect x="560" y="60" width="100" height="60" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="2"/>
  <text x="610.0" y="95.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Machines</text>
  <line x1="150" y1="90" x2="188" y2="90" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="90" x2="368" y2="90" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="90" x2="558" y2="90" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="200" width="330" height="60" rx="8" fill="#ffffff" stroke="#a33a2a" stroke-width="2"/>
  <text x="355.0" y="235.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Grant expired or revoked</text>
  <line x1="260" y1="120" x2="260" y2="198" stroke="#a33a2a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="190" y="290" width="330" height="60" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
  <text x="355.0" y="325.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Client re-authorizes</text>
  <line x1="355" y1="260" x2="355" y2="288" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666666">A URL is refused in another region and never forwarded.</text>
</svg>
