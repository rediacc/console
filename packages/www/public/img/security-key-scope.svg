<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#556b2f"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#f5f5f5"/>
  <rect x="220" y="20" width="200" height="50" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="2"/>
  <text x="320.0" y="50.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Organization</text>
  <line x1="320" y1="70" x2="320" y2="95" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="100" width="200" height="50" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="2"/>
  <text x="320.0" y="130.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">One config store</text>
  <line x1="320" y1="150" x2="320" y2="175" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="180" width="200" height="50" rx="8" fill="#ffffff" stroke="#556b2f" stroke-width="3"/>
  <text x="320.0" y="210.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">One CEK</text>
  <line x1="320" y1="230" x2="320" y2="255" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="260" width="560" height="70" rx="8" fill="#ffffff" stroke="#6f8243" stroke-width="2"/>
  <text x="320.0" y="300.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Configs, each with its own content key</text>
  <rect x="450" y="100" width="170" height="50" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="535.0" y="122.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Teams</text>
  <text x="535.0" y="139.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666666">Access control only</text>
  <line x1="450" y1="125" x2="422" y2="125" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <rect x="20" y="180" width="170" height="50" rx="8" fill="#ffffff" stroke="#6f8243" stroke-width="2"/>
  <text x="105.0" y="210.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Kit per user per org</text>
  <line x1="190" y1="205" x2="218" y2="205" stroke="#556b2f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666666">Teams limit who may ask the server. They do not split the CEK.</text>
</svg>
