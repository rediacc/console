<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="display:block;width:100%;height:auto" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- The cage -->
  <g style="stroke:var(--illustration-ink-soft,#6e6e73)">
    <rect x="110" y="100" width="280" height="260" rx="18"/>
    <line x1="166" y1="100" x2="166" y2="360"/>
    <line x1="222" y1="100" x2="222" y2="360"/>
    <line x1="278" y1="100" x2="278" y2="360"/>
    <line x1="334" y1="100" x2="334" y2="360"/>
  </g>
  <!-- Your data, boxed -->
  <g style="stroke:var(--illustration-ink,#1a1a1a)">
    <rect x="180" y="180" width="140" height="100" rx="12"/>
    <line x1="206" y1="212" x2="294" y2="212"/>
    <line x1="206" y1="246" x2="294" y2="246"/>
  </g>
  <!-- The exit -->
  <g style="stroke:var(--illustration-accent,#4a7c3f)" stroke-width="5">
    <line x1="430" y1="230" x2="562" y2="230"/>
    <path d="M540 208 L568 230 L540 252"/>
  </g>
  <!-- Free copy -->
  <g style="stroke:var(--illustration-accent,#4a7c3f)">
    <rect x="600" y="180" width="140" height="100" rx="12"/>
    <line x1="626" y1="212" x2="714" y2="212"/>
    <line x1="626" y1="246" x2="714" y2="246"/>
  </g>
  <!-- Open shackle on the cage -->
  <g style="stroke:var(--illustration-accent,#4a7c3f)">
    <rect x="360" y="88" width="64" height="50" rx="10" style="fill:var(--illustration-surface,#ffffff);stroke:var(--illustration-accent,#4a7c3f)"/>
    <path d="M374 88 V70 a19 19 0 0 1 38 0 V78"/>
  </g>
</svg>
