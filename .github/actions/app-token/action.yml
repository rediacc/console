name: Generate GitHub App Token
description: >
  Generates a short-lived GitHub App installation token with preset-based
  permission scoping. Replaces long-lived GH_PAT for CI/CD operations.

inputs:
  client-id:
    description: GitHub App Client ID (numeric App ID is also accepted — both forms funnel to @octokit/auth-app)
    required: true
  private-key:
    description: GitHub App private key (PEM)
    required: true
  preset:
    description: >
      Permission preset. Pick the NARROWEST one that works — these tokens are
      minted in PR-triggered jobs whose code comes from the PR itself, and the
      app holds an `always` bypass on the main-branch ruleset, so a write-scoped
      token in a PR job is a branch-protection bypass in PR-controlled hands.

        readonly     contents:read
                     Checkout-only jobs. Fetching private submodules needs
                     nothing more than this. THIS IS THE DEFAULT AND THE RIGHT
                     ANSWER FOR ALMOST EVERY CI JOB.
        pr-read      contents:read + pull_requests:read
                     Jobs that read PR metadata (gh pr list/view, review
                     threads, comments) but never write it back.
        cd           contents:write + pull_requests:write + actions:write
                     Release/deploy paths (push-to-main, workflow_dispatch).
        housekeeping contents:write + packages:write + actions:write +
                     deployments:write
    required: false
    default: readonly
  repositories:
    description: >
      Comma-separated list of repository names (without owner) to scope the
      token to. If not set, the token is scoped to all repositories the app
      is installed on. Use the narrowest scope needed for the job.
    required: false

outputs:
  token:
    description: GitHub App installation token
    value: ${{ steps.token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Resolve permissions from preset
      id: perms
      shell: bash
      run: |
        preset="$(echo "${{ inputs.preset }}" | tr '[:upper:]' '[:lower:]' | xargs)"
        case "$preset" in
          readonly)
            echo "perm-contents=read" >> "$GITHUB_OUTPUT"
            ;;
          pr-read)
            echo "perm-contents=read" >> "$GITHUB_OUTPUT"
            echo "perm-pull-requests=read" >> "$GITHUB_OUTPUT"
            ;;
          # NOTE: the old `ci` and `push` presets were deleted, not merely
          # unused, and for the same reason: both handed contents:write to
          # PR-triggered jobs, and this App bypasses the main-branch ruleset.
          # `push` existed solely so ci-quality.yml's `quality-branch` could
          # rebase and republish the PR branch; that job now only REPORTS that a
          # rebase is needed (.ci/scripts/quality/check-branch.sh) and runs on
          # the default contents:read token. `preset: ci` and `preset: push` now
          # fail loudly here rather than silently over-scoping.
          cd)
            echo "perm-contents=write" >> "$GITHUB_OUTPUT"
            echo "perm-pull-requests=write" >> "$GITHUB_OUTPUT"
            echo "perm-actions=write" >> "$GITHUB_OUTPUT"
            # workflows:write, added 2026-09-06, ONLY on cd and only after the
            # App installation was granted it. Without it the 'Tag & GitHub
            # Release' step's `git push origin v<X>` is rejected outright:
            #   refusing to allow a GitHub App to create or update workflow
            #   <file> without workflows permission
            # whenever the tagged commit range touches .github/workflows. The
            # release then half-completes: edge deploys and the R2 artifacts
            # publish, but no git tag and no GitHub Release exist. Seen twice,
            # runs 34019022671 (v1.3.11) and 34003183456 (v1.3.8); v1.3.11 went
            # untagged for a day because of it.
            #
            # ORDER MATTERS AND IS NOT REVERSIBLE HERE: create-github-app-token
            # FAILS the mint when asked for a permission the installation does
            # not hold, so this line breaks every CD run if the grant is ever
            # withdrawn. It is deliberately not on `housekeeping`, which never
            # pushes a tag.
            echo "perm-workflows=write" >> "$GITHUB_OUTPUT"
            ;;
          housekeeping)
            echo "perm-contents=write" >> "$GITHUB_OUTPUT"
            echo "perm-packages=write" >> "$GITHUB_OUTPUT"
            echo "perm-actions=write" >> "$GITHUB_OUTPUT"
            echo "perm-deployments=write" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unknown preset: $preset"
            exit 1
            ;;
        esac

    - name: Generate token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: ${{ steps.perms.outputs.perm-contents }}
        permission-pull-requests: ${{ steps.perms.outputs.perm-pull-requests }}
        permission-actions: ${{ steps.perms.outputs.perm-actions }}
        permission-packages: ${{ steps.perms.outputs.perm-packages }}
        permission-deployments: ${{ steps.perms.outputs.perm-deployments }}
        permission-workflows: ${{ steps.perms.outputs.perm-workflows }}

    # Configure global git credentials so submodule fetches can authenticate.
    # actions/checkout uses includeIf.gitdir (local scope) which doesn't apply
    # to submodule gitdirs, causing "could not read Username" errors.
    - name: Configure global git credentials
      shell: bash
      env:
        TOKEN: ${{ steps.token.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
