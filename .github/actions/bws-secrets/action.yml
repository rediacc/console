name: Fetch secrets from Bitwarden
description: >
  Fetches named secrets from Bitwarden Secrets Manager (project ci-shared) and
  exports them as masked environment variables for the rest of the job.
  A name listed in .ci/config/bws-step-scoped.json (the production signing
  keys) must instead be STEP-SCOPED: fetched by its own call of this action
  immediately before its one consumer and blanked immediately after it by
  ./.github/actions/bws-scrub with `if: always()`, which
  check:ci-bws-step-scope enforces.
  Wraps bitwarden/sm-action so there is ONE pin site for it, not one per job,
  and so workflows name secrets by NAME rather than by UUID.

  HOW IT WORKS. sm-action addresses secrets by UUID only. Raw UUIDs in 62 job
  blocks would be unreadable and unreviewable, so the translation lives in
  .ci/config/bws-secret-map.json (name -> uuid, generated from the project
  itself) and this action does the lookup at job start. check_bws_map.py
  asserts every name requested anywhere is in that map and the map is fresh.

  WHAT FAILS LOUDLY, established 2026-09-02 against the real API rather than
  assumed: a UUID that does not exist or that the machine account cannot read
  makes /secrets/get-by-ids return 404 for the WHOLE request, so sm-action
  fails the job (src/main.rs, "The secrets provided could not be found"). A
  name absent from the map fails HERE, before sm-action runs. A malformed line
  fails here too.

  AN ORG-SETTINGS PRECONDITION THAT NO IN-TREE GATE CAN SEE. This repository
  restricts which actions may run (`allowed_actions: selected`), and
  bitwarden/sm-action is not owned by rediacc, not GitHub-owned, and not
  Marketplace-verified -- so the first CI run of this composite failed with
  "The action bitwarden/sm-action@1238aae8... is not allowed in <owner>/<repo>"
  before any secret was fetched (run 33690518859, 2026-09-02). Fixed by adding
  ONE pattern to the repository allowlist, and deliberately the exact pinned SHA
  rather than `bitwarden/*`:

      bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793

  So bumping the pin below is a THREE-PLACE change: this file's `uses:` line,
  the CHECKSUMS table in prewarm.py, and
  /repos/<owner>/<repo>/actions/permissions/selected-actions. The allowlist is
  recorded here because it is invisible in the tree -- the failure surfaces only
  after a push, and only as an action-resolution error that names no secret at
  all. (account/renet/elite are `allowed_actions: all` and needed no change.)
  Forgetting the checksum table is the safe direction: the prewarm reads the
  version from sm-action's own version.json, so an unlisted version SKIPS rather
  than serving a stale binary.

  WHAT DOES NOT FAIL: a correct UUID whose stored VALUE is empty. sm-action
  exports "" without complaint, and the Worker's zod schema normalises "" to
  undefined and validates it. That is the deploy scripts' non-empty guards'
  job (set-*-worker-secrets.sh), not this action's.

inputs:
  access-token:
    description: >
      Bitwarden machine-account access token (GitHub secret BWS_ACCESS_TOKEN).
      This is the ONE credential that stays in GitHub; everything else comes
      from Secrets Manager through it.
    required: true
  secrets:
    description: >
      One secret per line, by NAME as spelled in .ci/config/bws-secret-map.json.
      Optionally `NAME > ENV_NAME` to export under a different variable name,
      which is how one Bitwarden secret serves several regional slots
      (STRIPE_SECRET_KEY > STRIPE_SECRET_KEY_EU). Without `>` the env var is
      the name itself.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve names to UUIDs
      id: resolve
      shell: bash
      env:
        REQUESTED: ${{ inputs.secrets }}
        MAP: ${{ github.action_path }}/../../../.ci/config/bws-secret-map.json
        BWS_RESOLVE: ${{ github.action_path }}/resolve.py
      run: python3 "$BWS_RESOLVE"

    # WHY THIS STEP EXISTS, paid for on 2026-09-03 (run 33753814832, job
    # "Initialize"). sm-action ships no binary: index.js downloads
    # sm-action-<triple> from its own GitHub release on every job, ONCE, with no
    # retry. That download timed out after 5.3s, and its fallback is
    # `cargo build`, run with cwd = the WORKSPACE rather than the action
    # directory -- so it died on "could not find Cargo.toml in
    # /home/runner/work/console/console" and could never have worked here. One
    # five-second network blip therefore hard-fails the Initialize job, which
    # every other job in the run depends on.
    #
    # index.js:213-224 checks `<action_dir>/target/<triple>/release/sm-action`
    # FIRST and returns it if present, so placing the file there skips its
    # download entirely. That is what this does, with a retrying download and a pinned
    # checksum.
    #
    # THE VERSION IS DERIVED, NOT PINNED, and that is the load-bearing choice.
    # sm-action builds its URL from its own version.json, so pinning a version
    # here would let a pin bump serve a STALE binary silently -- worse than the
    # flake. We read the same version.json it reads; a version whose checksums
    # this file does not carry is a skip, not a guess.
    #
    # EVERY FAILURE HERE IS A SKIP, except a checksum mismatch. Skipping leaves
    # sm-action doing exactly what it does today, so this step can slow a job
    # down and cannot break one. A mismatch is the one loud case: the bytes at
    # a pinned release changed, and that is not a thing to route around.
    - name: Pre-place the sm-action binary (its own download has no retry)
      id: prewarm
      shell: bash
      env:
        BWS_PREWARM: ${{ github.action_path }}/prewarm.py
      run: python3 "$BWS_PREWARM"

    # THE FETCH IS A PAIR, AND EXACTLY ONE HALF RUNS. The prewarm step sets `binary` only when a verified binary sits at the path sm-action's index.js would use, and every skip leaves it empty.
    # With the binary, fetch.sh runs it directly with sm-action's own INPUT_* contract and retries a transient failure (5xx, 429, connection, timeout), which a `uses:` step cannot do and a later step cannot do for it.
    # That retry exists because job 109063577876 (run 36461941122) died on one "[503 Service Unavailable]" from Bitwarden and then printed a rotation notice for a healthy credential.
    # Without the binary, the `uses:` half fetches exactly as before, once. It still needs the `uses:` step, since it is the only way to run sm-action's own download and build path.
    - name: Fetch from Bitwarden Secrets Manager (with retry)
      id: fetch
      if: ${{ steps.prewarm.outputs.binary != '' }}
      shell: bash
      env:
        BWS_ACCESS_TOKEN: ${{ inputs.access-token }}
        INPUT_SECRETS: ${{ steps.resolve.outputs.mapping }}
        BWS_FETCH: ${{ github.action_path }}/fetch.sh
        SM_ACTION_BIN: ${{ steps.prewarm.outputs.binary }}
      run: bash "$BWS_FETCH" "$SM_ACTION_BIN"

    - name: Fetch from Bitwarden Secrets Manager (sm-action fallback, no retry)
      id: fetch-fallback
      if: ${{ steps.prewarm.outputs.binary == '' }}
      uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793  # v3.0.1
      with:
        access_token: ${{ inputs.access-token }}
        secrets: ${{ steps.resolve.outputs.mapping }}

    # THE ROTATION NOTICE, AND WHY IT IS NOT OPTIONAL.
    # `agent/plans/PLAN-bws-rotation-on-failure.md` deletes the hand-maintained expiry
    # date and makes the FAILURE the only signal. That trade makes exactly one thing
    # worse: a scheduled outage that arrived quietly becomes an unscheduled one, and CD
    # is where an unpredicted death costs most. This step is the mitigation for that
    # loss, which is why the plan marks it NOT OPTIONAL.
    #
    # THE CONDITION IS NARROW ON PURPOSE. `failure()` alone would also fire when
    # "Resolve names to UUIDs" rejected a malformed line or a name absent from the map,
    # neither of which is a credential problem, and a rotation notice printed over a
    # typo is the precision decay that teaches readers to scroll past the next one.
    # A failed fetch outcome says the resolution was fine and the fetch
    # itself is what died, which is the same narrowing the classifier does locally.
    #
    # THE CLASSIFIER RUNS IN fetch.sh, the only place that sees sm-action's stderr, and it hands this step its verdict as `steps.fetch.outputs.class`.
    # A `transient` class has already printed its own outage error naming the last status line, so the notice stays silent for it; any other value, including an absent one from a crash before classification, keeps the rotation notice as the default.
    # The `uses:` fallback has no stderr to classify, so its failure keeps the old unconditional notice.
    #
    # A MISSING NOTICE FILE IS ITSELF AN ANNOTATION, never a silent success. An `exit 0`
    # on a failed read would leave the job reporting only sm-action's own error, which
    # names no procedure at all.
    - name: Rotation notice (the fetch failed, and that is the only signal there is)
      if: ${{ failure() && ((steps.fetch.outcome == 'failure' && steps.fetch.outputs.class != 'transient') || steps.fetch-fallback.outcome == 'failure') }}
      shell: bash
      env:
        NOTICE: ${{ github.action_path }}/../../../.ci/config/bws-rotation-notice.txt
      run: |
        set -uo pipefail
        if [[ ! -s "$NOTICE" ]]; then
          echo "::error::the Bitwarden fetch failed AND .ci/config/bws-rotation-notice.txt is missing or empty at $NOTICE, so the rotation procedure cannot be printed. The credential still needs rotating; the instructions for it are what is absent."
          exit 0
        fi
        # A workflow annotation is ONE line. Literal newlines end it, so the rest of the
        # notice would be dropped on the floor with no sign that anything was lost;
        # `%0A` is the encoding GitHub documents for exactly this, and awk does the
        # joining without a subshell per line.
        body="$(awk '{ printf "%s%%0A", $0 }' "$NOTICE")"
        echo "::error title=BWS access token: rotate it::${body}"
