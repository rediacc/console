name: Fetch secrets from Bitwarden
description: >
  Fetches named secrets from Bitwarden Secrets Manager (project ci-shared) and
  exports them as masked environment variables for the rest of the job.
  Wraps bitwarden/sm-action so there is ONE pin site for it, not one per job,
  and so workflows name secrets by NAME rather than by UUID.

  HOW IT WORKS. sm-action addresses secrets by UUID only. Raw UUIDs in 62 job
  blocks would be unreadable and unreviewable, so the translation lives in
  .ci/config/bws-secret-map.json (name -> uuid, generated from the project
  itself) and this action does the lookup at job start. check_bws_map.py
  asserts every name requested anywhere is in that map and the map is fresh.

  WHAT FAILS LOUDLY, established 2026-09-02 against the real API rather than
  assumed: a UUID that does not exist or that the machine account cannot read
  makes /secrets/get-by-ids return 404 for the WHOLE request, so sm-action
  fails the job (src/main.rs, "The secrets provided could not be found"). A
  name absent from the map fails HERE, before sm-action runs. A malformed line
  fails here too.

  AN ORG-SETTINGS PRECONDITION THAT NO IN-TREE GATE CAN SEE. rediacc/console
  restricts which actions may run (`allowed_actions: selected`), and
  bitwarden/sm-action is not owned by rediacc, not GitHub-owned, and not
  Marketplace-verified -- so the first CI run of this composite failed with
  "The action bitwarden/sm-action@1238aae8... is not allowed in rediacc/console"
  before any secret was fetched (run 33690518859, 2026-09-02). Fixed by adding
  ONE pattern to the repository allowlist, and deliberately the exact pinned SHA
  rather than `bitwarden/*`:

      bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793

  So bumping the pin below is a THREE-PLACE change: this file's `uses:` line,
  the checksum table in the prewarm step, and
  /repos/rediacc/console/actions/permissions/selected-actions. The allowlist is
  recorded here because it is invisible in the tree -- the failure surfaces only
  after a push, and only as an action-resolution error that names no secret at
  all. (account/renet/elite are `allowed_actions: all` and needed no change.)
  Forgetting the checksum table is the safe direction: the prewarm reads the
  version from sm-action's own version.json, so an unlisted version SKIPS rather
  than serving a stale binary.

  WHAT DOES NOT FAIL: a correct UUID whose stored VALUE is empty. sm-action
  exports "" without complaint, and the Worker's zod schema normalises "" to
  undefined and validates it. That is the deploy scripts' non-empty guards'
  job (set-*-worker-secrets.sh), not this action's.

inputs:
  access-token:
    description: >
      Bitwarden machine-account access token (GitHub secret BWS_ACCESS_TOKEN).
      This is the ONE credential that stays in GitHub; everything else comes
      from Secrets Manager through it.
    required: true
  secrets:
    description: >
      One secret per line, by NAME as spelled in .ci/config/bws-secret-map.json.
      Optionally `NAME > ENV_NAME` to export under a different variable name,
      which is how one Bitwarden secret serves several regional slots
      (STRIPE_SECRET_KEY > STRIPE_SECRET_KEY_EU). Without `>` the env var is
      the name itself.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve names to UUIDs
      id: resolve
      shell: bash
      env:
        REQUESTED: ${{ inputs.secrets }}
        MAP: ${{ github.action_path }}/../../../.ci/config/bws-secret-map.json
      run: |
        set -euo pipefail
        [[ -f "$MAP" ]] || { echo "::error::bws-secret-map.json not found at $MAP"; exit 1; }
        # ubuntu-slim does not ship jq (backfill-release-sentinel.yml and ci.yml both
        # install it for that reason), and 11 slim jobs run this action. Install it
        # here rather than in every caller; macOS and Windows runner images carry it.
        if ! command -v jq >/dev/null 2>&1; then
          sudo apt-get install -y -qq jq >/dev/null || { echo "::error::jq is missing and could not be installed"; exit 1; }
        fi
        lines=""
        n=0
        while IFS= read -r raw; do
          line="$(echo "$raw" | sed -e 's/#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [[ -z "$line" ]] && continue
          name="${line%%>*}"; name="${name%"${name##*[![:space:]]}"}"
          if [[ "$line" == *">"* ]]; then
            env_name="${line#*>}"; env_name="${env_name#"${env_name%%[![:space:]]*}"}"
          else
            env_name="$name"
          fi
          if ! [[ "$name" =~ ^[A-Za-z0-9_.=:-]+$ && "$env_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::malformed secrets line: '$raw' (want NAME or NAME > ENV_NAME)"; exit 1
          fi
          uuid="$(jq -r --arg n "$name" '.secrets[$n].id // empty' "$MAP")"
          if [[ -z "$uuid" ]]; then
            echo "::error::secret '$name' is not in .ci/config/bws-secret-map.json. Add it to ci-shared and regenerate the map."
            exit 1
          fi
          lines+="${uuid} > ${env_name}"$'\n'
          n=$((n + 1))
        done <<<"$REQUESTED"
        if (( n == 0 )); then
          echo "::error::no secrets requested -- a fetch that fetches nothing is a wiring mistake"; exit 1
        fi
        echo "resolved $n secret(s)"
        {
          echo "mapping<<BWS_EOF"
          printf '%s' "$lines"
          echo "BWS_EOF"
        } >> "$GITHUB_OUTPUT"

    # WHY THIS STEP EXISTS, paid for on 2026-09-03 (run 33753814832, job
    # "Initialize"). sm-action ships no binary: index.js downloads
    # sm-action-<triple> from its own GitHub release on every job, ONCE, with no
    # retry. That download timed out after 5.3s, and its fallback is
    # `cargo build`, run with cwd = the WORKSPACE rather than the action
    # directory -- so it died on "could not find Cargo.toml in
    # /home/runner/work/console/console" and could never have worked here. One
    # five-second network blip therefore hard-fails the Initialize job, which
    # every other job in the run depends on.
    #
    # index.js:213-224 checks `<action_dir>/target/<triple>/release/sm-action`
    # FIRST and returns it if present, so placing the file there skips its
    # download entirely. That is what this does, with curl's retry and a pinned
    # checksum.
    #
    # THE VERSION IS DERIVED, NOT PINNED, and that is the load-bearing choice.
    # sm-action builds its URL from its own version.json, so pinning a version
    # here would let a pin bump serve a STALE binary silently -- worse than the
    # flake. We read the same version.json it reads; a version whose checksums
    # this file does not carry is a skip, not a guess.
    #
    # EVERY FAILURE HERE IS A SKIP, except a checksum mismatch. Skipping leaves
    # sm-action doing exactly what it does today, so this step can slow a job
    # down and cannot break one. A mismatch is the one loud case: the bytes at
    # a pinned release changed, and that is not a thing to route around.
    - name: Pre-place the sm-action binary (its own download has no retry)
      shell: bash
      run: |
        set -uo pipefail
        skip() { echo "::warning::bws-secrets prewarm skipped: $1"; exit 0; }

        # The action checkout lives beside the workspace, never inside it.
        actions_root="${RUNNER_WORKSPACE:-}/../_actions"
        dir="$(find "$actions_root" -maxdepth 3 -type d -path '*/bitwarden/sm-action/*' 2>/dev/null | head -1)"
        [[ -n "$dir" && -d "$dir" ]] || skip "sm-action checkout not found under _actions"

        case "${RUNNER_OS:-}/${RUNNER_ARCH:-}" in
          Linux/X64)     triple=x86_64-unknown-linux-gnu;  ext="" ;;
          Linux/ARM64)   triple=aarch64-unknown-linux-gnu; ext="" ;;
          macOS/X64)     triple=x86_64-apple-darwin;       ext="" ;;
          macOS/ARM64)   triple=aarch64-apple-darwin;      ext="" ;;
          Windows/X64)   triple=x86_64-pc-windows-msvc;    ext=".exe" ;;
          Windows/ARM64) triple=aarch64-pc-windows-msvc;   ext=".exe" ;;
          *) skip "unmapped runner ${RUNNER_OS:-?}/${RUNNER_ARCH:-?}" ;;
        esac

        dest="$dir/target/$triple/release/sm-action$ext"
        [[ -f "$dest" ]] && { echo "sm-action binary already present; nothing to do"; exit 0; }

        version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/version.json" 2>/dev/null | head -1)"
        [[ -n "$version" ]] || skip "cannot read a version from $dir/version.json"

        # Checksums of the v3.0.1 release assets, taken from the release itself.
        # Bumping the sm-action pin is now a FOUR-place change: this table, the
        # `uses:` line below, the org action allowlist (see the header), and
        # nothing else -- the version and URL follow from version.json.
        want=""
        if [[ "$version" == "3.0.1" ]]; then
          case "$triple" in
            x86_64-unknown-linux-gnu)  want=fa998e9db775d5c7bdbc0fd8840ac6474a8348cdc989176c5ce24c3d09045752 ;;
            aarch64-unknown-linux-gnu) want=35dde396e46be03c2b8f711d8ea4c3c75a3b42ab6681a260d614b17fca726989 ;;
            x86_64-apple-darwin)       want=9dfeab4d83b0347f9b5a04e8ca57f816c390b0f1c58a3d3bd7919ebfd3ab1124 ;;
            aarch64-apple-darwin)      want=a426480977db65e7ae0d50c5e0ba70508ff15bb1fc803a9b9048e5ccda8d1b73 ;;
            x86_64-pc-windows-msvc)    want=ae9cf1f9c400200cf889f17a44d7b3c9c525b9f462c0acd3cda76efab74e0174 ;;
            aarch64-pc-windows-msvc)   want=be716878c305707b7141e9581cdbf292c785f3aa3f7fbb42ac9c5e5460c09dba ;;
          esac
        fi
        [[ -n "$want" ]] || skip "no pinned checksum for sm-action $version/$triple (pin bumped without updating this table)"

        url="https://github.com/bitwarden/sm-action/releases/download/v${version}/sm-action-${triple}${ext}"
        tmp="$(mktemp)"
        if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
                  --connect-timeout 10 --max-time 180 -o "$tmp" "$url"; then
          rm -f "$tmp"
          skip "download failed after 5 retries. sm-action will now try ONCE itself; if that also fails it reports a Cargo.toml error, which is its broken source fallback, not a repo problem"
        fi

        if command -v sha256sum >/dev/null 2>&1; then got="$(sha256sum "$tmp" | cut -d" " -f1)"
        elif command -v shasum >/dev/null 2>&1; then got="$(shasum -a 256 "$tmp" | cut -d" " -f1)"
        else rm -f "$tmp"; skip "no sha256sum or shasum to verify the download with"
        fi
        if [[ "$got" != "$want" ]]; then
          rm -f "$tmp"
          echo "::error::sm-action $version/$triple checksum mismatch: got $got, pinned $want. The bytes at a pinned release changed; do not route around this."
          exit 1
        fi

        # No `set -e` here (skip() must be able to exit 0 from a failed test), so
        # the install is chained explicitly rather than trusting three bare commands.
        if ! { mkdir -p "$(dirname "$dest")" && mv "$tmp" "$dest" && chmod +x "$dest"; }; then
          rm -f "$tmp"
          skip "could not install the binary at $dest"
        fi
        echo "pre-placed sm-action $version/$triple (sha256 verified)"

    - name: Fetch from Bitwarden Secrets Manager
      uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793  # v3.0.1
      with:
        access_token: ${{ inputs.access-token }}
        secrets: ${{ steps.resolve.outputs.mapping }}
