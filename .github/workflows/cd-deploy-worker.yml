name: Deploy WWW Worker

# Reusable workflow for deploying the www Worker (marketing site + embedded
# account portal) to the edge or stable channel.
# Both channels are production-quality; "stable" serves www.rediacc.com, "edge"
# serves edge.rediacc.com. Called by Release workflow (edge, and stable for
# hotfixes) and promote-stable.yml (stable, after soak).
# Builds pages + account portal from source at the specified git ref, then deploys.

on:
  workflow_call:
    inputs:
      target:
        description: 'Deploy channel: edge or stable'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (SHA, tag, or branch)'
        required: true
        type: string
      version:
        description: 'Semver version string to embed in the marketing build footer (e.g. 1.0.3)'
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
      APP_PRIVATE_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      ACCOUNT_ED25519_PRIVATE_KEY:
        required: true
      ACCOUNT_ED25519_PUBLIC_KEY:
        required: true
      ACCOUNT_X25519_PRIVATE_KEY:
        required: true
      ACCOUNT_X25519_PUBLIC_KEY:
        required: true
      ACCOUNT_SERVER_API_KEY:
        required: true
      ACCOUNT_JWT_SECRET:
        required: true
      STRIPE_SECRET_KEY:
        required: true
      STRIPE_SANDBOX_SECRET_KEY:
        required: true
      STRIPE_WEBHOOK_SECRET_EU:
        required: true
      STRIPE_SANDBOX_WEBHOOK_SECRET:
        required: true
      AWS_SES_ACCESS_KEY_ID_EU:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_EU:
        required: true
      CLOUDFLARE_TURNSTILE_SECRET_KEY:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.target }} Worker
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'stable' && 'https://www.rediacc.com' || 'https://edge.rediacc.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            ACCOUNT_X25519_PRIVATE_KEY > BWS_ACCOUNT_X25519_PRIVATE_KEY
            ACCOUNT_X25519_PUBLIC_KEY > BWS_ACCOUNT_X25519_PUBLIC_KEY
            AWS_SES_ACCESS_KEY_ID_EU > BWS_AWS_SES_ACCESS_KEY_ID_EU
            AWS_SES_SECRET_ACCESS_KEY_EU > BWS_AWS_SES_SECRET_ACCESS_KEY_EU
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_TURNSTILE_SECRET_KEY > BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            STRIPE_SANDBOX_WEBHOOK_SECRET > BWS_STRIPE_SANDBOX_WEBHOOK_SECRET
            STRIPE_SECRET_KEY > BWS_STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET_EU > BWS_STRIPE_WEBHOOK_SECRET_EU

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ACCOUNT_ED25519_PRIVATE_KEY ACCOUNT_ED25519_PUBLIC_KEY ACCOUNT_JWT_SECRET ACCOUNT_SERVER_API_KEY ACCOUNT_X25519_PRIVATE_KEY ACCOUNT_X25519_PUBLIC_KEY AWS_SES_ACCESS_KEY_ID_EU AWS_SES_SECRET_ACCESS_KEY_EU CLOUDFLARE_API_TOKEN CLOUDFLARE_TURNSTILE_SECRET_KEY APP_PRIVATE_KEY STRIPE_SANDBOX_SECRET_KEY STRIPE_SANDBOX_WEBHOOK_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET_EU
          SHADOW_EXPECTED_MISMATCH: STRIPE_SANDBOX_WEBHOOK_SECRET
          GH_ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          GH_ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          GH_ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          GH_ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          GH_ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          GH_ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          GH_AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          GH_AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          GH_STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
          GH_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GH_STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
        run: .ci/scripts/ci/shadow-compare.sh
      - name: Init account submodule
        run: git submodule update --init private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Build pages
        run: npm run build -w @rediacc/www
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_VERSION: ${{ inputs.version }}
          # Same reason as the CI-side www build: downloads.astro fetches the
          # latest release at build time and THROWS rather than shipping an empty
          # downloads page, and unauthenticated that call is capped at 60/hour
          # per shared runner IP. CI hit it live on run 32223128728; this path had
          # the identical gap and would fail a DEPLOY the same way, which is worse.
          GITHUB_TOKEN: ${{ github.token }}
          # Single global CDN domain for tutorial/solution videos -- same value
          # for edge, stable, and PR previews. See .ci/docs/r2-media-setup.md.
          PUBLIC_VIDEO_CDN_BASE_URL: https://media.rediacc.com

      - name: Copy pages to www worker assets
        run: |
          rm -rf workers/www/dist
          mkdir -p workers/www/dist
          cp -r packages/www/dist/* workers/www/dist/

      # REMOVED: "Inject E2E videos". Unlike the two copies in ci.yml this one
      # used --search-latest, which scans the repository's artifacts rather than
      # one run's, so it could in principle have found something the per-run
      # lookups missed. It could not: no workflow produces an `e2e-videos-*`
      # artifact, and zero of the 1335 artifacts retained at removal time
      # matched that prefix. Videos reach the site through
      # PUBLIC_VIDEO_CDN_BASE_URL (media.rediacc.com) instead.

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/www/dist/account
        working-directory: private/account/web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_CI_MODE: 'false'

      - name: Install www worker dependencies
        run: npm install
        working-directory: workers/www

      - name: Set deploy target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: .ci/scripts/deploy/resolve-www-deploy-target.sh

      - name: Deploy Worker
        run: .ci/scripts/deploy/${{ steps.target.outputs.script }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.target.outputs.worker }}
          # Restored 2026-09-02 from the Bitwarden map, which is the naming
          # authority: every name below that the store holds is exported under
          # EXACTLY the stored spelling. HEAD carried an older contract
          # (SECRET_ED25519_*, STRIPE_KEY_EU) that the deploy script no longer reads.
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          AWS_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
          AWS_SES_FROM: ${{ vars.AWS_SES_FROM }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION_EU }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          ROOT_EMAIL: ${{ vars.ROOT_EMAIL }}
          SELLER_ADDRESS_LINE1: ${{ vars.SELLER_ADDRESS_LINE1 }}
          SELLER_ADDRESS_LINE2: ${{ vars.SELLER_ADDRESS_LINE2 }}
          SELLER_CITY: ${{ vars.SELLER_CITY }}
          SELLER_COUNTRY: ${{ vars.SELLER_COUNTRY }}
          SELLER_EMAIL: ${{ vars.SELLER_EMAIL }}
          SELLER_NAME: ${{ vars.SELLER_NAME }}
          SELLER_POSTAL_CODE: ${{ vars.SELLER_POSTAL_CODE }}
          SELLER_REGISTRATION_NUMBER: ${{ vars.SELLER_REGISTRATION_NUMBER }}
          SELLER_VAT_NUMBER: ${{ vars.SELLER_VAT_NUMBER }}
          # BOTH of these are per CHANNEL, not per region: stable gets the live EU
          # credentials, edge the sandbox ones (set-www-worker-secrets.sh:10-12,
          # 36-38). The unsuffixed store entries are pre-regional leftovers and are
          # NOT the source here. Restoring the ternary on the KEY was a P1 fix: it
          # had been rebuilt flat while the webhook kept its branch, so an EDGE
          # deploy would have configured the www Worker with the LIVE Stripe key
          # against a SANDBOX webhook secret -- fail-OPEN, and a pair no code path
          # expects. The map names a secret; it never says which branch reads it.
          #
          # Post-rename spelling: the live key COLLAPSED to STRIPE_SECRET_KEY
          # (one value served all three regions), so HEAD's STRIPE_SECRET_KEY_EU
          # no longer exists. The WEBHOOK secrets did not collapse -- those are
          # genuinely per region -- which is why only one side changed.
          STRIPE_SECRET_KEY: ${{ inputs.target == 'stable'
            && secrets.STRIPE_SECRET_KEY
            || secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ inputs.target == 'stable'
            && secrets.STRIPE_WEBHOOK_SECRET_EU
            || secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
        run: .ci/scripts/deploy/set-www-worker-secrets.sh

      - name: Verify Stripe webhook
        run: npx tsx scripts/verify-webhook.ts ${{ steps.target.outputs.sandbox }} --expected-url "https://${{ steps.target.outputs.domain }}/account/api/v1/webhooks/stripe"
        working-directory: private/account
        env:
          STRIPE_SECRET_KEY: ${{ inputs.target == 'stable' && secrets.STRIPE_SECRET_KEY || '' }}
          STRIPE_SANDBOX_SECRET_KEY: ${{ inputs.target != 'stable' && secrets.STRIPE_SANDBOX_SECRET_KEY || '' }}
