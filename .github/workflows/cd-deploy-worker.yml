name: Deploy WWW Worker

# Reusable workflow for deploying the www Worker (marketing site + embedded
# account portal).
# One shared www Worker serves www.rediacc.com, built from edge. Called by the edge release
# workflow (cd-release-edge.yml) only.
# Builds pages + account portal from source at the specified git ref, then deploys.

on:
  workflow_call:
    inputs:
      target:
        description: 'Label for the job name and the GitHub environment; the only caller passes edge, and the target does not change what is deployed'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (SHA, tag, or branch)'
        required: true
        type: string
      version:
        description: 'Semver version string to embed in the marketing build footer (e.g. 1.0.3)'
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
# This is a reusable workflow. A callee can never exceed what the calling job
# grants, so each job's block below is also the contract its callers must meet.
permissions: {}

jobs:
  deploy:
    name: Deploy ${{ inputs.target }} Worker
    runs-on: ubuntu-latest
    # contents: read is REQUIRED and was previously inherited from whichever
    # caller happened to invoke this file, which declared no permissions of its
    # own. The www build reads the GitHub Releases API (downloads.astro) with
    # GITHUB_TOKEN and THROWS rather than degrading, so an unauthenticated
    # 60/hr rate limit is a failed production deploy. Pinned here so this
    # workflow is self-sufficient and no caller can narrow it away.
    permissions:
      contents: read
    environment:
      name: ${{ inputs.target }}
      url: https://www.rediacc.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            ACCOUNT_X25519_PUBLIC_KEY > BWS_ACCOUNT_X25519_PUBLIC_KEY
            AWS_SES_ACCESS_KEY_ID_EU > BWS_AWS_SES_ACCESS_KEY_ID_EU
            AWS_SES_SECRET_ACCESS_KEY_EU > BWS_AWS_SES_SECRET_ACCESS_KEY_EU
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_TURNSTILE_SECRET_KEY > BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            STRIPE_SECRET_KEY > BWS_STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET_EU > BWS_STRIPE_WEBHOOK_SECRET_EU
            GITHUB_APP_ID > BWS_APP_ID
            TURNSTILE_SITE_KEY > BWS_TURNSTILE_SITE_KEY
            CLOUDFLARE_ACCOUNT_ID > BWS_CLOUDFLARE_ACCOUNT_ID
            AWS_SES_CONFIGURATION_SET > BWS_AWS_SES_CONFIGURATION_SET
            AWS_SES_FROM > BWS_AWS_SES_FROM
            AWS_SES_REGION_EU > BWS_AWS_SES_REGION_EU
            ROOT_EMAIL > BWS_ROOT_EMAIL
            SELLER_ADDRESS_LINE1 > BWS_SELLER_ADDRESS_LINE1
            SELLER_ADDRESS_LINE2 > BWS_SELLER_ADDRESS_LINE2
            SELLER_CITY > BWS_SELLER_CITY
            SELLER_COUNTRY > BWS_SELLER_COUNTRY
            SELLER_EMAIL > BWS_SELLER_EMAIL
            SELLER_NAME > BWS_SELLER_NAME
            SELLER_POSTAL_CODE > BWS_SELLER_POSTAL_CODE
            SELLER_REGISTRATION_NUMBER > BWS_SELLER_REGISTRATION_NUMBER
            SELLER_VAT_NUMBER > BWS_SELLER_VAT_NUMBER

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Init account submodule
        run: git submodule update --init private/account

      - uses: ./.github/actions/setup-node-npm

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && npm run install:natives && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Load well-known
        run: grep '^WK_' .ci/config/well-known.env >> "$GITHUB_ENV"

      - name: Build pages
        run: npm run build -w @rediacc/www
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_VERSION: ${{ inputs.version }}
          # Same reason as the CI-side www build: downloads.astro fetches the
          # latest release at build time and THROWS rather than shipping an empty
          # downloads page, and unauthenticated that call is capped at 60/hour
          # per shared runner IP. CI hit it live on run 32223128728; this path had
          # the identical gap and would fail a DEPLOY the same way, which is worse.
          GITHUB_TOKEN: ${{ github.token }}
          # Single global CDN domain for tutorial/solution videos -- same value
          # for edge, stable, and PR previews. See .ci/docs/r2-media-setup.md.
          PUBLIC_VIDEO_CDN_BASE_URL: ${{ env.WK_MEDIA_ORIGIN }}

      - name: Copy pages to www worker assets
        run: |
          rm -rf workers/www/dist
          mkdir -p workers/www/dist
          cp -r packages/www/dist/* workers/www/dist/

      # REMOVED: "Inject E2E videos". Unlike the two copies in ci.yml this one
      # used --search-latest, which scans the repository's artifacts rather than
      # one run's, so it could in principle have found something the per-run
      # lookups missed. It could not: no workflow produces an `e2e-videos-*`
      # artifact, and zero of the 1335 artifacts retained at removal time
      # matched that prefix. Videos reach the site through
      # PUBLIC_VIDEO_CDN_BASE_URL (media.rediacc.com) instead.

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/www/dist/account
        working-directory: private/account/web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ env.BWS_TURNSTILE_SITE_KEY }}
          VITE_CI_MODE: 'false'

      # The account worker enforces Turnstile whenever its secret is set, so a
      # portal built without the site key renders no widget and refuses every
      # login ("Captcha verification required", production 2026-09-24).
      - name: Portal carries the Turnstile site key
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::TURNSTILE_SITE_KEY resolved empty; refusing to deploy a portal nobody can log in to"; exit 1; }
          grep -rqF -- "$VITE_TURNSTILE_SITE_KEY" workers/www/dist/account/assets || { echo "::error::workers/www/dist/account does not contain the Turnstile site key"; exit 1; }
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ env.BWS_TURNSTILE_SITE_KEY }}

      - name: Install www worker dependencies
        run: npm install
        working-directory: workers/www

      - name: Set deploy target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.resolve_www_deploy_target

      - name: Deploy Worker
        # Each module is spelled out so check:ci-inner-timeout-reachable can
        # read the module's timers; a `-m rediacc_ci.deploy.${{ ... }}` hid
        # which one runs. deploy_www is resolve_www_deploy_target's only
        # output, and anything else is refused rather than guessed.
        run: |
          case "$DEPLOY_SCRIPT" in
            deploy_www) PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_www ;;
            *) echo "::error::unknown deploy script '$DEPLOY_SCRIPT'"; exit 1 ;;
          esac
        env:
          DEPLOY_SCRIPT: ${{ steps.target.outputs.script }}
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}

      # Step-scoped (.ci/config/bws-step-scoped.json, check:ci-bws-step-scope): this
      # fetch serves the next step only, and the scrub after it blanks the key.
      - name: Fetch the step-scoped signing key(s) for the next step only
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_X25519_PRIVATE_KEY > BWS_ACCOUNT_X25519_PRIVATE_KEY
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ steps.target.outputs.worker }}
          # Restored 2026-09-02 from the Bitwarden map, which is the naming
          # authority: every name below that the store holds is exported under
          # EXACTLY the stored spelling. HEAD carried an older contract
          # (SECRET_ED25519_*, STRIPE_KEY_EU) that the deploy script no longer reads.
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ env.BWS_ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_JWT_SECRET: ${{ env.BWS_ACCOUNT_JWT_SECRET }}
          ACCOUNT_SERVER_API_KEY: ${{ env.BWS_ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_X25519_PRIVATE_KEY: ${{ env.BWS_ACCOUNT_X25519_PRIVATE_KEY }}
          ACCOUNT_X25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_X25519_PUBLIC_KEY }}
          AWS_SES_ACCESS_KEY_ID: ${{ env.BWS_AWS_SES_ACCESS_KEY_ID_EU }}
          AWS_SES_CONFIGURATION_SET: ${{ env.BWS_AWS_SES_CONFIGURATION_SET }}
          AWS_SES_FROM: ${{ env.BWS_AWS_SES_FROM }}
          AWS_SES_REGION: ${{ env.BWS_AWS_SES_REGION_EU }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ env.BWS_AWS_SES_SECRET_ACCESS_KEY_EU }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ env.BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          ROOT_EMAIL: ${{ env.BWS_ROOT_EMAIL }}
          SELLER_ADDRESS_LINE1: ${{ env.BWS_SELLER_ADDRESS_LINE1 }}
          SELLER_ADDRESS_LINE2: ${{ env.BWS_SELLER_ADDRESS_LINE2 }}
          SELLER_CITY: ${{ env.BWS_SELLER_CITY }}
          SELLER_COUNTRY: ${{ env.BWS_SELLER_COUNTRY }}
          SELLER_EMAIL: ${{ env.BWS_SELLER_EMAIL }}
          SELLER_NAME: ${{ env.BWS_SELLER_NAME }}
          SELLER_POSTAL_CODE: ${{ env.BWS_SELLER_POSTAL_CODE }}
          SELLER_REGISTRATION_NUMBER: ${{ env.BWS_SELLER_REGISTRATION_NUMBER }}
          SELLER_VAT_NUMBER: ${{ env.BWS_SELLER_VAT_NUMBER }}
          # The one www Worker (www.rediacc.com) takes live billing on every
          # target, so the live key and the live EU webhook secret are used
          # unconditionally. The two are read as a pair from the same branch: a
          # live key with a sandbox webhook secret would fail OPEN. The unsuffixed
          # webhook store entry is a pre-regional leftover and is NOT the source.
          # The sandbox pair stays for local dev and E2E, never here.
          STRIPE_SECRET_KEY: ${{ env.BWS_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ env.BWS_STRIPE_WEBHOOK_SECRET_EU }}
        # workers/www holds the only node_modules/.bin/wrangler this job installs, and
        # `npx --no-install wrangler` resolves a local binary only, so the step runs
        # there (the same failure took Deploy Preview down in run 41348962671).
        working-directory: workers/www
        run: PYTHONPATH="$GITHUB_WORKSPACE/.ci" python3 -m rediacc_ci.deploy.set_www_worker_secrets
      - name: Blank the step-scoped signing key(s) for the rest of the job
        if: always()
        uses: ./.github/actions/bws-scrub
        with:
          names: |
            BWS_ACCOUNT_ED25519_PRIVATE_KEY
            BWS_ACCOUNT_X25519_PRIVATE_KEY

      - name: Verify Stripe webhook
        run: npx tsx scripts/verify-webhook.ts ${{ steps.target.outputs.sandbox }} --expected-url "https://${{ steps.target.outputs.domain }}/account/api/v1/webhooks/stripe"
        working-directory: private/account
        env:
          STRIPE_SECRET_KEY: ${{ env.BWS_STRIPE_SECRET_KEY }}
