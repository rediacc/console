name: Autopilot

# The v2 GitHub-side autonomy loop (docs/ci-overhaul/03-v2-autonomy.md).
# This workflow babysits a PR across CI rounds:
# gate -> (model fix/review-response round -> harness push) -> finish, with
# every write performed by the deterministic harness in .ci/scripts/autopilot/
# AFTER the model step exits. THE MODEL NEVER HOLDS A WRITE TOKEN: the only
# app-token mint in the model job sits after the model step, and the
# invariants gate (.ci/scripts/security/check-autopilot-workflow-invariants.sh)
# pins that ordering statically.
#
# ARMING (three paths, one latch; autopilot-gate.sh checks them in this order):
#   dispatch  `gh workflow run Autopilot -f pr_number=N` -- THE DISPATCH IS
#             THE ARMING ACT. Round 1 runs straight off it, and the
#             post-model state-comment write records a CAMPAIGN (campaign
#             open + the chosen model + the round cap) so the workflow_run
#             rounds that follow continue without a label existing at all.
#   campaign  the trusted state comment says `campaign: open` and rounds
#             remain. This is how the loop survives between dispatches.
#   label     the arming label, unchanged and still supported: apply it and
#             the same loop runs off the label instead of a campaign.
# STOPPING, three scopes: cancel the run kills ONE round; the
# `autopilot-blocked` label kills the LOOP (checked before every arming path);
# AUTOPILOT_ENABLED kills everything, repo-wide.
#
# The dispatch also carries the round's model, its reasoning effort, and an
# optional hold-open debug session (see the model job).
#
# STAGE FLAGS, all Actions VARIABLES (repo-level, or org-level scoped to this
# repo -- `vars.` reads both), all fail closed (ABSENT MEANS OFF). None of them
# exist yet, so this workflow lands INERT; enabling a stage is a variable flip,
# never a commit (03-v2-autonomy.md section 8):
#   AUTOPILOT_ENABLED           master switch: gate runs and logs (S1+)
#   AUTOPILOT_ALLOW_STATE       state-comment writes (S2+)
#   AUTOPILOT_ALLOW_FINISH      deterministic ready-flip / done (S3+)
#   AUTOPILOT_ALLOW_MODEL       model rounds run; pushes stay dry-run (S4+)
#   AUTOPILOT_ALLOW_PUSH        real pushes (S5+)
#   AUTOPILOT_ALLOW_SUBMODULES  submodule branches/pointers (S6); LIVE since
#                               2026-08-09, still absent = off. It also widens
#                               the post-model app token from console-only to
#                               all five repos, so flipping it on is a real
#                               increase in blast radius, not just a feature.
# EVERY STAGE FLAG IS A BOOLEAN: the only value that arms one is the literal
# string `true`. AUTOPILOT_ALLOW_MODEL carries the ALLOW_ prefix for that
# reason -- it is the S4 SWITCH, never a model name. The model NAME is the
# `model` dispatch input, recorded in the campaign. Putting a model name in
# this flag reads as false: the model job never starts, and the loop arms,
# decides go and does nothing with no error anywhere (renamed 2026-08-08 for
# exactly that trap; 03-v2-autonomy.md section 8).
# Plus configuration variables: AUTOPILOT_AUTHOR_ALLOWLIST (empty allows
# NOBODY), AUTOPILOT_APPLIER_ALLOWLIST, AUTOPILOT_LABEL, AUTOPILOT_MAX_ROUNDS,
# AUTOPILOT_BOT_LOGIN, AUTOPILOT_GIT_NAME, AUTOPILOT_GIT_EMAIL, and
# AUTOPILOT_EFFORT (low|medium|high|xhigh|max) -- the standing reasoning effort
# for AUTONOMOUS rounds, which have no dispatcher to ask. The `effort` dispatch
# input still wins for the round it is given on, and an unrecognised value in
# either place is ignored with a ::notice rather than forwarded to the CLI.
#
# IDENTITY, and the split matters: GITHUB_AUTOPILOT_APP_ID is an org VARIABLE
# (`vars.AUTOPILOT_APP_ID`, visibility scoped to console), NOT a secret. Setting
# it with `gh secret set GITHUB_AUTOPILOT_APP_ID` APPEARS TO SUCCEED and leaves the
# variable empty, which silently breaks every app-token mint below. Only
# AUTOPILOT_PRIVATE_KEY (the rediacc-autopilot app's key; the app has NO bypass
# on the console ruleset) and ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN are secrets.

on:
  workflow_run:
    workflows: ["Console CI", "Claude Review"]
    types: [completed]
  schedule:
    # Sweeper for missed events; dispatch-only, zero model cost (section 9).
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to arm, resume, or stage-test. Providing it IS the arming act: round 1 runs off this dispatch and opens a campaign.'
        required: false
        type: string

      model:
        description: 'Model for this round, recorded in the campaign so later rounds keep it.'
        required: false
        type: choice
        default: 'claude-sonnet-5'
        options: ['claude-sonnet-5', 'claude-opus-5']

      # DISPATCH-ONLY, deliberately: unlike model and max_rounds this is NOT
      # recorded in the campaign, so the autonomous rounds that follow run at
      # the model's own default. Raising effort is a per-round decision about
      # one hard failure, not a property of the whole campaign.
      effort:
        description: 'Reasoning effort for this round only (default = do not pass the flag).'
        required: false
        type: choice
        default: 'default'
        options: ['default', 'low', 'medium', 'high', 'xhigh', 'max']

      max_rounds:
        description: 'Round cap for the campaign. Empty uses the AUTOPILOT_MAX_ROUNDS variable, or 25.'
        required: false
        type: string
        default: ''

      # The three inputs below are COPIED FROM .ci/breakpoint/workflow/breakpoint.yml
      # and held to it by .ci/scripts/quality/check-autopilot-breakpoint-alignment.sh:
      # `hold-duration` mirrors breakpoint's `duration` option list exactly, and
      # the two booleans mirror its types and defaults. A debug session that
      # behaves differently here than in the tool people already know is a trap,
      # so the shapes are gated rather than merely intended to match.
      debug-shell:
        description: 'Hold the runner open with a tmate SSH/web shell after the model step. workflow_dispatch only.'
        required: false
        type: boolean
        default: false

      hold-duration:
        description: 'Minutes to hold the box open when debug-shell is on.'
        required: false
        type: choice
        default: '30'
        options: ['5', '10', '15', '30', '45', '60', '90', '120', '180', '240', '300']

      send-email:
        description: 'Email the access details. ON by default: on a public repo the URL is a bearer credential and the log is world-readable. Turning this off PRINTS the URL instead.'
        required: false
        type: boolean
        default: true

# Never kill a round mid-push: a queued duplicate exits at the gate's
# (run_id, attempt) dedup instead (03-v2-autonomy.md section 2).
concurrency:
  group: autopilot-${{ github.event.workflow_run.head_branch || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Autopilot Gate
    # Fork guard at the workflow if:, before any code runs; the gate script
    # re-checks both records. AUTOPILOT_ENABLED absent means '' != 'true':
    # off, fail closed, zero cost.
    if: >-
      github.event_name != 'schedule' &&
      vars.AUTOPILOT_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 14
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      mode: ${{ steps.decide.outputs.mode }}
      reason: ${{ steps.decide.outputs.reason }}
      round: ${{ steps.decide.outputs.round }}
      model: ${{ steps.decide.outputs.model }}
      rounds_max: ${{ steps.decide.outputs.rounds_max }}
      campaign: ${{ steps.decide.outputs.campaign }}
      dispatch_trusted: ${{ steps.decide.outputs.dispatch_trusted }}
      sig: ${{ steps.decide.outputs.sig }}
      sig_count: ${{ steps.decide.outputs.sig_count }}
      pr_number: ${{ steps.pr.outputs.number }}
      head_branch: ${{ steps.prcore.outputs.head_branch }}
      head_sha: ${{ steps.prcore.outputs.head_sha }}
      comment_id: ${{ steps.state.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      LABEL: ${{ vars.AUTOPILOT_LABEL || 'autopilot' }}
    steps:
      # WALL 4 (03-v2-autonomy.md:112-138): workflow_run is an automation
      # event, so the action's .claude/ restore never fires while
      # .claude/hooks/** still execute. The gate therefore checks out ONLY the
      # trusted ref and never PR head; the scripts below all come from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rediacc/console
          ref: main
          persist-credentials: false

      - name: Locate the armed PR
        id: pr
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          if [ -n "$DISPATCH_PR" ]; then
            n="$DISPATCH_PR"
          else
            n="$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          echo "number=$n" >>"$GITHUB_OUTPUT"
          [ -n "$n" ] || echo "::notice::autopilot gate: no open PR located; no-go"

      - name: Build PR fixture core
        id: prcore
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/fx"
          gh api "repos/$REPO/pulls/$PR" --jq '{number, author: .user.login, draft, labels: [.labels[].name], head_repo: .head.repo.full_name, base_repo: .base.repo.full_name, head_sha: .head.sha, head_branch: .head.ref}' >"$RUNNER_TEMP/fx/pr-core.json"
          echo "head_sha=$(jq -r '.head_sha' "$RUNNER_TEMP/fx/pr-core.json")" >>"$GITHUB_OUTPUT"
          echo "head_branch=$(jq -r '.head_branch' "$RUNNER_TEMP/fx/pr-core.json")" >>"$GITHUB_OUTPUT"

      # On dispatch the payload is SYNTHESIZED from the head's completed CI
      # run, plus one key the real payload never carries: autopilot_dispatch.
      # Its presence is what tells the gate this round was armed by a
      # dispatch, and it is built with `jq --arg` from env so no input value
      # is ever shell text (the invariants gate catches github.event.*, not
      # inputs.*, so this discipline is on the author).
      #
      # A head with no completed CI run is a NO-GO WITH A REASON, not a dead
      # step: the bare `jq -e` that used to close this block exited 1 and
      # painted the gate red with nothing on stdout explaining it, which is
      # exactly what a dispatch made a minute too early produces.
      - name: Build event fixture
        id: ev
        if: steps.pr.outputs.number != ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ steps.prcore.outputs.head_sha }}
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_MODEL: ${{ inputs.model }}
          DISPATCH_MAX_ROUNDS: ${{ inputs.max_rounds }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            cp "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/fx/event.json"
          else
            gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&status=completed&per_page=1" --jq '{workflow_run: (.workflow_runs[0] | {conclusion, id, run_attempt, head_sha, head_repository: {full_name: .head_repository.full_name}}), repository: {full_name: env.REPO}}' | jq --arg a "$DISPATCH_ACTOR" --arg p "$DISPATCH_PR" --arg m "$DISPATCH_MODEL" --arg r "$DISPATCH_MAX_ROUNDS" '. + {autopilot_dispatch: {actor: $a, pr_input: $p, model: $m, max_rounds: $r}}' >"$RUNNER_TEMP/fx/event.json"
          fi
          jq -e '.workflow_run.id' "$RUNNER_TEMP/fx/event.json" >/dev/null 2>&1 && r=true || r=false
          echo "ready=$r" >>"$GITHUB_OUTPUT"
          [ "$r" = "true" ] || echo "::notice::autopilot gate: head $HEAD_SHA has no completed Console CI run yet, so there is nothing to classify; dispatch again once CI finishes. No-go, zero cost."

      - name: Build PR fixture signals
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.prcore.outputs.head_sha }}
        run: |
          applier="$(gh api "repos/$REPO/issues/$PR/timeline" --paginate --jq '[.[] | select(.event=="labeled" and .label.name==env.LABEL)] | (last.actor.login // "")')"
          rc=0
          PR_NUMBER="$PR" .ci/scripts/quality/check-resolved-threads.sh >/dev/null 2>&1 || rc=$?
          threads="$([ "$rc" -eq 0 ] && echo 0 || echo 1)"
          red="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=Review%20Complete" --jq '([.check_runs[] | select(.conclusion == "failure")] | length) > 0')"
          jq --arg a "$applier" --argjson t "$threads" --argjson r "$red" '. + {label_applier: $a, unresolved_threads: $t, review_gate_red: $r}' "$RUNNER_TEMP/fx/pr-core.json" >"$RUNNER_TEMP/fx/pr.json"

      - name: Build failed-jobs and watchdog fixtures
        if: steps.pr.outputs.number != '' && steps.ev.outputs.ready == 'true'
        run: |
          run_id="$(jq -r '.workflow_run.id' "$RUNNER_TEMP/fx/event.json")"
          gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" --paginate --jq '.jobs[] | select(.conclusion == "failure") | .name' >"$RUNNER_TEMP/fx/failed-jobs.txt"
          for s in in_progress queued; do
            gh api "repos/$REPO/actions/workflows/watchdog-monitor.yml/runs?status=$s&per_page=50" --jq '.workflow_runs[] | .display_title // ""'
          done | grep -F "run $run_id " | grep -F 'rerun pending' >"$RUNNER_TEMP/fx/watchdog.txt" || true

      # WHOSE TEXT MAY REACH THE MODEL is decided HERE, in the read-only gate,
      # and never in the model job: this step holds github.token with
      # pull-requests:read and nothing else, and its output is an artifact the
      # round consumes rather than a live API the round can widen
      # (03-v2-autonomy.md section 6, residual 1). review-payload.sh keeps
      # only unresolved, non-outdated threads whose ROOT comment author is the
      # review pipeline. The console PR BODY rides along so the linked
      # submodule PRs are fetched too: the Submodule Branches gate reds console
      # over threads living in another repository, and a round that cannot see
      # them cannot clear it.
      #
      # A FETCH FAILURE IS NOT A GATE FAILURE, but it is not silence either.
      # Failing the whole gate here would let one GraphQL hiccup stop fix
      # rounds that never wanted a payload; instead no payload file is
      # written, and the Compose step refuses a review-response round that
      # finds none. Fail closed exactly where the payload matters.
      - name: Build review payload fixture
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          rc=0
          gh pr view "$PR" --repo "$REPO" --json body --jq '.body // ""' >"$RUNNER_TEMP/fx/pr-body.md" || true
          .ci/scripts/autopilot/fetch-review-threads.sh --pr "$PR" --repo "$REPO" --body "$RUNNER_TEMP/fx/pr-body.md" --out "$RUNNER_TEMP/fx/review-threads.json" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::autopilot gate: review threads could not be fetched; a review-response round will refuse rather than run on a partial payload"
            exit 0
          fi
          .ci/scripts/autopilot/review-payload.sh --threads "$RUNNER_TEMP/fx/review-threads.json" --author-filter github-actions --out "$RUNNER_TEMP/fx/review-payload.json"

      - name: Select the trusted state comment
        id: state
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
          BOT: ${{ vars.AUTOPILOT_BOT_LOGIN || 'rediacc-autopilot[bot]' }}
        run: |
          # --slurp, and it is load-bearing: `--paginate --jq` applies the
          # filter PER PAGE and concatenates, so a PR past 30 comments wrote
          # two top-level arrays into this file and state-comment.sh select
          # then emitted two verdicts. --slurp wraps the pages first, and
          # `.[][]` flattens them back into one comment stream. The jq step is
          # a SEPARATE pipe: the runner's gh refuses `--slurp` combined with
          # `--jq` ("not supported"), which killed the first live dispatch on
          # 2026-08-09 while the local gh accepted it happily.
          gh api "repos/$REPO/issues/$PR/comments" --paginate --slurp >"$RUNNER_TEMP/fx/comments.raw.json"
          jq '[.[][] | {id, author: .user.login, body}]' "$RUNNER_TEMP/fx/comments.raw.json" >"$RUNNER_TEMP/fx/comments.json"
          sel="$(.ci/scripts/autopilot/state-comment.sh select --comments "$RUNNER_TEMP/fx/comments.json" --bot "$BOT")"
          jq -r '.body // ""' <<<"$sel" >"$RUNNER_TEMP/fx/state.txt"
          echo "comment_id=$(jq -r '.id // ""' <<<"$sel")" >>"$GITHUB_OUTPUT"

      # Every no-go below costs zero model tokens: the model job only starts
      # on a go decision (03-v2-autonomy.md section 2).
      - name: Gate decision
        id: decide
        if: steps.pr.outputs.number != '' && steps.ev.outputs.ready == 'true'
        env:
          AUTOPILOT_ENABLED: ${{ vars.AUTOPILOT_ENABLED }}
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_PUSH }}
          AUTOPILOT_AUTHOR_ALLOWLIST: ${{ vars.AUTOPILOT_AUTHOR_ALLOWLIST }}
          AUTOPILOT_APPLIER_ALLOWLIST: ${{ vars.AUTOPILOT_APPLIER_ALLOWLIST }}
          AUTOPILOT_LABEL: ${{ vars.AUTOPILOT_LABEL }}
          AUTOPILOT_MAX_ROUNDS: ${{ vars.AUTOPILOT_MAX_ROUNDS }}
        run: |
          .ci/scripts/autopilot/autopilot-gate.sh --classify --event "$RUNNER_TEMP/fx/event.json" --pr "$RUNNER_TEMP/fx/pr.json" --state "$RUNNER_TEMP/fx/state.txt" --failed-jobs "$RUNNER_TEMP/fx/failed-jobs.txt" --watchdog "$RUNNER_TEMP/fx/watchdog.txt" >"$RUNNER_TEMP/fx/decision.json"
          cat "$RUNNER_TEMP/fx/decision.json"
          cat "$RUNNER_TEMP/fx/decision.json" >>"$GITHUB_STEP_SUMMARY"
          for k in decision mode reason round model rounds_max campaign dispatch_trusted sig sig_count; do
            echo "$k=$(jq -r ".$k" "$RUNNER_TEMP/fx/decision.json")" >>"$GITHUB_OUTPUT"
          done

      - name: Upload fixtures
        if: steps.pr.outputs.number != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopilot-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/fx
          retention-days: 7

  model:
    name: Autopilot Round
    needs: gate
    # The model runs only on a go decision for a model mode, and only when the
    # model stage is armed. Ready-flip and done are deterministic and go to
    # the finish job instead.
    #
    # AUTOPILOT_ALLOW_MODEL is the S4 SWITCH, not the model name: the only
    # value that arms it is `true`. The model NAME comes from the `model`
    # dispatch input / the campaign field, and reaches the round via
    # needs.gate.outputs.model. Putting a model name in this variable reads as
    # false and disarms the whole job silently.
    #
    # AUTOPILOT_ALLOW_STATE IS A STRUCTURAL PRECONDITION, not a second copy of
    # the state-write gate below. A round that runs without it produces a
    # push, a resolved thread or an escalation and then CANNOT record the
    # round in the ledger -- so the next event re-classifies from a state
    # comment that never learned this round happened, and the round counter
    # that bounds the whole loop (03-v2-autonomy.md section 4's termination
    # proof) stops counting. Stage order is S2 before S4 precisely so this
    # combination never exists; the invariant `model-without-state-guard` in
    # check-autopilot-workflow-invariants.sh pins it statically.
    if: >-
      needs.gate.outputs.decision == 'go' &&
      (needs.gate.outputs.mode == 'fix' || needs.gate.outputs.mode == 'review-response') &&
      vars.AUTOPILOT_ALLOW_MODEL == 'true' &&
      vars.AUTOPILOT_ALLOW_STATE == 'true'
    runs-on: ubuntu-latest
    # 30 for a normal round. A debug-shell dispatch holds the runner open for
    # up to `hold-duration` (300) AFTER the round, so it needs its own
    # ceiling: 350, not 360, because 360 is exactly GitHub's hosted-job cap
    # and declaring it makes the platform kill race the declared timeout --
    # the reasoning is breakpoint.yml's, and so is the number. Actions
    # expressions have NO ARITHMETIC, so this is a choice between two
    # constants rather than duration + slack.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true') && 350 || 30 }}
    # contents:read is the WHOLE grant while the model runs. The push, the
    # state comment and the escalation label all use the app token minted
    # AFTER the model step below.
    permissions:
      contents: read
      actions: read
    env:
      REPO: ${{ github.repository }}
    steps:
      # WALL 4 (03-v2-autonomy.md:112-138): the trusted ref lands FIRST, so
      # the harness scripts and the protected-config snapshot both predate any
      # PR-authored byte reaching this workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rediacc/console
          ref: main
          persist-credentials: false

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN > BWS_ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN
            AWS_SES_ACCESS_KEY_ID_EU > BWS_AWS_SES_ACCESS_KEY_ID_EU
            AWS_SES_SECRET_ACCESS_KEY_EU > BWS_AWS_SES_SECRET_ACCESS_KEY_EU
            GITHUB_AUTOPILOT_PRIVATE_KEY > BWS_AUTOPILOT_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN AWS_SES_ACCESS_KEY_ID_EU AWS_SES_SECRET_ACCESS_KEY_EU AUTOPILOT_PRIVATE_KEY
          GH_ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          GH_AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          GH_AUTOPILOT_PRIVATE_KEY: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then echo "shadow $n match"; else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # $RUNNER_TEMP survives both the PR-head checkout (which empties the
      # workspace) and the action's untracked-file reset; proven the hard way
      # by the review pipeline (claude-review-reusable.yml).
      - name: Stage harness outside the workspace
        run: |
          rm -rf "$RUNNER_TEMP/harness"
          mkdir -p "$RUNNER_TEMP/harness"
          cp -r .ci "$RUNNER_TEMP/harness/.ci"

      - name: Snapshot trusted agent config
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/restore-trusted-config.sh" snapshot --checkout "$GITHUB_WORKSPACE" --snapshot "$RUNNER_TEMP/trusted-config"

      # PR-AUTHORED CONTENT enters here, and only here. persist-credentials
      # MUST stay false: the model reads attacker-influenceable text with
      # egress tools available, and a bearer string in .git/config would turn
      # capability-bounded-by-job into an exfiltratable credential (same
      # analysis as claude-review-reusable.yml's PR-head checkout).
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.head_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autopilot-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/fx

      # WALL 4 mitigation, active half: overwrite the protected set from the
      # pre-checkout snapshot and quarantine the branch's copies as data, so
      # the hooks that execute during the model step are main's hooks.
      - name: Restore trusted agent config over the PR checkout
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/restore-trusted-config.sh" restore --checkout "$GITHUB_WORKSPACE" --snapshot "$RUNNER_TEMP/trusted-config" --quarantine "$RUNNER_TEMP/quarantine"

      # The control, live in production: if the restore above ever stops
      # holding, this dies before the model gets a shell.
      - name: Assert the protected set matches the trusted snapshot
        id: restore_assert
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/restore-trusted-config.sh" assert --checkout "$GITHUB_WORKSPACE" --snapshot "$RUNNER_TEMP/trusted-config"

      # TRIPWIRE, copied from claude-review-reusable.yml: if anyone
      # re-introduces persisted credentials on the PR-head checkout, die here
      # instead of handing a bearer token to the model.
      - name: Assert no credential was persisted into the workspace
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader' >/dev/null 2>&1; then
            echo "::error::The PR-head checkout persisted a credential into .git/config."
            exit 1
          fi
          echo "No persisted credential in the workspace."

      - name: Record pre-model HEAD
        id: premodel
        run: |
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Select prompt template
        id: template
        env:
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          case "$MODE" in
            fix) echo "file=fix-round.md" >>"$GITHUB_OUTPUT" ;;
            review-response) echo "file=review-response.md" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::no prompt template for mode '$MODE'" && exit 1 ;;
          esac

      # The injected <autopilot_state> block is the model's ONLY state
      # channel: agent mode inlines no PR text at all (03-v2-autonomy.md
      # wall 1), so everything the round needs rides in the prompt.
      # A review-response round also receives <review_payload>: the gate's
      # author-filtered thread set (03-v2-autonomy.md section 6, residual 1).
      # compose-prompt.sh REFUSES a review round that finds no payload rather
      # than answering findings it never read.
      - name: Compose prompt
        id: prompt
        env:
          TEMPLATE: ${{ steps.template.outputs.file }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/compose-prompt.sh" --prompts "$RUNNER_TEMP/harness/.ci/scripts/autopilot/prompts" --fx "$RUNNER_TEMP/fx" --template "$TEMPLATE" --mode "$MODE" --out "$RUNNER_TEMP/prompt.md"

      # claude_args is assembled HERE, from env, rather than interpolated at
      # the call site: the model is now a dispatch input carried in the
      # campaign, and two hardcoded copies of an argument list drift (the
      # review pipeline paid for exactly that with a log line that claimed a
      # model the run had not used). The gate has already constrained
      # needs.gate.outputs.model to its allowlist, so nothing arbitrary can
      # reach the flag.
      #
      # --effort rides the same list. It IS forwarded: claude-code-action
      # leaves every unrecognised claude_args flag in `extraArgs`
      # (base-action/src/parse-sdk-options.ts at the pinned SHA), and the
      # agent SDK emits every extraArgs entry to the CLI verbatim as
      # `--<key> <value>`, which is the same path the SDK uses for its own
      # `effort` option. 'default' means: do not pass the flag at all.
      #
      # AUTOPILOT_EFFORT is the standing setting for AUTONOMOUS rounds, which
      # have nobody to ask: before it, every unattended round ran at the
      # model's own default and the only lever was to dispatch each round by
      # hand. The dispatch input still wins when present, and an unrecognised
      # value in either is ignored with a ::notice rather than forwarded, since
      # `--effort banana` fails the round after paying for the runner.
      - name: Resolve the round's model arguments
        id: margs
        env:
          MODEL: ${{ needs.gate.outputs.model }}
          MODE: ${{ needs.gate.outputs.mode }}
          EFFORT: ${{ inputs.effort }}
          AUTOPILOT_EFFORT: ${{ vars.AUTOPILOT_EFFORT }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/resolve-model-args.sh" --model "$MODEL" --mode "$MODE" --effort "$EFFORT" --effort-var "$AUTOPILOT_EFFORT"

      # NO WRITE TOKEN: github_token carries this job's contents:read grant,
      # comments and pushes are impossible from inside the model, and the app
      # token does not exist yet. track_progress stays 'false': it hard-errors
      # on workflow_run, and its tag-mode fetch is the credentialed path this
      # job must never take (see claude-review-reusable.yml's TRACK_PROGRESS).
      - name: Model round
        id: claude
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1.0.180
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          track_progress: 'false'
          # The file tools MUST be allowed explicitly: with a permissions
          # allowlist present, everything unlisted is denied, and the first
          # two live rounds (2026-08-09, runs 31321211521 + 31326053280)
          # burned 41 turns / $1.34 with 21 denials because the model could
          # neither edit the fix nor write handoff.json. Allowing Edit/Write
          # does not touch the no-write-token wall: file edits are local to
          # the runner; every commit/push still happens post-model in the
          # harness, gated by the boundary.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Read",
                  "Glob",
                  "Grep",
                  "Edit",
                  "Write",
                  "MultiEdit",
                  "Bash(npm run:*)",
                  "Bash(npx tsc:*)",
                  "Bash(git status:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(gh run view:*)",
                  "Bash(gh api repos/rediacc/console/actions/*)"
                ]
              }
            }
          claude_args: ${{ steps.margs.outputs.args }}

      # The handoff contract says the model edits files and never commits;
      # a moved HEAD means it minted commits anyway, and nothing it did can
      # be trusted mechanically. Escalate loudly.
      - name: Assert the model left HEAD alone
        env:
          PRE_SHA: ${{ steps.premodel.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$PRE_SHA" ]; then
            echo "::error::HEAD moved during the model step; refusing to touch the result"
            exit 1
          fi

      # =====================================================================
      # HOLD-OPEN DEBUG SESSION (workflow_dispatch + debug-shell only)
      # =====================================================================
      # PLACEMENT IS THE SECURITY DECISION, and it is why this sits here
      # rather than at the end of the job where a debug step naturally wants
      # to live. The window between "the model exited" and "the app token is
      # minted" is the only point where the workspace holds the round's whole
      # result AND no write credential exists anywhere on the runner. Two
      # steps later, `Wire push authentication` writes the app token into
      # .git/config -- a human on this box after that line has a repo-write
      # bearer token, which is a different feature with a different blast
      # radius. Never move these steps down.
      #
      # Autonomous rounds can never reach any of it: `github.event_name ==
      # 'workflow_dispatch'` is checked alongside the input, so a workflow_run
      # round cannot hold a runner open even if the inputs context leaked a
      # truthy value.
      #
      # `dispatch_trusted` is the third condition and it is NOT redundant with
      # the gate's go decision. A round can be armed by the LABEL, whose trust
      # check is the label applier -- a different person from whoever pressed
      # Run workflow. Without this condition, anyone with workflow-dispatch
      # rights could get an interactive shell on a runner holding the repo
      # source by dispatching an already-label-armed PR. The gate reports the
      # DISPATCHER's allowlist membership separately for exactly this step.
      #
      # Machinery is the vendored breakpoint tool (.ci/breakpoint), invoked
      # from $RUNNER_TEMP/harness -- the TRUSTED copy staged before the PR
      # head landed. Calling .ci/breakpoint out of $GITHUB_WORKSPACE would
      # execute PR-authored shell, which is the whole thing wall 4 exists to
      # prevent.

      # A debug shell is a human reading this disk, and the model step may
      # have left OAuth material on it. Scrub, then ASSERT: a scrub whose
      # result is never checked is a claim, not a control.
      - name: Scrub agent credentials before the debug session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        run: |
          rm -rf "$HOME/.claude/.credentials.json" "$HOME/.claude.json" "$HOME/.claude/statsig"
          find "$HOME/.claude" "$RUNNER_TEMP" -name '*credential*' -exec rm -rf {} + 2>/dev/null || true
          left="$(find "$HOME/.claude" "$RUNNER_TEMP" -name '*credential*' 2>/dev/null | head -5)"
          [ -z "$left" ] || { echo "::error::credential material survived the scrub: $left"; exit 1; }
          echo "no credential files remain under \$HOME/.claude or \$RUNNER_TEMP"

      - name: Start the debug origin
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        run: |
          "$RUNNER_TEMP/harness/.ci/breakpoint/scripts/start-origin.sh" --port 8080 --services none --desktop none >/dev/null

      - name: Start the debug shell
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        run: |
          "$RUNNER_TEMP/harness/.ci/breakpoint/scripts/start-shell.sh" --timeout 90

      # QUICK MODE ONLY, and therefore NO CLOUDFLARE CREDENTIAL IN THIS
      # STEP'S env. start-tunnel.sh reads CLOUDFLARE_BREAKPOINT_TUNNEL_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID only in start_named(); quick mode never touches
      # them, and stop-breakpoint.sh skips its whole account-side block when
      # they are absent (it is written to be mode-agnostic for exactly this).
      # Passing an unused Cloudflare token (tunnel edit + rediacc.io DNS edit)
      # into the one step sequence whose PURPOSE is to put a human on this
      # runner would hand that human the token for nothing.
      #
      # The tunnel URL is DELIBERATELY not a step output and appears in no
      # env: block. The runner prints a step's env: before the step runs, so
      # a URL routed that way is published seconds before ::add-mask:: can
      # cover it -- the live leak in run 30254567365. It travels in the
      # session state file instead, which publish-endpoints.sh reads.
      #
      # --label rdc-ci, not 'autopilot': derive-descriptor.sh validates the
      # label against BREAKPOINT_TUNNEL_LABELS (a CLOSED set, so the orphan
      # sweeper can only reap names it can match) and exits 4 on anything
      # else, which would kill the tunnel step outright.
      - name: Start the debug tunnel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/harness/.ci/breakpoint/scripts/start-tunnel.sh" --mode quick --origin http://localhost:8080 --label rdc-ci --run-id "$GITHUB_RUN_ID" >/dev/null

      # Email-first, per breakpoint's access rules: on a public repo the URL
      # is a bearer credential, so send-email defaults to true and the logs
      # channel is the loud fallback that warns about the exposure.
      - name: Publish the debug session details
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_SES_REGION_EU }}
          AWS_SES_FROM: ${{ vars.AWS_SES_FROM }}
          GITHUB_ACTOR: ${{ github.actor }}
          BP_SEND_EMAIL: ${{ inputs.send-email }}
          BP_DURATION: ${{ inputs.hold-duration }}
        run: |
          "$RUNNER_TEMP/harness/.ci/breakpoint/scripts/publish-endpoints.sh" --send-email "$BP_SEND_EMAIL" --duration "$BP_DURATION"

      - name: Hold the runner open
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        env:
          BP_DURATION: ${{ inputs.hold-duration }}
        run: |
          "$RUNNER_TEMP/harness/.ci/breakpoint/scripts/hold-breakpoint.sh" --duration-min "$BP_DURATION" --origin http://localhost:8080

      # always(), because the session that FAILED is the one that most needs
      # its tunnel and its shell taken down. One script call, not a chain: a
      # cancelled run gets only a short grace before SIGKILL.
      - name: Tear down the debug session
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.debug-shell && needs.gate.outputs.dispatch_trusted == 'true' }}
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/harness/.ci/breakpoint/scripts/stop-breakpoint.sh" --label rdc-ci --run-id "$GITHUB_RUN_ID"

      # INVARIANT 1 (03-v2-autonomy.md section 0): the FIRST app-token mint in
      # this job sits AFTER the model step, so no write token ever exists in
      # the model's process environment. The invariants gate pins this order.
      #
      # THE SCOPE FOLLOWS THE STAGE FLAG. With submodules disarmed this token
      # can write console and nothing else, which is the narrowest scope the
      # round can do its job with. Arming S6 widens it to all five repos in one
      # step, because a submodule push and its PR need write there.
      # 03-v2-autonomy.md section 5 asks for per-ROUND scoping (exactly the
      # repos in that round's handoff); that needs the handoff parsed before
      # the mint, and the handoff is untrusted, so it is deliberately NOT done
      # here. The flag-shaped approximation keeps the common case narrow.
      - name: Mint post-model app token
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
          preset: cd
          repositories: ${{ vars.AUTOPILOT_ALLOW_SUBMODULES == 'true' && 'console,renet,account,elite,homebrew-tap' || 'console' }}

      - name: Wire push authentication
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPO}.git"

      # The security boundary: validate-handoff -> stage exactly files[] ->
      # exfil-tripwire -> commit -F -> push by explicit SHA. Push stays a
      # dry-run until AUTOPILOT_ALLOW_PUSH is 'true' (S4 vs S5).
      #
      # ALL THREE OUTCOMES EXIT 0. `escalate` and `no-change` are round
      # RESULTS, not failures, and the steps below branch on the validated
      # verdict rather than on this step's colour -- which is what keeps an
      # escalation's REASON in front of the operator instead of losing it to a
      # red job and a wordless label.
      - name: Run the harness boundary
        id: boundary
        env:
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_PUSH }}
          AUTOPILOT_ALLOW_SUBMODULES: ${{ vars.AUTOPILOT_ALLOW_SUBMODULES }}
          AUTOPILOT_GIT_NAME: ${{ vars.AUTOPILOT_GIT_NAME }}
          AUTOPILOT_GIT_EMAIL: ${{ vars.AUTOPILOT_GIT_EMAIL }}
          HEAD_BRANCH: ${{ needs.gate.outputs.head_branch }}
        run: |
          args=(--root "$GITHUB_WORKSPACE" --handoff "$GITHUB_WORKSPACE/handoff.json" --branch "$HEAD_BRANCH" --failed-jobs "$RUNNER_TEMP/fx/failed-jobs.txt" --verdict-out "$RUNNER_TEMP/verdict.json")
          [ "$AUTOPILOT_ALLOW_PUSH" = "true" ] || args+=(--dry-run)
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/autopilot-push.sh" "${args[@]}"
          echo "outcome=$(jq -r '.outcome // "none"' "$RUNNER_TEMP/verdict.json")" >>"$GITHUB_OUTPUT"

      # S4 evidence: the would-be commit, uploaded only when the tripwire
      # stayed quiet (a TRIPPED diff is never uploaded; console artifacts are
      # public and uploading it would complete the exfiltration). Only a push
      # round has one -- an escalate round minted no commit, so `git show
      # HEAD` there would upload the PR's own last commit as if the round had
      # proposed it.
      - name: Capture dry-run diff
        if: success() && vars.AUTOPILOT_ALLOW_PUSH != 'true' && steps.boundary.outputs.outcome == 'push'
        run: |
          git show HEAD >"$RUNNER_TEMP/would-push.patch"

      - name: Upload dry-run diff
        if: success() && vars.AUTOPILOT_ALLOW_PUSH != 'true' && steps.boundary.outputs.outcome == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopilot-would-push-${{ github.run_id }}
          path: ${{ runner.temp }}/would-push.patch
          retention-days: 7

      # The submodule branches are already pushed by the boundary above; what
      # is left is the part only a token can do. `check-submodule-branches.sh`
      # is a REQUIRED gate that reads the console PR BODY for each submodule
      # PR's link, so a round that pushed a submodule branch and skipped this
      # leaves console red on a gate no amount of later code can clear.
      - name: Open and link the submodule PRs
        id: submodules
        if: >-
          success() &&
          steps.boundary.outputs.outcome == 'push' &&
          vars.AUTOPILOT_ALLOW_SUBMODULES == 'true' &&
          vars.AUTOPILOT_ALLOW_PUSH == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_PUSH }}
          PR: ${{ needs.gate.outputs.pr_number }}
          HEAD_BRANCH: ${{ needs.gate.outputs.head_branch }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/submodule-prs.sh" --verdict "$RUNNER_TEMP/verdict.json" --repo "$REPO" --pr "$PR" --branch "$HEAD_BRANCH"

      # ESCALATE, in full: the model's reason and any proposed patch reach the
      # PR as data, then the latch goes on. Model text is extracted with jq
      # into a file and posted with -F body=@file, never interpolated.
      - name: Post the escalation and latch the loop
        id: escalation
        if: success() && steps.boundary.outputs.outcome == 'escalate' && vars.AUTOPILOT_ALLOW_STATE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_STATE: ${{ vars.AUTOPILOT_ALLOW_STATE }}
          PR: ${{ needs.gate.outputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/post-escalation.sh" --pr "$PR" --repo "$REPO" --title "the round escalated" --round "$ROUND" --verdict "$RUNNER_TEMP/verdict.json" --run-url "$RUN_URL"

      # The other half of the review-response contract: the model recorded
      # dispositions, the harness answers and resolves. A round that escalated
      # is excluded -- its findings are being handed to a human, so resolving
      # the threads would erase the thing the operator needs to see.
      - name: Answer and resolve the disposed review threads
        id: reply
        if: >-
          success() &&
          needs.gate.outputs.mode == 'review-response' &&
          steps.boundary.outputs.outcome != 'escalate' &&
          vars.AUTOPILOT_ALLOW_PUSH == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_PUSH }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/review-reply.sh" plan --verdict "$RUNNER_TEMP/verdict.json" --threads "$RUNNER_TEMP/fx/review-payload.json" --out "$RUNNER_TEMP/reply-plan.json"
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/review-reply.sh" apply --plan "$RUNNER_TEMP/reply-plan.json"

      # A review round that pushed nothing produces no CI run, hence no
      # workflow_run, hence no next round: the loop would stop with the Review
      # Gate still red. Re-requesting the review is the event that carries it
      # forward, and it costs no model tokens.
      - name: Re-request the review gate after a no-push review round
        if: >-
          success() &&
          needs.gate.outputs.mode == 'review-response' &&
          steps.boundary.outputs.outcome != 'push' &&
          vars.AUTOPILOT_ALLOW_PUSH == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_PUSH }}
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/finish.sh" rerun-review --pr "$PR" --repo "$REPO"

      # THE LEDGER IS NEVER OPTIONAL (03-v2-autonomy.md section 0): autopilot
      # commits are attributed to the operator, and this comment is the audit
      # trail recording every round's run and commit.
      #
      # It is also where a dispatch-armed round RECORDS THE CAMPAIGN. The
      # gate resolved campaign/model/rounds_max; writing them here is what
      # lets the next workflow_run round re-arm itself without a label. The
      # write is still gated on AUTOPILOT_ALLOW_STATE (S2), so a campaign
      # cannot outlive the stage flag that permits recording it.
      #
      # The ledger line, ruled_out[] and decisions[] all come from the
      # VALIDATED verdict rather than handoff.json: the handoff is untrusted
      # model output and the validator has already bounded these arrays. The
      # ruled-out section is the anti-thrash memory, and it only works if a
      # round records every entry instead of its first.
      - name: Update state comment
        id: state_update
        if: success() && vars.AUTOPILOT_ALLOW_STATE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_STATE: ${{ vars.AUTOPILOT_ALLOW_STATE }}
          PR: ${{ needs.gate.outputs.pr_number }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          ROUND: ${{ needs.gate.outputs.round }}
          MAX_ROUNDS: ${{ needs.gate.outputs.rounds_max }}
          CAMPAIGN: ${{ needs.gate.outputs.campaign }}
          MODEL: ${{ needs.gate.outputs.model }}
          SIG: ${{ needs.gate.outputs.sig }}
          SIG_COUNT: ${{ needs.gate.outputs.sig_count }}
        run: |
          run_id="$(jq -r '.workflow_run.id' "$RUNNER_TEMP/fx/event.json")"
          attempt="$(jq -r '.workflow_run.run_attempt // 1' "$RUNNER_TEMP/fx/event.json")"
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/update-state.sh" --pr "$PR" --repo "$REPO" --comment-id "$COMMENT_ID" --body "$RUNNER_TEMP/fx/state.txt" --state waiting-ci --round "$ROUND" --rounds-max "$MAX_ROUNDS" --head "$(git rev-parse HEAD)" --last-run "$run_id/$attempt handled" --ledger "$(jq -r '.ledger_line' "$RUNNER_TEMP/verdict.json")" --verdict "$RUNNER_TEMP/verdict.json" --campaign "$CAMPAIGN" --model "$MODEL" --last-sig "$SIG" --sig-count "$SIG_COUNT"

      # Escalation latch: any red above (validator, tripwire, restore assert)
      # applies autopilot-blocked so the gate refuses further rounds until a
      # human clears it, AND says which step class failed. A wordless label was
      # the whole problem: the operator's first signal was that nothing was
      # happening. Best-effort (`|| true`): the job is already red either way,
      # and before the app token exists no write is possible at all.
      - name: Latch and explain a failed round
        if: failure() && steps.app_token.conclusion == 'success' && vars.AUTOPILOT_ALLOW_STATE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_STATE: ${{ vars.AUTOPILOT_ALLOW_STATE }}
          PR: ${{ needs.gate.outputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS: restore=${{ steps.restore_assert.conclusion }},model=${{ steps.claude.conclusion }},boundary=${{ steps.boundary.conclusion }},submodules=${{ steps.submodules.conclusion }},escalation=${{ steps.escalation.conclusion }},reply=${{ steps.reply.conclusion }},state=${{ steps.state_update.conclusion }}
        run: |
          "$RUNNER_TEMP/harness/.ci/scripts/autopilot/post-escalation.sh" --pr "$PR" --repo "$REPO" --title "the round failed" --round "$ROUND" --steps "$STEPS" --run-url "$RUN_URL" || true
          echo "::error::autopilot round failed; escalation label applied"

  finish:
    name: Autopilot Finish
    needs: gate
    # Three deterministic modes, zero model tokens between them
    # (03-v2-autonomy.md section 9). rerun-review joined them once the gate
    # learned to tell "the Review Gate is red and there is something to
    # answer" from "the Review Gate is red and the review simply needs to run
    # again" -- the second was buying a full model round to do nothing.
    if: >-
      needs.gate.outputs.decision == 'go' &&
      (needs.gate.outputs.mode == 'ready-flip' || needs.gate.outputs.mode == 'done' || needs.gate.outputs.mode == 'rerun-review') &&
      vars.AUTOPILOT_ALLOW_FINISH == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 14
    permissions:
      contents: read
      actions: read
    env:
      REPO: ${{ github.repository }}
    steps:
      # WALL 4: trusted ref only; this job never touches PR-authored content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rediacc/console
          ref: main
          persist-credentials: false

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_AUTOPILOT_PRIVATE_KEY > BWS_AUTOPILOT_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: AUTOPILOT_PRIVATE_KEY
          GH_AUTOPILOT_PRIVATE_KEY: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then echo "shadow $n match"; else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - name: Download fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autopilot-fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/fx

      # Deterministic finish steps run with no model in this job at all, so
      # the post-model invariant is trivially satisfied; the token still binds
      # to the bypass-less autopilot app, scoped to console.
      - name: Mint app token
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
          preset: cd
          repositories: console

      # finish.sh gates its writes on AUTOPILOT_ALLOW_PUSH; the finish STAGE
      # is armed by AUTOPILOT_ALLOW_FINISH (S3 precedes S5), so the flag is
      # mapped here, deliberately and visibly.
      - name: Ready-flip
        if: needs.gate.outputs.mode == 'ready-flip'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_FINISH }}
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          .ci/scripts/autopilot/finish.sh ready-flip --pr "$PR" --repo "$REPO"

      # Same flag mapping as the ready-flip above, and for the same reason:
      # finish.sh gates its writes on AUTOPILOT_ALLOW_PUSH while the finish
      # STAGE is armed by AUTOPILOT_ALLOW_FINISH (S3 precedes S5).
      - name: Re-request the review gate
        if: needs.gate.outputs.mode == 'rerun-review'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_PUSH: ${{ vars.AUTOPILOT_ALLOW_FINISH }}
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          .ci/scripts/autopilot/finish.sh rerun-review --pr "$PR" --repo "$REPO"

      # A RERUN ROUND MUST LEAVE A LEDGER LINE. Every gate invocation has to
      # end in a push, a bounded deterministic step, or no action at all
      # (03-v2-autonomy.md section 4's termination proof); a rerun creates a
      # new review run, which creates a new workflow_run, which re-enters the
      # gate. Counted rounds are what makes that loop terminate, and the
      # counter is `grep -cE '^r[0-9]+ \| run '` over this comment -- so the
      # line's SHAPE is load-bearing, not cosmetic.
      - name: Record the rerun round
        if: needs.gate.outputs.mode == 'rerun-review' && vars.AUTOPILOT_ALLOW_STATE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_STATE: ${{ vars.AUTOPILOT_ALLOW_STATE }}
          PR: ${{ needs.gate.outputs.pr_number }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          ROUND: ${{ needs.gate.outputs.round }}
          MAX_ROUNDS: ${{ needs.gate.outputs.rounds_max }}
          CAMPAIGN: ${{ needs.gate.outputs.campaign }}
          MODEL: ${{ needs.gate.outputs.model }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          SIG: ${{ needs.gate.outputs.sig }}
          SIG_COUNT: ${{ needs.gate.outputs.sig_count }}
        run: |
          run_id="$(jq -r '.workflow_run.id' "$RUNNER_TEMP/fx/event.json")"
          attempt="$(jq -r '.workflow_run.run_attempt // 1' "$RUNNER_TEMP/fx/event.json")"
          .ci/scripts/autopilot/update-state.sh --pr "$PR" --repo "$REPO" --comment-id "$COMMENT_ID" --body "$RUNNER_TEMP/fx/state.txt" --state waiting-review --round "$ROUND" --rounds-max "$MAX_ROUNDS" --head "$HEAD_SHA" --last-run "$run_id/$attempt handled" --ledger "r$ROUND | run $run_id/$attempt | rerun-review: re-requested the review gate, no model" --campaign "$CAMPAIGN" --model "$MODEL" --last-sig "$SIG" --sig-count "$SIG_COUNT"

      - name: Done detection
        if: needs.gate.outputs.mode == 'done'
        env:
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          jq '{ci_green: true, draft, unresolved_threads, reviewed: (.review_gate_red | not)}' "$RUNNER_TEMP/fx/pr.json" >"$RUNNER_TEMP/done.json"
          .ci/scripts/autopilot/finish.sh check-done --pr "$RUNNER_TEMP/done.json"
          echo "::notice::autopilot: done-conditions hold for PR #$PR"

      # A campaign that is never closed is a loop with no terminating state:
      # every later workflow_run would re-arm off `campaign: open` and land
      # back here. The model job cannot do this -- it only runs for fix and
      # review-response -- so done's closure belongs to the finish job, which
      # already holds the token and the fixtures. Same stage flag as every
      # other state write.
      - name: Close the campaign
        if: needs.gate.outputs.mode == 'done' && vars.AUTOPILOT_ALLOW_STATE == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_STATE: ${{ vars.AUTOPILOT_ALLOW_STATE }}
          PR: ${{ needs.gate.outputs.pr_number }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          ROUND: ${{ needs.gate.outputs.round }}
          MAX_ROUNDS: ${{ needs.gate.outputs.rounds_max }}
          CAMPAIGN: ${{ needs.gate.outputs.campaign }}
          MODEL: ${{ needs.gate.outputs.model }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          SIG: ${{ needs.gate.outputs.sig }}
          SIG_COUNT: ${{ needs.gate.outputs.sig_count }}
        run: |
          [ -n "$COMMENT_ID" ] || exit 0
          run_id="$(jq -r '.workflow_run.id' "$RUNNER_TEMP/fx/event.json")"
          attempt="$(jq -r '.workflow_run.run_attempt // 1' "$RUNNER_TEMP/fx/event.json")"
          .ci/scripts/autopilot/update-state.sh --pr "$PR" --repo "$REPO" --comment-id "$COMMENT_ID" --body "$RUNNER_TEMP/fx/state.txt" --state "done" --round "$ROUND" --rounds-max "$MAX_ROUNDS" --head "$HEAD_SHA" --last-run "$run_id/$attempt handled" --campaign "$CAMPAIGN" --model "$MODEL" --last-sig "$SIG" --sig-count "$SIG_COUNT"

  # A gate no-go is normally silent and free, which is right for `not-armed`,
  # `already-handled` or `superseded` -- nothing has ended. Two are different
  # in kind: `stuck-signature` and `round-cap` END the campaign. Left silent,
  # the operator's only signal is that the PR stopped moving, which is exactly
  # the failure mode the escalation design exists to prevent.
  #
  # IT COMMENTS EXACTLY ONCE, and the mechanism is worth stating so nobody
  # "fixes" it into spamming: the first run here applies `autopilot-blocked`,
  # and the gate checks that label BEFORE the round cap and before mode
  # selection. Every later event on the same PR therefore reports
  # `blocked-label`, which matches neither prefix below, so this job never
  # runs again until a human clears the latch.
  escalate:
    name: Autopilot Escalation
    needs: gate
    if: >-
      needs.gate.outputs.decision == 'no-go' &&
      needs.gate.outputs.pr_number != '' &&
      (startsWith(needs.gate.outputs.reason, 'stuck-signature') || startsWith(needs.gate.outputs.reason, 'round-cap')) &&
      vars.AUTOPILOT_ALLOW_STATE == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 14
    permissions:
      contents: read
    env:
      REPO: ${{ github.repository }}
    steps:
      # WALL 4: trusted ref only; this job never touches PR-authored content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rediacc/console
          ref: main
          persist-credentials: false

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_AUTOPILOT_PRIVATE_KEY > BWS_AUTOPILOT_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: AUTOPILOT_PRIVATE_KEY
          GH_AUTOPILOT_PRIVATE_KEY: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then echo "shadow $n match"; else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # The four older autopilot jobs sit in .profiler-coverage-allowlist's
      # burn-down ledger, whose own BLOCKER says the gate is blocking for every
      # job added from that day on. This one is new, and it already checks out
      # the repo for the local app-token action, so it carries the step rather
      # than lengthening a list that is only allowed to shrink.
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-slim

      - name: Mint app token
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
          preset: cd
          repositories: console

      # The gate's reason travels by env: and reaches the comment as a script
      # argument, never as shell.
      - name: Latch and explain the terminal no-go
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          AUTOPILOT_ALLOW_STATE: ${{ vars.AUTOPILOT_ALLOW_STATE }}
          PR: ${{ needs.gate.outputs.pr_number }}
          ROUND: ${{ needs.gate.outputs.round }}
          REASON: ${{ needs.gate.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .ci/scripts/autopilot/post-escalation.sh --pr "$PR" --repo "$REPO" --title "the campaign stopped" --round "$ROUND" --reason "$REASON" --run-url "$RUN_URL"

  sweeper:
    name: Autopilot Sweeper
    if: github.event_name == 'schedule' && vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 14
    # pull-requests/issues read are the campaign scan's whole grant: it lists
    # open PRs and reads their comments with github.token. The DISPATCH below
    # is a separate step with the app token, so the scan never holds one.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      REPO: ${{ github.repository }}
      LABEL: ${{ vars.AUTOPILOT_LABEL || 'autopilot' }}
    steps:
      # WALL 4: trusted ref only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rediacc/console
          ref: main
          persist-credentials: false

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_AUTOPILOT_PRIVATE_KEY > BWS_AUTOPILOT_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: AUTOPILOT_PRIVATE_KEY
          GH_AUTOPILOT_PRIVATE_KEY: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then echo "shadow $n match"; else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # LABEL-ARMED UNION CAMPAIGN-ARMED. The label-only sweep reached the
      # arming path that needs a sweeper least: a campaign whose workflow_run
      # never arrived carries no label, so nothing was scheduled to notice it.
      - name: Collect armed PRs
        env:
          GH_TOKEN: ${{ github.token }}
          BOT: ${{ vars.AUTOPILOT_BOT_LOGIN || 'rediacc-autopilot[bot]' }}
        run: |
          .ci/scripts/autopilot/sweep-collect.sh --repo "$REPO" --label "$LABEL" --bot "$BOT" --work "$RUNNER_TEMP/sweep" --out "$RUNNER_TEMP/sweep/armed.txt"

      - name: Mint dispatch token
        id: app_token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_PRIVATE_KEY }}
          preset: cd
          repositories: console

      # Dispatch every armed PR unconditionally: the dispatched gate run dedups
      # against the ledger at zero model cost, so a naive sweep is cheap and the
      # sweeper never re-implements the gate (03-v2-autonomy.md section 9).
      - name: Dispatch armed PRs
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          while read -r n; do
            [ -n "$n" ] && gh workflow run Autopilot --repo "$REPO" -f pr_number="$n"
          done <"$RUNNER_TEMP/sweep/armed.txt"
