name: Release to Production

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force promotion (skip 7-day soak period)'
        type: boolean
        default: false
  # Operator ruling 2026-09-30: a green NIGHTLY also releases edge to stable, in
  # addition to the 06:00 soak run above. Every Console CI completion on main
  # fires this; the promote job's `if:` keeps only the scheduled ones that
  # concluded success or failure, and check_soak_period waives the soak only
  # when that nightly's head provably contains the edge tag's commit
  # (rediacc_ci.release.nightly_tested_edge). A FAILED nightly counts as tested
  # only when every failed step is a drift gate (upstream advisories, dependency
  # freshness: nightly_tested_edge.DRIFT_STEPS, PLAN-plan-per-pr-loop R1); any
  # other failure decides ready=false, as before.
  workflow_run:
    workflows: ["Console CI"]
    types: [completed]
    branches: [main]

# The 06:00 soak run, a nightly-triggered run and a manual dispatch must never
# promote at the same time. Queued, never cancelled: a cancelled promotion
# half-way through the R2/Docker writes is worse than a late one.
concurrency:
  group: promote-stable
  cancel-in-progress: false

# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
permissions: {}

env:
  SOAK_DAYS: 7

jobs:
  promote:
    name: Release to Production
    runs-on: ubuntu-latest
    # workflow_run fires on EVERY Console CI completion on main (push, rehearsal,
    # red or green); only a scheduled nightly that concluded success or failure
    # may proceed (cancelled is never a pass), and check_soak_period refuses a
    # failure whose failed steps are not all drift gates. The schedule and
    # workflow_dispatch triggers pass unconditionally, as before.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'schedule'
          && (github.event.workflow_run.conclusion == 'success'
              || github.event.workflow_run.conclusion == 'failure'))
    # actions: read for check_soak_period's read of a failed nightly's jobs and
    # steps (actions/runs/<id>/jobs), pull-requests: read for the
    # `gh pr list --search label:rollback` guard,
    # packages: write because the stable retag does `buildx imagetools create`
    # (a push). This job only READS tags and releases, so contents stays read -
    # the contents: write it used to inherit belongs to verify-stable alone.
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    outputs:
      promoted: ${{ steps.result.outputs.promoted }}
      version: ${{ steps.soak.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit graph and tags, no blobs: the nightly waiver runs
          # `git merge-base --is-ancestor v<edge>^{commit} <nightly head_sha>`,
          # which a depth-1 checkout cannot answer (it would fall back to soak).
          fetch-depth: 0
          filter: blob:none

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ZONE_ID > BWS_CLOUDFLARE_ZONE_ID
      - name: Check edge manifest
        id: edge
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.check_edge_manifest

      - name: Check stable manifest
        if: steps.edge.outputs.skip != 'true'
        id: stable
        env:
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.check_stable_manifest

      # The walk back's candidates (PLAN-plan-per-pr-loop R2): with a release on
      # every merge the newest edge is almost always younger than the soak, so
      # check_soak_period selects the NEWEST edge release that has soaked.
      - name: List edge releases
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true'
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.list_edge_releases

      # The edge versions with a complete channel snapshot (snapshots/v<ver>/):
      # an OLDER selection is promotable only from its own snapshot.
      - name: List channel snapshots
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true'
        id: snapshots
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.list_channel_snapshots

      # SOAK_DAYS comes from the workflow-level env: above. Every step after this
      # one promotes steps.soak.outputs.version, the SELECTED release, never
      # whatever edge happens to be newest when the step runs.
      - name: Check soak period
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true'
        id: soak
        env:
          EDGE_DATE: ${{ steps.edge.outputs.date }}
          FORCE: ${{ inputs.force }}
          PROMOTE_TRIGGER: ${{ github.event_name }}
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
          NIGHTLY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          NIGHTLY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NIGHTLY_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          STABLE_VERSION: ${{ steps.stable.outputs.version }}
          EDGE_RELEASES: ${{ steps.releases.outputs.releases }}
          CHANNEL_SNAPSHOTS: ${{ steps.snapshots.outputs.snapshots }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.check_soak_period

      # BEFORE ANY PROMOTION WRITE, and the position is the whole point.
      # Today the R2 and Docker promotions succeed first and only then does the
      # worker/account deploy check out `ref: v<version>` -- so an untagged
      # version leaves stable CLI artifacts and Docker tags advanced while
      # eu/us/asia workers still run the previous code. A half-applied
      # three-region production release. Failing here turns that into a loud
      # no-op. Defence in depth: the upstream skip_release fix stops the pointer
      # advancing in the first place, but this catches any OTHER cause (a manual
      # aws cp, a partially-failed release) because its oracle -- git tags and
      # the Releases API -- is independent of the manifest it judges.
      - name: Assert the edge version is actually released
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.assert_edge_tag_exists "${{ steps.soak.outputs.version }}"

      - name: Check for rollback labels
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_DATE: ${{ steps.soak.outputs.date }}
        # gh_retry (common.sh): three attempts, so one GitHub 5xx no longer reds
        # the promotion (the PR #597 class). A search that still fails ends the
        # step under bash -e, which blocks the promotion: it fails closed.
        run: |
          source .ci/scripts/lib/common.sh
          ROLLBACKS=$(gh_retry "rollback-label search" -- pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --search "merged:>=${EDGE_DATE} label:rollback" --json number --jq 'length')

          if [[ "$ROLLBACKS" -gt 0 ]]; then
            echo "::error::Found $ROLLBACKS PR(s) with rollback label since edge release. Promotion blocked."
            exit 1
          fi
          echo "No rollback labels found"

      # =====================================================================
      # Promote ALL artifacts from edge to stable
      # =====================================================================

      - name: Promote R2 artifacts (CLI, Repos)
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ env.BWS_CLOUDFLARE_ZONE_ID }}
          EDGE_VERSION: ${{ steps.soak.outputs.version }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.promote_r2_to_stable

      - name: Login to GHCR
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load well-known
        run: grep '^WK_' .ci/config/well-known.env >> "$GITHUB_ENV"

      # The selected version's own tag (CD pushes <image>:<version> beside :edge),
      # never the moving :edge, which a release landing mid-run would change.
      - name: Promote Docker images (:<version> -> :stable)
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.soak.outputs.version }}
        run: |
          for image in renet rdc; do
            SRC="${{ env.WK_IMAGE_REGISTRY }}/${image}:${VERSION}"
            DST="${{ env.WK_IMAGE_REGISTRY }}/${image}:stable"
            echo "Promoting ${image}: ${VERSION} -> stable"
            docker buildx imagetools create -t "$DST" "$SRC"
          done

          echo "Docker promotion complete"

      - name: Set promotion result
        id: result
        run: |
          if [[ "${{ steps.edge.outputs.skip }}" == "true" ]] || \
             [[ "${{ steps.stable.outputs.same }}" == "true" ]] || \
             [[ "${{ steps.soak.outputs.ready }}" != "true" ]]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: steps.result.outputs.promoted == 'true'
        run: |
          {
            echo "## Stable Promotion"
            echo "- Promoted version: ${{ steps.soak.outputs.version }} (newest edge: ${{ steps.edge.outputs.version }})"
            echo "- Previous stable: ${{ steps.stable.outputs.version }}"
            echo "- Trigger: ${{ github.event_name }}, decided by: ${{ steps.soak.outputs.path }} (soak days: ${{ env.SOAK_DAYS }})"
            echo "- R2: CLI, APT, RPM, APK, Archlinux promoted; Docker: all images retagged :${{ steps.soak.outputs.version }} -> :stable"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy stable Workers from the exact tagged version
  deploy-marketing-stable:
    name: Deploy stable Marketing
    # The callee needs only checkout.
    permissions:
      contents: read
    needs: [promote]
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/cd-deploy-worker.yml
    with:
      target: stable
      ref: v${{ needs.promote.outputs.version }}
      version: ${{ needs.promote.outputs.version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  deploy-account-stable:
    name: Deploy stable Account (all regions)
    # The callee needs only checkout.
    permissions:
      contents: read
    needs: [promote]
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/cd-deploy-account.yml
    with:
      target: stable
      ref: v${{ needs.promote.outputs.version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  # Verify stable endpoints after deployment
  verify-stable:
    name: Verify stable
    # contents: write is load-bearing and belongs to THIS job only:
    # mark-production.sh moves the `production` tag ref (PATCH/POST on
    # git/refs) and runs `gh release edit --latest`, both on github.token.
    # It runs AFTER the endpoints verify, so losing this scope leaves stable
    # deployed while the production tag and the latest badge still point at
    # the previous version.
    permissions:
      contents: write
    needs: [promote, deploy-marketing-stable, deploy-account-stable]
    if: needs.promote.outputs.promoted == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .ci/scripts is needed too: the verification itself now lives there.
          # .ci/rediacc_ci, because the step(s) below run `python3 -m rediacc_ci.*` and a cone that stops at .ci/scripts does not put that package on disk at all: the job dies with ModuleNotFoundError before judging anything, and a crash is not a verdict. Added 2026-09-21, sweeping the class the ci-complete cone was found in.
          sparse-checkout: |
            regions.json
            .ci/scripts
            .ci/rediacc_ci
            .ci/config/well-known.env
          sparse-checkout-cone-mode: false

      - name: Verify stable endpoints
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.verify_stable_endpoints

      # AFTER verification, never before: the markers are a claim that this
      # version is live and serving, so they must not be written by a promotion
      # whose endpoints failed to answer.
      - name: Mark this version as production
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.mark_production "${{ needs.promote.outputs.version }}"
