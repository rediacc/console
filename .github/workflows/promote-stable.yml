name: Release to Production

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 6:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force promotion (skip 7-day soak period)'
        type: boolean
        default: false

permissions:
  # contents: WRITE, not read -- verify-stable now moves the `production`
  # tag and flips the GitHub Release's `latest` badge, which is the only
  # record of what is actually in production. Nothing else here writes.
  contents: write
  packages: write
  pull-requests: read

env:
  SOAK_DAYS: 7

jobs:
  promote:
    name: Release to Production
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.result.outputs.promoted }}
      version: ${{ steps.edge.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - name: Check edge manifest
        id: edge
        run: .ci/scripts/release/check-edge-manifest.sh

      # BEFORE ANY PROMOTION WRITE, and the position is the whole point.
      # Today the R2 and Docker promotions succeed first and only then does the
      # worker/account deploy check out `ref: v<version>` -- so an untagged
      # version leaves stable CLI artifacts and Docker tags advanced while
      # eu/us/asia workers still run the previous code. A half-applied
      # three-region production release. Failing here turns that into a loud
      # no-op. Defence in depth: the upstream skip_release fix stops the pointer
      # advancing in the first place, but this catches any OTHER cause (a manual
      # aws cp, a partially-failed release) because its oracle -- git tags and
      # the Releases API -- is independent of the manifest it judges.
      - name: Assert the edge version is actually released
        if: steps.edge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: .ci/scripts/release/assert-edge-tag-exists.sh "${{ steps.edge.outputs.version }}"

      - name: Check stable manifest
        if: steps.edge.outputs.skip != 'true'
        id: stable
        env:
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
        run: .ci/scripts/release/check-stable-manifest.sh

      # SOAK_DAYS comes from the workflow-level env: above.
      - name: Check soak period
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true'
        id: soak
        env:
          EDGE_DATE: ${{ steps.edge.outputs.date }}
          FORCE: ${{ inputs.force }}
        run: .ci/scripts/release/check-soak-period.sh

      - name: Check for rollback labels
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EDGE_DATE="${{ steps.edge.outputs.date }}"
          ROLLBACKS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --search "merged:>=${EDGE_DATE} label:rollback" --json number --jq 'length')

          if [[ "$ROLLBACKS" -gt 0 ]]; then
            echo "::error::Found $ROLLBACKS PR(s) with rollback label since edge release. Promotion blocked."
            exit 1
          fi
          echo "No rollback labels found"

      # =====================================================================
      # Promote ALL artifacts from edge to stable
      # =====================================================================

      - name: Promote R2 artifacts (CLI, Repos)
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          EDGE_VERSION: ${{ steps.edge.outputs.version }}
        run: .ci/scripts/deploy/promote-r2-to-stable.sh

      - name: Login to GHCR
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote Docker images (:edge -> :stable)
        if: steps.edge.outputs.skip != 'true' && steps.stable.outputs.same != 'true' && steps.soak.outputs.ready == 'true'
        run: |
          for image in renet rdc; do
            SRC="ghcr.io/rediacc/${image}:edge"
            DST="ghcr.io/rediacc/${image}:stable"
            echo "Promoting ${image}: edge -> stable"
            docker buildx imagetools create -t "$DST" "$SRC"
          done

          echo "Docker promotion complete"

      - name: Set promotion result
        id: result
        run: |
          if [[ "${{ steps.edge.outputs.skip }}" == "true" ]] || \
             [[ "${{ steps.stable.outputs.same }}" == "true" ]] || \
             [[ "${{ steps.soak.outputs.ready }}" != "true" ]]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          else
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: steps.result.outputs.promoted == 'true'
        run: |
          {
            echo "## Stable Promotion"
            echo "- Edge version: ${{ steps.edge.outputs.version }}"
            echo "- Previous stable: ${{ steps.stable.outputs.version }}"
            echo "- Soak days: ${{ env.SOAK_DAYS }}"
            echo "- R2: CLI, APT, RPM, APK, Archlinux promoted"
            echo "- Docker: all images retagged :edge -> :stable"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy stable Workers from the exact tagged version
  deploy-marketing-stable:
    name: Deploy stable Marketing
    needs: [promote]
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/cd-deploy-worker.yml
    with:
      target: stable
      ref: v${{ needs.promote.outputs.version }}
      version: ${{ needs.promote.outputs.version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
      ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
      AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  deploy-account-stable:
    name: Deploy stable Account (all regions)
    needs: [promote]
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/cd-deploy-account.yml
    with:
      target: stable
      ref: v${{ needs.promote.outputs.version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
      ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
      STRIPE_WEBHOOK_SECRET_US: ${{ secrets.STRIPE_WEBHOOK_SECRET_US }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
      AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
      AWS_SES_ACCESS_KEY_ID_US: ${{ secrets.AWS_SES_ACCESS_KEY_ID_US }}
      AWS_SES_SECRET_ACCESS_KEY_US: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_US }}
      STRIPE_WEBHOOK_SECRET_ASIA: ${{ secrets.STRIPE_WEBHOOK_SECRET_ASIA }}
      AWS_SES_ACCESS_KEY_ID_ASIA: ${{ secrets.AWS_SES_ACCESS_KEY_ID_ASIA }}
      AWS_SES_SECRET_ACCESS_KEY_ASIA: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_ASIA }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OBS_OTLP_CREDENTIALS_EU: ${{ secrets.OTLP_CLIENT_CREDENTIALS_EU }}
      OBS_OTLP_CREDENTIALS_US: ${{ secrets.OTLP_CLIENT_CREDENTIALS_US }}
      OBS_OTLP_CREDENTIALS_ASIA: ${{ secrets.OTLP_CLIENT_CREDENTIALS_ASIA }}
      ACCOUNT_BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      ACCOUNT_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}

  # Verify stable endpoints after deployment
  verify-stable:
    name: Verify stable
    needs: [promote, deploy-marketing-stable, deploy-account-stable]
    if: needs.promote.outputs.promoted == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .ci/scripts is needed too: the verification itself now lives there.
          sparse-checkout: |
            regions.json
            .ci/scripts
          sparse-checkout-cone-mode: false

      - name: Verify stable endpoints
        run: .ci/scripts/deploy/verify-stable-endpoints.sh

      # AFTER verification, never before: the markers are a claim that this
      # version is live and serving, so they must not be written by a promotion
      # whose endpoints failed to answer.
      - name: Mark this version as production
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/scripts/release/mark-production.sh "${{ needs.promote.outputs.version }}"
