name: CD - Stage Artifacts (Reusable)

# Reusable workflow that stages release artifacts to production R2 + GHCR
# and validates them pre-publish. Called from ci.yml for every event that
# resolves to a non-empty channel (push -> edge, pull_request -> pr-N).
# schedule events get an empty channel and skip all upload + GHCR retag
# steps; the builds + validation still run for nightly coverage.
# - Downloads all build artifacts
# - Builds Linux packages (DEB/RPM) ONCE
# - Generates CLI manifest ONCE
# - Builds Pages bundle (www + apt/rpm metadata)
# - Stages Docker images (skipped on empty channel)
# - Validates all artifacts
# - Uploads to R2 (skipped on empty channel)

on:
  workflow_call:
    inputs:
      next_version:
        type: string
        required: false
      channel:
        description: 'Release channel (e.g., pr-123, edge, stable)'
        type: string
        required: false
      skip_release:
        # 'true' only when the commit explicitly earns no release (bump-none).
        # Consumers test `!= 'true'`, never `== 'false'`: an absent value means
        # the decision did not complete, and that must RELEASE, not skip.
        description: 'true when this commit earns no release; withholds the R2 channel pointer'
        type: string
        required: false
      renet_tag:
        type: string
        required: false
      web_tag:
        type: string
        required: false
      rdc_tag:
        type: string
        required: false
      upload_pages:
        required: false
        type: boolean
        default: false
    outputs:
      validation_passed:
        description: 'Whether all validation passed'
        value: ${{ jobs.stage.outputs.passed }}
    secrets:
      # Bitwarden machine-account token for the shadow secret fetch
      # (.github/actions/bws-secrets). Every caller must pass it.
      BWS_ACCESS_TOKEN:
        required: true
      RELEASE_GPG_PRIVATE_KEY:
        required: false
      RELEASE_GPG_PASSPHRASE:
        required: false
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: false
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: false
      CLOUDFLARE_R2_ENDPOINT:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read
  packages: write   # GHCR pull + retag push when push-to-main
  id-token: write   # OIDC token for Sigstore signing
  attestations: write  # Store attestations on GitHub

jobs:
  stage:
    name: Stage Artifacts
    runs-on: ubuntu-latest
    # This job had NO ceiling at all -- not here, and not on the caller in
    # ci.yml, which cannot carry one because it `uses:` this reusable workflow.
    # It was therefore free to run to GitHub's 360-minute default while holding
    # the release path, and it is the job that uploads to R2. Observed real
    # durations are around 11 minutes; 45 is generous headroom that still fails
    # fast instead of burning six hours of runner time on a wedged sync.
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.validate.outputs.passed }}
    steps:
      # Same preinstalled-bloat removal ct-tests.yml uses (5 sites): this job
      # died of runner ENOSPC pulling archlinux:latest for pacman metadata
      # (run 30017108104 attempt 2) -- docker images + package repos + staged
      # artifacts sit right at the runner's free-space edge.
      - name: Free runner disk (preinstalled bloat)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node + deps moved down to Step 4, where they are first used: the
      # artifact downloads in between need neither.

      # -----------------------------------------------------------------------
      # Step 1: Download all build artifacts
      # -----------------------------------------------------------------------

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            RELEASE_GPG_PASSPHRASE > BWS_RELEASE_GPG_PASSPHRASE
            RELEASE_GPG_PRIVATE_KEY > BWS_RELEASE_GPG_PRIVATE_KEY
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: RELEASE_GPG_PASSPHRASE RELEASE_GPG_PRIVATE_KEY CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN
          GH_RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          GH_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - name: Download CLI executables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: build-cli-*-${{ github.sha }}
          path: dist/cli/
          merge-multiple: true

      - name: Download CLI npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cli-npm-${{ github.sha }}
          path: dist/npm/

      - name: Download www build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-www-${{ github.sha }}
          path: packages/www/dist/

      - name: Download json build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-json-${{ github.sha }}
          path: packages/json/dist/

      # -----------------------------------------------------------------------
      # Step 2: Build Linux packages (DEB/RPM) - ONCE
      # -----------------------------------------------------------------------
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev createrepo-c gnupg
          # Install nfpm (unified Linux package builder — replaces dpkg-deb + rpmbuild)
          source .ci/config/constants.sh
          # Verify BEFORE extracting. ci.yml:805-810 already did this; this
          # sibling call site kept the old `| sudo tar` form, so the pinned
          # NFPM_SHA256_LINUX_X86_64 in constants.sh was checked on one of the
          # two nfpm installs and not the other.
          TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sfL -o "$TARBALL" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${TARBALL}"
          echo "${NFPM_SHA256_LINUX_X86_64}  ${TARBALL}" | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "$TARBALL" nfpm
          rm -f "$TARBALL"

      - name: Build Linux packages
        run: .ci/scripts/build/build-linux-packages.sh
        env:
          NEXT_VERSION: ${{ inputs.next_version }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      # -----------------------------------------------------------------------
      # Step 3: Generate CLI manifest - ONCE
      # -----------------------------------------------------------------------
      - name: Generate CLI manifest
        run: |
          .ci/scripts/build/generate-cli-manifest.sh \
            --version ${{ inputs.next_version }} \
            --channel "${{ inputs.channel }}" \
            --input dist/cli/ \
            --output dist/cli/manifest.json

      # -----------------------------------------------------------------------
      # Step 4: Build Pages bundle (www + apt/rpm metadata)
      # -----------------------------------------------------------------------
      - name: Install dependencies and build packages
        uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'

      - name: Assemble pages package
        run: .ci/scripts/build/build-pages.sh --output dist/pages

      - name: Copy CLI manifest to pages
        run: |
          mkdir -p dist/pages/cli
          cp dist/cli/manifest.json dist/pages/cli/

      - name: Build package repositories
        # build-pkg-repo.sh hard-exits on an empty --channel, and the nightly
        # (schedule) run derives channel="" on purpose to avoid orphaning ~5 GB
        # of R2 bytes. Every UPLOAD step here already self-gates; this is a BUILD
        # step, so it was never covered by that invariant and reddened the whole
        # nightly. Same gate as its neighbours.
        if: inputs.channel != ''
        run: |
          VERSION="${{ inputs.next_version }}"

          # Build self-contained repos (packages alongside metadata)
          .ci/scripts/build/build-pkg-repo.sh \
            --version "$VERSION" \
            --local-pkgs dist/packages \
            --output dist/repos \
            --channel "${{ inputs.channel }}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}

      # -----------------------------------------------------------------------
      # Step 5: Stage Docker images (validates existence + retag to channel)
      # -----------------------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Stage Docker images
        # Skip on empty channel (schedule events). retag-image.sh
        # uses `set -euo pipefail` and would fail loudly on an empty target
        # tag; gating here is cheaper than erroring the job for validation-
        # only runs that deliberately don't publish.
        #
        # Also skipped for a bump-none commit: the `:edge` moving tag is a
        # channel pointer of the same family as cli/edge/manifest.json, and it
        # is what promote-stable retags into `:stable`. Unlike the R2 uploads
        # above, no script owns this policy, so the `if:` is the right home.
        if: inputs.channel != '' && inputs.skip_release != 'true'
        run: |
          CHANNEL="${{ inputs.channel }}"

          .ci/scripts/docker/retag-image.sh --image renet --from "${{ inputs.renet_tag }}" --to "$CHANNEL"
          .ci/scripts/docker/retag-image.sh --image rdc --from "${{ inputs.rdc_tag }}" --to "$CHANNEL"
          # On-prem server image lives outside the elite/ namespace; use --image-path
          # so retag doesn't try to prepend PUBLISH_DOCKER_REGISTRY. Built by the
          # build-server-docker-{amd64,arm64} jobs, sharing the web_tag.
          .ci/scripts/docker/retag-image.sh --image-path ghcr.io/rediacc/server --from "${{ inputs.web_tag }}" --to "$CHANNEL"

      # -----------------------------------------------------------------------
      # Step 6: Validate all artifacts
      # -----------------------------------------------------------------------
      - name: Validate artifacts
        id: validate
        env:
          MODE: ${{ github.event_name != 'push' && '(no-publish) ' || '' }}
          EVENT_NAME: ${{ github.event_name }}
          NEXT_VERSION: ${{ inputs.next_version }}
          CHANNEL: ${{ inputs.channel }}
        run: .ci/scripts/release/validate-stage-artifacts.sh

      # Install validation handled by validate-install job in ci.yml (6 platforms).

      # -----------------------------------------------------------------------
      # Upload preview pages artifact (for PR preview deploys)
      # -----------------------------------------------------------------------
      - name: Upload preview pages artifact
        if: ${{ inputs.upload_pages && github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: preview-pages-${{ github.sha }}
          path: dist/pages/
          retention-days: 1

      # -----------------------------------------------------------------------
      # Upload staging artifacts for publish job (only when push-to-main)
      # -----------------------------------------------------------------------
      - name: Upload staging release artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-artifacts-${{ github.sha }}
          path: |
            dist/cli/
            dist/packages/
          retention-days: 1

      # The manifest ALONE, ~1 KB, under the exact name cd-v2.yml's
      # assert-artifact-version.sh looks for.
      #
      # That guard has been dead since it was written. It downloads an artifact
      # named `cli-manifest`, and nothing ever produced one -- the manifest was
      # only ever inside release-artifacts-<sha>, which is ~7 GB and far too
      # heavy for an init-job check to pull. So the guard hit its
      # "artifact not found -> warn -> exit 0" branch on EVERY release and
      # silently passed. On 2026-08-07 that let a second release publish
      # 1.2.16 binaries under the label 1.2.17; the mismatch surfaced only in
      # post-publish install validation, fifteen minutes and one edge deploy
      # later. Uploading the manifest separately is what makes the guard able
      # to fire at all.
      - name: Upload CLI manifest for the CD artifact-version assertion
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli-manifest
          path: dist/cli/manifest.json
          retention-days: 1
          if-no-files-found: error

      # Pages artifact no longer needed -- cd-deploy-worker.yml builds from source.

      # -----------------------------------------------------------------------
      # Upload to R2 staging (pre-publish validation needs ALL artifacts on R2)
      # -----------------------------------------------------------------------
      # THE SIGNAL IS PASSED DOWN, NOT TURNED INTO AN `if:`, and that is
      # deliberate. An `if:` here would mean the script's own guard never runs
      # on a real bump-none merge, so nothing would ever exercise it and it
      # would rot into a vacuous branch. Letting the script decide keeps the
      # thing under test on the live path. See
      # agent/PLAN-skip-release-gates-r2-manifest.md section 3.
      - name: Upload artifacts to R2 channel
        if: inputs.channel != ''
        run: |
          .ci/scripts/deploy/upload-to-r2.sh \
            --version "${{ inputs.next_version }}" \
            --channel "${{ inputs.channel }}"
        env:
          SKIP_RELEASE: ${{ inputs.skip_release }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

      - name: Upload repos to R2 channel
        if: inputs.channel != ''
        env:
          SKIP_RELEASE: ${{ inputs.skip_release }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CHANNEL: ${{ inputs.channel }}
        run: .ci/scripts/deploy/upload-repos-to-r2.sh

      # -----------------------------------------------------------------------
      # Assert the versioned-path sentinel is actually sealed after upload.
      # Replaces the dead key-based sentinel check in upload-to-r2.sh (which
      # looked for cli/v${V}/manifest.json -- a file nothing ever wrote).
      # If this step ever fails on a stable/edge push, it means the CLI loop
      # changed and the sentinel is silently absent again.
      # -----------------------------------------------------------------------
      - name: Assert R2 versioned sentinel exists
        # A bump-none commit deliberately writes no versioned path and seals no
        # sentinel, so asserting one exists would fail on exactly the commits
        # that are behaving correctly.
        if: (inputs.channel == 'stable' || inputs.channel == 'edge') && inputs.skip_release != 'true'
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: .ci/scripts/test/assert-r2-sentinel.sh "${{ inputs.channel }}" "${{ inputs.next_version }}"

      # -----------------------------------------------------------------------
      # Attest staging artifacts (Sigstore provenance for supply chain integrity)
      # -----------------------------------------------------------------------
      - name: Attest staging release artifact
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-path: |
            dist/cli/**/*
            dist/packages/**/*

      - name: Attest staging repos artifact
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4
        with:
          subject-path: |
            dist/repos/apt/dists/**/*
            dist/repos/rpm/repodata/**/*
