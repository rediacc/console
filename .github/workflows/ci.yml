name: Console CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  schedule:
    # DECLARED 01:00 UTC, ACTUALLY DISPATCHED just after 04:00. Measured across
    # all 12 available scheduled runs: drift +2h53m to +3h35m, mean +3h15m,
    # never once below +2h53m. That is GitHub deferring scheduled workflows on
    # the free plan, not jitter, and it is stated here because someone checking
    # at 01:05 finds no run and reasonably concludes the schedule is broken.
    # The window to look in is 04:00-04:40 UTC; after that, a missing run IS a
    # finding.
    - cron: '0 1 * * *'
  # workflow_dispatch is the NIGHTLY REHEARSAL, guarded to main by the first
  # step of `initialize`.
  #
  # This supersedes the previous note here ("workflow_dispatch removed: manual
  # triggers don't satisfy PR checks and waste CI budget. Use empty commits to
  # retrigger PR CI instead."). That reasoning was about retriggering a PR, and
  # it still holds: this is NOT for PRs, and the guard makes using it for one
  # impossible.
  #
  # It exists because the nightly can only be tested by waiting a day, and the
  # nightly had been red for twelve consecutive nights (2026-07-16 to 07-27,
  # zero successes). Fixing that at one attempt per 24 hours is not a feedback
  # loop. A dispatch on main is schedule-equivalent BY CONSTRUCTION, not by
  # convention: `full_suite` is `github.event_name != 'push'` (true for both),
  # and "Generate channel context" yields an empty channel for anything that is
  # not push or pull_request (both). assert-channel-for-event.sh has an explicit
  # workflow_dispatch arm asserting exactly that.
  workflow_dispatch:

# Minimal default permissions — jobs that need more declare their own.
# NOTE: `statuses: write` was removed. Nothing here ever wrote a commit status,
# and the required check ("CI Complete") is bound to the github-actions app —
# the same app that issues every job's GITHUB_TOKEN — so granting it repo-wide
# handed PR-controlled code a plausible way to post that context itself.
permissions:
  contents: read
  packages: read    # Most jobs pull from GHCR

# Supersede-cancellation, which was previously absent rather than disabled.
#
# The old group was:
#   group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}', github.run_id) }}
#   cancel-in-progress: false
#
# `github.run_id` is UNIQUE PER RUN, so every pull_request run got a group
# containing only itself. A group of one can never collide, so it could never
# cancel anything, and `cancel-in-progress: false` made it moot regardless.
# Pushing twice to a PR therefore left BOTH runs going, each ~500 machine-minutes.
# The only thing actually cancelling superseded runs was a LOCAL Claude hook
# (.claude/hooks/post-bash/cancel-old-ci.sh) that fires after a git push from one
# particular machine, so pushes from anywhere else were unprotected.
#
# The three arms are deliberately different, and the distinction is load-bearing:
#
#   pull_request -> keyed on the PR NUMBER, cancel-in-progress TRUE. A newer
#     commit supersedes an older one, which is the intended saving.
#
#   push (main)  -> keyed on 'ci-main', cancel-in-progress FALSE. Main is the
#     release path: finalize-release-sentinel dispatches cd-v2, so cancelling a
#     main run mid-flight could interrupt a release. Queue instead.
#
#   everything else (schedule, workflow_dispatch) -> keyed on run_id, so they are
#     never grouped and never cancelled. This is REQUIRED, not incidental: the
#     nightly and its rehearsal both run on main's ref, so a shared ref-based key
#     would let a rehearsal cancel the nightly, and a cancelled nightly reports
#     `cancelled` rather than `failure`, which is exactly the laundering that hid
#     twelve consecutive red nights.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'ci-main'
     || github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number)
     || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # COLUMN 1: INITIALIZE
  # Jobs: initialize, ci-watchdog
  # No dependencies - starts immediately for fast feedback on Quality checks
  # ============================================================================
  initialize:
    name: Initialize
    runs-on: ubuntu-latest  # Needs Docker for registry cache check
    timeout-minutes: 14
    # checks: read is for detect-pointer-bump.sh (reads the baseline commit's
    # "CI Complete" check-run with the plain GITHUB_TOKEN; the app token has
    # no checks scope). Job-level permissions replace the workflow defaults,
    # so contents+packages are restated.
    permissions:
      contents: read
      packages: read
      checks: read
      # For the scope-engine shadow step only: it calls `gh run list` and
      # `gh run download` to look for an attested skip-plan on an ancestor
      # commit. Read-only, and the step cannot fail the job.
      actions: read
    if: github.event_name != 'push' || (github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))
    outputs:
      is_bot: ${{ steps.init.outputs.is_bot }}
      next_version: ${{ steps.init.outputs.next_version }}
      bump_type: ${{ steps.init.outputs.bump_type }}
      # Empty unless this commit explicitly earns NO release. Consumers must
      # test `!= 'true'`, never `== 'false'`: an absent value means the
      # decision did not complete, and that must RELEASE, not skip.
      skip_release: ${{ steps.init.outputs.skip_release }}
      channel: ${{ steps.staging.outputs.channel }}
      renet_tag: ${{ steps.init.outputs.renet_tag }}
      renet_exists: ${{ steps.init.outputs.renet_exists }}
      web_tag: ${{ steps.init.outputs.web_tag }}
      web_exists: ${{ steps.init.outputs.web_exists }}
      rdc_tag: ${{ steps.init.outputs.rdc_tag }}
      rdc_exists: ${{ steps.init.outputs.rdc_exists }}
      image_tag: ${{ steps.init.outputs.image_tag }}
      # full_suite: run all jobs on PR and nightly. Skip expensive
      # jobs (quality, standalone, elite) on push-to-main since PR already validated.
      full_suite: ${{ github.event_name != 'push' }}
      # external_quality: three-state control for the externally-dependent
      # quality gates (deps/go-deps/embed-asset/action freshness, external
      # links, DKIM DNS, plus the audit's skip half). 'hard' on a normal PR
      # (failures block), 'skip' on a PR carrying the no-external-quality
      # label (offline branch work: the lookups cannot succeed at all), and
      # 'soft' otherwise (schedule/dispatch: the gate runs and warns but
      # cannot redden the nightly, whose reds should mean "main is broken",
      # not "the world moved"; 5 of 8 nightlies before 2026-08-04 were red on
      # external drift alone). Consumed by ci-quality.yml steps via the
      # run-external-gate.sh wrapper; push never reaches quality (full_suite).
      external_quality: ${{ github.event_name != 'pull_request' && 'soft' || (contains(github.event.pull_request.labels.*.name, 'no-external-quality') && 'skip' || 'hard') }}
      # media_quality: TWO-state control for the gates that read in-flight
      # tutorial media (recorded .cast files and the transcript/audio/parity
      # artifacts derived from them). 'skip' ONLY on a pull request carrying
      # the no-media-quality label; every other event, including a label that
      # cannot be read, resolves to 'hard'. There is deliberately no 'soft'
      # third state: nothing here depends on the outside world, so a failure
      # on schedule/dispatch means main's own media is inconsistent, which is
      # exactly the red the nightly should carry.
      #
      # This exists for one narrow situation: a re-recording pass that cannot
      # be resumed mid-flight leaves the media tree internally inconsistent
      # for hours, which reddens an otherwise-green PR on a defect that is
      # already being fixed. The label is a temporary hold, not an exemption,
      # and quality-content / quality-i18n announce every gate it removes.
      media_quality: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'no-media-quality') && 'skip' || 'hard' }}
      # pointer_bump_only: PR head provably identical in content to a commit
      # that already passed full CI, differing only in submodule pointers that
      # moved to tree-identical commits on the submodules' main (post-squash
      # bump). Gates the expensive jobs; see .ci/scripts/ci/detect-pointer-bump.sh.
      pointer_bump_only: ${{ steps.init.outputs.pointer_bump_only }}
      # ---- Scope engine, LIVE ------------------------------------------------
      # The scope step emits ONLY `run_<key>=false` for keys it has decided are
      # out of scope, plus `scope_mode`. It never emits `=true`. Every consumer
      # therefore tests `!= 'false'`, which makes the whole chain FAIL OPEN:
      # an absent output, an empty output, a crashed engine, or the step not
      # running at all (push, schedule, workflow_dispatch, where the `if:`
      # excludes it) all read as "run", i.e. full CI. There is no path on which
      # a broken scope engine silently removes coverage.
      #
      # scope_mode is carried only so ci-complete's reconciler can say WHICH
      # decision it is reconciling against. It gates nothing.
      scope_mode: ${{ steps.scope.outputs.scope_mode }}
      # 13 ct-tests leaves, passed through to ct-tests.yml as inputs.
      run_unit: ${{ steps.scope.outputs.run_unit }}
      run_e2e_workers: ${{ steps.scope.outputs.run_e2e_workers }}
      run_e2e_ceph: ${{ steps.scope.outputs.run_e2e_ceph }}
      run_e2e_ceph_workers: ${{ steps.scope.outputs.run_e2e_ceph_workers }}
      run_e2e_k8s: ${{ steps.scope.outputs.run_e2e_k8s }}
      run_e2e_k8s_ceph: ${{ steps.scope.outputs.run_e2e_k8s_ceph }}
      run_e2e_k8s_multinode: ${{ steps.scope.outputs.run_e2e_k8s_multinode }}
      run_e2e_migrate: ${{ steps.scope.outputs.run_e2e_migrate }}
      run_fork_isolation: ${{ steps.scope.outputs.run_fork_isolation }}
      run_renet: ${{ steps.scope.outputs.run_renet }}
      run_license_enforcement: ${{ steps.scope.outputs.run_license_enforcement }}
      run_account_e2e: ${{ steps.scope.outputs.run_account_e2e }}
      run_drills: ${{ steps.scope.outputs.run_drills }}
      # 5 top-level ci.yml jobs, consumed by their own `if:` here.
      run_ops: ${{ steps.scope.outputs.run_ops }}
      run_elite_run: ${{ steps.scope.outputs.run_elite_run }}
      run_update_flow: ${{ steps.scope.outputs.run_update_flow }}
      run_package_tests: ${{ steps.scope.outputs.run_package_tests }}
      run_install_methods: ${{ steps.scope.outputs.run_install_methods }}
    steps:
      # The rehearsal is only schedule-equivalent when it runs where the nightly
      # runs. A dispatch on a feature branch would produce a full ~70-minute run
      # whose result says nothing about the nightly, which is worse than no
      # rehearsal because it looks like evidence. Fail loudly rather than
      # skipping: a silently skipped guard is the failure mode this whole wave
      # is about.
      - name: Guard the rehearsal dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          echo "::error::The nightly rehearsal may only be dispatched on main (got: $DISPATCH_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
          # fetch-depth: 0 is REQUIRED by the scope-engine shadow step below,
          # and it is not a nicety. With the default depth-1 clone
          # `git rev-parse --is-shallow-repository` is true, so the engine
          # answers `baseline:shallow-clone` on every single run and reports
          # full CI forever while looking perfectly healthy from the outside.
          # That is exactly how D9 stayed false for twelve consecutive runs,
          # so the depth and the step have to land together or not at all.
          #
          # filter: blob:none keeps it cheap: commits and trees only, no
          # historical file contents. Same pairing already used at ci.yml's
          # tag-bijection checkout.
          fetch-depth: 0
          filter: blob:none

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh

      # Fork PRs are not supported (see .github/CONTRIBUTING.md). They fail
      # here anyway: secrets are empty on a fork, so the app-token step below
      # errors, `initialize` fails, and `ci-complete` reports red. The old
      # per-job `is_fork` gating never changed that outcome.
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap

      # PR Validation (PR events only)
      - name: Validate PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: return await require('./.ci/scripts/ci/validate-pr.cjs')({github, context, core})

      # Login to GHCR for registry cache check
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Run consolidated initialization script
      - name: Initialize CI
        id: init
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Plain job token for detect-pointer-bump.sh: check-runs need
          # checks:read, which the app-token presets do not carry.
          CHECKS_TOKEN: ${{ github.token }}
        run: |
          .ci/scripts/ci/initialize.sh --output "$GITHUB_OUTPUT"

      - name: Generate channel context
        id: staging
        run: |
          # Only push and pull_request events write to R2. schedule (nightly)
          # gets empty channel -> stage-artifacts still runs for validation
          # but every R2/GHCR upload step self-gates on channel != ''. Prior
          # design set dryrun-<sha> here and produced ~5 GB of orphan R2
          # bytes per nightly run (and per merge-queue check, since removed).
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANNEL="edge"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANNEL="pr-${{ github.event.pull_request.number }}"
          else
            CHANNEL=""
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Assert channel matches event
        # Guard against someone reintroducing a dryrun-<sha> fallthrough
        # for schedule events.
        run: .ci/scripts/ci/assert-channel-for-event.sh "${{ github.event_name }}" "${{ steps.staging.outputs.channel }}"

      # LIVE as of D-1: the `run_<key>` outputs this step writes now gate 17
      # jobs. It was shadow-only until the reconciler had a clean run of real
      # PR traffic behind it.
      #
      # What "live" does and does not mean here. The step still always exits 0
      # (scope-shadow.sh ends in an unconditional `exit 0` and every command
      # inside it is `|| true`-guarded), and it still emits nothing but
      # `run_<key>=false` lines for keys it rules OUT. So a failure, a timeout,
      # or a shallow clone produces no output lines at all, every consumer's
      # `!= 'false'` is then true, and CI runs in full. Losing the engine costs
      # money, never coverage. No continue-on-error is needed for the same
      # reason: the script owns its own success, which keeps the guarantee
      # where the logic is.
      #
      # OUTPUT_FILE is REQUIRED, not decoration. scope-shadow.sh treats an
      # unset OUTPUT_FILE as "local run, decide nothing" and returns before
      # writing a single line, so dropping this prefix does not fall back to
      # $GITHUB_OUTPUT -- it silently disables scoping while every log line
      # still looks healthy. That is the same shape of failure as the shallow
      # clone that kept the shadow reporting full CI for twelve runs, which is
      # why it is stated here rather than left to the script.
      - name: Scope engine
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Two independent full-CI overrides, both fail-open in the same
          # direction: FORCE_FULL_CI is the repo-wide kill switch (set the
          # `FULL_CI` repository variable to disable scoping for everyone
          # without a code change), FULL_CI_LABEL is the per-PR escape hatch
          # (label a PR `full-ci` when you want the whole fleet on one commit).
          #
          # The repository variable must be the exact string `true`. The script
          # compares literally, so `FULL_CI=1` or `FULL_CI=yes` reads as OFF
          # and the kill switch does nothing. FULL_CI_LABEL needs no such care:
          # contains() already yields true or false.
          FORCE_FULL_CI: ${{ vars.FULL_CI }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          # The PRE-EXISTING (non-scope) skip conditions, recorded into the plan
          # so the reconciler can tell "skipped because scope said so" from
          # "skipped because this workflow has always skipped it here". Without
          # them the plan is an incomplete prediction: on a pointer-bump PR all
          # 17 planned keys skip and a live gate would red every one of them.
          # These three cannot be derived inside the script (two are
          # `steps.init` outputs, not environment), which is the only reason
          # this step gained inputs.
          FULL_SUITE: ${{ github.event_name != 'push' }}
          POINTER_BUMP_ONLY: ${{ steps.init.outputs.pointer_bump_only }}
          IS_BOT: ${{ steps.init.outputs.is_bot }}
        run: OUTPUT_FILE="$GITHUB_OUTPUT" .ci/scripts/ci/scope-shadow.sh

      # if-no-files-found: ignore is what makes this succeed unconditionally:
      # the shadow step may legitimately produce neither file (no base/head
      # pair resolved), and that is data, not a failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: scope-shadow-${{ github.run_id }}
          path: |
            .ci/cache/scope-shadow/scope-classify.json
            .ci/cache/scope-shadow/scope-baseline.json
          retention-days: 7
          if-no-files-found: ignore

      # The attested-shaped plan, under the BARE name scope-engine's
      # createRepoIo looks up. Artifact names are already run-scoped, so no
      # suffix: a suffixed name would be undiscoverable by the later run that
      # goes hunting for a baseline, which is the only consumer it has.
      # It carries no `reconciled` flag, so it can be found and parsed but
      # never used as a baseline. That is the point at this stage.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ci-skip-plan
          path: .ci/cache/scope-shadow/plan.json
          retention-days: 7
          if-no-files-found: ignore

      # Upload CI tags as artifact for debugging
      - name: Upload CI Tags
        if: steps.init.outputs.is_bot != 'true'
        run: |
          cat > ci-tags.txt << EOF
          renet_tag=${{ steps.init.outputs.renet_tag }}
          web_tag=${{ steps.init.outputs.web_tag }}
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.init.outputs.is_bot != 'true'
        with:
          name: ci-tags-${{ github.sha }}
          path: ci-tags.txt
          retention-days: 1

  cancel-watchdog:
    name: CI Watchdog
    needs: [initialize]
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
    timeout-minutes: 14
    # Use !cancelled() so force-cancel from newer runs can stop this job
    if: ${{ !cancelled() && needs.initialize.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .github/actions
            .ci/config

      - name: Cancel older runs
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-cancel-push')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .ci/scripts/ci/cancel-older-runs.sh --timeout 60 --poll-interval 10

      # The monitor itself lives in watchdog-monitor.yml as a chain of short
      # ubuntu-slim generations: the 1-vCPU runner's 15-minute job cap is a
      # hard platform limit, so the old single 3-hour monitor job (which held
      # a standard runner for the whole run) cannot run there. This bootstrap
      # only dispatches generation 1; each generation re-dispatches the next
      # until the run completes or a terminal verdict fires. The WATCHDOG_*
      # pattern env vars moved to watchdog-monitor.yml with the monitor step.
      - name: Start watchdog monitor chain
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          .ci/scripts/ci/dispatch-watchdog.sh --run-id "$GITHUB_RUN_ID" \
            --generation 1 --pr-number "${PR_NUMBER:-}" --head-ref "${HEAD_REF:-}"

  # ============================================================================
  # LABEL GUIDE: explain this repo's labels on every PR
  #
  # Twelve labels, several of them kill switches whose effect is invisible
  # unless you already know they exist (`full-ci` bypasses the scope engine's
  # skips, `no-cancel-push` disarms the watchdog, `rollback` blocks stable
  # promotion). Nobody remembers twelve of those, and nothing on a PR says what
  # they do. This posts one comment, rendered from .github/labels.yml, and
  # rewrites it in place only when that file changes -- a rerun on an unchanged
  # tree performs zero API writes.
  #
  # WHY ITS OWN JOB rather than a step inside `initialize`: it needs
  # `pull-requests: write`, and no job in this workflow holds that today.
  # `initialize` carries a 20-step surface including checkout, an app token
  # scoped across five repos, GHCR login and the scope engine; widening ITS
  # grant to hand every one of those steps PR-write access to buy one comment
  # is the wrong trade. Job-level permissions REPLACE the workflow defaults, so
  # this block is the job's entire grant.
  # ============================================================================
  label-guide:
    name: Label Guide
    needs: [initialize]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && needs.initialize.outputs.is_bot != 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `.github` in full, not `.github/labels.yml`: actions/checkout runs
          # sparse-checkout in CONE mode, where entries are directory prefixes
          # and a bare file path matches nothing.
          sparse-checkout: |
            .ci/scripts
            .github
      - name: Post the label guide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: return await require('./.ci/scripts/ci/label-guide-comment.cjs')({github, context, core})

      # A SECOND STEP HERE, not a second job. It needs exactly what this job
      # already holds -- `pull-requests: write` plus the `.ci/scripts` sparse
      # checkout -- and the argument in this job's header applies unchanged: a
      # whole job to buy one more comment is the wrong trade, and a second job
      # would also need its own entry in `needs` and in assert-ci-complete.sh.
      # Same idempotence contract: it rewrites in place and writes nothing when
      # the body is unchanged.
      - name: Post the autopilot guide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: return await require('./.ci/scripts/ci/autopilot-guide-comment.cjs')({github, context, core})

  # ============================================================================
  # COLUMN 2: QUALITY
  # Jobs: quality (reusable workflow)
  # Dependencies: [initialize]
  # ============================================================================
  quality:
    name: Quality
    needs: [initialize]
    if: needs.initialize.outputs.is_bot != 'true' && needs.initialize.outputs.full_suite == 'true'
    uses: ./.github/workflows/ci-quality.yml
    with:
      is_bot: ${{ needs.initialize.outputs.is_bot }}
      next_version: ${{ needs.initialize.outputs.next_version }}
      external_quality: ${{ needs.initialize.outputs.external_quality }}
      media_quality: ${{ needs.initialize.outputs.media_quality }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      # quality-i18n restores the R2 narration-audio cache so the tutorial-audio
      # gate can actually assert per-file existence (see ci-quality.yml).
      CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_MEDIA_ENDPOINT: ${{ secrets.R2_MEDIA_ENDPOINT }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ============================================================================
  # ENTRY-POINT TESTS: ./run.sh itself
  # Dependencies: [initialize]
  #
  # run.sh is the door every other command goes through, and until now nothing
  # tested it. Two defects lived in it because of that: `quality all` warned and
  # returned SUCCESS when shfmt was absent (so on any machine without shfmt it
  # reported green having run no shell gate), and `fix shell` formatted with a
  # different shfmt than the gate verified with.
  #
  # Deliberately its own job rather than a step in ci-quality.yml: this needs a
  # BARE CHECKOUT and nothing else -- no node, no submodules, no docker -- so it
  # gives a verdict in under a minute instead of waiting on a lane that installs
  # a toolchain first. The suite is hermetic for the same reason.
  # ============================================================================
  run-sh-tests:
    name: Entry Point (run.sh)
    needs: [initialize]
    if: needs.initialize.outputs.is_bot != 'true'
    runs-on: ubuntu-slim
    # ubuntu-slim is killed at 15 minutes with no failed step, which reads as
    # neither pass nor fail; check-workflow-gates.sh enforces <= 14 here.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every Linux job carries this or is allowlisted with a BLOCKER reason;
      # check_runner_advice.py enforces it. This job has no reason to be
      # exempt -- it is short and bare, which makes it a useful datapoint for
      # what a minimal lane actually costs.
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-slim

      - name: run.sh entry-point controls
        run: .ci/scripts/test/gates/test-run-sh.sh

      - name: devbox probe controls
        # Hermetic: fake docker binaries on a temp PATH, never the real daemon,
        # so these run on a bare runner with no container available.
        run: .ci/scripts/test/gates/test-devbox-probes.sh

      - name: devbox hostname controls
        # Hermetic: pure string/slug functions plus a real git fixture for the
        # detached-HEAD case. No docker daemon, no network.
        run: .ci/scripts/test/gates/test-devbox-slug.sh

      - name: gate toolchain resolver controls
        run: .ci/scripts/test/gates/test-toolchain.sh

  # ============================================================================
  # REVIEW GATE: enforce review-thread hygiene (bot-agnostic)
  # Dependencies: [initialize, quality]
  # Must pass before Build jobs can start
  #
  # Reviews themselves come from the Claude Review workflow
  # (claude-review.yml), which fires only when CI is green AND the PR is
  # non-draft. This gate enforces that the threads any review leaves are
  # resolved and substantively replied to.
  # ============================================================================
  review-gate:
    name: Review Gate
    needs: [initialize, quality]
    runs-on: ubuntu-slim
    timeout-minutes: 14
    if: needs.initialize.outputs.is_bot != 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .github/actions
            .ci/config

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # pr-read, not cd: the three scripts below only READ review state.
          # check-resolved-threads.sh / check-review-comments.sh /
          # check-review-report-replies.sh merely print the resolve/reply
          # commands for a human to run; they never call them.
          preset: pr-read
          repositories: console
      - name: Check resolved threads
        run: .ci/scripts/quality/check-resolved-threads.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Check unreplied review comments
        run: .ci/scripts/quality/check-review-comments.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      # Inline comments and review threads are covered above; the review's
      # SUMMARY REPORT is an issue comment (flat, no resolve mechanism) and
      # would otherwise be ignorable. Requires a substantive reply that
      # references the newest finished report by comment id.
      - name: Check unreplied review reports
        run: .ci/scripts/quality/check-review-report-replies.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Same class as ci-quality.yml's epic-block and trailer steps: the
          # script already prefers PR_HEAD_REF for the per-epic lookup
          # (check-review-report-replies.sh:85), but without it on this
          # detached checkout it degrades to the flat, non-per-epic path
          # (still enforced, just coarser than intended for a PR with epics).
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

  # ============================================================================
  # STRIPE SANDBOX: Deploy per-PR account server with sandbox Stripe keys
  # Seeds products/prices, creates webhook endpoint, deploys Cloudflare Worker
  # Only runs on pull_request events
  # ============================================================================
  stripe-sandbox:
    name: Stripe Sandbox
    needs: [initialize, quality, review-gate]
    runs-on: ubuntu-latest  # Needs Docker for account server
    timeout-minutes: 30
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.pointer_bump_only != 'true' &&
      needs.quality.result == 'success' &&
      needs.review-gate.result == 'success'
    outputs:
      account_server_url: ${{ steps.deploy.outputs.account_server_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .ci/config

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ACCOUNT_ED25519_PRIVATE_KEY ACCOUNT_ED25519_PUBLIC_KEY ACCOUNT_JWT_SECRET ACCOUNT_SERVER_API_KEY APP_PRIVATE_KEY STRIPE_SANDBOX_SECRET_KEY
          GH_ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          GH_ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          GH_ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          GH_ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Install account dependencies
        run: npm install
        working-directory: private/account

      - name: Setup Stripe sandbox
        run: npx tsx scripts/setup-sandbox.ts --pr-number ${{ github.event.pull_request.number }} --skip-webhook
        working-directory: private/account
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}

      - name: Start account server
        id: deploy
        run: bash .ci/scripts/infra/ci-start-account.sh
        env:
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}

      - name: Verify account server health
        run: curl -sf http://localhost:3000/health

      - name: Cleanup
        if: always()
        run: bash .ci/scripts/infra/ci-stop.sh


  # ============================================================================
  # COLUMN 3: BUILD & DOCKER
  # Jobs: build-renet (unified), build-docker (parallel reusable workflows)
  # Fast path (tests): initialize -> build-renet -> build-docker-fast -> tests
  # Publish path: quality + review-gate -> build-docker (full) -> stage-artifacts
  # ============================================================================

  # Unified renet build - produces full binaries with embedded CRIU/rsync
  # Used by BOTH CLI (SEA embedding) and Docker (bridge images)
  build-renet:
    name: Build (Renet)
    needs: [initialize]
    permissions:
      contents: read
      packages: write   # GHCR push
    # pointer_bump_only gates the whole expensive pipeline here: build-cli,
    # build-docker(-fast) and everything needing them skip transitively when
    # this job skips (their ifs check needs.<build>.result == 'success').
    if: always() && needs.initialize.result == 'success' && needs.initialize.outputs.pointer_bump_only != 'true'
    uses: ./.github/workflows/ci-build-renet.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}
      skip_build: ${{ needs.initialize.outputs.renet_exists == 'true' }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      # OTLP_AUTH_TOKEN removed: credentials are resolved at runtime (renet#51).

  build-docker:
    name: Build (Docker)
    # build-cli produces the musl SEA that the rdc container image embeds; the
    # rdc-image build (build-cli-docker) downloads it, so order after build-cli.
    needs: [initialize, build-renet, build-cli]
    permissions:
      contents: read
      packages: write   # GHCR push
    if: always() && needs.initialize.result == 'success' && needs.build-renet.result == 'success' && needs.build-cli.result == 'success'
    uses: ./.github/workflows/ci-build-docker.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
      renet_exists: ${{ needs.initialize.outputs.renet_exists }}
      web_tag: ${{ needs.initialize.outputs.web_tag }}
      web_exists: ${{ needs.initialize.outputs.web_exists }}
      rdc_tag: ${{ needs.initialize.outputs.rdc_tag }}
      rdc_exists: ${{ needs.initialize.outputs.rdc_exists }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}

  build-docker-fast:
    name: Build (Docker Fast)
    needs: [initialize, build-renet]
    permissions:
      contents: read
      packages: write   # GHCR push
    if: always() && needs.initialize.result == 'success' && needs.build-renet.result == 'success'
    uses: ./.github/workflows/ci-build-docker.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
      renet_exists: ${{ needs.initialize.outputs.renet_exists }}
      web_tag: ${{ needs.initialize.outputs.web_tag }}
      web_exists: ${{ needs.initialize.outputs.web_exists }}
      rdc_tag: ${{ needs.initialize.outputs.rdc_tag }}
      rdc_exists: ${{ needs.initialize.outputs.rdc_exists }}
      test_images_only: true
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}

  build-cli:
    name: Build (CLI)
    needs: [initialize, build-renet]
    permissions:
      contents: read
      packages: write   # GHCR push
    if: always() && needs.initialize.result == 'success' && needs.build-renet.result == 'success'
    uses: ./.github/workflows/ci-build-cli.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}

  # ============================================================================
  # UPDATE FLOW E2E
  # Validates install.sh + `rdc update` lifecycle (findings B, C, D, E, F).
  # Consumes the rdc-linux-x64 artifact built by build-cli; runs a local
  # Python fixture server that impersonates releases.rediacc.com and drives
  # install/update/rollback scenarios.
  # ============================================================================
  update-flow-test:
    name: Tests + Infra / Update Flow
    needs: [initialize, build-cli]
    if: always() && needs.initialize.outputs.full_suite == 'true' && needs.initialize.result == 'success' && needs.build-cli.result == 'success' && needs.initialize.outputs.run_update_flow != 'false'
    uses: ./.github/workflows/ct-update-flow.yml
    with:
      cli_artifact_name: build-cli-linux-x64-${{ github.sha }}
      cli_artifact_binary: rdc-linux-x64

  # ============================================================================
  # COLUMN 3A: LINUX PACKAGE TESTS
  # Uses dummy binary — validates packaging scripts, Docker install tests
  # Dependencies: quality (lightweight, runs in parallel with builds)
  # ============================================================================
  package-tests:
    name: Tests + Infra / Linux Packages
    needs: [initialize, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.initialize.outputs.full_suite == 'true' && needs.initialize.result == 'success' && needs.initialize.outputs.pointer_bump_only != 'true' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && needs.initialize.outputs.run_package_tests != 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq createrepo-c
          source .ci/config/constants.sh
          TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sfL -o "$TARBALL" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${TARBALL}"
          # Verify BEFORE extracting: this used to pipe straight into `sudo tar`.
          echo "${NFPM_SHA256_LINUX_X86_64}  ${TARBALL}" | sha256sum -c -
          sudo tar xzf "$TARBALL" -C /usr/local/bin nfpm
          rm -f "$TARBALL"

      - name: Run Linux package tests
        run: .ci/scripts/test/test-linux-packages.sh

  # ============================================================================
  # COLUMN 3A-BIS: RELEASE-STATE DRIFT GATE
  # BLOCKER gate that enforces the sentinel-based release contract defined in
  # .ci/scripts/lib/release-state-validator.sh. Fails loud if R2 `.released`
  # sentinels and git release tags are not in bijection. Runs before
  # stage-artifacts so drift from a prior cancelled run is caught before any
  # new bytes are uploaded. Only blocks release channels on push-to-main;
  # PR/fork runs skip because they never write versioned prefixes.
  # ============================================================================
  check-release-state:
    name: Check Release State
    needs: [initialize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.is_bot != 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.initialize.outputs.channel == 'edge' || needs.initialize.outputs.channel == 'stable')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need full tag history for bijection check
          filter: blob:none   # tags and commits only, no historical file contents

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - name: Assert release-state bijection
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          IN_FLIGHT_VERSION: v${{ needs.initialize.outputs.next_version }}
        run: .ci/scripts/quality/check-release-state.sh

  # ============================================================================
  # COLUMN 3B: DEPLOY DRY-RUN
  # Jobs: stage-artifacts (reusable workflow)
  # Dependencies: build-docker, build-cli, quality, review-gate, check-release-state
  # ============================================================================
  stage-artifacts:
    name: Stage Artifacts
    # Serialize staging per channel+version: a retried/duplicate run (e.g. a
    # watchdog auto-retry attempt 2) must not run a second upload-to-r2 for the
    # same version concurrently with the first. cancel-in-progress:false — never
    # cancel an in-flight `aws s3 sync` mid-upload; queue instead. Cross-version
    # runs get distinct groups, so normal throughput is unaffected.
    concurrency:
      group: stage-artifacts-${{ needs.initialize.outputs.channel }}-v${{ needs.initialize.outputs.next_version }}
      cancel-in-progress: false
    needs: [initialize, build-docker, build-cli, quality, review-gate, check-release-state]
    permissions:
      contents: read
      packages: write      # GHCR pull for validation
      id-token: write      # OIDC token for Sigstore signing
      attestations: write  # Store attestations on GitHub
    if: always() && needs.initialize.outputs.is_bot != 'true' && needs.initialize.result == 'success' && needs.build-docker.result == 'success' && needs.build-cli.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && (needs.review-gate.result == 'success' || needs.review-gate.result == 'skipped') && (needs.check-release-state.result == 'success' || needs.check-release-state.result == 'skipped')
    uses: ./.github/workflows/cd-stage.yml
    with:
      upload_pages: ${{ github.event_name == 'pull_request' }}
      channel: ${{ needs.initialize.outputs.channel }}
      next_version: ${{ needs.initialize.outputs.next_version }}
      # A bump-none commit earns no tag and no GitHub release, so it must not
      # advance the R2 channel pointer either -- an edge manifest naming an
      # untagged version breaks `rdc` auto-update and, worse, feeds
      # promote-stable a `ref: v<version>` that does not exist. See
      # agent/PLAN-skip-release-gates-r2-manifest.md.
      skip_release: ${{ needs.initialize.outputs.skip_release }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
      web_tag: ${{ needs.initialize.outputs.web_tag }}
      rdc_tag: ${{ needs.initialize.outputs.rdc_tag }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ============================================================================
  # COLUMN 4: TESTS + INFRA
  # Jobs: tests (reusable workflow)
  # Dependencies: build-docker (fast path)
  # ============================================================================
  tests:
    name: Tests + Infra
    needs: [initialize, build-docker-fast]
    # full_suite moved from this `if:` into an INPUT so the workflow is still
    # CALLED on push-to-main: its migration-test job has to run there (it
    # validates the D1 migrations that push is about to deploy), while every
    # test job inside stays gated on full_suite exactly as before.
    if: always() && needs.initialize.result == 'success' && needs.build-docker-fast.result == 'success'
    uses: ./.github/workflows/ct-tests.yml
    with:
      full_suite: ${{ needs.initialize.outputs.full_suite }}
      pointer_bump_only: ${{ needs.initialize.outputs.pointer_bump_only }}
      # Scope decisions, one per ct-tests leaf. Empty (the default on every
      # non-PR event, where the scope step does not run) means RUN; only the
      # literal string 'false' skips. migration-test takes no scope input on
      # purpose: it validates the D1 migrations that push-to-main is about to
      # deploy, and it is not the scope engine's to decide.
      run_unit: ${{ needs.initialize.outputs.run_unit }}
      run_e2e_workers: ${{ needs.initialize.outputs.run_e2e_workers }}
      run_e2e_ceph: ${{ needs.initialize.outputs.run_e2e_ceph }}
      run_e2e_ceph_workers: ${{ needs.initialize.outputs.run_e2e_ceph_workers }}
      run_e2e_k8s: ${{ needs.initialize.outputs.run_e2e_k8s }}
      run_e2e_k8s_ceph: ${{ needs.initialize.outputs.run_e2e_k8s_ceph }}
      run_e2e_k8s_multinode: ${{ needs.initialize.outputs.run_e2e_k8s_multinode }}
      run_e2e_migrate: ${{ needs.initialize.outputs.run_e2e_migrate }}
      run_fork_isolation: ${{ needs.initialize.outputs.run_fork_isolation }}
      run_renet: ${{ needs.initialize.outputs.run_renet }}
      run_license_enforcement: ${{ needs.initialize.outputs.run_license_enforcement }}
      run_account_e2e: ${{ needs.initialize.outputs.run_account_e2e }}
      run_drills: ${{ needs.initialize.outputs.run_drills }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ============================================================================
  # COLUMN 4D: OPS VM TESTS
  # Validates rdc ops provisioning commands across platforms
  # Dependencies: build-renet (needs renet binary)
  # ============================================================================
  ops-tests:
    name: OPS Tests
    needs: [initialize, quality, review-gate, build-renet]
    # The explicit pointer_bump_only clause is load-bearing: this if never
    # references its build-renet need, so under always() the job would RUN on
    # a fast-path push and die fetching the missing renet artifact.
    if: >-
      always() &&
      needs.initialize.outputs.full_suite == 'true' &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.pointer_bump_only != 'true' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.review-gate.result == 'success' || needs.review-gate.result == 'skipped') &&
      needs.initialize.outputs.run_ops != 'false'
    uses: ./.github/workflows/ci-ops-test.yml
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ============================================================================
  # COLUMN 4C: ELITE RUN TEST
  # Validates the elite on-premise docker-compose stack starts correctly
  # Tests the same setup customers use before changes affect them
  # Dependencies: build-docker (needs Docker images)
  # ============================================================================
  elite-run-test:
    name: Elite Run
    needs: [initialize, build-docker-fast]
    if: >-
      always() &&
      needs.initialize.outputs.full_suite == 'true' &&
      needs.initialize.result == 'success' &&
      needs.build-docker-fast.result == 'success' &&
      needs.initialize.outputs.run_elite_run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap

      - name: Checkout with Submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Image Tags
        run: .ci/scripts/ci/set-image-tags.sh
        env:
          IMAGE_TAG: ${{ needs.initialize.outputs.image_tag }}
          WEB_TAG: ${{ needs.initialize.outputs.web_tag }}
          RENET_TAG: ${{ needs.initialize.outputs.renet_tag }}

      - name: Pre-pull Docker Images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TAG: ${{ env.TAG }}
        run: .ci/scripts/infra/ci-pull-images.sh

      - name: Start Elite Services
        env:
          TAG: ${{ env.TAG }}
          CI_MODE: 'true'
        run: .ci/scripts/infra/ci-start-elite.sh

      - name: Run Health Check
        run: ./private/elite/scripts/healthcheck.sh

      - name: Final Service Status
        if: always()
        run: |
          echo "Final Container Status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "(NAME|rediacc)" || true

      - name: Cleanup
        if: always()
        run: .ci/scripts/infra/ci-stop-elite.sh

  # ============================================================================
  # COLUMN 4E: BREAKPOINT LIFECYCLE
  # Regression-tests the debug box's tunnel lifecycle: create -> assert the
  # public URL serves -> tear down -> assert it is GONE.
  #
  # That last assertion is the point. The nightly sweeper
  # (.ci/breakpoint/scripts/reap-breakpoint-orphans.sh) proves orphans get
  # cleaned up eventually; nothing else proves teardown works AT ALL.
  #
  # QUICK MODE ONLY, and that is a security property rather than a convenience.
  # This is the only breakpoint code that runs inside a watchdog-monitored run,
  # and the watchdog force-cancels, which bypasses `if: always()`. Quick mode
  # creates ZERO account-side objects, so a force-cancel here leaks nothing by
  # construction -- and the job asserts exactly that, so the claim stays true as
  # the code changes. It therefore needs NO credentials: no Cloudflare token
  # reaches a PR-triggered run.
  #
  # The job name contains neither "Quality" nor "Review Gate", so it is outside
  # WATCHDOG_NO_RETRY_PATTERNS and a genuine trycloudflare outage gets
  # classified and retried instead of force-cancelling the whole run.
  # ============================================================================
  breakpoint-lifecycle:
    name: Breakpoint Lifecycle
    needs: [initialize]
    runs-on: ubuntu-slim
    timeout-minutes: 8 # CHECK 3: slim jobs must declare <= 14
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.full_suite == 'true' &&
      needs.initialize.outputs.pointer_bump_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .ci/breakpoint

      - name: Run tunnel lifecycle regression
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          # start-tunnel.sh's own diagnostic asks for exactly this: "Raise
          # --connect-timeout if this recurs on a slow runner." It recurred.
          # Runs 30544923735 and 30545891729, eleven minutes apart on
          # 2026-07-30, both failed with "tunnel URL <...>.trycloudflare.com
          # never answered in 90s / the URL was published, so cloudflared
          # started: this is the EDGE not routing". The URL being published
          # means cloudflared came up locally and the Cloudflare edge was slow
          # to route it; neither commit under test touched breakpoint code and
          # the five runs before them passed, so this is the third-party edge.
          #
          # Set HERE rather than in the script, because .ci/breakpoint/ is
          # VENDORED into other repos and check-breakpoint-drift.sh fails on any
          # local edit -- correctly. start-tunnel.sh reads
          # ARG_CONNECT_TIMEOUT from the environment (start-tunnel.sh:44), so a
          # repo-specific value belongs at the call site and costs zero drift.
          # The interactive default stays 90s: a human at a shell wants to hear
          # about a dead tunnel quickly, while this unattended regression would
          # rather wait than go red on somebody else's edge. The job's
          # timeout-minutes: 8 remains the real backstop.
          ARG_CONNECT_TIMEOUT: "180"
        run: .ci/breakpoint/scripts/test-breakpoint-lifecycle.sh --port 18099

      - name: Teardown (belt and braces)
        if: always()
        run: .ci/breakpoint/scripts/stop-breakpoint.sh --run-id "${{ github.run_id }}"

  # ============================================================================
  # COLUMN 5: DEPLOY PREVIEW
  # Deploys pages preview to Cloudflare Pages for PR validation
  # Dependencies: stage-artifacts, tests (ALL must pass)
  # Only runs on pull_request events
  # ============================================================================
  deploy-preview:
    name: Deploy Preview
    # `tests` was in `needs` and gated in the `if:`, and this job consumes
    # NOTHING from it. Its only artifact is `preview-pages-<sha>`, uploaded by
    # cd-stage.yml:223 through the `stage-artifacts` job, which is still
    # required below. Waiting on `tests` meant the preview URL appeared only
    # after the full E2E fleet finished, roughly 44 minutes for the slowest leg.
    #
    # BEHAVIOUR CHANGE, stated rather than buried: previews are now published
    # for PRs whose tests are RED. That is the point. A preview is a debugging
    # tool, and it was least available exactly when it was most useful. Nothing
    # here promotes anything: the Worker is named for the PR, the URL is a
    # workers.dev subdomain, and release promotion is gated separately on
    # push-to-main plus a release channel.
    needs: [initialize, stage-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.initialize.result == 'success' &&
      needs.stage-artifacts.result == 'success'
    # NO `environment:` BLOCK, and its absence is the point.
    #
    # A job-level `environment:` makes GitHub create the environment OBJECT and a
    # deployment record. This job created `pr-N` for every PR, and nothing in CI
    # can clean the objects up again: deleting one needs Administration:write,
    # which check-no-app-admin-perm.sh deliberately forbids the CI App from
    # holding, so a leaked token cannot delete `edge` or `stable`. The result was
    # 25 empty `pr-*` shells on /deployments, deleted by hand on 2026-09-03 with
    # .ci/scripts/housekeeping/cleanup-pr-environments.sh.
    #
    # Nothing depended on the block. Every secret and variable this job reads
    # resolves at repo or org scope (checked against the live scopes, including
    # the two that would have hurt -- CLOUDFLARE_ACCOUNT_ID and ROOT_EMAIL, both
    # repo-level), and all 25 environments held zero secrets, zero variables and
    # zero protection rules. Its serialization is redundant too: the workflow-level
    # concurrency group above already cancels a PR's previous run.
    #
    # The preview URL is not lost, it moves one click: the "Deployment summary"
    # step below writes it to $GITHUB_STEP_SUMMARY. Cloudflare-side publish and
    # cleanup are untouched -- the operator's ask was to stop publishing them on
    # the GitHub side only.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .ci/config

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            ACCOUNT_X25519_PRIVATE_KEY > BWS_ACCOUNT_X25519_PRIVATE_KEY
            ACCOUNT_X25519_PUBLIC_KEY > BWS_ACCOUNT_X25519_PUBLIC_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            AWS_SES_ACCESS_KEY_ID_EU > BWS_AWS_SES_ACCESS_KEY_ID_EU
            AWS_SES_SECRET_ACCESS_KEY_EU > BWS_AWS_SES_SECRET_ACCESS_KEY_EU
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ACCOUNT_ED25519_PRIVATE_KEY ACCOUNT_ED25519_PUBLIC_KEY ACCOUNT_JWT_SECRET ACCOUNT_SERVER_API_KEY ACCOUNT_X25519_PRIVATE_KEY ACCOUNT_X25519_PUBLIC_KEY APP_PRIVATE_KEY STRIPE_SANDBOX_SECRET_KEY AWS_SES_ACCESS_KEY_ID_EU AWS_SES_SECRET_ACCESS_KEY_EU CLOUDFLARE_API_TOKEN
          GH_ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          GH_ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          GH_ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          GH_ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          GH_ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          GH_ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          GH_AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          GH_AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: false

      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Install account dependencies
        run: npm install
        working-directory: private/account

      - name: Install www worker dependencies
        run: npm install
        working-directory: workers/www

      - name: Download preview pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: preview-pages-${{ github.sha }}
          path: workers/www/dist/

      # Mint a per-PR Turnstile widget so the preview hostname
      # `pr-N.rediacc.workers.dev` is on its own widget allowlist.
      # Cloudflare Turnstile does not support wildcards or parent-domain
      # inheritance, so each PR needs its own widget.
      # See private/account/docs/infra/cloudflare.md and
      # private/account/scripts/preview-turnstile.ts.
      - name: Create PR Turnstile widget
        id: create-widget
        working-directory: private/account
        run: npx tsx scripts/preview-turnstile.ts create "${PR_NUMBER}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/www/dist/account
        working-directory: private/account/web
        env:
          # PR previews use the per-PR widget minted above, NOT vars.TURNSTILE_SITE_KEY.
          # The prod sitekey's widget is hostname-locked to apex/regional domains
          # and cannot include workers.dev subdomains without burning hostname slots.
          VITE_TURNSTILE_SITE_KEY: ${{ steps.create-widget.outputs.sitekey }}
          VITE_CI_MODE: 'false'

      # REMOVED: "Inject E2E videos" and "Inject tutorials".
      #
      # Both downloaded artifacts that NOTHING IN THIS REPOSITORY HAS EVER
      # PRODUCED. Enumerating every `upload-artifact` name across
      # .github/workflows/ yields no `e2e-videos-*` and no
      # `tutorial-recordings-*`, and the live artifacts API agrees: of 1335
      # artifacts retained at the time of removal, zero matched either prefix,
      # while a dozen other prefixes matched normally, so the zero is a real
      # absence rather than a query that saw nothing.
      #
      # Both steps ended in `|| true`, so they failed silently on every run
      # since they were written and nobody could tell. The videos users actually
      # see are served from media.rediacc.com via PUBLIC_VIDEO_CDN_BASE_URL,
      # which is why nothing was visibly missing.
      #
      # A third copy lived in cd-deploy-worker.yml and is removed with these.

      # Create Stripe webhook pointing to pr-N
      - name: Setup Stripe webhook
        id: stripe-webhook
        run: npx tsx scripts/setup-sandbox.ts --pr-number "${PR_NUMBER}"
        working-directory: private/account
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}

      # Deploy single combined pr-N Worker (static assets + embedded account server)
      - name: Deploy preview worker
        run: .ci/scripts/deploy/deploy-www.sh --name "pr-${PR_NUMBER}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set preview worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # ONE NAME EVERYWHERE: the left side is the name the builder READS
          # and the key it WRITES into the Worker (private/account/src/types/
          # env.ts). The right side keeps the GitHub secret's current name.
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ steps.stripe-webhook.outputs.stripe_webhook_secret }}
          ROOT_EMAIL: ${{ vars.ROOT_EMAIL }}
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION_EU }}
          # Per-PR Turnstile secret comes from the create-widget step above,
          # paired with the per-PR sitekey baked into the Vite build.
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ steps.create-widget.outputs.secret }}
          AWS_SES_FROM: ${{ vars.AWS_SES_FROM }}
          AWS_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
        run: .ci/scripts/deploy/set-preview-worker-secrets.sh

      - name: Deployment summary
        run: |
          {
            echo "## Preview Deployment"
            echo ""
            echo "**URL:** https://pr-${PR_NUMBER}.rediacc.workers.dev"
            echo "**Console:** https://pr-${PR_NUMBER}.rediacc.workers.dev/console/"
            echo "**Account API:** https://pr-${PR_NUMBER}.rediacc.workers.dev/account/api/v1/health"
            echo "**PR:** #${PR_NUMBER}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # COLUMN 5b: SMOKE TEST PREVIEW
  # Validates the licensing chain end-to-end against the live preview Worker.
  # Seeds test data into preview D1, then issues a repo license via the E2E
  # encrypted tunnel and verifies the Ed25519 signature.
  # ============================================================================
  smoke-test-preview:
    name: Smoke Test Preview
    needs: [initialize, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.deploy-preview.result == 'success'
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .ci/scripts
            packages/shared
            packages/provisioning
            workers/www
            package.json
            package-lock.json
            tsconfig.json
            .ci/config

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ACCOUNT_ED25519_PUBLIC_KEY ACCOUNT_JWT_SECRET CLOUDFLARE_API_TOKEN
          GH_ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          GH_ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh

      # No app-token step here on purpose: this job checks out no submodules
      # and `.npmrc` sets allow-git=none, so nothing needs authenticated git.
      # It previously minted a write-scoped token that no step ever consumed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Seed test data into preview D1
        id: seed
        run: .ci/scripts/test/seed-smoke-test.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}

      - name: Wait for preview worker
        run: .ci/scripts/deploy/wait-for-preview-worker.sh

      - name: Run license smoke test
        run: npx tsx .ci/scripts/test/smoke-test-preview.ts
        env:
          PREVIEW_URL: https://pr-${{ env.PR_NUMBER }}.rediacc.workers.dev
          SMOKE_TEST_TOKEN: ${{ steps.seed.outputs.SMOKE_TEST_TOKEN }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}

  # ============================================================================
  # VALIDATE INSTALL METHODS - Full pre-publish validation on all 6 platforms
  # Tests ALL methods against staging worker + R2 staging artifacts.
  # Catches broken packages/Docker/install BEFORE they reach production.
  # ============================================================================
  validate-install:
    name: Validate Install Methods
    needs: [initialize, stage-artifacts]
    # THE CHANNEL CONDITION IS LOAD-BEARING, and its absence was a standing red.
    #
    # `run_install_methods` comes from the `scope` step, which is gated on
    # `github.event_name == 'pull_request'` (see `id: scope` above). On a
    # schedule run that step never executes, so the output is EMPTY, and empty
    # is not the string 'false' -- the guard reads like one and admits the job.
    #
    # It then runs with channel='' (assert-channel-for-event.sh requires that
    # for schedule), so docker_tag is '' and constants.sh:27 rewrites it to
    # `latest`. The job pulls the last RELEASED image and asserts next_version
    # against it, which fails whenever main carries commits since the last tag.
    # Measured on nightlies 32323997586 and 32208001410: "Version mismatch:
    # expected '1.2.27', got '1.2.26'". Deterministic, not flaky, and `bump-none`
    # merges widen the gap because they deliberately cut no release.
    #
    # Skipping is the honest outcome, the same ruling `validate-promote` records
    # below for the same cause: with no channel there is nothing staged, so the
    # job has no subject. That comment already names Validate Install Methods as
    # one of the three instances of this class; this is the site it missed.
    # VALIDATE_INSTALL is soft-required in assert-ci-complete.sh, which forgives
    # `skipped`.
    if: >-
      always() &&
      needs.stage-artifacts.result == 'success' &&
      needs.initialize.outputs.run_install_methods != 'false' &&
      needs.initialize.outputs.channel != '' &&
      needs.initialize.outputs.skip_release != 'true'
    uses: ./.github/workflows/ct-install-methods.yml
    with:
      version: ${{ needs.initialize.outputs.next_version }}
      docker_tag: ${{ needs.initialize.outputs.channel }}
      repo_channel: ${{ needs.initialize.outputs.channel }}

  # ============================================================================
  # VALIDATE PROMOTION - Simulates edge-to-stable promotion
  # Copies PR channel repos to a temp promoted channel, sed-fixes configs,
  # then tests APT/DNF/APK/Pacman install against the promoted channel.
  # ============================================================================
  validate-promote:
    name: Validate Promotion
    needs: [initialize, stage-artifacts]
    runs-on: ubuntu-latest
    # 60, not 30, because on `main` this job has been running within MINUTES of
    # its own ceiling for weeks and has now blown through it twice. Measured
    # durations of the `main` push runs, newest last:
    #   30249144168 21m57s   30289599104 27m20s   30324286856 CANCELLED 31m03s
    #   30528112416 28m35s   30596539903 24m09s   30621380078 24m56s
    #   30692838860 24m01s   31143504009 CANCELLED 30m51s
    # The second cancellation blocked the 0804-1 release: validate-promote is
    # soft-required in assert-ci-complete.sh, which forgives `skipped` but NOT
    # `cancelled`, so CI Complete and Pipeline Sentinel both failed and the
    # finalize step never dispatched cd-v2.yml. Nothing was wrong with the code.
    #
    # A PR CANNOT CATCH THIS, which is why the fix lands directly on main. PR
    # runs promote the tiny per-PR channel (pr-551 finished in 7m19s on run
    # 31136715318); `main` promotes the full `edge` channel, and that channel
    # grows with every release, so the trend is upward -- 21m57s on 2026-07-27
    # to over 30m on 2026-08-07. A PR check here goes green while proving
    # nothing about the path that actually breaks.
    #
    # IT DID CREEP PAST 60, and the prescribed fix has now been applied rather
    # than the number raised again. 57m01s on 2026-08-18 left three minutes of
    # headroom; 61m12s on 2026-08-20 (run 32423301927) blew the ceiling and took
    # CI Complete and Pipeline Sentinel with it, exactly the shape the 0804-1
    # release hit. That job's log has ZERO retry warnings and died mid-transfer,
    # so it was size, not flakiness.
    #
    # simulate-promotion.sh now copies SERVER-SIDE inside R2 instead of syncing
    # the whole channel down to /tmp and back up, so the cost no longer scales
    # with the runner's bandwidth. Note the destination channel is recreated
    # every run, so "incremental" could never mean skipping already-present
    # objects; not moving the bytes through the runner at all is the lever.
    #
    # It uses `aws s3api copy-object`, NOT `aws s3 sync`. The high-level command
    # reaches for object tagging on every s3-to-s3 path and R2 implements
    # neither side: --copy-props default needs GetObjectTagging, and any other
    # value sends `x-amz-tagging-directive: REPLACE`, which R2 refused with
    # NotImplemented on every object of run 32465461193. s3api sends only the
    # parameters named, so no tagging header is ever produced.
    #
    # 60 is KEPT deliberately. The growth is now off the critical path, but this
    # job also runs apt/dnf/apk/pacman installs after the copy, and a ceiling
    # that has twice been the thing that broke a release is not the place to
    # shave minutes. If it ever approaches 60 again, the copy is no longer the
    # suspect and the install steps are.
    timeout-minutes: 60
    # THIRD INSTANCE OF THE EMPTY-CHANNEL CLASS, and the gate is copied verbatim
    # from how cd-stage.yml already solved it (see its "Build package
    # repositories" step). `initialize` derives channel="" for anything that is
    # not push or pull_request, deliberately, so a nightly does not orphan ~5 GB
    # of R2 bytes. This job then ran anyway and died at
    # simulate-promotion.sh:41 with "CHANNEL is required (the source channel,
    # e.g. pr-123)", observed on nightly 30327872124.
    #
    # Skipping is the honest outcome, not a workaround: promotion validation
    # copies a STAGED channel and re-tests installs from the copy. With no
    # channel there is nothing staged, so the job has no subject. VALIDATE_PROMOTE
    # is soft-required in assert-ci-complete.sh, which forgives `skipped`.
    #
    # The other two instances of this class: Stage Artifacts (fixed in Wave A)
    # and Validate Install Methods (fixed on this branch). All three shared one
    # cause -- a job assuming a channel that schedule runs deliberately lack.
    if: >-
      always() &&
      needs.stage-artifacts.result == 'success' &&
      needs.initialize.outputs.channel != '' &&
      needs.initialize.outputs.skip_release != 'true'
    env:
      CHANNEL: ${{ needs.initialize.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - name: Simulate promotion (copy + sed-fix)
        run: .ci/scripts/deploy/simulate-promotion.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_MAX_ATTEMPTS: 10
          AWS_RETRY_MODE: adaptive
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}

      - name: Test APT install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method apt --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Test DNF install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method dnf --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Test APK install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method apk --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Test Pacman install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method pacman --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Cleanup promoted channel
        if: always()
        run: |
          PROMOTED="${CHANNEL}-promoted"
          BUCKET="rediacc-releases"
          for dir in apt rpm apk archlinux; do
            aws s3 rm "s3://${BUCKET}/${dir}/${PROMOTED}/" --recursive \
              --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --quiet 2>/dev/null || true
          done
          echo "Cleaned up promoted channel: ${PROMOTED}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

  # ============================================================================
  # CI COMPLETE - required status check for branch protection
  # This job only succeeds if ALL CI jobs pass
  # ============================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-slim
    # check-release-state is aggregated here because it was a live FALSE-GREEN
    # path, found by .ci/scripts/quality/check-ci-job-aggregation.sh. It is not
    # merely unobserved: stage-artifacts requires
    # `check-release-state.result == 'success' || == 'skipped'`, so a FAILURE
    # makes stage-artifacts SKIP, `skipped` is forgiven by the soft tier, and
    # `CI Complete` reports success while a release-state assertion failed on
    # main. It is soft-required, because it legitimately skips on every PR
    # (it is gated on push-to-main plus a release channel).
    needs: [initialize, label-guide, run-sh-tests, quality, review-gate, stripe-sandbox, build-docker, build-docker-fast, build-cli, package-tests, check-release-state, stage-artifacts, validate-install, validate-promote, tests, elite-run-test, ops-tests, update-flow-test, deploy-preview, smoke-test-preview, breakpoint-lifecycle]
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow defaults, so contents and
    # packages are restated. actions: read is for the shadow reconciliation
    # step at the end, which downloads this run's attested plan and reads its
    # own per-job outcomes. Read-only, and that step fails nothing.
    permissions:
      contents: read
      packages: read
      actions: read
    if: always() && !cancelled()
    steps:
      # The tier logic now lives in .ci/scripts/ci/assert-ci-complete.sh, so the
      # repo must be on disk. Sparse: this job needs only that script + its lib.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .ci/scripts

      - name: Check all jobs passed
        run: .ci/scripts/ci/assert-ci-complete.sh
        env:
          POINTER_BUMP_ONLY: ${{ needs.initialize.outputs.pointer_bump_only }}
          RESULT_INITIALIZE: ${{ needs.initialize.result }}
          RESULT_LABEL_GUIDE: ${{ needs.label-guide.result }}
          RESULT_RUN_SH_TESTS: ${{ needs.run-sh-tests.result }}
          RESULT_BUILD_DOCKER: ${{ needs.build-docker.result }}
          RESULT_BUILD_DOCKER_FAST: ${{ needs.build-docker-fast.result }}
          RESULT_BUILD_CLI: ${{ needs.build-cli.result }}
          RESULT_QUALITY: ${{ needs.quality.result }}
          RESULT_REVIEW_GATE: ${{ needs.review-gate.result }}
          RESULT_STRIPE_SANDBOX: ${{ needs.stripe-sandbox.result }}
          RESULT_PACKAGE_TESTS: ${{ needs.package-tests.result }}
          RESULT_CHECK_RELEASE_STATE: ${{ needs.check-release-state.result }}
          RESULT_STAGE_ARTIFACTS: ${{ needs.stage-artifacts.result }}
          RESULT_VALIDATE_INSTALL: ${{ needs.validate-install.result }}
          RESULT_VALIDATE_PROMOTE: ${{ needs.validate-promote.result }}
          RESULT_TESTS: ${{ needs.tests.result }}
          RESULT_ELITE_RUN_TEST: ${{ needs.elite-run-test.result }}
          RESULT_OPS_TESTS: ${{ needs.ops-tests.result }}
          RESULT_UPDATE_FLOW_TEST: ${{ needs.update-flow-test.result }}
          RESULT_DEPLOY_PREVIEW: ${{ needs.deploy-preview.result }}
          RESULT_SMOKE_TEST_PREVIEW: ${{ needs.smoke-test-preview.result }}
          RESULT_BREAKPOINT_LIFECYCLE: ${{ needs.breakpoint-lifecycle.result }}

      # SHADOW reconciliation, and it runs AFTER the real gate above on
      # purpose: this must never influence the verdict, only observe it.
      # always() so the evidence is collected even when the gate above failed,
      # which is exactly the case worth understanding.
      #
      # It answers the one question that decides whether the reconciler can be
      # turned on for real: would it have fired FALSELY? The reconciler
      # hard-fails on any planned-run job that skipped, and today's shadow plan
      # does not encode pre-existing skip conditions (full_suite, and
      # pointer_bump_only). Wiring it before seeing a clean run of PRs would
      # red a required check for reasons unrelated to scope.
      - name: Skip-plan reconciliation (shadow, fails nothing)
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # Which decision the reconciler is reconciling against. Empty on any
          # run where the scope step did not produce one, which the reconciler
          # treats the same way every other consumer does: as "full CI", not as
          # an error.
          SCOPE_MODE: ${{ needs.initialize.outputs.scope_mode }}
        run: .ci/scripts/ci/scope-reconcile-shadow.sh
  # ============================================================================
  # FINALIZE RELEASE SENTINEL
  # Atomic commit point of the release pipeline. Writes `.released` sentinels
  # to cli/v${V}/ on R2 — only after every CI gate upstream
  # has passed. The sentinel seals the version: from here on, write_once_guard
  # refuses to overwrite, and the drift gate requires a matching git tag.
  #
  # See .ci/scripts/lib/release-state-validator.sh for the invariant and
  # .ci/scripts/deploy/write-release-sentinel.sh for the writer.
  #
  # always() prefix is load-bearing (same reason as housekeeping): ci-complete
  # transitively needs deploy-preview / smoke-test-preview which are
  # pull_request-only and skip on push-to-main.
  # ============================================================================
  finalize-release-sentinel:
    name: Finalize Release Sentinel
    runs-on: ubuntu-slim
    needs: [initialize, ci-complete]
    permissions:
      contents: read
      actions: write   # for dispatching cd-v2.yml after sentinel write
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci-complete.result == 'success' &&
      needs.initialize.result == 'success' &&
      (needs.initialize.outputs.channel == 'edge' || needs.initialize.outputs.channel == 'stable')
    timeout-minutes: 5
    concurrency:
      group: finalize-release-v${{ needs.initialize.outputs.next_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .github/actions
            .ci/config

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - name: Install jq
        run: command -v jq >/dev/null || sudo apt-get install -y -qq jq
      # ASK BEFORE SEALING. This step used to come AFTER the sentinel write, so
      # a bump-none merge sealed cli/v<X>/.released and only then decided that
      # no release was owed -- leaving R2 holding a sentinel for a version that
      # never got a tag. Seen live on run 32491717875 (sealed 15:12:12, skipped
      # 15:12:16), which is why cli/v1.2.27/.released exists with no v1.2.27.
      #
      # STEP-level, not job-level, and that is not a style choice: a job-level
      # `if:` would leave finalize-release-sentinel with result `skipped`, and
      # pipeline-sentinel feeds that result to assert-job-succeeded.sh, which
      # treats `skipped` as a hard failure. Skipping the release would fail CI.
      # THE DECISION IS MADE IN `initialize`, NOT HERE. It used to be a step in
      # this job, which `needs: ci-complete` and is therefore DOWNSTREAM of
      # stage-artifacts -- the job that writes R2. The answer arrived after the
      # uploader had already advanced the edge channel pointer, which is how
      # cli/edge/manifest.json came to advertise a version with no tag. Moving
      # it does not add a second evaluation: there is still exactly one, and
      # this job now READS it. See .ci/scripts/ci/initialize.sh step 6b.
      #
      # THE GUARD POLARITY IS INVERTED ON PURPOSE. `!= 'true'` means the seal
      # and the dispatch happen unless the decision explicitly said to skip.
      # Every degenerate state -- initialize cancelled, OOM-killed, or the
      # output name typo'd -- yields an empty string and therefore RELEASES.
      # `== 'true'` would invert that: any of those would silently skip both
      # steps, the job would go green, and the release would simply never
      # happen. That is precisely the failure dispatch-release.sh's fail-open
      # doctrine exists to prevent ("a silently withheld release is far worse
      # than one unnecessary release"), so the guard fails in the same
      # direction the script does.
      - name: Write release sentinels
        if: needs.initialize.outputs.skip_release != 'true'
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          .ci/scripts/deploy/write-release-sentinel.sh \
            --version "${{ needs.initialize.outputs.next_version }}" \
            --channel "${{ needs.initialize.outputs.channel }}" \
            --commit-sha "${{ github.sha }}"
      # Sentinel is sealed at this point, and the very next step dispatches.
      # There is ZERO conditional logic between the two: both carry the SAME
      # guard, evaluated once in `initialize` and merely read here, so nothing
      # can decide differently in between. That property is what the original ordering
      # only appeared to have -- it put dispatch immediately after the seal to
      # survive a CANCELLATION, and was then broken by a path it had not
      # considered: a step that ran, succeeded, and chose not to release.
      # Cancellation is still covered, because cd-v2 runs as its own
      # workflow_dispatch run with an independent lifecycle.
      #
      # The dispatch lives in a script so the bump-none skip decision has
      # somewhere testable to live: it needs a PR lookup and a fail-open branch,
      # and a `run:` block is capped at 8 logic lines for exactly that reason.
      # The script FAILS OPEN -- any lookup trouble dispatches anyway, because a
      # silently withheld release is far worse than one extra release.
      # --dispatch-only skips the lookup: `initialize` already did it, and
      # asking twice could get a different answer if a label moved in between.
      - name: Dispatch cd-v2 release
        if: needs.initialize.outputs.skip_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/scripts/ci/dispatch-release.sh --dispatch-only

  # (Removed: assert-finalize-sentinel-ran was a single-purpose sentinel
  # job whose only step asserted that finalize-release-sentinel did not
  # silently skip on a release-channel push to main. The same check now
  # lives in the consolidated `pipeline-sentinel` job below, alongside the
  # equivalent housekeeping check. See commit history for the original
  # rationale; merging two single-step jobs into one removes two ceremonial
  # entries from the post-CI DAG without changing the assertion property.)

  # ============================================================================
  # PIPELINE SENTINEL
  # Asserts the critical post-CI job (finalize-release-sentinel) actually ran
  # and didn't silently skip via GHA's transitive-skip propagation when a
  # pull_request-only dep is `skipped` on push-to-main.
  #
  # (Housekeeping was moved out of the release pipeline to a nightly schedule —
  # see .github/workflows/housekeeping.yml — so version/R2 cleanup can no longer
  # race a live release. It is no longer asserted here.)
  #
  # finalize-release-sentinel has its own `if:` guards; this sentinel is the
  # belt-and-suspenders that fails loud if those guards regress. 'cancelled'
  # (watchdog force-cancel, concurrent-push supersession, manual cancel) and
  # 'failure' (the job already surfaced its own failure) pass through. Only
  # 'skipped' on a release-channel push-to-main trips this. See
  # .ci/scripts/ci/assert-job-succeeded.sh for the full state table.
  # ============================================================================
  pipeline-sentinel:
    name: Pipeline Sentinel
    runs-on: ubuntu-slim
    needs: [initialize, finalize-release-sentinel]
    timeout-minutes: 5
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
      - name: Check finalize-release-sentinel conclusion (release channels only)
        if: needs.initialize.result == 'success' && (needs.initialize.outputs.channel == 'edge' || needs.initialize.outputs.channel == 'stable')
        run: .ci/scripts/ci/assert-job-succeeded.sh finalize-release-sentinel "${{ needs.finalize-release-sentinel.result }}"
