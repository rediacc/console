name: Console CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '0 1 * * *'  # Nightly at 1:00 UTC (2:00 CET)
  # workflow_dispatch removed: manual triggers don't satisfy PR checks and waste CI budget.
  # Use empty commits (git commit --allow-empty) to retrigger PR CI instead.

# Minimal default permissions — jobs that need more declare their own.
# NOTE: `statuses: write` was removed. Nothing here ever wrote a commit status,
# and the required check ("CI Complete") is bound to the github-actions app —
# the same app that issues every job's GITHUB_TOKEN — so granting it repo-wide
# handed PR-controlled code a plausible way to post that context itself.
permissions:
  contents: read
  packages: read    # Most jobs pull from GHCR

concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # COLUMN 1: INITIALIZE
  # Jobs: initialize, ci-watchdog
  # No dependencies - starts immediately for fast feedback on Quality checks
  # ============================================================================
  initialize:
    name: Initialize
    runs-on: ubuntu-latest  # Needs Docker for registry cache check
    timeout-minutes: 15
    # checks: read is for detect-pointer-bump.sh (reads the baseline commit's
    # "CI Complete" check-run with the plain GITHUB_TOKEN; the app token has
    # no checks scope). Job-level permissions replace the workflow defaults,
    # so contents+packages are restated.
    permissions:
      contents: read
      packages: read
      checks: read
    if: github.event_name != 'push' || (github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))
    outputs:
      is_bot: ${{ steps.init.outputs.is_bot }}
      next_version: ${{ steps.init.outputs.next_version }}
      bump_type: ${{ steps.init.outputs.bump_type }}
      channel: ${{ steps.staging.outputs.channel }}
      renet_tag: ${{ steps.init.outputs.renet_tag }}
      renet_exists: ${{ steps.init.outputs.renet_exists }}
      web_tag: ${{ steps.init.outputs.web_tag }}
      web_exists: ${{ steps.init.outputs.web_exists }}
      rdc_tag: ${{ steps.init.outputs.rdc_tag }}
      rdc_exists: ${{ steps.init.outputs.rdc_exists }}
      image_tag: ${{ steps.init.outputs.image_tag }}
      # full_suite: run all jobs on PR and nightly. Skip expensive
      # jobs (quality, standalone, elite) on push-to-main since PR already validated.
      full_suite: ${{ github.event_name != 'push' }}
      # pointer_bump_only: PR head provably identical in content to a commit
      # that already passed full CI, differing only in submodule pointers that
      # moved to tree-identical commits on the submodules' main (post-squash
      # bump). Gates the expensive jobs; see .ci/scripts/ci/detect-pointer-bump.sh.
      pointer_bump_only: ${{ steps.init.outputs.pointer_bump_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      # Fork PRs are not supported (see .github/CONTRIBUTING.md). They fail
      # here anyway: secrets are empty on a fork, so the app-token step below
      # errors, `initialize` fails, and `ci-complete` reports red. The old
      # per-job `is_fork` gating never changed that outcome.
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap

      # PR Validation (PR events only)
      - name: Validate PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: return await require('./.ci/scripts/ci/validate-pr.cjs')({github, context, core})

      # Login to GHCR for registry cache check
      - name: Login to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Run consolidated initialization script
      - name: Initialize CI
        id: init
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Plain job token for detect-pointer-bump.sh: check-runs need
          # checks:read, which the app-token presets do not carry.
          CHECKS_TOKEN: ${{ github.token }}
        run: |
          .ci/scripts/ci/initialize.sh --output "$GITHUB_OUTPUT"

      - name: Generate channel context
        id: staging
        run: |
          # Only push and pull_request events write to R2. schedule (nightly)
          # gets empty channel -> stage-artifacts still runs for validation
          # but every R2/GHCR upload step self-gates on channel != ''. Prior
          # design set dryrun-<sha> here and produced ~5 GB of orphan R2
          # bytes per nightly run (and per merge-queue check, since removed).
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANNEL="edge"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANNEL="pr-${{ github.event.pull_request.number }}"
          else
            CHANNEL=""
          fi
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

      - name: Assert channel matches event
        # Guard against someone reintroducing a dryrun-<sha> fallthrough
        # for schedule events.
        run: .ci/scripts/ci/assert-channel-for-event.sh "${{ github.event_name }}" "${{ steps.staging.outputs.channel }}"

      # Upload CI tags as artifact for debugging
      - name: Upload CI Tags
        if: steps.init.outputs.is_bot != 'true'
        run: |
          cat > ci-tags.txt << EOF
          renet_tag=${{ steps.init.outputs.renet_tag }}
          web_tag=${{ steps.init.outputs.web_tag }}
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: steps.init.outputs.is_bot != 'true'
        with:
          name: ci-tags-${{ github.sha }}
          path: ci-tags.txt
          retention-days: 1

  # ============================================================================
  # MIGRATION TEST
  # Validates that D1 migrations apply cleanly against a production data clone.
  # Creates an ephemeral D1 database, clones production, runs migrations, then
  # deletes the database. No worker is deployed -- CI-only, no public URL.
  # ============================================================================
  migration-test:
    name: Migration Test
    needs: [initialize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.pointer_bump_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Init account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Reap stale migration-test D1 databases
        run: .ci/scripts/housekeeping/cleanup-stale-d1.sh --max-age 60
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Test migrations against all regional clones (edge first, then stable)
        run: .ci/scripts/deploy/test-d1-migrations.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  cancel-watchdog:
    name: CI Watchdog
    needs: [initialize]
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read
    timeout-minutes: 15
    # Use !cancelled() so force-cancel from newer runs can stop this job
    if: ${{ !cancelled() && needs.initialize.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts

      - name: Cancel older runs
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-cancel-push')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .ci/scripts/ci/cancel-older-runs.sh --timeout 60 --poll-interval 10

      # The monitor itself lives in watchdog-monitor.yml as a chain of short
      # ubuntu-slim generations: the 1-vCPU runner's 15-minute job cap is a
      # hard platform limit, so the old single 3-hour monitor job (which held
      # a standard runner for the whole run) cannot run there. This bootstrap
      # only dispatches generation 1; each generation re-dispatches the next
      # until the run completes or a terminal verdict fires. The WATCHDOG_*
      # pattern env vars moved to watchdog-monitor.yml with the monitor step.
      - name: Start watchdog monitor chain
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          .ci/scripts/ci/dispatch-watchdog.sh --run-id "$GITHUB_RUN_ID" \
            --generation 1 --pr-number "${PR_NUMBER:-}" --head-ref "${HEAD_REF:-}"

  # ============================================================================
  # COLUMN 2: QUALITY
  # Jobs: quality (reusable workflow)
  # Dependencies: [initialize]
  # ============================================================================
  quality:
    name: Quality
    needs: [initialize]
    if: needs.initialize.outputs.is_bot != 'true' && needs.initialize.outputs.full_suite == 'true'
    uses: ./.github/workflows/ci-quality.yml
    with:
      is_bot: ${{ needs.initialize.outputs.is_bot }}
      next_version: ${{ needs.initialize.outputs.next_version }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      # quality-i18n restores the R2 narration-audio cache so the tutorial-audio
      # gate can actually assert per-file existence (see ci-quality.yml).
      R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.R2_MEDIA_ACCESS_KEY_ID }}
      R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.R2_MEDIA_SECRET_ACCESS_KEY }}
      R2_MEDIA_ENDPOINT: ${{ secrets.R2_MEDIA_ENDPOINT }}

  # ============================================================================
  # REVIEW GATE: enforce review-thread hygiene (bot-agnostic)
  # Dependencies: [initialize, quality]
  # Must pass before Build jobs can start
  #
  # Reviews themselves come from the Claude Review workflow
  # (claude-review.yml), which fires only when CI is green AND the PR is
  # non-draft. This gate enforces that the threads any review leaves are
  # resolved and substantively replied to.
  # ============================================================================
  review-gate:
    name: Review Gate
    needs: [initialize, quality]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: needs.initialize.outputs.is_bot != 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .github/actions
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # pr-read, not cd: the two scripts below only READ review state.
          # check-resolved-threads.sh / check-review-comments.sh merely print
          # the resolve/reply commands for a human to run; they never call them.
          preset: pr-read
          repositories: console
      - name: Check resolved threads
        run: .ci/scripts/quality/check-resolved-threads.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Check unreplied review comments
        run: .ci/scripts/quality/check-review-comments.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      # Inline comments and review threads are covered above; the review's
      # SUMMARY REPORT is an issue comment (flat, no resolve mechanism) and
      # would otherwise be ignorable. Requires a substantive reply that
      # references the newest finished report by comment id.
      - name: Check unreplied review reports
        run: .ci/scripts/quality/check-review-report-replies.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  # ============================================================================
  # STRIPE SANDBOX: Deploy per-PR account server with sandbox Stripe keys
  # Seeds products/prices, creates webhook endpoint, deploys Cloudflare Worker
  # Only runs on pull_request events
  # ============================================================================
  stripe-sandbox:
    name: Stripe Sandbox
    needs: [initialize, quality, review-gate]
    runs-on: ubuntu-latest  # Needs Docker for account server
    timeout-minutes: 30
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.pointer_bump_only != 'true' &&
      needs.quality.result == 'success' &&
      needs.review-gate.result == 'success'
    outputs:
      account_server_url: ${{ steps.deploy.outputs.account_server_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Install account dependencies
        run: npm install
        working-directory: private/account

      - name: Setup Stripe sandbox
        run: npx tsx scripts/setup-sandbox.ts --pr-number ${{ github.event.pull_request.number }} --skip-webhook
        working-directory: private/account
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}

      - name: Start account server
        id: deploy
        run: bash .ci/scripts/infra/ci-start-account.sh
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}

      - name: Verify account server health
        run: curl -sf http://localhost:3000/health

      - name: Cleanup
        if: always()
        run: bash .ci/scripts/infra/ci-stop.sh


  # ============================================================================
  # COLUMN 3: BUILD & DOCKER
  # Jobs: build-renet (unified), build-docker (parallel reusable workflows)
  # Fast path (tests): initialize -> build-renet -> build-docker-fast -> tests
  # Publish path: quality + review-gate -> build-docker (full) -> stage-artifacts
  # ============================================================================

  # Unified renet build - produces full binaries with embedded CRIU/rsync
  # Used by BOTH CLI (SEA embedding) and Docker (bridge images)
  build-renet:
    name: Build (Renet)
    needs: [initialize]
    permissions:
      contents: read
      packages: write   # GHCR push
    # pointer_bump_only gates the whole expensive pipeline here: build-cli,
    # build-docker(-fast) and everything needing them skip transitively when
    # this job skips (their ifs check needs.<build>.result == 'success').
    if: always() && needs.initialize.result == 'success' && needs.initialize.outputs.pointer_bump_only != 'true'
    uses: ./.github/workflows/ci-build-renet.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}
      skip_build: ${{ needs.initialize.outputs.renet_exists == 'true' }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      # OTLP_AUTH_TOKEN removed: credentials are resolved at runtime (renet#51).

  build-docker:
    name: Build (Docker)
    # build-cli produces the musl SEA that the rdc container image embeds; the
    # rdc-image build (build-cli-docker) downloads it, so order after build-cli.
    needs: [initialize, build-renet, build-cli]
    permissions:
      contents: read
      packages: write   # GHCR push
    if: always() && needs.initialize.result == 'success' && needs.build-renet.result == 'success' && needs.build-cli.result == 'success'
    uses: ./.github/workflows/ci-build-docker.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
      renet_exists: ${{ needs.initialize.outputs.renet_exists }}
      web_tag: ${{ needs.initialize.outputs.web_tag }}
      web_exists: ${{ needs.initialize.outputs.web_exists }}
      rdc_tag: ${{ needs.initialize.outputs.rdc_tag }}
      rdc_exists: ${{ needs.initialize.outputs.rdc_exists }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}

  build-docker-fast:
    name: Build (Docker Fast)
    needs: [initialize, build-renet]
    permissions:
      contents: read
      packages: write   # GHCR push
    if: always() && needs.initialize.result == 'success' && needs.build-renet.result == 'success'
    uses: ./.github/workflows/ci-build-docker.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
      renet_exists: ${{ needs.initialize.outputs.renet_exists }}
      web_tag: ${{ needs.initialize.outputs.web_tag }}
      web_exists: ${{ needs.initialize.outputs.web_exists }}
      rdc_tag: ${{ needs.initialize.outputs.rdc_tag }}
      rdc_exists: ${{ needs.initialize.outputs.rdc_exists }}
      test_images_only: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}

  build-cli:
    name: Build (CLI)
    needs: [initialize, build-renet]
    permissions:
      contents: read
      packages: write   # GHCR push
    if: always() && needs.initialize.result == 'success' && needs.build-renet.result == 'success'
    uses: ./.github/workflows/ci-build-cli.yml
    with:
      next_version: ${{ needs.initialize.outputs.next_version }}

  # ============================================================================
  # UPDATE FLOW E2E
  # Validates install.sh + `rdc update` lifecycle (findings B, C, D, E, F).
  # Consumes the rdc-linux-x64 artifact built by build-cli; runs a local
  # Python fixture server that impersonates releases.rediacc.com and drives
  # install/update/rollback scenarios.
  # ============================================================================
  update-flow-test:
    name: Tests + Infra / Update Flow
    needs: [initialize, build-cli]
    if: always() && needs.initialize.outputs.full_suite == 'true' && needs.initialize.result == 'success' && needs.build-cli.result == 'success'
    uses: ./.github/workflows/ct-update-flow.yml
    with:
      cli_artifact_name: build-cli-linux-x64-${{ github.sha }}
      cli_artifact_binary: rdc-linux-x64

  # ============================================================================
  # COLUMN 3A: LINUX PACKAGE TESTS
  # Uses dummy binary — validates packaging scripts, Docker install tests
  # Dependencies: quality (lightweight, runs in parallel with builds)
  # ============================================================================
  package-tests:
    name: Tests + Infra / Linux Packages
    needs: [initialize, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always() && needs.initialize.outputs.full_suite == 'true' && needs.initialize.result == 'success' && needs.initialize.outputs.pointer_bump_only != 'true' && (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq createrepo-c
          source .ci/config/constants.sh
          TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -sfL -o "$TARBALL" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${TARBALL}"
          # Verify BEFORE extracting: this used to pipe straight into `sudo tar`.
          echo "${NFPM_SHA256_LINUX_X86_64}  ${TARBALL}" | sha256sum -c -
          sudo tar xzf "$TARBALL" -C /usr/local/bin nfpm
          rm -f "$TARBALL"

      - name: Run Linux package tests
        run: .ci/scripts/test/test-linux-packages.sh

  # ============================================================================
  # COLUMN 3A-BIS: RELEASE-STATE DRIFT GATE
  # BLOCKER gate that enforces the sentinel-based release contract defined in
  # .ci/scripts/lib/release-state-validator.sh. Fails loud if R2 `.released`
  # sentinels and git release tags are not in bijection. Runs before
  # stage-artifacts so drift from a prior cancelled run is caught before any
  # new bytes are uploaded. Only blocks release channels on push-to-main;
  # PR/fork runs skip because they never write versioned prefixes.
  # ============================================================================
  check-release-state:
    name: Check Release State
    needs: [initialize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      always() &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.is_bot != 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.initialize.outputs.channel == 'edge' || needs.initialize.outputs.channel == 'stable')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need full tag history for bijection check
      - name: Assert release-state bijection
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          IN_FLIGHT_VERSION: v${{ needs.initialize.outputs.next_version }}
        run: .ci/scripts/quality/check-release-state.sh

  # ============================================================================
  # COLUMN 3B: DEPLOY DRY-RUN
  # Jobs: stage-artifacts (reusable workflow)
  # Dependencies: build-docker, build-cli, quality, review-gate, check-release-state
  # ============================================================================
  stage-artifacts:
    name: Stage Artifacts
    # Serialize staging per channel+version: a retried/duplicate run (e.g. a
    # watchdog auto-retry attempt 2) must not run a second upload-to-r2 for the
    # same version concurrently with the first. cancel-in-progress:false — never
    # cancel an in-flight `aws s3 sync` mid-upload; queue instead. Cross-version
    # runs get distinct groups, so normal throughput is unaffected.
    concurrency:
      group: stage-artifacts-${{ needs.initialize.outputs.channel }}-v${{ needs.initialize.outputs.next_version }}
      cancel-in-progress: false
    needs: [initialize, build-docker, build-cli, quality, review-gate, check-release-state]
    permissions:
      contents: read
      packages: write      # GHCR pull for validation
      id-token: write      # OIDC token for Sigstore signing
      attestations: write  # Store attestations on GitHub
    if: always() && needs.initialize.outputs.is_bot != 'true' && needs.initialize.result == 'success' && needs.build-docker.result == 'success' && needs.build-cli.result == 'success' && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && (needs.review-gate.result == 'success' || needs.review-gate.result == 'skipped') && (needs.check-release-state.result == 'success' || needs.check-release-state.result == 'skipped')
    uses: ./.github/workflows/cd-stage.yml
    with:
      upload_pages: ${{ github.event_name == 'pull_request' }}
      channel: ${{ needs.initialize.outputs.channel }}
      next_version: ${{ needs.initialize.outputs.next_version }}
      renet_tag: ${{ needs.initialize.outputs.renet_tag }}
      web_tag: ${{ needs.initialize.outputs.web_tag }}
      rdc_tag: ${{ needs.initialize.outputs.rdc_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ============================================================================
  # COLUMN 4: TESTS + INFRA
  # Jobs: tests (reusable workflow)
  # Dependencies: build-docker (fast path)
  # ============================================================================
  tests:
    name: Tests + Infra
    needs: [initialize, build-docker-fast]
    if: always() && needs.initialize.outputs.full_suite == 'true' && needs.initialize.result == 'success' && needs.build-docker-fast.result == 'success'
    uses: ./.github/workflows/ct-tests.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}

  # ============================================================================
  # COLUMN 4D: OPS VM TESTS
  # Validates rdc ops provisioning commands across platforms
  # Dependencies: build-renet (needs renet binary)
  # ============================================================================
  ops-tests:
    name: OPS Tests
    needs: [initialize, quality, review-gate, build-renet]
    # The explicit pointer_bump_only clause is load-bearing: this if never
    # references its build-renet need, so under always() the job would RUN on
    # a fast-path push and die fetching the missing renet artifact.
    if: >-
      always() &&
      needs.initialize.outputs.full_suite == 'true' &&
      needs.initialize.result == 'success' &&
      needs.initialize.outputs.pointer_bump_only != 'true' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.review-gate.result == 'success' || needs.review-gate.result == 'skipped')
    uses: ./.github/workflows/ci-ops-test.yml
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ============================================================================
  # COLUMN 4C: ELITE RUN TEST
  # Validates the elite on-premise docker-compose stack starts correctly
  # Tests the same setup customers use before changes affect them
  # Dependencies: build-docker (needs Docker images)
  # ============================================================================
  elite-run-test:
    name: Elite Run
    needs: [initialize, build-docker-fast]
    if: >-
      always() &&
      needs.initialize.outputs.full_suite == 'true' &&
      needs.initialize.result == 'success' &&
      needs.build-docker-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap

      - name: Checkout with Submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Image Tags
        run: .ci/scripts/ci/set-image-tags.sh
        env:
          IMAGE_TAG: ${{ needs.initialize.outputs.image_tag }}
          WEB_TAG: ${{ needs.initialize.outputs.web_tag }}
          RENET_TAG: ${{ needs.initialize.outputs.renet_tag }}

      - name: Pre-pull Docker Images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TAG: ${{ env.TAG }}
        run: .ci/scripts/infra/ci-pull-images.sh

      - name: Start Elite Services
        env:
          TAG: ${{ env.TAG }}
          CI_MODE: 'true'
        run: .ci/scripts/infra/ci-start-elite.sh

      - name: Run Health Check
        run: ./private/elite/scripts/healthcheck.sh

      - name: Final Service Status
        if: always()
        run: |
          echo "Final Container Status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "(NAME|rediacc)" || true

      - name: Cleanup
        if: always()
        run: .ci/scripts/infra/ci-stop-elite.sh

  # ============================================================================
  # COLUMN 5: DEPLOY PREVIEW
  # Deploys pages preview to Cloudflare Pages for PR validation
  # Dependencies: stage-artifacts, tests (ALL must pass)
  # Only runs on pull_request events
  # ============================================================================
  deploy-preview:
    name: Deploy Preview
    needs: [initialize, stage-artifacts, tests, migration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.initialize.result == 'success' &&
      needs.stage-artifacts.result == 'success' &&
      needs.tests.result == 'success' &&
      needs.migration-test.result == 'success'
    environment:
      name: pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.rediacc.workers.dev
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: false

      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Install account dependencies
        run: npm install
        working-directory: private/account

      - name: Install www worker dependencies
        run: npm install
        working-directory: workers/www

      - name: Download preview pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: preview-pages-${{ github.sha }}
          path: workers/www/dist/

      # Mint a per-PR Turnstile widget so the preview hostname
      # `pr-N.rediacc.workers.dev` is on its own widget allowlist.
      # Cloudflare Turnstile does not support wildcards or parent-domain
      # inheritance, so each PR needs its own widget.
      # See private/account/docs/infra/cloudflare.md and
      # private/account/scripts/preview-turnstile.ts.
      - name: Create PR Turnstile widget
        id: create-widget
        working-directory: private/account
        run: npx tsx scripts/preview-turnstile.ts create "${PR_NUMBER}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/www/dist/account
        working-directory: private/account/web
        env:
          # PR previews use the per-PR widget minted above, NOT vars.TURNSTILE_SITE_KEY.
          # The prod sitekey's widget is hostname-locked to apex/regional domains
          # and cannot include workers.dev subdomains without burning hostname slots.
          VITE_TURNSTILE_SITE_KEY: ${{ steps.create-widget.outputs.sitekey }}
          VITE_CI_MODE: 'false'

      # Inject e2e test videos into pages for documentation embedding
      - name: Inject E2E videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/scripts/docs/inject-e2e-videos.sh --run-id "${{ github.run_id }}" --artifact-name "e2e-videos-${{ github.sha }}" --output workers/www/dist/assets/videos/user-guide/ || true

      # Inject tutorial recordings into pages for interactive player
      - name: Inject tutorials
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/scripts/docs/inject-tutorials.sh --run-id "${{ github.run_id }}" --artifact-name "tutorial-recordings-${{ github.sha }}" --output workers/www/dist/assets/tutorials/ || true

      # Create Stripe webhook pointing to pr-N
      - name: Setup Stripe webhook
        id: stripe-webhook
        run: npx tsx scripts/setup-sandbox.ts --pr-number ${PR_NUMBER}
        working-directory: private/account
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}

      # Deploy single combined pr-N Worker (static assets + embedded account server)
      - name: Deploy preview worker
        run: .ci/scripts/deploy/deploy-www.sh --name "pr-${PR_NUMBER}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set preview worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          SECRET_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          SECRET_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          SECRET_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          SECRET_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          SECRET_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          SECRET_STRIPE_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          SECRET_STRIPE_WEBHOOK: ${{ steps.stripe-webhook.outputs.stripe_webhook_secret }}
          SECRET_ROOT_EMAIL: ${{ vars.ROOT_EMAIL }}
          SECRET_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          SECRET_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          SECRET_SES_REGION: ${{ vars.AWS_SES_REGION_EU }}
          # Per-PR Turnstile secret comes from the create-widget step above,
          # paired with the per-PR sitekey baked into the Vite build.
          SECRET_TURNSTILE_KEY: ${{ steps.create-widget.outputs.secret }}
          VAR_SES_FROM: ${{ vars.AWS_SES_FROM }}
          VAR_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
        run: .ci/scripts/deploy/set-preview-worker-secrets.sh

      - name: Deployment summary
        run: |
          echo "## Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://pr-${PR_NUMBER}.rediacc.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Console:** https://pr-${PR_NUMBER}.rediacc.workers.dev/console/" >> $GITHUB_STEP_SUMMARY
          echo "**Account API:** https://pr-${PR_NUMBER}.rediacc.workers.dev/account/api/v1/health" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${PR_NUMBER}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # COLUMN 5b: SMOKE TEST PREVIEW
  # Validates the licensing chain end-to-end against the live preview Worker.
  # Seeds test data into preview D1, then issues a repo license via the E2E
  # encrypted tunnel and verifies the Ed25519 signature.
  # ============================================================================
  smoke-test-preview:
    name: Smoke Test Preview
    needs: [initialize, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.deploy-preview.result == 'success'
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .ci/scripts
            packages/shared
            packages/provisioning
            workers/www
            package.json
            package-lock.json
            tsconfig.json

      # No app-token step here on purpose: this job checks out no submodules
      # and `.npmrc` sets allow-git=none, so nothing needs authenticated git.
      # It previously minted a write-scoped token that no step ever consumed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Seed test data into preview D1
        id: seed
        run: .ci/scripts/test/seed-smoke-test.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}

      - name: Wait for preview worker
        run: .ci/scripts/deploy/wait-for-preview-worker.sh

      - name: Run license smoke test
        run: npx tsx .ci/scripts/test/smoke-test-preview.ts
        env:
          PREVIEW_URL: https://pr-${{ env.PR_NUMBER }}.rediacc.workers.dev
          SMOKE_TEST_TOKEN: ${{ steps.seed.outputs.SMOKE_TEST_TOKEN }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}

  # ============================================================================
  # VALIDATE INSTALL METHODS - Full pre-publish validation on all 6 platforms
  # Tests ALL methods against staging worker + R2 staging artifacts.
  # Catches broken packages/Docker/install BEFORE they reach production.
  # ============================================================================
  validate-install:
    name: Validate Install Methods
    needs: [initialize, stage-artifacts]
    if: >-
      always() &&
      needs.stage-artifacts.result == 'success'
    uses: ./.github/workflows/ct-install-methods.yml
    with:
      version: ${{ needs.initialize.outputs.next_version }}
      docker_tag: ${{ needs.initialize.outputs.channel }}
      repo_channel: ${{ needs.initialize.outputs.channel }}

  # ============================================================================
  # VALIDATE PROMOTION - Simulates edge-to-stable promotion
  # Copies PR channel repos to a temp promoted channel, sed-fixes configs,
  # then tests APT/DNF/APK/Pacman install against the promoted channel.
  # ============================================================================
  validate-promote:
    name: Validate Promotion
    needs: [initialize, stage-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      needs.stage-artifacts.result == 'success'
    env:
      CHANNEL: ${{ needs.initialize.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Simulate promotion (copy + sed-fix)
        run: .ci/scripts/deploy/simulate-promotion.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_MAX_ATTEMPTS: 10
          AWS_RETRY_MODE: adaptive
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}

      - name: Test APT install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method apt --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Test DNF install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method dnf --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Test APK install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method apk --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Test Pacman install from promoted channel
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method pacman --version ${{ needs.initialize.outputs.next_version }}
        env:
          REPO_CHANNEL: ${{ env.PROMOTED }}

      - name: Cleanup promoted channel
        if: always()
        run: |
          PROMOTED="${CHANNEL}-promoted"
          BUCKET="rediacc-releases"
          for dir in apt rpm apk archlinux; do
            aws s3 rm "s3://${BUCKET}/${dir}/${PROMOTED}/" --recursive \
              --endpoint-url "$R2_ENDPOINT" --quiet 2>/dev/null || true
          done
          echo "Cleaned up promoted channel: ${PROMOTED}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

  # ============================================================================
  # CI COMPLETE - required status check for branch protection
  # This job only succeeds if ALL CI jobs pass
  # ============================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-slim
    needs: [initialize, quality, review-gate, stripe-sandbox, build-docker, build-docker-fast, build-cli, package-tests, stage-artifacts, validate-install, validate-promote, tests, elite-run-test, ops-tests, migration-test, update-flow-test, deploy-preview, smoke-test-preview]
    timeout-minutes: 5
    if: always() && !cancelled()
    steps:
      # The tier logic now lives in .ci/scripts/ci/assert-ci-complete.sh, so the
      # repo must be on disk. Sparse: this job needs only that script + its lib.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .ci/scripts

      - name: Check all jobs passed
        run: .ci/scripts/ci/assert-ci-complete.sh
        env:
          POINTER_BUMP_ONLY: ${{ needs.initialize.outputs.pointer_bump_only }}
          RESULT_INITIALIZE: ${{ needs.initialize.result }}
          RESULT_BUILD_DOCKER: ${{ needs.build-docker.result }}
          RESULT_BUILD_DOCKER_FAST: ${{ needs.build-docker-fast.result }}
          RESULT_BUILD_CLI: ${{ needs.build-cli.result }}
          RESULT_QUALITY: ${{ needs.quality.result }}
          RESULT_REVIEW_GATE: ${{ needs.review-gate.result }}
          RESULT_STRIPE_SANDBOX: ${{ needs.stripe-sandbox.result }}
          RESULT_PACKAGE_TESTS: ${{ needs.package-tests.result }}
          RESULT_STAGE_ARTIFACTS: ${{ needs.stage-artifacts.result }}
          RESULT_VALIDATE_INSTALL: ${{ needs.validate-install.result }}
          RESULT_VALIDATE_PROMOTE: ${{ needs.validate-promote.result }}
          RESULT_TESTS: ${{ needs.tests.result }}
          RESULT_ELITE_RUN_TEST: ${{ needs.elite-run-test.result }}
          RESULT_OPS_TESTS: ${{ needs.ops-tests.result }}
          RESULT_MIGRATION_TEST: ${{ needs.migration-test.result }}
          RESULT_UPDATE_FLOW_TEST: ${{ needs.update-flow-test.result }}
          RESULT_DEPLOY_PREVIEW: ${{ needs.deploy-preview.result }}
          RESULT_SMOKE_TEST_PREVIEW: ${{ needs.smoke-test-preview.result }}
  # ============================================================================
  # FINALIZE RELEASE SENTINEL
  # Atomic commit point of the release pipeline. Writes `.released` sentinels
  # to cli/v${V}/ on R2 — only after every CI gate upstream
  # has passed. The sentinel seals the version: from here on, write_once_guard
  # refuses to overwrite, and the drift gate requires a matching git tag.
  #
  # See .ci/scripts/lib/release-state-validator.sh for the invariant and
  # .ci/scripts/deploy/write-release-sentinel.sh for the writer.
  #
  # always() prefix is load-bearing (same reason as housekeeping): ci-complete
  # transitively needs deploy-preview / smoke-test-preview which are
  # pull_request-only and skip on push-to-main.
  # ============================================================================
  finalize-release-sentinel:
    name: Finalize Release Sentinel
    runs-on: ubuntu-slim
    needs: [initialize, ci-complete]
    permissions:
      contents: read
      actions: write   # for dispatching cd-v2.yml after sentinel write
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci-complete.result == 'success' &&
      needs.initialize.result == 'success' &&
      (needs.initialize.outputs.channel == 'edge' || needs.initialize.outputs.channel == 'stable')
    timeout-minutes: 5
    concurrency:
      group: finalize-release-v${{ needs.initialize.outputs.next_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
      - name: Install jq
        run: command -v jq >/dev/null || sudo apt-get install -y -qq jq
      - name: Write release sentinels
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          .ci/scripts/deploy/write-release-sentinel.sh \
            --version "${{ needs.initialize.outputs.next_version }}" \
            --channel "${{ needs.initialize.outputs.channel }}" \
            --commit-sha "${{ github.sha }}"
      # Sentinel is sealed at this point. Dispatch cd-v2 immediately so a
      # later cancellation of THIS run (e.g. auto-cancel-on-push during
      # housekeeping) cannot strand a sealed version without a tag. cd-v2
      # runs as its own workflow_dispatch run with an independent lifecycle.
      - name: Dispatch cd-v2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cd-v2.yml \
            --ref main \
            -f release_mode=patch \
            -f ci_run_id=${{ github.run_id }}

  # (Removed: assert-finalize-sentinel-ran was a single-purpose sentinel
  # job whose only step asserted that finalize-release-sentinel did not
  # silently skip on a release-channel push to main. The same check now
  # lives in the consolidated `pipeline-sentinel` job below, alongside the
  # equivalent housekeeping check. See commit history for the original
  # rationale; merging two single-step jobs into one removes two ceremonial
  # entries from the post-CI DAG without changing the assertion property.)

  # ============================================================================
  # PIPELINE SENTINEL
  # Asserts the critical post-CI job (finalize-release-sentinel) actually ran
  # and didn't silently skip via GHA's transitive-skip propagation when a
  # pull_request-only dep is `skipped` on push-to-main.
  #
  # (Housekeeping was moved out of the release pipeline to a nightly schedule —
  # see .github/workflows/housekeeping.yml — so version/R2 cleanup can no longer
  # race a live release. It is no longer asserted here.)
  #
  # finalize-release-sentinel has its own `if:` guards; this sentinel is the
  # belt-and-suspenders that fails loud if those guards regress. 'cancelled'
  # (watchdog force-cancel, concurrent-push supersession, manual cancel) and
  # 'failure' (the job already surfaced its own failure) pass through. Only
  # 'skipped' on a release-channel push-to-main trips this. See
  # .ci/scripts/ci/assert-job-succeeded.sh for the full state table.
  # ============================================================================
  pipeline-sentinel:
    name: Pipeline Sentinel
    runs-on: ubuntu-slim
    needs: [initialize, finalize-release-sentinel]
    timeout-minutes: 5
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
      - name: Check finalize-release-sentinel conclusion (release channels only)
        if: needs.initialize.result == 'success' && (needs.initialize.outputs.channel == 'edge' || needs.initialize.outputs.channel == 'stable')
        run: .ci/scripts/ci/assert-job-succeeded.sh finalize-release-sentinel "${{ needs.finalize-release-sentinel.result }}"
