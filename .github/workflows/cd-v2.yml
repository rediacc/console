name: Release to Edge

# Publish workflow -- dispatched from CI's finalize-release-sentinel job
# (right after the sentinel is sealed), or manually. Creates the version git
# tag, promotes Docker images, deploys edge, validates the live install, then
# tags submodules and publishes Homebrew + the GitHub Release.
#
# We dispatch from finalize (rather than firing on workflow_run) so a CI
# run that gets force-cancelled mid-housekeeping after the sentinel was
# already written cannot strand a sealed version without a tag. The
# sentinel write IS the atomic commit point; this workflow only runs once
# the sentinel is committed, and its FIRST write is the matching git tag
# (init's "Create version tag"), before any job that can fail or skip.
# ci_workflow_invariants.py refuses a graph that puts the tag behind one.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to publish from (leave empty to auto-derive the latest green Console CI on main)'
        required: false
        type: string
      release_mode:
        description: 'Release mode'
        required: true
        type: choice
        options:
          - retry
          - patch
        default: retry
      publish_stable:
        description: 'Also publish to stable channel (hotfix deployment)'
        type: boolean
        default: false
      deploy_workers_only:
        description: 'Deploy Workers only (skip version bump, CLI, Docker, GitHub Release)'
        type: boolean
        default: false
      allow_stale_ci_run_id:
        description: 'Bypass the "ci_run_id must be the latest green CI on main" check. Use only for cherry-picking a specific prior CI run.'
        type: boolean
        default: false

# Release publishing, Docker and Cloudflare Pages scopes are declared per job
# below, not here: no job holds contents: write (every git push and the
# GitHub Release ride the cd-preset App token), and only publish needs
# packages: write.
# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
permissions: {}

# Queue new releases instead of cancelling in-progress ones
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # INITIALIZE
  # Resolve CI run context, recalculate version, guard against duplicate publish
  # ============================================================================
  init:
    name: Initialize
    runs-on: ubuntu-latest
    # Bounds the artifact download in assert_artifact_version (DOWNLOAD_TIMEOUT_S=300) with headroom; check:ci-inner-timeout-reachable requires a ceiling above every step timer.
    timeout-minutes: 30
    # actions: read is for resolve-ci-run.sh, which reads
    # repos/*/actions/runs with github.token. Everything else in this job
    # (check-existing-release, assert-artifact-version, the submodule fetch
    # and the version tag push) runs on the cd-preset App token, so no write
    # scope is needed on github.token here.
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      ci_sha: ${{ steps.resolve.outputs.ci_sha }}
      next_version: ${{ steps.version.outputs.next_version || steps.init.outputs.next_version }}
      bump_type: ${{ steps.version.outputs.bump_type || steps.init.outputs.bump_type }}
      channel: ${{ steps.channel.outputs.channel }}
      retry_mode: ${{ steps.skip-check.outputs.retry_mode }}
      workers_only: ${{ steps.skip-check.outputs.workers_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID
            GIT_BOT_NAME > BWS_GIT_BOT_NAME
            GIT_BOT_EMAIL > BWS_GIT_BOT_EMAIL
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account,homebrew-tap,elite

      # Re-checkout with submodules using app token (needed for submodule
      # branch check, and the credential the version tag push rides)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for merge-base --is-ancestor in submodule divergence check
          filter: blob:none   # commit topology only; this step never opens a historical file
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install the pinned aws CLI
        uses: ./.github/actions/setup-aws

      # Auto-derives from the latest green Console CI PUSH run on main that staged artifacts (a no-op duplicate or a nightly stages nothing) when ci_run_id is
      # empty; otherwise validates the supplied run. See the script header for
      # why "is this the latest green run" is deliberately NOT one of the checks.
      - name: Resolve CI run context
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
          ALLOW_STALE: ${{ inputs.allow_stale_ci_run_id }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.resolve_ci_run

      - name: Stale ref check (workers-only)
        if: inputs.deploy_workers_only == true
        run: |
          CI_SHA="${{ steps.resolve.outputs.ci_sha }}"
          BEHIND=$(git rev-list --count "${CI_SHA}..HEAD" 2>/dev/null || echo "unknown")
          if [[ "$BEHIND" != "unknown" ]] && [[ "$BEHIND" -gt 10 ]]; then
            echo "::warning::CI ref is ${BEHIND} commits behind HEAD. Verify you are deploying the intended code."
          fi
          echo "::notice::Workers-only deploy from SHA: ${CI_SHA} (${BEHIND} commits behind HEAD)"

      # release_mode=patch (default for finalize-dispatched runs and manual
      # bumps) recomputes next_version from PR labels + git tags. release_mode=retry
      # re-deploys the latest tag without bumping. Workers-only is the emergency
      # path that skips version bump and publish entirely.
      - name: Decide release mode
        id: skip-check
        env:
          DEPLOY_WORKERS_ONLY: ${{ inputs.deploy_workers_only }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.decide_release_mode

      # Retry/workers-only mode: use current version from latest tag without bumping
      - name: Resolve version (retry/workers-only mode)
        if: steps.skip-check.outputs.retry_mode == 'true' || steps.skip-check.outputs.workers_only == 'true'
        id: version
        run: |
          VERSION=$(PYTHONPATH=.ci python3 -m rediacc_ci.version.resolve_version --current)
          echo "next_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=none" >> "$GITHUB_OUTPUT"
          echo "::notice::Using existing version $VERSION (from latest tag)"

      # Normal mode: recalculate version from git state
      - name: Initialize CI
        if: >-
          steps.skip-check.outputs.retry_mode != 'true' &&
          steps.skip-check.outputs.workers_only != 'true'
        id: init
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.ci.initialize --output "$GITHUB_OUTPUT"

      - name: Generate channel
        id: channel
        run: |
          echo "channel=edge" >> "$GITHUB_OUTPUT"

      # Version guard: fail early if this version was already published (skip in retry/workers-only mode)
      - name: Check for existing release
        if: >-
          steps.skip-check.outputs.retry_mode != 'true' &&
          steps.skip-check.outputs.workers_only != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.init.outputs.next_version }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.check_existing_release

      # Artifact-version assertion: catch the stale-ci_run_id foot-gun.
      # If someone dispatches with a ci_run_id whose artifacts were built
      # against a previous tag, our computed next_version (from current
      # latest tag + bump) would NOT match the version baked into the
      # artifacts. CD would then happily retag the OLD bytes with the NEW
      # version label, and only Docker's runtime --version check would
      # surface the mismatch hours later. This step fails loud + fast in
      # the init job, before any registry mutation happens.
      #
      # RETRY MODE RUNS THIS TOO, and the comment that used to excuse it away
      # was wrong. It claimed "retry uses the latest tag's version, which the
      # artifacts already match by definition". They do not match by
      # definition: retry takes its VERSION from resolve_version --current
      # (the "Resolve version (retry/workers-only mode)" step above) but takes
      # its ARTIFACTS from resolve-ci-run.sh, which with no ci_run_id supplied
      # picks the LATEST GREEN CI RUN ON MAIN -- not the run that cut the
      # current tag. A retry dispatched after any newer CI went green therefore
      # republishes those newer artifacts under the older tag, which is exactly
      # the mismatch this assertion exists to catch, with the assertion off.
      #
      # Still skipped for workers-only: it doesn't promote artifacts at all.
      - name: Assert artifact version matches promotion target
        # workers_only is what actually skips this. A `skip_release` clause
        # used to sit here too, and `decide-release-mode.sh` wrote that output
        # `false` on ALL THREE of its paths -- so every one of its ~9 guards was
        # permanently true, and the comment further down credited it with a skip
        # that workers_only was doing. A condition that cannot be false is not a
        # guard, it is a claim, and this one was already misleading a reader.
        if: steps.skip-check.outputs.workers_only != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Same precedence as the job's next_version output: the retry/
          # workers-only step wins when it ran, otherwise rediacc_ci.ci.initialize's.
          VERSION: ${{ steps.version.outputs.next_version || steps.init.outputs.next_version }}
          CI_RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.assert_artifact_version

      # THE TAG AND THE SENTINEL ARE ONE UNIT. ci.yml's finalize-release-sentinel
      # sealed cli/v<V>/.released before dispatching this run, and Check
      # Release State requires a v<V> tag for every sentinel. So the tag is
      # this workflow's FIRST write, in the job that decides the version and
      # behind nothing but the two read-only guards above. It used to live in
      # tag-and-release, behind publish, both edge deploys, the smoke test and
      # post-publish install validation: CD run 37749637824 (v2.2.0) went red
      # on a Rocky 9 DNF stall in that validation, the tag job was skipped,
      # and the sealed sentinel was left with no tag, which reddened main.
      #
      # The tag points at the CI commit whose artifacts this run promotes,
      # which is also the commit the sentinel records (--commit-sha
      # github.sha in finalize), not at whatever main was at dispatch.
      #
      # IDEMPOTENT, AND RETRY RUNS IT. retry_mode takes its version from the
      # latest tag, so on a retry the tag exists and this step only proves it
      # (via ls-remote, never a local guess) and moves on. A patch run reaching
      # an existing tag at another commit is refused: check-existing-release
      # already said it was absent, so something moved. An ls-remote that
      # fails (rc other than 0 or 2) is UNKNOWN, and unknown is refused.
      - name: Create version tag
        if: steps.skip-check.outputs.workers_only != 'true'
        env:
          VERSION: ${{ steps.version.outputs.next_version || steps.init.outputs.next_version }}
          CI_SHA: ${{ steps.resolve.outputs.ci_sha }}
          RETRY_MODE: ${{ steps.skip-check.outputs.retry_mode }}
          GIT_BOT_NAME: ${{ env.BWS_GIT_BOT_NAME }}
          GIT_BOT_EMAIL: ${{ env.BWS_GIT_BOT_EMAIL }}
        run: |
          rc=0; REFS=$(git ls-remote --exit-code origin "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}") || rc=$?
          if [[ "$rc" == 0 ]]; then AT=$(tail -n1 <<<"$REFS" | cut -f1); [[ "$AT" == "$CI_SHA" || "$RETRY_MODE" == true ]] || { echo "::error::Tag v${VERSION} already exists at ${AT}, not at CI commit ${CI_SHA}. Refusing to release one version from two commits."; exit 1; }; echo "::notice::Tag v${VERSION} already exists at ${AT} (retry_mode=${RETRY_MODE}); nothing to create."; exit 0; fi
          [[ "$rc" == 2 ]] || { echo "::error::git ls-remote origin failed (rc=${rc}), so whether v${VERSION} exists is UNKNOWN. Refusing to guess; re-dispatch once GitHub answers."; exit 1; }
          [[ "$RETRY_MODE" != true ]] || { echo "::error::Retry of v${VERSION}, but origin has no such tag. Retry derives its version from tags; re-dispatch with release_mode=patch."; exit 1; }
          git -c user.name="$GIT_BOT_NAME" -c user.email="$GIT_BOT_EMAIL" tag -a "v${VERSION}" -m "v${VERSION}" "$CI_SHA"
          git push origin "v${VERSION}"
          echo "::notice::Created tag v${VERSION} at ${CI_SHA}"

      # PLAN-cd-errors-in-ci W4: the release state is judged before anything
      # is published. rediacc_ci.release.cd_preflight is read-only and runs (a)
      # the bijection excluding v<V>, (c) the floor and channel pointers and (d)
      # v<V> is sealed and its tag sits at the CI commit. It sits AFTER `Create
      # version tag` on purpose: v<V> is sealed by ci.yml and untagged until
      # that step, so a preflight before it judged a state CD itself was about
      # to fix and would red every release. An UNCHECKED read is red too.
      # retry_mode passes no --release-sha: the tag step above already accepts
      # a retry's existing tag wherever it points.
      # ci_workflow_invariants pins this step behind the tag step.
      - name: CD preflight
        if: steps.skip-check.outputs.workers_only != 'true'
        env:
          VERSION: ${{ steps.version.outputs.next_version || steps.init.outputs.next_version }}
          CI_SHA: ${{ steps.skip-check.outputs.retry_mode != 'true' && steps.resolve.outputs.ci_sha || '' }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.release.cd_preflight
          --phase cd --release-version "$VERSION" --release-sha "$CI_SHA"
          --checks a,c,d

  # ============================================================================
  # PUBLISH
  # Actually publish to GitHub Release, Docker, Pages
  # Downloads artifacts cross-workflow from the CI run using --run-id
  # ============================================================================
  publish:
    name: Tag & Release
    runs-on: ubuntu-latest
    # packages: write because retag_image.py does `buildx imagetools create`,
    # which PUSHES to ghcr. actions: read for the cross-run
    # download-artifact (run-id + github-token). attestations: read for
    # `gh attestation verify`, which only READS the attestation - the signing
    # and storing happens in cd-stage.yml, not here.
    # The environment: edge deployment record is created by the runner, not the
    # token, so deployments: write is not needed.
    permissions:
      contents: read
      packages: write
      actions: read
      attestations: read
    needs: [init]
    if: >-
      success()
    environment:
      name: edge
      url: https://edge.rediacc.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.init.outputs.workers_only != 'true'

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            STRIPE_SECRET_KEY > BWS_STRIPE_SECRET_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            GITHUB_APP_ID > BWS_APP_ID
            CLOUDFLARE_ZONE_ID > BWS_CLOUDFLARE_ZONE_ID
      - uses: ./.github/actions/app-token
        if: needs.init.outputs.workers_only != 'true'
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account,homebrew-tap,elite

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.init.outputs.workers_only != 'true'
        with:
          fetch-depth: 0
          filter: blob:none   # see the divergence-check checkout above
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Install the pinned aws CLI
        if: needs.init.outputs.workers_only != 'true'
        uses: ./.github/actions/setup-aws

      - uses: ./.github/actions/setup-node-npm
        if: needs.init.outputs.workers_only != 'true'

      # -----------------------------------------------------------------------
      # Step 1: Promote Docker images (channel -> version + latest)
      # -----------------------------------------------------------------------
      - name: Login to GHCR
        if: needs.init.outputs.workers_only != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load well-known
        run: grep '^WK_' .ci/config/well-known.env >> "$GITHUB_ENV"

      - name: Promote Docker images
        if: needs.init.outputs.workers_only != 'true'
        run: |
          CHANNEL="${{ needs.init.outputs.channel }}"
          VERSION="${{ needs.init.outputs.next_version }}"

          .ci/scripts/docker/retag_image.py --image renet --from "$CHANNEL" --to "$VERSION" --push-latest --skip-if-exists
          .ci/scripts/docker/retag_image.py --image rdc --from "$CHANNEL" --to "$VERSION" --push-latest --skip-if-exists
          # On-prem server image lives at ghcr.io/rediacc/server (outside elite/),
          # so PUBLISH_DOCKER_REGISTRY can't reach it. cd-stage stages :CHANNEL.
          .ci/scripts/docker/retag_image.py --image-path ${{ env.WK_IMAGE_REGISTRY }}/server --from "$CHANNEL" --to "$VERSION" --push-latest --skip-if-exists

      # -----------------------------------------------------------------------
      # Step 1b: Install dependencies and build shared packages
      # (account code is embedded in the www worker via direct import)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        if: needs.init.outputs.workers_only != 'true'
        run: npm ci && npm run install:natives

      - name: Build shared packages
        if: needs.init.outputs.workers_only != 'true'
        run: npm run build:packages

      - name: Install account dependencies
        if: needs.init.outputs.workers_only != 'true'
        run: npm install
        working-directory: private/account

      # Stripe sync is skipped in workers-only mode. Stripe product changes require a full release.
      - name: Sync Stripe products/prices
        if: needs.init.outputs.workers_only != 'true' && needs.init.outputs.retry_mode != 'true'
        run: npx tsx scripts/stripe-sync.ts
        working-directory: private/account
        env:
          STRIPE_SECRET_KEY: ${{ env.BWS_STRIPE_SECRET_KEY }}

      - name: Verify Stripe webhook endpoints (per-region)
        if: needs.init.outputs.workers_only != 'true' && needs.init.outputs.retry_mode != 'true'
        run: |
          jq -r '.regions[] | .domain' regions.json | while read -r domain; do
            echo "Verifying webhook for ${domain}..."
            npx tsx private/account/scripts/verify-webhook.ts --expected-url "https://${domain}/account/api/v1/webhooks/stripe"
          done
        env:
          STRIPE_SECRET_KEY: ${{ env.BWS_STRIPE_SECRET_KEY }}


      # -----------------------------------------------------------------------
      # Step 2: Bump version & commit (includes all submodules)
      # -----------------------------------------------------------------------
      - name: Download release artifacts
        if: needs.init.outputs.workers_only != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts-${{ needs.init.outputs.ci_sha }}
          path: dist/
          run-id: ${{ needs.init.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify release artifact attestation
        if: needs.init.outputs.workers_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.verify_artifact_attestation

      # The version tag is created in init (see "Create version tag"): the
      # sentinel is already sealed, so the tag must not wait on anything that
      # can fail. Submodule tags, the Homebrew formula and the GitHub Release
      # wait in `tag-and-release` below, behind the edge deploys, the smoke
      # test and post-publish install validation.

      # Package repos + R2 edge upload already handled by CI (cd-stage.yml).
      # CI builds self-contained repos and uploads to {format}/edge/ on push-to-main.
      # No rebuild or re-upload needed here -- one code path, tested in PR CI.

      # Pages + E2E videos are handled by cd-deploy-worker.yml (builds from source,
      # injects videos during deploy). No staging-pages download needed here.

      # -----------------------------------------------------------------------
      # Hotfix: also promote to stable channel (skips 7-day soak)
      # -----------------------------------------------------------------------
      - name: Promote R2 artifacts to stable (hotfix)
        if: needs.init.outputs.workers_only != 'true' && inputs.publish_stable == true
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ env.BWS_CLOUDFLARE_ZONE_ID }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.promote_r2_to_stable_hotfix

      - name: Promote Docker to stable (hotfix)
        if: needs.init.outputs.workers_only != 'true' && inputs.publish_stable == true
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.promote_docker_to_stable_hotfix

      # -----------------------------------------------------------------------
      # Step 5: Cleanup channel Docker tags
      # -----------------------------------------------------------------------
      - name: Cleanup channel Docker tags
        if: needs.init.outputs.workers_only != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.cleanup_channel_docker_tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANNEL: ${{ needs.init.outputs.channel }}

      # Stable promotion (CLI, repos, Docker :stable) is handled by
      # promote-stable.yml after 7-day soak. CD only publishes to edge.

      # -----------------------------------------------------------------------
      # Final summary
      # -----------------------------------------------------------------------
      - name: Deployment summary
        if: needs.init.outputs.workers_only != 'true'
        env:
          VERSION: ${{ needs.init.outputs.next_version }}
          CI_RUN_ID: ${{ needs.init.outputs.ci_run_id }}
          CI_SHA: ${{ needs.init.outputs.ci_sha }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.deployment_summary

  # Install validation moved to CI (pre-publish). CI validates on all 6 platforms
  # BEFORE publish, so broken artifacts never reach the edge or stable channel.

  # ============================================================================
  # DEPLOY EDGE - Marketing + per-region account workers
  # ============================================================================
  deploy-marketing-edge:
    name: Deploy edge Marketing
    # The callee needs only checkout. Without this block it inherited this
    # workflow contents:write + packages:write + actions:write + attestations:write,
    # which no step in the called workflow uses.
    permissions:
      contents: read
    needs: [init, publish]
    # Cannot use bare success() here: in workers_only mode `publish` is
    # correctly skipped (its own `if:` gates on workers_only), and bare
    # success() treats a skipped need as a failure -> this job silently
    # skips too, defeating workers_only's whole purpose. Use explicit
    # per-job result checks. See the deploy-marketing-stable pattern in
    # commit c608e29a8 for the established shape.
    if: >-
      always() &&
      needs.init.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    uses: ./.github/workflows/cd-deploy-worker.yml
    with:
      target: edge
      ref: ${{ needs.init.outputs.ci_sha }}
      version: ${{ needs.init.outputs.next_version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  deploy-account-edge:
    name: Deploy edge Account (all regions)
    # The callee needs only checkout. Without this block it inherited this
    # workflow contents:write + packages:write + actions:write + attestations:write,
    # which no step in the called workflow uses.
    permissions:
      contents: read
    needs: [init, publish]
    # See deploy-marketing-edge above for why we don't use bare success().
    if: >-
      always() &&
      needs.init.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    uses: ./.github/workflows/cd-deploy-account.yml
    with:
      target: edge
      ref: ${{ needs.init.outputs.ci_sha }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  # ============================================================================
  # DEPLOY STABLE (hotfix only) - Marketing + per-region account workers
  # ============================================================================
  deploy-marketing-stable:
    name: Deploy stable Marketing (hotfix)
    # The callee needs only checkout. Without this block it inherited this
    # workflow contents:write + packages:write + actions:write + attestations:write,
    # which no step in the called workflow uses.
    permissions:
      contents: read
    needs: [init, publish, smoke-test, tag-and-release]
    # tag-and-release is correctly skipped in workers-only mode (no version
    # is cut), so we cannot use bare success() here -- a skipped need makes
    # success() false, which silently skips the stable deploy. Allow
    # tag-and-release to be either success or skipped; gate the rest
    # explicitly so a real upstream failure still blocks the deploy.
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      (needs.tag-and-release.result == 'success' || needs.tag-and-release.result == 'skipped') &&
      inputs.publish_stable == true
    uses: ./.github/workflows/cd-deploy-worker.yml
    with:
      target: stable
      ref: ${{ needs.init.outputs.workers_only == 'true' && needs.init.outputs.ci_sha || format('v{0}', needs.init.outputs.next_version) }}
      version: ${{ needs.init.outputs.next_version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  deploy-account-stable:
    name: Deploy stable Account (hotfix, all regions)
    # The callee needs only checkout. Without this block it inherited this
    # workflow contents:write + packages:write + actions:write + attestations:write,
    # which no step in the called workflow uses.
    permissions:
      contents: read
    needs: [init, publish, smoke-test, tag-and-release]
    # See deploy-marketing-stable above for why we don't use bare success().
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      (needs.tag-and-release.result == 'success' || needs.tag-and-release.result == 'skipped') &&
      inputs.publish_stable == true
    uses: ./.github/workflows/cd-deploy-account.yml
    with:
      target: stable
      ref: ${{ needs.init.outputs.workers_only == 'true' && needs.init.outputs.ci_sha || format('v{0}', needs.init.outputs.next_version) }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  # ============================================================================
  # POST-PUBLISH SMOKE TEST - Verify endpoints respond after deployment
  # ============================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-slim
    # Checkout, then HTTP probes against the deployed endpoints. No GitHub API.
    permissions:
      contents: read
    needs: [init, publish, deploy-marketing-edge, deploy-account-edge]
    # See deploy-marketing-edge above for why we don't use bare success().
    # smoke-test must still run when publish is skipped (workers_only),
    # because the workers themselves were redeployed and need verifying.
    timeout-minutes: 10
    if: >-
      always() &&
      needs.init.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.deploy-marketing-edge.result == 'success' &&
      needs.deploy-account-edge.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .ci/scripts is needed too: the smoke test itself now lives there.
          # .ci/rediacc_ci, because the step(s) below run `python3 -m rediacc_ci.*` and a cone that stops at .ci/scripts does not put that package on disk at all: the job dies with ModuleNotFoundError before judging anything, and a crash is not a verdict. Added 2026-09-21, sweeping the class the ci-complete cone was found in.
          sparse-checkout: |
            regions.json
            .ci/scripts
            .ci/rediacc_ci
            .ci/config/well-known.env
          sparse-checkout-cone-mode: false

      - name: Verify edge endpoints
        env:
          VERSION: ${{ needs.init.outputs.next_version }}
          WORKERS_ONLY: ${{ needs.init.outputs.workers_only }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.verify_edge_endpoints

  # ============================================================================
  # POST-PUBLISH INSTALL VALIDATION - Reuses ct-install-methods.yml against
  # the live channel. Symmetric with ci.yml's pre-publish validate-install
  # (same workflow, same script). Catches state corruption between staging
  # validation and live R2 (CDN purge bugs, R2 outage, accidental scrubs).
  # The `quick` install method runs `install.sh | bash` end-to-end inside
  # Ubuntu/Debian containers; it would have failed loud if v1.1.4's
  # versioned R2 path was empty.
  # ============================================================================
  validate-install-published:
    name: Validate Install (post-publish)
    # Matches what ct-install-methods.yml declares: checkout plus a ghcr PULL.
    permissions:
      contents: read
      packages: read
    needs: [init, publish, deploy-marketing-edge, deploy-account-edge, smoke-test]
    # See deploy-marketing-edge above for why we don't use bare success().
    # Workers-only already excluded by the workers_only check; we
    # still need explicit per-job result checks for the other needs.
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.deploy-marketing-edge.result == 'success' &&
      needs.deploy-account-edge.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.init.outputs.workers_only != 'true'
    uses: ./.github/workflows/ct-install-methods.yml
    with:
      version: ${{ needs.init.outputs.next_version }}
      repo_channel: ${{ needs.init.outputs.channel }}

  # ============================================================================
  # TAG & GITHUB RELEASE - Runs AFTER edge deploys + smoke-test + post-publish
  # install validation succeed. Tags submodules, updates the Homebrew formula,
  # advances the contract floor and publishes the GitHub Release. The VERSION
  # git tag is NOT created here any more: init creates it, because the R2
  # sentinel is already sealed and a sentinel without a tag is the bijection
  # break Check Release State reddens main on. What waits for validation is
  # what users install from (Homebrew) or read as "released" (the Release).
  #
  # RETRY RUNS THIS JOB TOO, so a release whose validation went red after the
  # tag can be completed by a release_mode=retry dispatch. The first step asks
  # whether the GitHub Release exists; on a retry where it does, every later
  # step is skipped (nothing owed, and tag_submodules would refuse a submodule
  # that moved since). On a patch run everything is owed by definition:
  # check-existing-release proved the Release absent in init.
  # ============================================================================
  tag-and-release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    # NO `contents: write`, and that is the point. Every write in this job now
    # rides the cd-preset App token: the submodule tags, the
    # homebrew-tap bump and the contract floor push go through the global
    # insteadOf credential, and "Create GitHub Release" is now explicitly on
    # `steps.app-token.outputs.token` too.
    #
    # It used to be the ONE step left on github.token, and it runs LAST, after
    # the tag push. So the job held two credentials to do one job and the
    # fragile half went last: lose contents:write and the tag lands while the
    # Release does not. That is not hypothetical, it is the half-completed
    # release this repo saw twice, on v1.3.11 and v1.3.8, recorded in
    # .github/actions/app-token/action.yml.
    #
    # One credential for the whole job means the failure mode is now all-or-
    # nothing rather than partial, which is the property that matters for a
    # release: a run that cannot authenticate produces no tag AND no Release,
    # and promote-stable's assert-edge-tag-exists.sh then refuses to promote.
    #
    # actions: read is for the cross-run download-artifact.
    permissions:
      contents: read
      actions: read
    needs: [init, publish, deploy-marketing-edge, deploy-account-edge, smoke-test, validate-install-published]
    # retry_mode is NOT excluded here any more; see the job header and the
    # "Decide what this run still owes" step. workers_only cuts no version.
    if: >-
      success() &&
      needs.init.outputs.workers_only != 'true'
    steps:
      # Checked out first, unconditionally: the decision below reads GitHub through
      # rediacc_ci.core.gh_retry, so one 5xx on `gh release view` retries instead of
      # failing the retry run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Patch run: everything is owed. Retry run: owed only when the GitHub
      # Release for this version is missing (a run whose validation went red
      # after init tagged it). A `gh release view` that fails for any reason
      # other than "release not found" is UNKNOWN and refused, never read as
      # "missing" or as "present".
      - name: Decide what this run still owes
        id: owed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.init.outputs.next_version }}
          RETRY_MODE: ${{ needs.init.outputs.retry_mode }}
        run: |
          if [[ "$RETRY_MODE" != true ]]; then echo "owed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          rc=0; ERR=$(PYTHONPATH=.ci python3 -m rediacc_ci.core.gh_retry "release lookup" -- release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null) || rc=$?
          if [[ "$rc" == 0 ]]; then echo "::notice::Retry of v${VERSION}: its GitHub Release exists, nothing owed."; echo "owed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          grep -qi 'release not found' <<<"$ERR" || { echo "::error::Could not tell whether Release v${VERSION} exists (rc=${rc}): ${ERR}"; exit 1; }
          echo "::notice::Retry of v${VERSION}: no GitHub Release yet; completing submodule tags, Homebrew, the floor and the Release."; echo "owed=true" >> "$GITHUB_OUTPUT"

      - name: Fetch secrets from Bitwarden
        if: steps.owed.outputs.owed == 'true'
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            GITHUB_APP_ID > BWS_APP_ID
            GIT_BOT_NAME > BWS_GIT_BOT_NAME
            GIT_BOT_EMAIL > BWS_GIT_BOT_EMAIL
      - uses: ./.github/actions/app-token
        if: steps.owed.outputs.owed == 'true'
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account,homebrew-tap,elite

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.owed.outputs.owed == 'true'
        with:
          fetch-depth: 0
          filter: blob:none   # see the divergence-check checkout above
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install the pinned aws CLI
        if: steps.owed.outputs.owed == 'true'
        uses: ./.github/actions/setup-aws

      - name: Download release artifacts
        if: steps.owed.outputs.owed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts-${{ needs.init.outputs.ci_sha }}
          path: dist/
          run-id: ${{ needs.init.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      # The version tag itself is created by init's "Create version tag".
      - name: Tag submodules
        if: steps.owed.outputs.owed == 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.tag_submodules
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.init.outputs.next_version }}

      - name: Update Homebrew formula
        if: steps.owed.outputs.owed == 'true'
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.release.update_homebrew_tap \
            --version ${{ needs.init.outputs.next_version }} \
            --local-checksums dist/cli \
            --push
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          GIT_BOT_NAME: ${{ env.BWS_GIT_BOT_NAME }}
          GIT_BOT_EMAIL: ${{ env.BWS_GIT_BOT_EMAIL }}

      # Auto-advance the release-contract-floor ratchet to track the oldest
      # cli sentinel currently on R2. The bijection check uses this as a
      # high-water mark so an accidental scrub of every cli sentinel can't
      # silently turn the gate into a no-op. The ratchet is monotonic: it
      # only writes if the observed oldest is strictly greater than the
      # value already in the file. Idempotent on retry/no-op runs.
      - name: Advance release-contract-floor ratchet
        if: steps.owed.outputs.owed == 'true'
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          GIT_BOT_NAME: ${{ env.BWS_GIT_BOT_NAME }}
          GIT_BOT_EMAIL: ${{ env.BWS_GIT_BOT_EMAIL }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.advance_contract_floor

      - name: Create GitHub Release
        if: steps.owed.outputs.owed == 'true'
        env:
          # The App token, not github.token. See this job's `permissions:` block:
          # every other write here already uses it, and this step running last on
          # a different credential is what made a lost scope produce a tag with no
          # Release rather than a clean failure.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.init.outputs.next_version }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.release.create_github_release

  # No cleanup-on-failure job. Failure model:
  #   - R2 sentinel is the atomic commit point, written by ci.yml's
  #     finalize-release-sentinel BEFORE this workflow runs. The git tag is
  #     its twin and is created FIRST here, in init, so the pair cannot be
  #     split by anything downstream (a red deploy, smoke test or install
  #     validation). ci_workflow_invariants.py refuses a job graph that puts
  #     the tag behind any job other than init, or skips it on retry_mode.
  #   - What remains possible: init itself failing before its tag step
  #     (resolve, check-existing-release, assert-artifact-version), or the
  #     dispatch never arriving. The sentinel then has no tag; Check Release
  #     State names it, and the repair is a release_mode=patch re-dispatch
  #     (retry derives its version FROM tags, so it cannot see the version).
  #   - validate-install-published still gates tag-and-release, so a broken
  #     release never gets submodule-tagged / homebrewed / GitHub-released.
  #     A retry dispatch completes those once the install is fixed.
  #   - Docker channel tags are mutable; the next successful publish overwrites
  #     them. Untagging on failure just trades "stale image" for "404", which
  #     is strictly worse for downstream consumers.
  #   - Housekeeping (ci.yml on every successful main push) cleans staging
  #     tags, R2 orphans, dead branches with sentinel-aware logic.
  #   - Check Release State (drift gate) catches sentinel <-> tag mismatches on
  #     the next push.
