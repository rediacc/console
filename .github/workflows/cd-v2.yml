name: Release to Edge

# Publish workflow -- dispatched from CI's finalize-release-sentinel job
# (right after the sentinel is sealed), or manually. Promotes Docker images,
# creates git tag + GitHub Release, deploys edge worker.
#
# We dispatch from finalize (rather than firing on workflow_run) so a CI
# run that gets force-cancelled mid-housekeeping after the sentinel was
# already written cannot strand a sealed version without a tag. The
# sentinel write IS the atomic commit point; this workflow only runs once
# the sentinel is committed.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI workflow run ID to publish from (leave empty to auto-derive the latest green Console CI on main)'
        required: false
        type: string
      release_mode:
        description: 'Release mode'
        required: true
        type: choice
        options:
          - retry
          - patch
        default: retry
      publish_stable:
        description: 'Also publish to stable channel (hotfix deployment)'
        type: boolean
        default: false
      deploy_workers_only:
        description: 'Deploy Workers only (skip version bump, CLI, Docker, GitHub Release)'
        type: boolean
        default: false
      allow_stale_ci_run_id:
        description: 'Bypass the "ci_run_id must be the latest green CI on main" check. Use only for cherry-picking a specific prior CI run.'
        type: boolean
        default: false

# Required for release publishing, Docker, and Cloudflare Pages deployment
permissions:
  actions: write
  contents: write
  packages: write       # For GHCR push
  attestations: write   # Verify artifact provenance

# Queue new releases instead of cancelling in-progress ones
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # INITIALIZE
  # Resolve CI run context, recalculate version, guard against duplicate publish
  # ============================================================================
  init:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      ci_sha: ${{ steps.resolve.outputs.ci_sha }}
      next_version: ${{ steps.version.outputs.next_version || steps.init.outputs.next_version }}
      bump_type: ${{ steps.version.outputs.bump_type || steps.init.outputs.bump_type }}
      channel: ${{ steps.channel.outputs.channel }}
      retry_mode: ${{ steps.skip-check.outputs.retry_mode }}
      workers_only: ${{ steps.skip-check.outputs.workers_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account,homebrew-tap,elite

      # Re-checkout with submodules using app token (needed for submodule branch check)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for merge-base --is-ancestor in submodule divergence check
          filter: blob:none   # commit topology only; this step never opens a historical file
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      # Auto-derives from the latest green Console CI on main when ci_run_id is
      # empty; otherwise validates the supplied run. See the script header for
      # why "is this the latest green run" is deliberately NOT one of the checks.
      - name: Resolve CI run context
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
          ALLOW_STALE: ${{ inputs.allow_stale_ci_run_id }}
        run: .ci/scripts/release/resolve-ci-run.sh

      - name: Stale ref check (workers-only)
        if: inputs.deploy_workers_only == true
        run: |
          CI_SHA="${{ steps.resolve.outputs.ci_sha }}"
          BEHIND=$(git rev-list --count "${CI_SHA}..HEAD" 2>/dev/null || echo "unknown")
          if [[ "$BEHIND" != "unknown" ]] && [[ "$BEHIND" -gt 10 ]]; then
            echo "::warning::CI ref is ${BEHIND} commits behind HEAD. Verify you are deploying the intended code."
          fi
          echo "::notice::Workers-only deploy from SHA: ${CI_SHA} (${BEHIND} commits behind HEAD)"

      # release_mode=patch (default for finalize-dispatched runs and manual
      # bumps) recomputes next_version from PR labels + git tags. release_mode=retry
      # re-deploys the latest tag without bumping. Workers-only is the emergency
      # path that skips version bump and publish entirely.
      - name: Decide release mode
        id: skip-check
        env:
          DEPLOY_WORKERS_ONLY: ${{ inputs.deploy_workers_only }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: .ci/scripts/release/decide-release-mode.sh

      # Retry/workers-only mode: use current version from latest tag without bumping
      - name: Resolve version (retry/workers-only mode)
        if: steps.skip-check.outputs.retry_mode == 'true' || steps.skip-check.outputs.workers_only == 'true'
        id: version
        run: |
          VERSION=$(.ci/scripts/version/resolve-version.sh --current)
          echo "next_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=none" >> "$GITHUB_OUTPUT"
          echo "::notice::Using existing version $VERSION (from latest tag)"

      # Normal mode: recalculate version from git state
      - name: Initialize CI
        if: >-
          steps.skip-check.outputs.retry_mode != 'true' &&
          steps.skip-check.outputs.workers_only != 'true'
        id: init
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          .ci/scripts/ci/initialize.sh --output "$GITHUB_OUTPUT"

      - name: Generate channel
        id: channel
        run: |
          echo "channel=edge" >> "$GITHUB_OUTPUT"

      # Version guard: fail early if this version was already published (skip in retry/workers-only mode)
      - name: Check for existing release
        if: >-
          steps.skip-check.outputs.retry_mode != 'true' &&
          steps.skip-check.outputs.workers_only != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.init.outputs.next_version }}
        run: .ci/scripts/release/check-existing-release.sh

      # Artifact-version assertion: catch the stale-ci_run_id foot-gun.
      # If someone dispatches with a ci_run_id whose artifacts were built
      # against a previous tag, our computed next_version (from current
      # latest tag + bump) would NOT match the version baked into the
      # artifacts. CD would then happily retag the OLD bytes with the NEW
      # version label, and only Docker's runtime --version check would
      # surface the mismatch hours later. This step fails loud + fast in
      # the init job, before any registry mutation happens.
      #
      # RETRY MODE RUNS THIS TOO, and the comment that used to excuse it away
      # was wrong. It claimed "retry uses the latest tag's version, which the
      # artifacts already match by definition". They do not match by
      # definition: retry takes its VERSION from resolve-version.sh --current
      # (the "Resolve version (retry/workers-only mode)" step above) but takes
      # its ARTIFACTS from resolve-ci-run.sh, which with no ci_run_id supplied
      # picks the LATEST GREEN CI RUN ON MAIN -- not the run that cut the
      # current tag. A retry dispatched after any newer CI went green therefore
      # republishes those newer artifacts under the older tag, which is exactly
      # the mismatch this assertion exists to catch, with the assertion off.
      #
      # Still skipped for workers-only: it doesn't promote artifacts at all.
      - name: Assert artifact version matches promotion target
        # workers_only is what actually skips this. A `skip_release` clause
        # used to sit here too, and `decide-release-mode.sh` wrote that output
        # `false` on ALL THREE of its paths -- so every one of its ~9 guards was
        # permanently true, and the comment further down credited it with a skip
        # that workers_only was doing. A condition that cannot be false is not a
        # guard, it is a claim, and this one was already misleading a reader.
        if: steps.skip-check.outputs.workers_only != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Same precedence as the job's next_version output: the retry/
          # workers-only step wins when it ran, otherwise initialize.sh's.
          VERSION: ${{ steps.version.outputs.next_version || steps.init.outputs.next_version }}
          CI_RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        run: .ci/scripts/release/assert-artifact-version.sh

  # ============================================================================
  # PUBLISH
  # Actually publish to GitHub Release, Docker, Pages
  # Downloads artifacts cross-workflow from the CI run using --run-id
  # ============================================================================
  publish:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [init]
    if: >-
      success()
    environment:
      name: edge
      url: https://edge.rediacc.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.init.outputs.workers_only != 'true'

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            STRIPE_SECRET_KEY > BWS_STRIPE_SECRET_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY STRIPE_SECRET_KEY CLOUDFLARE_API_TOKEN
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        if: needs.init.outputs.workers_only != 'true'
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account,homebrew-tap,elite

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.init.outputs.workers_only != 'true'
        with:
          fetch-depth: 0
          filter: blob:none   # see the divergence-check checkout above
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: needs.init.outputs.workers_only != 'true'
        with:
          node-version: '22'

      # -----------------------------------------------------------------------
      # Step 1: Promote Docker images (channel -> version + latest)
      # -----------------------------------------------------------------------
      - name: Login to GHCR
        if: needs.init.outputs.workers_only != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote Docker images
        if: needs.init.outputs.workers_only != 'true'
        run: |
          CHANNEL="${{ needs.init.outputs.channel }}"
          VERSION="${{ needs.init.outputs.next_version }}"

          .ci/scripts/docker/retag-image.sh --image renet --from "$CHANNEL" --to "$VERSION" --push-latest --skip-if-exists
          .ci/scripts/docker/retag-image.sh --image rdc --from "$CHANNEL" --to "$VERSION" --push-latest --skip-if-exists
          # On-prem server image lives at ghcr.io/rediacc/server (outside elite/),
          # so PUBLISH_DOCKER_REGISTRY can't reach it. cd-stage stages :CHANNEL.
          .ci/scripts/docker/retag-image.sh --image-path ghcr.io/rediacc/server --from "$CHANNEL" --to "$VERSION" --push-latest --skip-if-exists

      # -----------------------------------------------------------------------
      # Step 1b: Install dependencies and build shared packages
      # (account code is embedded in the www worker via direct import)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        if: needs.init.outputs.workers_only != 'true'
        run: npm ci && npm run install:natives

      - name: Build shared packages
        if: needs.init.outputs.workers_only != 'true'
        run: npm run build:packages

      - name: Install account dependencies
        if: needs.init.outputs.workers_only != 'true'
        run: npm install
        working-directory: private/account

      # Stripe sync is skipped in workers-only mode. Stripe product changes require a full release.
      - name: Sync Stripe products/prices
        if: needs.init.outputs.workers_only != 'true' && needs.init.outputs.retry_mode != 'true'
        run: npx tsx scripts/stripe-sync.ts
        working-directory: private/account
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}

      - name: Verify Stripe webhook endpoints (per-region)
        if: needs.init.outputs.workers_only != 'true' && needs.init.outputs.retry_mode != 'true'
        run: |
          jq -r '.regions[] | .domain' regions.json | while read -r domain; do
            echo "Verifying webhook for ${domain}..."
            npx tsx private/account/scripts/verify-webhook.ts --expected-url "https://${domain}/account/api/v1/webhooks/stripe"
          done
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}


      # -----------------------------------------------------------------------
      # Step 2: Bump version & commit (includes all submodules)
      # -----------------------------------------------------------------------
      - name: Download release artifacts
        if: needs.init.outputs.workers_only != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts-${{ needs.init.outputs.ci_sha }}
          path: dist/
          run-id: ${{ needs.init.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Verify release artifact attestation
        if: needs.init.outputs.workers_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/scripts/release/verify-artifact-attestation.sh

      # Tag creation + GitHub Release + Homebrew update moved to the
      # `tag-and-release` job below, which runs after edge deploys +
      # smoke-test succeed. Keeping them there prevents orphan tags
      # pointing at a broken release.

      # Package repos + R2 edge upload already handled by CI (cd-stage.yml).
      # CI builds self-contained repos and uploads to {format}/edge/ on push-to-main.
      # No rebuild or re-upload needed here -- one code path, tested in PR CI.

      # Pages + E2E videos are handled by cd-deploy-worker.yml (builds from source,
      # injects videos during deploy). No staging-pages download needed here.

      # -----------------------------------------------------------------------
      # Hotfix: also promote to stable channel (skips 7-day soak)
      # -----------------------------------------------------------------------
      - name: Promote R2 artifacts to stable (hotfix)
        if: needs.init.outputs.workers_only != 'true' && inputs.publish_stable == true
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: .ci/scripts/deploy/promote-r2-to-stable-hotfix.sh

      - name: Promote Docker to stable (hotfix)
        if: needs.init.outputs.workers_only != 'true' && inputs.publish_stable == true
        run: .ci/scripts/deploy/promote-docker-to-stable-hotfix.sh

      # -----------------------------------------------------------------------
      # Step 5: Cleanup channel Docker tags
      # -----------------------------------------------------------------------
      - name: Cleanup channel Docker tags
        if: needs.init.outputs.workers_only != 'true'
        run: .ci/scripts/release/cleanup-channel-docker-tags.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANNEL: ${{ needs.init.outputs.channel }}

      # Stable promotion (CLI, repos, Docker :stable) is handled by
      # promote-stable.yml after 7-day soak. CD only publishes to edge.

      # -----------------------------------------------------------------------
      # Final summary
      # -----------------------------------------------------------------------
      - name: Deployment summary
        if: needs.init.outputs.workers_only != 'true'
        env:
          VERSION: ${{ needs.init.outputs.next_version }}
          CI_RUN_ID: ${{ needs.init.outputs.ci_run_id }}
          CI_SHA: ${{ needs.init.outputs.ci_sha }}
        run: .ci/scripts/release/deployment-summary.sh

  # Install validation moved to CI (pre-publish). CI validates on all 6 platforms
  # BEFORE publish, so broken artifacts never reach the edge or stable channel.

  # ============================================================================
  # DEPLOY EDGE - Marketing + per-region account workers
  # ============================================================================
  deploy-marketing-edge:
    name: Deploy edge Marketing
    needs: [init, publish]
    # Cannot use bare success() here: in workers_only mode `publish` is
    # correctly skipped (its own `if:` gates on workers_only), and bare
    # success() treats a skipped need as a failure -> this job silently
    # skips too, defeating workers_only's whole purpose. Use explicit
    # per-job result checks. See the deploy-marketing-stable pattern in
    # commit c608e29a8 for the established shape.
    if: >-
      always() &&
      needs.init.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    uses: ./.github/workflows/cd-deploy-worker.yml
    with:
      target: edge
      ref: ${{ needs.init.outputs.ci_sha }}
      version: ${{ needs.init.outputs.next_version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
      ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
      AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  deploy-account-edge:
    name: Deploy edge Account (all regions)
    needs: [init, publish]
    # See deploy-marketing-edge above for why we don't use bare success().
    if: >-
      always() &&
      needs.init.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    uses: ./.github/workflows/cd-deploy-account.yml
    with:
      target: edge
      ref: ${{ needs.init.outputs.ci_sha }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
      ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
      STRIPE_WEBHOOK_SECRET_US: ${{ secrets.STRIPE_WEBHOOK_SECRET_US }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
      AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
      AWS_SES_ACCESS_KEY_ID_US: ${{ secrets.AWS_SES_ACCESS_KEY_ID_US }}
      AWS_SES_SECRET_ACCESS_KEY_US: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_US }}
      STRIPE_WEBHOOK_SECRET_ASIA: ${{ secrets.STRIPE_WEBHOOK_SECRET_ASIA }}
      AWS_SES_ACCESS_KEY_ID_ASIA: ${{ secrets.AWS_SES_ACCESS_KEY_ID_ASIA }}
      AWS_SES_SECRET_ACCESS_KEY_ASIA: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_ASIA }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OBS_OTLP_CREDENTIALS_EU: ${{ secrets.OTLP_CLIENT_CREDENTIALS_EU }}
      OBS_OTLP_CREDENTIALS_US: ${{ secrets.OTLP_CLIENT_CREDENTIALS_US }}
      OBS_OTLP_CREDENTIALS_ASIA: ${{ secrets.OTLP_CLIENT_CREDENTIALS_ASIA }}
      ACCOUNT_BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      ACCOUNT_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}

  # ============================================================================
  # DEPLOY STABLE (hotfix only) - Marketing + per-region account workers
  # ============================================================================
  deploy-marketing-stable:
    name: Deploy stable Marketing (hotfix)
    needs: [init, publish, smoke-test, tag-and-release]
    # tag-and-release is correctly skipped in retry/workers-only mode (the
    # tag already exists), so we cannot use bare success() here -- a skipped
    # need makes success() false, which silently skips the stable deploy.
    # Allow tag-and-release to be either success or skipped; gate the rest
    # explicitly so a real upstream failure still blocks the deploy.
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      (needs.tag-and-release.result == 'success' || needs.tag-and-release.result == 'skipped') &&
      inputs.publish_stable == true
    uses: ./.github/workflows/cd-deploy-worker.yml
    with:
      target: stable
      ref: ${{ needs.init.outputs.workers_only == 'true' && needs.init.outputs.ci_sha || format('v{0}', needs.init.outputs.next_version) }}
      version: ${{ needs.init.outputs.next_version }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
      ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
      AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

  deploy-account-stable:
    name: Deploy stable Account (hotfix, all regions)
    needs: [init, publish, smoke-test, tag-and-release]
    # See deploy-marketing-stable above for why we don't use bare success().
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      (needs.tag-and-release.result == 'success' || needs.tag-and-release.result == 'skipped') &&
      inputs.publish_stable == true
    uses: ./.github/workflows/cd-deploy-account.yml
    with:
      target: stable
      ref: ${{ needs.init.outputs.workers_only == 'true' && needs.init.outputs.ci_sha || format('v{0}', needs.init.outputs.next_version) }}
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
      ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
      ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
      ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
      ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
      ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_EU }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
      STRIPE_WEBHOOK_SECRET_US: ${{ secrets.STRIPE_WEBHOOK_SECRET_US }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
      AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
      AWS_SES_ACCESS_KEY_ID_US: ${{ secrets.AWS_SES_ACCESS_KEY_ID_US }}
      AWS_SES_SECRET_ACCESS_KEY_US: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_US }}
      STRIPE_WEBHOOK_SECRET_ASIA: ${{ secrets.STRIPE_WEBHOOK_SECRET_ASIA }}
      AWS_SES_ACCESS_KEY_ID_ASIA: ${{ secrets.AWS_SES_ACCESS_KEY_ID_ASIA }}
      AWS_SES_SECRET_ACCESS_KEY_ASIA: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_ASIA }}
      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OBS_OTLP_CREDENTIALS_EU: ${{ secrets.OTLP_CLIENT_CREDENTIALS_EU }}
      OBS_OTLP_CREDENTIALS_US: ${{ secrets.OTLP_CLIENT_CREDENTIALS_US }}
      OBS_OTLP_CREDENTIALS_ASIA: ${{ secrets.OTLP_CLIENT_CREDENTIALS_ASIA }}
      ACCOUNT_BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      ACCOUNT_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}

  # ============================================================================
  # POST-PUBLISH SMOKE TEST - Verify endpoints respond after deployment
  # ============================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-slim
    needs: [init, publish, deploy-marketing-edge, deploy-account-edge]
    # See deploy-marketing-edge above for why we don't use bare success().
    # smoke-test must still run when publish is skipped (workers_only),
    # because the workers themselves were redeployed and need verifying.
    timeout-minutes: 10
    if: >-
      always() &&
      needs.init.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.deploy-marketing-edge.result == 'success' &&
      needs.deploy-account-edge.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .ci/scripts is needed too: the smoke test itself now lives there.
          sparse-checkout: |
            regions.json
            .ci/scripts
          sparse-checkout-cone-mode: false

      - name: Verify edge endpoints
        env:
          VERSION: ${{ needs.init.outputs.next_version }}
          WORKERS_ONLY: ${{ needs.init.outputs.workers_only }}
        run: .ci/scripts/deploy/verify-edge-endpoints.sh

  # ============================================================================
  # POST-PUBLISH INSTALL VALIDATION - Reuses ct-install-methods.yml against
  # the live channel. Symmetric with ci.yml's pre-publish validate-install
  # (same workflow, same script). Catches state corruption between staging
  # validation and live R2 (CDN purge bugs, R2 outage, accidental scrubs).
  # The `quick` install method runs `install.sh | bash` end-to-end inside
  # Ubuntu/Debian containers — it would have failed loud if v1.1.4's
  # versioned R2 path was empty.
  # ============================================================================
  validate-install-published:
    name: Validate Install (post-publish)
    needs: [init, publish, deploy-marketing-edge, deploy-account-edge, smoke-test]
    # See deploy-marketing-edge above for why we don't use bare success().
    # Workers-only already excluded by the workers_only check; we
    # still need explicit per-job result checks for the other needs.
    if: >-
      always() &&
      needs.init.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.deploy-marketing-edge.result == 'success' &&
      needs.deploy-account-edge.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      needs.init.outputs.workers_only != 'true'
    uses: ./.github/workflows/ct-install-methods.yml
    with:
      version: ${{ needs.init.outputs.next_version }}
      repo_channel: ${{ needs.init.outputs.channel }}

  # ============================================================================
  # TAG & GITHUB RELEASE - Runs AFTER edge deploys + smoke-test + post-publish
  # install validation succeed. Creates the git tag, tags submodules, updates
  # Homebrew formula, publishes the GitHub Release. Ordering this last means a
  # failed deploy or broken install does not leave an orphan tag pointing at a
  # broken release.
  # ============================================================================
  tag-and-release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    needs: [init, publish, deploy-marketing-edge, deploy-account-edge, smoke-test, validate-install-published]
    if: >-
      success() &&
      needs.init.outputs.retry_mode != 'true' &&
      needs.init.outputs.workers_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account,homebrew-tap,elite

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none   # see the divergence-check checkout above
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-artifacts-${{ needs.init.outputs.ci_sha }}
          path: dist/
          run-id: ${{ needs.init.outputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Create version tag
        run: |
          VERSION="${{ needs.init.outputs.next_version }}"
          git config user.name "${{ vars.GIT_BOT_NAME }}"
          git config user.email "${{ vars.GIT_BOT_EMAIL }}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
          echo "::notice::Created tag v${VERSION}"

      - name: Tag submodules
        run: .ci/scripts/release/tag-submodules.sh
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.init.outputs.next_version }}

      - name: Update Homebrew formula
        run: |
          .ci/scripts/release/update-homebrew-tap.sh \
            --version ${{ needs.init.outputs.next_version }} \
            --local-checksums dist/cli \
            --push
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}
          GIT_BOT_NAME: ${{ vars.GIT_BOT_NAME }}
          GIT_BOT_EMAIL: ${{ vars.GIT_BOT_EMAIL }}

      # Auto-advance the release-contract-floor ratchet to track the oldest
      # cli sentinel currently on R2. The bijection check uses this as a
      # high-water mark so an accidental scrub of every cli sentinel can't
      # silently turn the gate into a no-op. The ratchet is monotonic: it
      # only writes if the observed oldest is strictly greater than the
      # value already in the file. Idempotent on retry/no-op runs.
      - name: Advance release-contract-floor ratchet
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GIT_BOT_NAME: ${{ vars.GIT_BOT_NAME }}
          GIT_BOT_EMAIL: ${{ vars.GIT_BOT_EMAIL }}
        run: .ci/scripts/release/advance-contract-floor.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.init.outputs.next_version }}
        run: .ci/scripts/release/create-github-release.sh

  # No cleanup-on-failure job. Failure model:
  #   - R2 sentinel is the atomic commit point, written by ci.yml's
  #     finalize-release-sentinel BEFORE this workflow runs. cd-v2 failures
  #     do not invalidate the seal; fix forward via retry mode.
  #   - validate-install-published gates tag-and-release, so a broken release
  #     never gets tagged / homebrewed / GitHub-released.
  #   - Docker channel tags are mutable; the next successful publish overwrites
  #     them. Untagging on failure just trades "stale image" for "404", which
  #     is strictly worse for downstream consumers.
  #   - Housekeeping (ci.yml on every successful main push) cleans staging
  #     tags, R2 orphans, dead branches with sentinel-aware logic.
  #   - Check Release State (drift gate) catches sentinel ↔ tag mismatches on
  #     the next push.
