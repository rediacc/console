# Edge D1 databases are now persistent for the beta channel.
# Daily cloning from production is disabled; use workflow_dispatch for manual runs.
name: Edge D1 Clone

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Read regions.json to build the clone matrix
  read-regions:
    name: Read regions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: regions.json
          sparse-checkout-cone-mode: false

      - id: regions
        run: |
          echo "matrix=$(jq -c '{include: [.regions[] | {source: .d1.name, target: .edgeD1.name, id}]}' regions.json)" >> "$GITHUB_OUTPUT"

  clone:
    name: Clone ${{ matrix.id }} D1
    needs: read-regions
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.read-regions.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .ci/config
            workers/account
            private/account/drizzle
            .github/actions

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: CLOUDFLARE_API_TOKEN
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then echo "shadow $n match"; else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Clone ${{ matrix.source }} to ${{ matrix.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .ci/scripts/deploy/clone-d1.sh --source ${{ matrix.source }} --target ${{ matrix.target }} --sanitize
