# Edge D1 databases are now persistent for the beta channel.
# Daily cloning from production is disabled; use workflow_dispatch for manual runs.
name: Edge D1 Clone

on:
  workflow_dispatch: {}

# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
permissions: {}

jobs:
  # Read regions.json to build the clone matrix
  read-regions:
    name: Read regions
    runs-on: ubuntu-latest
    # Sparse checkout of regions.json, then jq. No GitHub API.
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: regions.json
          sparse-checkout-cone-mode: false

      - id: regions
        run: |
          echo "matrix=$(jq -c '{include: [.regions[] | {source: .d1.name, target: .edgeD1.name, id}]}' regions.json)" >> "$GITHUB_OUTPUT"

  clone:
    name: Clone ${{ matrix.id }} D1
    # Checkout, then wrangler against Cloudflare with a Bitwarden-supplied
    # API token. No GitHub API.
    permissions:
      contents: read
    needs: read-regions
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.read-regions.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .ci/config
            workers/account
            private/account/drizzle
            .github/actions

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Clone ${{ matrix.source }} to ${{ matrix.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.clone_d1 --source ${{ matrix.source }} --target ${{ matrix.target }} --sanitize
