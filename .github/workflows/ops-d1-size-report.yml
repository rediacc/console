name: D1 Size Report

# PLAN-d1-scaling Z7. Reads every region's account D1 through the D1 query API
# (rediacc_ci.ops.d1_size_report): tables, rows, value bytes, file size and tenant
# count. Exit 3 means an alert (tenants >= 25,000 or file >= 5 GB) and fails the
# step, so an alert reds the scheduled run (wl_schedred surfaces it to a session)
# with the report in the step summary. Exit 2 (a region cannot be read) and any
# other non-zero code fail the job too. Read-only: nothing is written to
# Cloudflare.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: d1-size-report
  cancel-in-progress: false

jobs:
  report:
    name: D1 Size Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest

      - name: Fetch secrets from Bitwarden
        # LIVE: read by the report step below.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID > BWS_CLOUDFLARE_ACCOUNT_ID

      - name: Read every region's D1
        id: report
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          PYTHONPATH=.ci python3 -m rediacc_ci.ops.d1_size_report --json-out d1-size.json --md-out d1-size.md
          rc=$?
          set -e
          if [ -f d1-size.md ]; then cat d1-size.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
