name: Deploy Account Workers

# Reusable workflow for deploying per-region account Workers.
# Builds the account portal SPA once, then deploys to each region in parallel.
# Reads regions from regions.json for the deployment matrix.

on:
  workflow_call:
    inputs:
      target:
        description: 'Deploy channel: edge or stable'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (SHA, tag, or branch)'
        required: true
        type: string
      # The release whose executor artifacts (executor/v<version>/ in the releases
      # bucket) the proxy image is built from. Edge passes next_version, stable
      # the promoted version, so a stable proxy is byte-identical to the edge one
      # (agent/plans/PLAN-proxy-cd-six-targets.md, ruling "Ride promote-stable").
      version:
        description: 'Release version X.Y.Z the proxy executor image is built from'
        required: true
        type: string
      # The Console CI run whose cli-bundle-<ref> and renet-binaries-<ref>
      # artifacts the stage-executor job writes to executor/v<version>/. Edge
      # only, and only when the run cuts or retries a version: a workers-only
      # deploy passes '' and builds from the version's already-staged artifacts.
      ci_run_id:
        description: 'Console CI run id holding the CLI bundle and renet artifacts (edge only)'
        required: false
        type: string
        default: ''
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
      # These three used to be read but never declared, so every deployed account
      # Worker got OTLP_CLIENT_CREDENTIALS="" and shipped no telemetry. Declaring
      # them fixed that; fetching them from Bitwarden 2026-09-05 fixed it again,
      # because the org secret the callers passed had been deleted and the whole
      # chain was carrying "" a second time.
      # The chunk-store backup plane's key pair is no input: the job fetches its
      # own channel's pair from Bitwarden (see "Fetch the stable/edge backup key
      # pair"), and set_account_worker_secrets refuses an empty value, so a
      # missing pair is a loud deploy error, not a Worker whose backup endpoints
      # answer 503 (the shape of the OTLP bug above).
# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
# This is a reusable workflow. A callee can never exceed what the calling job
# grants, so each job's block below is also the contract its callers must meet.
permissions: {}

jobs:
  # Read regions.json to build the deployment matrix
  read-regions:
    name: Read regions
    runs-on: ubuntu-latest
    # Sparse checkout of regions.json. No GitHub API.
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: regions.json
          sparse-checkout-cone-mode: false

      - id: regions
        run: |
          # backupBucket/edgeBackupBucket/r2Jurisdiction are read by the "Set Worker
          # secrets" step below and were NEVER in this projection -- all three
          # resolved empty and set-account-worker-secrets.sh:150-156 exited 1, so
          # every account deploy hard-failed. regions.json NESTS two of them under
          # backupR2.name / edgeBackupR2.name, so this maps as well as selects.
          echo "matrix=$(jq -c '{include: [.regions[] | {id, domain, edgeDomain, secretSuffix, sesRegion, workerName, edgeWorkerName, backupBucket: .backupR2.name, edgeBackupBucket: .edgeBackupR2.name, r2Jurisdiction}]}' regions.json)" >> "$GITHUB_OUTPUT"

  # Build SPA once (shared across all regions)
  build:
    name: Build account portal
    runs-on: ubuntu-latest
    # Checkout only against GITHUB_TOKEN; the private submodules come in on the
    # cd-preset App token, and every deploy credential is Cloudflare/AWS/Stripe
    # from Bitwarden. No GitHub API write anywhere in this file.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID
            TURNSTILE_SITE_KEY > BWS_TURNSTILE_SITE_KEY

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Init account submodule
        run: git submodule update --init private/account

      - uses: ./.github/actions/setup-node-npm

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && npm run install:natives && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/account/dist/account
        working-directory: private/account/web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ env.BWS_TURNSTILE_SITE_KEY }}
          VITE_CI_MODE: 'false'

      # The account worker enforces Turnstile whenever its secret is set, so a
      # portal built without the site key renders no widget and refuses every
      # login ("Captcha verification required", production 2026-09-24).
      - name: Portal carries the Turnstile site key
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "::error::TURNSTILE_SITE_KEY resolved empty; refusing to deploy a portal nobody can log in to"; exit 1; }
          grep -rqF -- "$VITE_TURNSTILE_SITE_KEY" workers/account/dist/account/assets || { echo "::error::workers/account/dist/account does not contain the Turnstile site key"; exit 1; }
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ env.BWS_TURNSTILE_SITE_KEY }}

      - name: Install account worker dependencies
        run: npm install
        working-directory: workers/account

      - name: Upload account worker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: account-worker-${{ inputs.target }}
          path: workers/account/
          retention-days: 1

  # Write the executor artifacts of this edge version to the releases bucket
  # once (executor/v<version>/, write-once: equal bytes skip, unequal refuse), so
  # every region's proxy image, and later the stable one, is built from the same
  # bytes (Design item 8). The sources are the Console CI run's own artifacts,
  # read across runs by run id, which is why this job alone holds actions: read.
  # `ref` is the CI commit on edge, and both artifact names carry it.
  stage-executor:
    name: Stage executor artifacts v${{ inputs.version }}
    if: inputs.target == 'edge' && inputs.ci_run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest

      - name: Fetch secrets from Bitwarden
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY

      - name: Install the pinned aws CLI
        uses: ./.github/actions/setup-aws

      - uses: ./.github/actions/setup-node-npm

      # ssh2 and cpu-features at the lockfile versions, built for linux-x64: the
      # natives tar executor_artifacts refuses unless each matches the lockfile.
      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Download the CLI bundle of the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: cli-bundle-${{ inputs.ref }}
          path: ${{ runner.temp }}/cli-bundle
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Download the renet binaries of the CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: renet-binaries-${{ inputs.ref }}
          path: ${{ runner.temp }}/renet
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}

      - name: Stage executor artifacts v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
          CI_SHA: ${{ inputs.ref }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.executor_artifacts stage
          --version "$VERSION" --git-sha "$CI_SHA"
          --bundle-dir "$RUNNER_TEMP/cli-bundle" --renet "$RUNNER_TEMP/renet/renet-linux-amd64"
          --node-modules node_modules

  # Deploy to each region in parallel
  deploy:
    name: Deploy ${{ inputs.target }} ${{ matrix.id }}
    # As `build`. The environment: deployment record is created by the runner,
    # not by the token, so deployments: write is not needed.
    permissions:
      contents: read
    needs: [read-regions, build, stage-executor]
    # stage-executor is skipped on stable and on a workers-only edge deploy, and
    # bare success() treats a skipped need as a failure, so each need is named.
    if: >-
      !cancelled() &&
      needs.read-regions.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.stage-executor.result == 'success' || needs.stage-executor.result == 'skipped')
    runs-on: ubuntu-latest
    # Bounds every step below, so the proxy deploy's own kill timers (deploy_proxy.py READY_TIMEOUT_S, DOH_TIMEOUT_S) are reachable inside a limit the job enforces.
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.read-regions.outputs.matrix) }}
      fail-fast: false
    environment:
      name: ${{ inputs.target }}-${{ matrix.id }}
      url: ${{ inputs.target == 'stable' && format('https://{0}', matrix.domain) || format('https://{0}', matrix.edgeDomain) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # `.ci/config` is not optional here: ./.github/actions/bws-secrets resolves
          # NAMES to UUIDs out of .ci/config/bws-secret-map.json before it calls
          # sm-action, so a cone that stops at .github/actions makes the composite
          # fail with "bws-secret-map.json not found" in a job whose checkout looks
          # deliberate. Anything added to this list must stay a superset of what
          # every local action in this job READS, not just where they live.
          sparse-checkout: |
            .github/actions
            .ci/config
      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_BACKUP_S3_ENDPOINT > BWS_ACCOUNT_BACKUP_S3_ENDPOINT
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            FREE_LICENSE_HMAC_KEY > BWS_FREE_LICENSE_HMAC_KEY
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            ACCOUNT_X25519_PUBLIC_KEY > BWS_ACCOUNT_X25519_PUBLIC_KEY
            AWS_SES_ACCESS_KEY_ID_ASIA > BWS_AWS_SES_ACCESS_KEY_ID_ASIA
            AWS_SES_ACCESS_KEY_ID_EU > BWS_AWS_SES_ACCESS_KEY_ID_EU
            AWS_SES_ACCESS_KEY_ID_US > BWS_AWS_SES_ACCESS_KEY_ID_US
            AWS_SES_SECRET_ACCESS_KEY_ASIA > BWS_AWS_SES_SECRET_ACCESS_KEY_ASIA
            AWS_SES_SECRET_ACCESS_KEY_EU > BWS_AWS_SES_SECRET_ACCESS_KEY_EU
            AWS_SES_SECRET_ACCESS_KEY_US > BWS_AWS_SES_SECRET_ACCESS_KEY_US
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_TURNSTILE_SECRET_KEY > BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            STRIPE_SECRET_KEY > BWS_STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET_ASIA > BWS_STRIPE_WEBHOOK_SECRET_ASIA
            STRIPE_WEBHOOK_SECRET_EU > BWS_STRIPE_WEBHOOK_SECRET_EU
            STRIPE_WEBHOOK_SECRET_US > BWS_STRIPE_WEBHOOK_SECRET_US
            OBS_OTLP_CREDENTIALS_ASIA > BWS_OBS_OTLP_CREDENTIALS_ASIA
            OBS_OTLP_CREDENTIALS_EU > BWS_OBS_OTLP_CREDENTIALS_EU
            OBS_OTLP_CREDENTIALS_US > BWS_OBS_OTLP_CREDENTIALS_US
            GITHUB_APP_ID > BWS_APP_ID
            CLOUDFLARE_ACCOUNT_ID > BWS_CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            AWS_SES_CONFIGURATION_SET > BWS_AWS_SES_CONFIGURATION_SET
            AWS_SES_FROM > BWS_AWS_SES_FROM
            ROOT_EMAIL > BWS_ROOT_EMAIL
            SELLER_ADDRESS_LINE1 > BWS_SELLER_ADDRESS_LINE1
            SELLER_ADDRESS_LINE2 > BWS_SELLER_ADDRESS_LINE2
            SELLER_CITY > BWS_SELLER_CITY
            SELLER_COUNTRY > BWS_SELLER_COUNTRY
            SELLER_EMAIL > BWS_SELLER_EMAIL
            SELLER_NAME > BWS_SELLER_NAME
            SELLER_POSTAL_CODE > BWS_SELLER_POSTAL_CODE
            SELLER_REGISTRATION_NUMBER > BWS_SELLER_REGISTRATION_NUMBER
            SELLER_VAT_NUMBER > BWS_SELLER_VAT_NUMBER
            TURNSTILE_SITE_KEY > BWS_TURNSTILE_SITE_KEY

      # The backup key pair is per CHANNEL: two bucket-scoped tokens, each limited
      # to object read and write on its own channel's three backup buckets
      # (agent/plans/PLAN-backup-credential-isolation.md). A run fetches ONLY its
      # own channel's pair, so a stable deploy never holds edge's key and the
      # other way round; set_account_worker_secrets refuses the other pair if it
      # is ever set. check:ci-backup-credential-isolation pins both conditions.
      - name: Fetch the stable backup key pair from Bitwarden
        if: inputs.target == 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_STABLE > BWS_ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_STABLE
            ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_STABLE > BWS_ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_STABLE

      - name: Fetch the edge backup key pair from Bitwarden
        if: inputs.target != 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_EDGE > BWS_ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_EDGE
            ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_EDGE > BWS_ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_EDGE

      # The config server key (layer 3 of the config store) is per REGION and
      # CHANNEL: one name per Worker, none shared. A run fetches only its own
      # name, so a stable eu deploy never holds the edge or another region's
      # key; set_account_worker_secrets refuses the other channel's name if it
      # is ever set (agent/plans/PLAN-config-server-key.md K2). The names are
      # literal, one step per Worker, so the bws map gate sees each of them.
      - name: Fetch the eu stable config server key from Bitwarden
        if: matrix.secretSuffix == 'EU' && inputs.target == 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_CONFIG_SERVER_KEY_EU_STABLE > BWS_ACCOUNT_CONFIG_SERVER_KEY_EU_STABLE

      - name: Fetch the eu edge config server key from Bitwarden
        if: matrix.secretSuffix == 'EU' && inputs.target != 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_CONFIG_SERVER_KEY_EU_EDGE > BWS_ACCOUNT_CONFIG_SERVER_KEY_EU_EDGE

      - name: Fetch the us stable config server key from Bitwarden
        if: matrix.secretSuffix == 'US' && inputs.target == 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_CONFIG_SERVER_KEY_US_STABLE > BWS_ACCOUNT_CONFIG_SERVER_KEY_US_STABLE

      - name: Fetch the us edge config server key from Bitwarden
        if: matrix.secretSuffix == 'US' && inputs.target != 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_CONFIG_SERVER_KEY_US_EDGE > BWS_ACCOUNT_CONFIG_SERVER_KEY_US_EDGE

      - name: Fetch the asia stable config server key from Bitwarden
        if: matrix.secretSuffix == 'ASIA' && inputs.target == 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_CONFIG_SERVER_KEY_ASIA_STABLE > BWS_ACCOUNT_CONFIG_SERVER_KEY_ASIA_STABLE

      - name: Fetch the asia edge config server key from Bitwarden
        if: matrix.secretSuffix == 'ASIA' && inputs.target != 'stable'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_CONFIG_SERVER_KEY_ASIA_EDGE > BWS_ACCOUNT_CONFIG_SERVER_KEY_ASIA_EDGE

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Init account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: ./.github/actions/setup-node-npm

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && npm run install:natives && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Download account worker artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: account-worker-${{ inputs.target }}
          path: workers/account/

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          # A global install resolves wrangler's whole tree live; --before holds it to the release-age window.
          before="$(PYTHONPATH=.ci python3 -m rediacc_ci.core.release_age npm-before)"
          npm install -g "wrangler@${WRANGLER_VERSION}" --before "${before}"

      - name: Resolve deploy config
        id: config
        env:
          TARGET: ${{ inputs.target }}
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_SECRET_SUFFIX: ${{ matrix.secretSuffix }}
          MATRIX_WORKER_NAME: ${{ matrix.workerName }}
          MATRIX_DOMAIN: ${{ matrix.domain }}
          MATRIX_EDGE_WORKER_NAME: ${{ matrix.edgeWorkerName }}
          MATRIX_EDGE_DOMAIN: ${{ matrix.edgeDomain }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.resolve_account_deploy_config

      # Preflight: the secret this job is about to push must be the one the live
      # `rediacc-console` Turnstile widget holds. On 2026-09-24 Bitwarden's copy had
      # silently drifted, a routine secret push deployed it to every account Worker,
      # and every login failed with "Captcha verification failed". Exit 1 is drift,
      # exit 2 is no verdict (API or credential failure); both block the deploy.
      - name: Turnstile widget matches Bitwarden (${{ matrix.id }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ env.BWS_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ env.BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.turnstile_drift

      # Preflight: the production price catalog is only updated by a manual
      # stripe-sync run per regional Stripe account. Fail the deploy if the
      # target account's lookup keys drift from shared PLAN_PRICING, so code
      # expecting new prices can never ship before the sync ran.
      - name: Verify Stripe prices match shared constants (${{ matrix.id }})
        working-directory: private/account
        env:
          # ONE live key serves all three regions since the collapse, so the old
          # STRIPE_KEY_{EU,US,ASIA} fan-in bound the same value three times and the
          # `${!key_var}` indirection chose between identical things -- on a SUFFIX
          # that resolve-account-deploy-config.sh no longer emits, so it was empty
          # and the lookup silently found nothing. Deleted rather than repaired:
          # the indirection had no remaining purpose, and it was one of the runtime
          # -constructed names that no static scan can see.
          STRIPE_SECRET_KEY: ${{ inputs.target == 'stable'
            && env.BWS_STRIPE_SECRET_KEY
            || env.BWS_STRIPE_SANDBOX_SECRET_KEY }}
        run: npx tsx scripts/check-live-prices.ts

      # ---- Proxy Worker and console executor (agent/plans/PLAN-proxy-cd-six-targets.md
      # Design item 9). Forward: record-before, a bootstrap proxy deploy only when
      # the proxy Worker does not exist yet, the account Worker and its secrets,
      # the proxy deploy, its smoke, and the executor switched on only when that
      # smoke passed. Failure: the reverse-order rollback. Always: the record.
      #
      # A stable promote checks out v<version>, and a version older than these
      # steps carries neither the modules nor an account Worker that exports
      # ExecutorIssuer. Such a promote FAILS on every target (operator ruling
      # 2026-10-26, "Fail those promotions"): a stable region left without the
      # proxy executor is a broken console, not a skipped step.
      - name: Proxy CD steps present in ${{ inputs.ref }}
        env:
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ -f .ci/rediacc_ci/deploy/deploy_record.py && -f .ci/rediacc_ci/deploy/console_executor.py ]]; then exit 0; fi
          echo "::error::${REF} carries no deploy_record.py/console_executor.py: a ${TARGET} deploy always ships the proxy steps, so a release older than them is not deployable"
          echo "- ${TARGET} ${REGION}: REFUSED, ${REF} predates the proxy CD steps" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Install the pinned aws CLI
        uses: ./.github/actions/setup-aws

      - name: Install proxy worker dependencies
        run: npm ci
        working-directory: workers/proxy

      # Taken BEFORE deploy_account applies the D1 migrations: the bookmark is the
      # only rollback handle for a migration. Any lookup it cannot answer (wrangler,
      # the bookmark, R2, the staged manifest of v<version>) exits 1 here, before
      # anything is deployed.
      - name: Record before (${{ matrix.id }})
        id: record_before
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_record before
          --target "$TARGET" --region "$REGION" --version "$VERSION"
          --out "$RUNNER_TEMP/deploy-record/before.json"

      # U1: the account config binds EXECUTOR to this target's proxy Worker, and a
      # deploy naming a service that does not exist is refused, so a target's
      # first release deploys the proxy before the account Worker.
      - name: Bootstrap proxy Worker (${{ matrix.id }})
        id: proxy_bootstrap
        if: steps.record_before.outputs.proxy_exists == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_record bootstrap
          --before "$RUNNER_TEMP/deploy-record/before.json"
          --record "$RUNNER_TEMP/deploy-record/proxy-bootstrap.json"

      - name: Deploy account Worker (${{ matrix.id }})
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_account --region ${{ steps.config.outputs.region }} --target ${{ inputs.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          # deploy_account refuses before any write unless the dist carries this
          # key (portal_sitekey_refusal), then smokes the served portal for it.
          TURNSTILE_SITE_KEY: ${{ env.BWS_TURNSTILE_SITE_KEY }}

      # Step-scoped (.ci/config/bws-step-scoped.json, check:ci-bws-step-scope): this
      # fetch serves the next step only, and the scrub after it blanks the key.
      - name: Fetch the step-scoped signing key(s) for the next step only
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_X25519_PRIVATE_KEY > BWS_ACCOUNT_X25519_PRIVATE_KEY
      - name: Set Worker secrets (${{ matrix.id }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          # Region-aware secrets: resolved via bash indirection from SUFFIX
          # No STRIPE_SANDBOX_*: set-account-worker-secrets.sh blanks Stripe on
          # edge (billing disabled) and uses the regional key on stable, so the
          # sandbox pair was wired in but never read. The sandbox key is still
          # used by the "Verify Stripe prices" step above.
          SUFFIX: ${{ matrix.secretSuffix }}
          TARGET: ${{ inputs.target }}
          # Chunk-store backup plane. The ENDPOINT is shared (it is not a
          # credential; the script splices the region's jurisdiction label into
          # it). The KEY PAIR is per channel and not per region: one token per
          # channel, scoped to object read and write on that channel's three
          # buckets. Only this run's channel was fetched above, so the other
          # channel's two names arrive empty, which the script requires.
          ACCOUNT_BACKUP_S3_ENDPOINT: ${{ env.BWS_ACCOUNT_BACKUP_S3_ENDPOINT }}
          ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_STABLE: ${{ env.BWS_ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_STABLE }}
          ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_STABLE: ${{ env.BWS_ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_STABLE }}
          ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_EDGE: ${{ env.BWS_ACCOUNT_BACKUP_S3_ACCESS_KEY_ID_EDGE }}
          ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_EDGE: ${{ env.BWS_ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY_EDGE }}
          WORKER_NAME: ${{ steps.config.outputs.worker }}
          # Restored 2026-09-02 from the Bitwarden map, which is the naming
          # authority: every name below that the store holds is exported under
          # EXACTLY the stored spelling. HEAD carried an older contract
          # (SECRET_ED25519_*, STRIPE_KEY_EU) that the deploy script no longer reads.
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ env.BWS_ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_JWT_SECRET: ${{ env.BWS_ACCOUNT_JWT_SECRET }}
          FREE_LICENSE_HMAC_KEY: ${{ env.BWS_FREE_LICENSE_HMAC_KEY }}
          ACCOUNT_CONFIG_SERVER_KEY_EU_STABLE: ${{ env.BWS_ACCOUNT_CONFIG_SERVER_KEY_EU_STABLE }}
          ACCOUNT_CONFIG_SERVER_KEY_EU_EDGE: ${{ env.BWS_ACCOUNT_CONFIG_SERVER_KEY_EU_EDGE }}
          ACCOUNT_CONFIG_SERVER_KEY_US_STABLE: ${{ env.BWS_ACCOUNT_CONFIG_SERVER_KEY_US_STABLE }}
          ACCOUNT_CONFIG_SERVER_KEY_US_EDGE: ${{ env.BWS_ACCOUNT_CONFIG_SERVER_KEY_US_EDGE }}
          ACCOUNT_CONFIG_SERVER_KEY_ASIA_STABLE: ${{ env.BWS_ACCOUNT_CONFIG_SERVER_KEY_ASIA_STABLE }}
          ACCOUNT_CONFIG_SERVER_KEY_ASIA_EDGE: ${{ env.BWS_ACCOUNT_CONFIG_SERVER_KEY_ASIA_EDGE }}
          ACCOUNT_SERVER_API_KEY: ${{ env.BWS_ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_X25519_PRIVATE_KEY: ${{ env.BWS_ACCOUNT_X25519_PRIVATE_KEY }}
          ACCOUNT_X25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_X25519_PUBLIC_KEY }}
          AWS_SES_ACCESS_KEY_ID_ASIA: ${{ env.BWS_AWS_SES_ACCESS_KEY_ID_ASIA }}
          AWS_SES_ACCESS_KEY_ID_EU: ${{ env.BWS_AWS_SES_ACCESS_KEY_ID_EU }}
          AWS_SES_ACCESS_KEY_ID_US: ${{ env.BWS_AWS_SES_ACCESS_KEY_ID_US }}
          AWS_SES_CONFIGURATION_SET: ${{ env.BWS_AWS_SES_CONFIGURATION_SET }}
          AWS_SES_FROM: ${{ env.BWS_AWS_SES_FROM }}
          AWS_SES_REGION: ${{ matrix.sesRegion }}
          AWS_SES_SECRET_ACCESS_KEY_ASIA: ${{ env.BWS_AWS_SES_SECRET_ACCESS_KEY_ASIA }}
          AWS_SES_SECRET_ACCESS_KEY_EU: ${{ env.BWS_AWS_SES_SECRET_ACCESS_KEY_EU }}
          AWS_SES_SECRET_ACCESS_KEY_US: ${{ env.BWS_AWS_SES_SECRET_ACCESS_KEY_US }}
          BACKUP_BUCKET_EDGE: ${{ matrix.edgeBackupBucket }}
          BACKUP_BUCKET_STABLE: ${{ matrix.backupBucket }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ env.BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          OBS_OTLP_CREDENTIALS_ASIA: ${{ env.BWS_OBS_OTLP_CREDENTIALS_ASIA }}
          OBS_OTLP_CREDENTIALS_EU: ${{ env.BWS_OBS_OTLP_CREDENTIALS_EU }}
          OBS_OTLP_CREDENTIALS_US: ${{ env.BWS_OBS_OTLP_CREDENTIALS_US }}
          R2_JURISDICTION: ${{ matrix.r2Jurisdiction }}
          ROOT_EMAIL: ${{ env.BWS_ROOT_EMAIL }}
          SELLER_ADDRESS_LINE1: ${{ env.BWS_SELLER_ADDRESS_LINE1 }}
          SELLER_ADDRESS_LINE2: ${{ env.BWS_SELLER_ADDRESS_LINE2 }}
          SELLER_CITY: ${{ env.BWS_SELLER_CITY }}
          SELLER_COUNTRY: ${{ env.BWS_SELLER_COUNTRY }}
          SELLER_EMAIL: ${{ env.BWS_SELLER_EMAIL }}
          SELLER_NAME: ${{ env.BWS_SELLER_NAME }}
          SELLER_POSTAL_CODE: ${{ env.BWS_SELLER_POSTAL_CODE }}
          SELLER_REGISTRATION_NUMBER: ${{ env.BWS_SELLER_REGISTRATION_NUMBER }}
          SELLER_VAT_NUMBER: ${{ env.BWS_SELLER_VAT_NUMBER }}
          STRIPE_SECRET_KEY: ${{ env.BWS_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_ASIA: ${{ env.BWS_STRIPE_WEBHOOK_SECRET_ASIA }}
          STRIPE_WEBHOOK_SECRET_EU: ${{ env.BWS_STRIPE_WEBHOOK_SECRET_EU }}
          STRIPE_WEBHOOK_SECRET_US: ${{ env.BWS_STRIPE_WEBHOOK_SECRET_US }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.set_account_worker_secrets
      - name: Blank the step-scoped signing key(s) for the rest of the job
        if: always()
        uses: ./.github/actions/bws-scrub
        with:
          names: |
            BWS_ACCOUNT_ED25519_PRIVATE_KEY
            BWS_ACCOUNT_X25519_PRIVATE_KEY

      - name: Deploy proxy Worker (${{ matrix.id }})
        id: proxy_deploy
        if: steps.record_before.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_proxy
          --target "$TARGET" --region "$REGION" --version "$VERSION"
          --record "$RUNNER_TEMP/deploy-record/proxy.json"

      # Health 200, unauthenticated server-info 401, and /v1/ready 200 on the
      # version the deploy recorded, polled for up to 5 minutes: a deploy that
      # exits 0 only means the rollout started.
      - name: Proxy smoke (${{ matrix.id }})
        id: proxy_smoke
        if: steps.record_before.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_proxy
          --target "$TARGET" --region "$REGION" --smoke-only
          --record "$RUNNER_TEMP/deploy-record/proxy.json"

      # Ruling ASKED:2026-10-25T18:18Z "Closed until smoke passes": the region's
      # console executor opens only on this release's passing proxy smoke.
      - name: Enable console executor (${{ matrix.id }})
        id: enable
        if: steps.proxy_smoke.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.console_executor --enable --target "$TARGET" --region "$REGION"

      # Reverse order: close the console executor, return the proxy to the release
      # record-before names (nothing for a first deploy), then PRINT the account
      # Worker rollback and the D1 restore, which stay human decisions.
      - name: Roll back proxy and console executor (${{ matrix.id }})
        id: rollback
        if: failure() && steps.record_before.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_record rollback
          --before "$RUNNER_TEMP/deploy-record/before.json"

      - name: Write the deploy record (${{ matrix.id }})
        if: always() && steps.record_before.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          REGION: ${{ matrix.id }}
          VERSION: ${{ inputs.version }}
          ENABLE_OUTCOME: ${{ steps.enable.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: >-
          PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_record after
          --before "$RUNNER_TEMP/deploy-record/before.json"
          --proxy-record "$RUNNER_TEMP/deploy-record/proxy.json"
          --manifest workers/proxy/stage/manifest.json
          --enable-outcome "$ENABLE_OUTCOME" --rollback-outcome "$ROLLBACK_OUTCOME"
          --out "$RUNNER_TEMP/deploy-record/deploy-record-$TARGET-$REGION.json"

      - name: Upload the deploy record (${{ matrix.id }})
        if: always() && steps.record_before.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: deploy-record-${{ inputs.target }}-${{ matrix.id }}
          path: ${{ runner.temp }}/deploy-record/
          retention-days: 3
          if-no-files-found: error
