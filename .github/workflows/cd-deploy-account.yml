name: Deploy Account Workers

# Reusable workflow for deploying per-region account Workers.
# Builds the account portal SPA once, then deploys to each region in parallel.
# Reads regions from regions.json for the deployment matrix.

on:
  workflow_call:
    inputs:
      target:
        description: 'Deploy channel: edge or stable'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (SHA, tag, or branch)'
        required: true
        type: string
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
      APP_PRIVATE_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      ACCOUNT_ED25519_PRIVATE_KEY:
        required: true
      ACCOUNT_ED25519_PUBLIC_KEY:
        required: true
      ACCOUNT_X25519_PRIVATE_KEY:
        required: true
      ACCOUNT_X25519_PUBLIC_KEY:
        required: true
      ACCOUNT_SERVER_API_KEY:
        required: true
      ACCOUNT_JWT_SECRET:
        required: true
      STRIPE_SECRET_KEY:
        required: true
      STRIPE_SANDBOX_SECRET_KEY:
        required: true
      STRIPE_WEBHOOK_SECRET_EU:
        required: true
      STRIPE_WEBHOOK_SECRET_US:
        required: true
      STRIPE_SANDBOX_WEBHOOK_SECRET:
        required: true
      AWS_SES_ACCESS_KEY_ID_EU:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_EU:
        required: true
      AWS_SES_ACCESS_KEY_ID_US:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_US:
        required: true
      STRIPE_WEBHOOK_SECRET_ASIA:
        required: true
      AWS_SES_ACCESS_KEY_ID_ASIA:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_ASIA:
        required: true
      CLOUDFLARE_TURNSTILE_SECRET_KEY:
        required: true
      # An undeclared secret silently reads as "" inside a reusable workflow.
      # These three were read by the "Set Worker secrets" step but never declared
      # here nor passed by any caller, so every deployed account Worker got
      # OTLP_CLIENT_CREDENTIALS="" and shipped no telemetry. Keep them declared.
      OBS_OTLP_CREDENTIALS_EU:
        required: true
      OBS_OTLP_CREDENTIALS_US:
        required: true
      OBS_OTLP_CREDENTIALS_ASIA:
        required: true
      # Chunk-store backup plane. `required: true` deliberately, and every
      # caller updated in the same change: these are optional in the Worker's
      # env schema, so an empty value does NOT fail the deploy -- it ships a
      # Worker whose backup endpoints answer 503 at runtime. That is the exact
      # shape of the OTLP bug above, and `required` is what turns it into a
      # loud workflow error instead of a silent production regression.
      ACCOUNT_BACKUP_S3_ENDPOINT:
        required: true
      ACCOUNT_BACKUP_S3_ACCESS_KEY_ID:
        required: true
      ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY:
        required: true

jobs:
  # Read regions.json to build the deployment matrix
  read-regions:
    name: Read regions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: regions.json
          sparse-checkout-cone-mode: false

      - id: regions
        run: |
          # backupBucket/edgeBackupBucket/r2Jurisdiction are read by the "Set Worker
          # secrets" step below and were NEVER in this projection -- all three
          # resolved empty and set-account-worker-secrets.sh:150-156 exited 1, so
          # every account deploy hard-failed. regions.json NESTS two of them under
          # backupR2.name / edgeBackupR2.name, so this maps as well as selects.
          echo "matrix=$(jq -c '{include: [.regions[] | {id, domain, edgeDomain, secretSuffix, sesRegion, workerName, edgeWorkerName, backupBucket: .backupR2.name, edgeBackupBucket: .edgeBackupR2.name, r2Jurisdiction}]}' regions.json)" >> "$GITHUB_OUTPUT"

  # Build SPA once (shared across all regions)
  build:
    name: Build account portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - name: Init account submodule
        run: git submodule update --init private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/account/dist/account
        working-directory: private/account/web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_CI_MODE: 'false'

      - name: Install account worker dependencies
        run: npm install
        working-directory: workers/account

      - name: Upload account worker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: account-worker-${{ inputs.target }}
          path: workers/account/
          retention-days: 1

  # Deploy to each region in parallel
  deploy:
    name: Deploy ${{ inputs.target }} ${{ matrix.id }}
    needs: [read-regions, build]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.read-regions.outputs.matrix) }}
      fail-fast: false
    environment:
      name: ${{ inputs.target }}-${{ matrix.id }}
      url: ${{ inputs.target == 'stable' && format('https://{0}', matrix.domain) || format('https://{0}', matrix.edgeDomain) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # `.ci/config` is not optional here: ./.github/actions/bws-secrets resolves
          # NAMES to UUIDs out of .ci/config/bws-secret-map.json before it calls
          # sm-action, so a cone that stops at .github/actions makes the composite
          # fail with "bws-secret-map.json not found" in a job whose checkout looks
          # deliberate. Anything added to this list must stay a superset of what
          # every local action in this job READS, not just where they live.
          sparse-checkout: |
            .github/actions
            .ci/config

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_BACKUP_S3_ACCESS_KEY_ID > BWS_ACCOUNT_BACKUP_S3_ACCESS_KEY_ID
            ACCOUNT_BACKUP_S3_ENDPOINT > BWS_ACCOUNT_BACKUP_S3_ENDPOINT
            ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY > BWS_ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            ACCOUNT_X25519_PRIVATE_KEY > BWS_ACCOUNT_X25519_PRIVATE_KEY
            ACCOUNT_X25519_PUBLIC_KEY > BWS_ACCOUNT_X25519_PUBLIC_KEY
            AWS_SES_ACCESS_KEY_ID_EU > BWS_AWS_SES_ACCESS_KEY_ID_EU
            AWS_SES_ACCESS_KEY_ID_US > BWS_AWS_SES_ACCESS_KEY_ID_US
            AWS_SES_SECRET_ACCESS_KEY_EU > BWS_AWS_SES_SECRET_ACCESS_KEY_EU
            AWS_SES_SECRET_ACCESS_KEY_US > BWS_AWS_SES_SECRET_ACCESS_KEY_US
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_TURNSTILE_SECRET_KEY > BWS_CLOUDFLARE_TURNSTILE_SECRET_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            STRIPE_SECRET_KEY > BWS_STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET_ASIA > BWS_STRIPE_WEBHOOK_SECRET_ASIA
            STRIPE_WEBHOOK_SECRET_EU > BWS_STRIPE_WEBHOOK_SECRET_EU
            STRIPE_WEBHOOK_SECRET_US > BWS_STRIPE_WEBHOOK_SECRET_US

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ACCOUNT_BACKUP_S3_ACCESS_KEY_ID ACCOUNT_BACKUP_S3_ENDPOINT ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY ACCOUNT_ED25519_PRIVATE_KEY ACCOUNT_ED25519_PUBLIC_KEY ACCOUNT_JWT_SECRET ACCOUNT_SERVER_API_KEY ACCOUNT_X25519_PRIVATE_KEY ACCOUNT_X25519_PUBLIC_KEY AWS_SES_ACCESS_KEY_ID_EU AWS_SES_ACCESS_KEY_ID_US AWS_SES_SECRET_ACCESS_KEY_EU AWS_SES_SECRET_ACCESS_KEY_US CLOUDFLARE_API_TOKEN CLOUDFLARE_TURNSTILE_SECRET_KEY APP_PRIVATE_KEY STRIPE_SANDBOX_SECRET_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET_ASIA STRIPE_WEBHOOK_SECRET_EU STRIPE_WEBHOOK_SECRET_US
          SHADOW_EXPECTED_MISMATCH: ACCOUNT_SERVER_API_KEY
          GH_ACCOUNT_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_BACKUP_S3_ACCESS_KEY_ID }}
          GH_ACCOUNT_BACKUP_S3_ENDPOINT: ${{ secrets.ACCOUNT_BACKUP_S3_ENDPOINT }}
          GH_ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY }}
          GH_ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          GH_ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          GH_ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          GH_ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          GH_ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          GH_ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          GH_AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          GH_AWS_SES_ACCESS_KEY_ID_US: ${{ secrets.AWS_SES_ACCESS_KEY_ID_US }}
          GH_AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          GH_AWS_SES_SECRET_ACCESS_KEY_US: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_US }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          GH_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          GH_STRIPE_WEBHOOK_SECRET_ASIA: ${{ secrets.STRIPE_WEBHOOK_SECRET_ASIA }}
          GH_STRIPE_WEBHOOK_SECRET_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
          GH_STRIPE_WEBHOOK_SECRET_US: ${{ secrets.STRIPE_WEBHOOK_SECRET_US }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - name: Init account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Download account worker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: account-worker-${{ inputs.target }}
          path: workers/account/

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Resolve deploy config
        id: config
        env:
          TARGET: ${{ inputs.target }}
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_SECRET_SUFFIX: ${{ matrix.secretSuffix }}
          MATRIX_WORKER_NAME: ${{ matrix.workerName }}
          MATRIX_DOMAIN: ${{ matrix.domain }}
          MATRIX_EDGE_WORKER_NAME: ${{ matrix.edgeWorkerName }}
          MATRIX_EDGE_DOMAIN: ${{ matrix.edgeDomain }}
        run: .ci/scripts/deploy/resolve-account-deploy-config.sh

      # Preflight: the production price catalog is only updated by a manual
      # stripe-sync run per regional Stripe account. Fail the deploy if the
      # target account's lookup keys drift from shared PLAN_PRICING, so code
      # expecting new prices can never ship before the sync ran.
      - name: Verify Stripe prices match shared constants (${{ matrix.id }})
        working-directory: private/account
        env:
          # ONE live key serves all three regions since the collapse, so the old
          # STRIPE_KEY_{EU,US,ASIA} fan-in bound the same value three times and the
          # `${!key_var}` indirection chose between identical things -- on a SUFFIX
          # that resolve-account-deploy-config.sh no longer emits, so it was empty
          # and the lookup silently found nothing. Deleted rather than repaired:
          # the indirection had no remaining purpose, and it was one of the runtime
          # -constructed names that no static scan can see.
          STRIPE_SECRET_KEY: ${{ inputs.target == 'stable'
            && secrets.STRIPE_SECRET_KEY
            || secrets.STRIPE_SANDBOX_SECRET_KEY }}
        run: npx tsx scripts/check-live-prices.ts

      - name: Deploy account Worker (${{ matrix.id }})
        run: .ci/scripts/deploy/deploy-account.sh --region ${{ steps.config.outputs.region }} --target ${{ inputs.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets (${{ matrix.id }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Region-aware secrets: resolved via bash indirection from SUFFIX
          # No STRIPE_SANDBOX_*: set-account-worker-secrets.sh blanks Stripe on
          # edge (billing disabled) and uses the regional key on stable, so the
          # sandbox pair was wired in but never read. The sandbox key is still
          # used by the "Verify Stripe prices" step above.
          SUFFIX: ${{ matrix.secretSuffix }}
          TARGET: ${{ inputs.target }}
          # Chunk-store backup plane. Not region-suffixed on purpose: one
          # bucket-scoped R2 credential serves every region.
          ACCOUNT_BACKUP_S3_ENDPOINT: ${{ secrets.ACCOUNT_BACKUP_S3_ENDPOINT }}
          ACCOUNT_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_BACKUP_S3_ACCESS_KEY_ID }}
          ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_BACKUP_S3_SECRET_ACCESS_KEY }}
          WORKER_NAME: ${{ steps.config.outputs.worker }}
          # Restored 2026-09-02 from the Bitwarden map, which is the naming
          # authority: every name below that the store holds is exported under
          # EXACTLY the stored spelling. HEAD carried an older contract
          # (SECRET_ED25519_*, STRIPE_KEY_EU) that the deploy script no longer reads.
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          ACCOUNT_SERVER_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          ACCOUNT_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          AWS_SES_ACCESS_KEY_ID_ASIA: ${{ secrets.AWS_SES_ACCESS_KEY_ID_ASIA }}
          AWS_SES_ACCESS_KEY_ID_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          AWS_SES_ACCESS_KEY_ID_US: ${{ secrets.AWS_SES_ACCESS_KEY_ID_US }}
          AWS_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
          AWS_SES_FROM: ${{ vars.AWS_SES_FROM }}
          AWS_SES_REGION: ${{ matrix.sesRegion }}
          AWS_SES_SECRET_ACCESS_KEY_ASIA: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_ASIA }}
          AWS_SES_SECRET_ACCESS_KEY_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          AWS_SES_SECRET_ACCESS_KEY_US: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_US }}
          BACKUP_BUCKET_EDGE: ${{ matrix.edgeBackupBucket }}
          BACKUP_BUCKET_STABLE: ${{ matrix.backupBucket }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          OBS_OTLP_CREDENTIALS_ASIA: ${{ secrets.OBS_OTLP_CREDENTIALS_ASIA }}
          OBS_OTLP_CREDENTIALS_EU: ${{ secrets.OBS_OTLP_CREDENTIALS_EU }}
          OBS_OTLP_CREDENTIALS_US: ${{ secrets.OBS_OTLP_CREDENTIALS_US }}
          R2_JURISDICTION: ${{ matrix.r2Jurisdiction }}
          ROOT_EMAIL: ${{ vars.ROOT_EMAIL }}
          SELLER_ADDRESS_LINE1: ${{ vars.SELLER_ADDRESS_LINE1 }}
          SELLER_ADDRESS_LINE2: ${{ vars.SELLER_ADDRESS_LINE2 }}
          SELLER_CITY: ${{ vars.SELLER_CITY }}
          SELLER_COUNTRY: ${{ vars.SELLER_COUNTRY }}
          SELLER_EMAIL: ${{ vars.SELLER_EMAIL }}
          SELLER_NAME: ${{ vars.SELLER_NAME }}
          SELLER_POSTAL_CODE: ${{ vars.SELLER_POSTAL_CODE }}
          SELLER_REGISTRATION_NUMBER: ${{ vars.SELLER_REGISTRATION_NUMBER }}
          SELLER_VAT_NUMBER: ${{ vars.SELLER_VAT_NUMBER }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
