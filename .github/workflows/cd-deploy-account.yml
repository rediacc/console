name: Deploy Account Workers

# Reusable workflow for deploying per-region account Workers.
# Builds the account portal SPA once, then deploys to each region in parallel.
# Reads regions from regions.json for the deployment matrix.

on:
  workflow_call:
    inputs:
      target:
        description: 'Deploy channel: edge or stable'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout (SHA, tag, or branch)'
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      ACCOUNT_ED25519_PRIVATE_KEY:
        required: true
      ACCOUNT_ED25519_PUBLIC_KEY:
        required: true
      ACCOUNT_X25519_PRIVATE_KEY:
        required: true
      ACCOUNT_X25519_PUBLIC_KEY:
        required: true
      ACCOUNT_SERVER_API_KEY:
        required: true
      ACCOUNT_JWT_SECRET:
        required: true
      STRIPE_SECRET_KEY_EU:
        required: true
      STRIPE_SECRET_KEY_US:
        required: true
      STRIPE_SANDBOX_SECRET_KEY:
        required: true
      STRIPE_WEBHOOK_SECRET_EU:
        required: true
      STRIPE_WEBHOOK_SECRET_US:
        required: true
      STRIPE_SANDBOX_WEBHOOK_SECRET:
        required: true
      AWS_SES_ACCESS_KEY_ID_EU:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_EU:
        required: true
      AWS_SES_ACCESS_KEY_ID_US:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_US:
        required: true
      STRIPE_SECRET_KEY_ASIA:
        required: true
      STRIPE_WEBHOOK_SECRET_ASIA:
        required: true
      AWS_SES_ACCESS_KEY_ID_ASIA:
        required: true
      AWS_SES_SECRET_ACCESS_KEY_ASIA:
        required: true
      TURNSTILE_SECRET_KEY:
        required: true
      # An undeclared secret silently reads as "" inside a reusable workflow.
      # These three were read by the "Set Worker secrets" step but never declared
      # here nor passed by any caller, so every deployed account Worker got
      # OTLP_CLIENT_CREDENTIALS="" and shipped no telemetry. Keep them declared.
      OTLP_CLIENT_CREDENTIALS_EU:
        required: true
      OTLP_CLIENT_CREDENTIALS_US:
        required: true
      OTLP_CLIENT_CREDENTIALS_ASIA:
        required: true
      # Chunk-store backup plane. `required: true` deliberately, and every
      # caller updated in the same change: these are optional in the Worker's
      # env schema, so an empty value does NOT fail the deploy -- it ships a
      # Worker whose backup endpoints answer 503 at runtime. That is the exact
      # shape of the OTLP bug above, and `required` is what turns it into a
      # loud workflow error instead of a silent production regression.
      BACKUP_S3_ENDPOINT:
        required: true
      BACKUP_S3_BUCKET:
        required: true
      BACKUP_S3_ACCESS_KEY_ID:
        required: true
      BACKUP_S3_SECRET_ACCESS_KEY:
        required: true

jobs:
  # Read regions.json to build the deployment matrix
  read-regions:
    name: Read regions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: regions.json
          sparse-checkout-cone-mode: false

      - id: regions
        run: |
          echo "matrix=$(jq -c '{include: [.regions[] | {id, domain, edgeDomain, secretSuffix, sesRegion, workerName, edgeWorkerName}]}' regions.json)" >> "$GITHUB_OUTPUT"

  # Build SPA once (shared across all regions)
  build:
    name: Build account portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,renet,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Init account submodule
        run: git submodule update --init private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Build account portal
        run: npm install && npx vite build --outDir ../../../workers/account/dist/account
        working-directory: private/account/web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_CI_MODE: 'false'

      - name: Install account worker dependencies
        run: npm install
        working-directory: workers/account

      - name: Upload account worker artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: account-worker-${{ inputs.target }}
          path: workers/account/
          retention-days: 1

  # Deploy to each region in parallel
  deploy:
    name: Deploy ${{ inputs.target }} ${{ matrix.id }}
    needs: [read-regions, build]
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.read-regions.outputs.matrix) }}
      fail-fast: false
    environment:
      name: ${{ inputs.target }}-${{ matrix.id }}
      url: ${{ inputs.target == 'stable' && format('https://{0}', matrix.domain) || format('https://{0}', matrix.edgeDomain) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/actions

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: cd
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Init account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Install account dependencies
        run: npm install && cd ../.. && npm run install:natives
        working-directory: private/account

      - name: Build shared packages
        run: npm run build:packages

      - name: Download account worker artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: account-worker-${{ inputs.target }}
          path: workers/account/

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Resolve deploy config
        id: config
        env:
          TARGET: ${{ inputs.target }}
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_SECRET_SUFFIX: ${{ matrix.secretSuffix }}
          MATRIX_WORKER_NAME: ${{ matrix.workerName }}
          MATRIX_DOMAIN: ${{ matrix.domain }}
          MATRIX_EDGE_WORKER_NAME: ${{ matrix.edgeWorkerName }}
          MATRIX_EDGE_DOMAIN: ${{ matrix.edgeDomain }}
        run: .ci/scripts/deploy/resolve-account-deploy-config.sh

      # Preflight: the production price catalog is only updated by a manual
      # stripe-sync run per regional Stripe account. Fail the deploy if the
      # target account's lookup keys drift from shared PLAN_PRICING, so code
      # expecting new prices can never ship before the sync ran.
      - name: Verify Stripe prices match shared constants (${{ matrix.id }})
        working-directory: private/account
        env:
          STRIPE_KEY_EU: ${{ secrets.STRIPE_SECRET_KEY_EU }}
          STRIPE_KEY_US: ${{ secrets.STRIPE_SECRET_KEY_US }}
          STRIPE_KEY_ASIA: ${{ secrets.STRIPE_SECRET_KEY_ASIA }}
          STRIPE_SANDBOX_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          SUFFIX: ${{ steps.config.outputs.suffix }}
        run: |
          if [[ "${{ inputs.target }}" == "stable" ]]; then
            key_var="STRIPE_KEY_${SUFFIX}"
            export STRIPE_SECRET_KEY="${!key_var}"
          else
            export STRIPE_SECRET_KEY="${STRIPE_SANDBOX_KEY}"
          fi
          npx tsx scripts/check-live-prices.ts

      - name: Deploy account Worker (${{ matrix.id }})
        run: .ci/scripts/deploy/deploy-account.sh --region ${{ steps.config.outputs.region }} --target ${{ inputs.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets (${{ matrix.id }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_ED25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_ED25519_PRIVATE_KEY }}
          SECRET_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          SECRET_X25519_PRIVATE_KEY: ${{ secrets.ACCOUNT_X25519_PRIVATE_KEY }}
          SECRET_X25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_X25519_PUBLIC_KEY }}
          SECRET_API_KEY: ${{ secrets.ACCOUNT_SERVER_API_KEY }}
          SECRET_JWT_SECRET: ${{ secrets.ACCOUNT_JWT_SECRET }}
          # Region-aware secrets: resolved via bash indirection from SUFFIX
          STRIPE_KEY_EU: ${{ secrets.STRIPE_SECRET_KEY_EU }}
          STRIPE_KEY_US: ${{ secrets.STRIPE_SECRET_KEY_US }}
          STRIPE_KEY_ASIA: ${{ secrets.STRIPE_SECRET_KEY_ASIA }}
          STRIPE_WH_EU: ${{ secrets.STRIPE_WEBHOOK_SECRET_EU }}
          STRIPE_WH_US: ${{ secrets.STRIPE_WEBHOOK_SECRET_US }}
          STRIPE_WH_ASIA: ${{ secrets.STRIPE_WEBHOOK_SECRET_ASIA }}
          # No STRIPE_SANDBOX_*: set-account-worker-secrets.sh blanks Stripe on
          # edge (billing disabled) and uses the regional key on stable, so the
          # sandbox pair was wired in but never read. The sandbox key is still
          # used by the "Verify Stripe prices" step above.
          SES_KEY_EU: ${{ secrets.AWS_SES_ACCESS_KEY_ID_EU }}
          SES_KEY_US: ${{ secrets.AWS_SES_ACCESS_KEY_ID_US }}
          SES_KEY_ASIA: ${{ secrets.AWS_SES_ACCESS_KEY_ID_ASIA }}
          SES_SECRET_EU: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_EU }}
          SES_SECRET_US: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_US }}
          SES_SECRET_ASIA: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY_ASIA }}
          OTLP_CRED_EU: ${{ secrets.OTLP_CLIENT_CREDENTIALS_EU }}
          OTLP_CRED_US: ${{ secrets.OTLP_CLIENT_CREDENTIALS_US }}
          OTLP_CRED_ASIA: ${{ secrets.OTLP_CLIENT_CREDENTIALS_ASIA }}
          SUFFIX: ${{ matrix.secretSuffix }}
          TARGET: ${{ inputs.target }}
          SECRET_ROOT_EMAIL: ${{ vars.ROOT_EMAIL }}
          SECRET_SES_REGION: ${{ matrix.sesRegion }}
          SECRET_TURNSTILE_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          # Chunk-store backup plane. Not region-suffixed on purpose: one
          # bucket-scoped R2 credential serves every region.
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          VAR_SES_FROM: ${{ vars.AWS_SES_FROM }}
          VAR_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
          VAR_SELLER_NAME: ${{ vars.SELLER_NAME }}
          VAR_SELLER_VAT_NUMBER: ${{ vars.SELLER_VAT_NUMBER }}
          VAR_SELLER_REGISTRATION_NUMBER: ${{ vars.SELLER_REGISTRATION_NUMBER }}
          VAR_SELLER_ADDRESS_LINE1: ${{ vars.SELLER_ADDRESS_LINE1 }}
          VAR_SELLER_ADDRESS_LINE2: ${{ vars.SELLER_ADDRESS_LINE2 }}
          VAR_SELLER_CITY: ${{ vars.SELLER_CITY }}
          VAR_SELLER_POSTAL_CODE: ${{ vars.SELLER_POSTAL_CODE }}
          VAR_SELLER_COUNTRY: ${{ vars.SELLER_COUNTRY }}
          VAR_SELLER_EMAIL: ${{ vars.SELLER_EMAIL }}
          WORKER_NAME: ${{ steps.config.outputs.worker }}
        run: .ci/scripts/deploy/set-account-worker-secrets.sh
