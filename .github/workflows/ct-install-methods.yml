name: Console CT - Install Methods

# Reusable workflow to test all documented installation methods
# Called after successful release to validate published artifacts
#
# Consolidated by runner type to minimize job overhead:
# - Linux x64: Binary, Docker, APT, DNF, APK, Pacman, Quick Install, Linuxbrew
# - Linux arm64: Binary, Docker, Quick Install
# - macOS ARM64: Binary, Homebrew
# - macOS x64: Binary, Homebrew
# - Windows x64: Binary
# - Windows arm64: Binary

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to test (R2 download path, e.g., 0.4.58)'
        required: true
        type: string
      docker_tag:
        description: 'Docker image tag override (for staging images, e.g., staging-abc123)'
        required: false
        type: string
        default: ''
      repo_channel:
        description: 'Repo channel path segment (e.g., "stable", "edge", or "" for staging)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
  packages: read    # GHCR pull for install tests

jobs:
  # ===========================================================================
  # Linux x64: Binary, Docker, APT, DNF, APK, Pacman, Quick Install, Linuxbrew
  # ===========================================================================
  test-linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_TAG: ${{ inputs.docker_tag }}
      REPO_CHANNEL: ${{ inputs.repo_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Test Binary Download
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method binary --version ${{ inputs.version }} --platform linux --arch x64

      - name: Test Docker
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method docker --version ${{ inputs.version }}

      - name: Test APT Installation
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method apt --version ${{ inputs.version }}

      - name: Test DNF Installation
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method dnf --version ${{ inputs.version }}

      - name: Test APK Installation
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method apk --version ${{ inputs.version }}

      - name: Test Pacman Installation
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method pacman --version ${{ inputs.version }}

      - name: Test npm Install
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method npm --version ${{ inputs.version }}

      - name: Test Quick Install
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method quick --version ${{ inputs.version }}

  # ===========================================================================
  # Linux arm64: Binary, Docker, Quick Install
  # ===========================================================================
  test-linux-arm64:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DOCKER_TAG: ${{ inputs.docker_tag }}
      REPO_CHANNEL: ${{ inputs.repo_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Test Binary Download
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method binary --version ${{ inputs.version }} --platform linux --arch arm64

      - name: Test Docker
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method docker --version ${{ inputs.version }}

      - name: Test Quick Install
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method quick --version ${{ inputs.version }}

  # ===========================================================================
  # macOS ARM64: Binary
  # ===========================================================================
  test-macos-arm64:
    name: macOS (ARM64)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      REPO_CHANNEL: ${{ inputs.repo_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Binary Download
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method binary --version ${{ inputs.version }} --platform mac --arch arm64

  # ===========================================================================
  # macOS x64: Binary
  # ===========================================================================
  test-macos-x64:
    name: macOS (x64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      REPO_CHANNEL: ${{ inputs.repo_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Binary Download
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method binary --version ${{ inputs.version }} --platform mac --arch x64

  # ===========================================================================
  # Windows x64: Binary
  # ===========================================================================
  test-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    # 30 min (was 15) to match macOS/Linux: the SEA binary is ~800 MB, and 15 min
    # was too tight to download it on the Windows runner (job hit the cap mid-download).
    timeout-minutes: 30
    env:
      REPO_CHANNEL: ${{ inputs.repo_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Binary Download
        shell: bash
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method binary --version ${{ inputs.version }} --platform win --arch x64

  # ===========================================================================
  # Windows arm64: Binary
  # ===========================================================================
  test-windows-arm64:
    name: Windows (arm64)
    runs-on: windows-11-arm
    # 30 min (was 15): same ~800 MB SEA-binary download as Windows x64.
    timeout-minutes: 30
    env:
      REPO_CHANNEL: ${{ inputs.repo_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Binary Download
        shell: bash
        run: |
          .ci/scripts/test/test-install-methods.sh \
            --method binary --version ${{ inputs.version }} --platform win --arch arm64

  # ===========================================================================
  # Gate Job - All tests must pass
  # ===========================================================================
  install-methods-complete:
    name: Install Methods Complete
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
      - test-linux-x64
      - test-linux-arm64
      - test-macos-arm64
      - test-macos-x64
      - test-windows-x64
      - test-windows-arm64
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .ci/scripts

      - name: Check all tests passed
        run: .ci/scripts/ci/assert-install-methods-complete.sh
        env:
          RESULT_LINUX_X64: ${{ needs.test-linux-x64.result }}
          RESULT_LINUX_ARM64: ${{ needs.test-linux-arm64.result }}
          RESULT_MACOS_ARM64: ${{ needs.test-macos-arm64.result }}
          RESULT_MACOS_X64: ${{ needs.test-macos-x64.result }}
          RESULT_WINDOWS_X64: ${{ needs.test-windows-x64.result }}
          RESULT_WINDOWS_ARM64: ${{ needs.test-windows-arm64.result }}
          VERSION: ${{ inputs.version }}
