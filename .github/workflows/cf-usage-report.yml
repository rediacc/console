name: Cloudflare Usage Report

# PLAN-cloudflare-spend-guard T6. Reads R2, D1 and Workers usage from the account
# GraphQL endpoint and counts the account Worker's "Nightly maintenance is NOT
# running" log line in Loki (rediacc_ci.ops.cf_usage_report). Red names the item
# past its ceiling in .ci/config/cf-spend-guard.json. Read-only: nothing is
# written to Cloudflare.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cf-usage-report
  cancel-in-progress: false

jobs:
  report:
    name: Cloudflare Usage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest

      - name: Fetch secrets from Bitwarden
        # LIVE: read by the report step below.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID > BWS_CLOUDFLARE_ACCOUNT_ID
            OBS_GRAFANA_READ_TOKEN > BWS_OBS_GRAFANA_READ_TOKEN

      - name: Report usage against the ceilings
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}
          OBS_GRAFANA_READ_TOKEN: ${{ env.BWS_OBS_GRAFANA_READ_TOKEN }}
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.ops.cf_usage_report | tee -a "$GITHUB_STEP_SUMMARY"
