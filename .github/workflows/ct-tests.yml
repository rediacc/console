name: Console CT - Tests

# Which suites run in which job is driven by the playwright.*.config.ts files.
# Suites deliberately left OUT of CI (concurrent multi-cluster, cluster rehearse,
# image-build, destructive ops, the two ruled csi-sanity deviations, the examples
# program, and the not-yet-enabled CLI migrate-routing suite) are documented, with
# reasons, in packages/e2e-tests/README.md ("Deliberately not in CI").

on:
  workflow_call:
    # Every TEST job here builds a nolicense renet from source on-runner
    # (rediacc_ci.infra.build_renet); console is public, so a prebuilt
    # nolicense binary must never ship via artifacts. Only the embed-assets
    # staging is shared, via the renet-embed-assets cache (same key as
    # ci-build-renet.yml).
    inputs:
      # The expensive suites run on PR and nightly only. This used to gate the
      # CALLER (ci.yml's `tests:` job), which is why migration-test could not
      # live here: on push-to-main the whole workflow was skipped, and D1
      # migrations must be validated on exactly that path. Gating each job
      # instead lets migration-test run on push while the E2E legs still do not.
      full_suite:
        type: string
        required: false
        default: 'true'
      pointer_bump_only:
        type: string
        required: false
        default: 'false'
      # ---- Scope engine, one input per leaf below --------------------------
      # The caller passes the scope engine's decision for each suite. The
      # engine only ever says 'false', for a suite it has ruled OUT; it never
      # says 'true'. So the default here is the EMPTY STRING and every job
      # tests `!= 'false'`: an unset input, an empty input, a caller that
      # predates these inputs, or a scope step that never ran all mean RUN.
      # Fail-open is the whole safety argument for scoping, and it lives here.
      #
      # migration-test deliberately has no input: it is gated on
      # pointer_bump_only alone because it validates the D1 migrations that
      # push-to-main is about to deploy.
      run_unit:
        type: string
        required: false
        default: ''
      run_e2e_workers:
        type: string
        required: false
        default: ''
      run_e2e_ceph:
        type: string
        required: false
        default: ''
      run_e2e_ceph_workers:
        type: string
        required: false
        default: ''
      run_e2e_k8s:
        type: string
        required: false
        default: ''
      run_e2e_k8s_ceph:
        type: string
        required: false
        default: ''
      run_e2e_k8s_multinode:
        type: string
        required: false
        default: ''
      run_e2e_migrate:
        type: string
        required: false
        default: ''
      run_fork_isolation:
        type: string
        required: false
        default: ''
      run_renet:
        type: string
        required: false
        default: ''
      run_license_enforcement:
        type: string
        required: false
        default: ''
      run_account_e2e:
        type: string
        required: false
        default: ''
      run_drills:
        type: string
        required: false
        default: ''
    secrets:
      # Bitwarden machine-account token for the shadow secret fetch
      # (.github/actions/bws-secrets). Every caller must pass it.
      BWS_ACCESS_TOKEN:
        required: true
# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
# This is a reusable workflow. A callee can never exceed what the calling job
# grants, so each job's block below is also the contract its callers must meet.
permissions: {}

jobs:
  # ============================================================================
  # COLUMN 4: TESTS + INFRA
  # Jobs: migration-test, test-unit, test-e2e-workers, test-e2e-ceph,
  #       test-e2e-ceph-workers, renet-pkg-scope, renet-pkg-matrix,
  #       test-e2e-ceph-workers-rpm, test-e2e-k8s, test-e2e-k8s-ceph,
  #       test-e2e-k8s-multinode, test-e2e-migrate, test-fork-isolation,
  #       test-renet-go, test-renet-integration, test-account-e2e, test-drills
  # ============================================================================

  # Validates that D1 migrations apply cleanly against a production data clone.
  # Creates an ephemeral D1 database, clones production, runs migrations, then
  # tears the clone down.
  #
  # NOT gated on full_suite, unlike every other job here. This one used to be a
  # top-level ci.yml job needing only `initialize`, and it ran on push-to-main --
  # the exact path that deploys these migrations. Moving it under `full_suite`
  # would have stopped validating migrations on the release path, which is the
  # one place the check has to hold.
  migration-test:
    name: Migration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checkout, with the private submodules on the readonly-preset App token.
    # No registry, no GitHub API.
    permissions:
      contents: read
    if: inputs.pointer_bump_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .ci/scripts, because the compare step below RUNS one. It used to be
          # 18 inline lines and needed no file; extracting it to
          # .ci/scripts/ci/shadow-compare.sh turned a cone that stops at .ci/config
          # into "No such file or directory" three steps later (job 100795527686).
          sparse-checkout: |
            .github/actions
            .ci/config
            .ci/scripts

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN
            GITHUB_APP_ID > BWS_APP_ID
            CLOUDFLARE_ACCOUNT_ID > BWS_CLOUDFLARE_ACCOUNT_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Init account submodule
        run: git submodule update --init --depth 1 private/account

      - uses: ./.github/actions/setup-node-npm

      - name: Install wrangler
        run: |
          source .ci/config/constants.sh
          npm install -g "wrangler@${WRANGLER_VERSION}"

      - name: Reap stale migration-test D1 databases
        run: PYTHONPATH=.ci python3 -m rediacc_ci.housekeeping.cleanup_stale_d1 --max-age 60
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}

      - name: Test migrations against all regional clones (edge first, then stable)
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.test_d1_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.BWS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.BWS_CLOUDFLARE_ACCOUNT_ID }}

  test-unit:
    name: Unit
    # Checkout, with the private submodules on the readonly-preset App token.
    # No registry, no GitHub API.
    permissions:
      contents: read
    if: inputs.full_suite == 'true' && inputs.run_unit != 'false'
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: .ci/scripts/test/run-unit.sh --coverage

  test-e2e-workers:
    name: E2E Workers (${{ matrix.os-image }}, ${{ matrix.shard }}/8)
    # Logs into ghcr with github.token and PULLS only (the credential is then
    # copied to the root docker config so the test`s root-run rdc/renet pull
    # through it). Never pushes, so read rather than write.
    permissions:
      contents: read
      packages: read
    if: inputs.full_suite == 'true' && inputs.run_e2e_workers != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 18 # budget cap, deferral #153aace7 DEFAULT (measured max 15.0)
    strategy:
      fail-fast: false
      matrix:
        # T2.12 (PLAN-ci-time-budget): 8 legs per distro, from the committed
        # .ci/config/shards/test-e2e-workers.json (LPT by measured/estimated
        # per-file duration; the file's own `#part1/2/3` describe-group split
        # keeps 13-postgres-fork-isolation, the single heaviest file at 8.1m,
        # from forcing its leg over budget alone). `include:` below has no
        # `shard` key, so GitHub Actions merges `full-integration`/`cli-suite`
        # onto every shard of the two distros it names, exactly as before
        # sharding existed.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        os-image:
          - ubuntu-24.04
          - debian-13
          - fedora-43
          - opensuse-16.0
          - oracle-10
          # NOTE: rocky-10 intentionally excluded. RHEL 10's stock kernel
          # ships without the btrfs module and Rediacc's storage backend
          # requires btrfs; Oracle Linux 10 works because UEK retains btrfs.
          # Full explanation and operator guidance:
          #   packages/www/src/content/docs/en/requirements.md (Why UEK?)
          #   packages/www/src/content/docs/en/limits.md (Why not Rocky 10?)
          #   packages/www/src/content/docs/en/troubleshooting.md (btrfs module missing)
        include:
          # FULL_INTEGRATION legs: 12a/12b/12d (composition suites) + 13b (live
          # CRIU fork). Composition logic is distro-agnostic, so two legs are the
          # honest floor — one apt-family (ubuntu) + one rpm-family (fedora).
          # CRIU_EXPECTED=1 turns 13b's "CRIU absent" guard into a hard failure.
          #
          # CLI_SUITE (suite 23, the rdc-driven migrate-routing e2e) is NOT enabled
          # here yet: it needs a local two-worker validation of its exact argv +
          # machine-registration/SSH wiring first (plan phase 5). To turn it on,
          # add `cli-suite: '1'` to the ubuntu-24.04 leg below. Rationale +
          # local-run instructions in packages/e2e-tests/README.md.
          # cli-suite is declared EMPTY rather than omitted. An omitted matrix
          # property still resolves to "" in `${{ matrix.cli-suite }}`, so the
          # behaviour is identical -- but actionlint rightly flags a reference
          # to a property the matrix never declares, and silencing that check
          # would cost far more than it saves. Flipping the suite on is still a
          # one-character edit: change '' to '1' on the ubuntu leg.
          - os-image: ubuntu-24.04
            full-integration: '1'
            cli-suite: ''
          - os-image: fedora-43
            full-integration: '1'
            cli-suite: ''
          # Fresh-install coverage (PLAN-ci-prebaked-vm-images 2c): shard 2 of
          # every distro boots the STOCK image on every run and so still runs a
          # full `renet setup`; it holds 02-machine-setup. This entry names only
          # `shard`, so GitHub merges `stock-image` onto the five shard-2 legs.
          - shard: 2
            stock-image: '1'
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      # Kill switch for the baked images: 'off' sends every leg to the stock
      # image. A committed value, because GitHub variables are ruled out.
      VM_BAKE: 'on'
      VM_CEPH_NODES: ''
      VM_IMAGE: ${{ matrix.os-image }}
      FULL_INTEGRATION: ${{ matrix.full-integration }}
      CRIU_EXPECTED: ${{ matrix.full-integration }}
      CLI_SUITE: ${{ matrix.cli-suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # T2.3 (PLAN-ci-time-budget): started in the background here, joined
      # immediately before Setup KVM Host, so the cleanup overlaps the setup
      # work in between instead of blocking it in the foreground.
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      # `account: 'true'` was dropped here and in the seven other VM/E2E jobs
      # below. It made setup-workspace restore or install the THREE account npm
      # trees (private/account, its web, its e2e), and not one of these suites
      # ever touches them: packages/e2e-tests contains zero references to
      # private/account, and so do the .ci scripts these jobs run. So it was
      # pure setup cost, and worse than cost -- the account cache key hashes
      # the three account lockfiles, which dragged every account-side
      # dependency change into the invalidation surface of eight E2E jobs that
      # cannot be affected by one.
      #
      # test-account-e2e keeps it. That job runs run-account-e2e.sh against
      # private/account and genuinely needs all three trees.
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global

      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Pre-baked image (PLAN-ci-prebaked-vm-images 2b): pull the image for
      # this tree's bake key from ghcr.io/rediacc/ci-vm-bake into its own
      # disks dir. A hit exports REDIACC_OPS_DISKS_PATH, BAKED_IMAGE_KEY and
      # RENET_SETUP_OFFLINE=1, which the harness and the renet it spawns
      # inherit. Any miss (no package for the key, as on a PR that changes a
      # key input, or a failed pull) leaves hit != 'true' and the stock steps
      # below run exactly as before. Skipped on shard 2 (stock-image), on the
      # nightly schedule (all 40 legs on stock) and with VM_BAKE=off.
      # The fetch installs its pinned oras itself and exits 0 on every miss,
      # its own pull timeout (8 min) included, so no failure here ends the leg.
      # ghcr.io/rediacc/ci-vm-bake is private: without this login every pull
      # answers "unauthorized", a miss, and the leg silently runs stock forever.
      # oras reads the docker credential store the action writes.
      - name: Login to GHCR for the baked image
        if: matrix.stock-image != '1' && github.event_name != 'schedule' && env.VM_BAKE != 'off'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Fetch baked VM image
        id: bake
        if: matrix.stock-image != '1' && github.event_name != 'schedule' && env.VM_BAKE != 'off'
        timeout-minutes: 12
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.vm_bake_image fetch --distro "${{ matrix.os-image }}" --dest "$RUNNER_TEMP/renet/disks-baked"

      # VM base-image cache, one entry per matrix distro, used only when no
      # baked image was fetched. The disks dir is cached whole; since renet
      # e599aa3 it holds only the VM_IMAGE distro
      # (EnsureBaseImage used to fetch the Ubuntu default on every leg).
      # Monthly key: several of these URLs are moving
      # pointers. Restored before any sudo step touches $RUNNER_TEMP/renet so
      # extraction happens as the runner user.
      - name: Compute VM image cache key
        if: steps.bake.outputs.hit != 'true'
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-${{ matrix.os-image }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        if: steps.bake.outputs.hit != 'true'
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup

      - name: Create E2E Test Environment
        run: PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env --renet-path /usr/bin/renet --output packages/e2e-tests/.env

      - name: Run E2E Tests (Workers)
        # T2.12: shard 1 also carries the FULL_INTEGRATION-only composition
        # suites (12a/12b/12d/13b) on the two distros that set full-integration
        # -- they stay off the sharded plan (their own cost is unmeasured) and
        # ride whichever leg has the most headroom instead of a leg of their own.
        # Leg 1, not 7: on leg 7 (run for b45276a49) 12a's "new: create
        # repository" failed right after 06-daemon-operations on both
        # full-integration distros, while beside 13-postgres-fork-isolation and
        # 14 on leg 6 it had passed; leg 1 holds 01, 15 and 25 (.ci/config/shards/test-e2e-workers.json), kept free of 06.
        run: |
          ALSO=()
          if [[ "${{ matrix.full-integration }}" == '1' && "${{ matrix.shard }}" == '1' ]]; then
            ALSO=(--also "12a-full-integration-repository.test.ts,12b-full-integration-checkpoint.test.ts,12d-full-integration-multi-machine.test.ts,13b-live-fork-checkpoint.test.ts")
          fi
          .ci/scripts/test/run-e2e.sh --workers 1 --fail-on-skip \
            --shard-manifest .ci/config/shards/test-e2e-workers.json --shard "${{ matrix.shard }}/8" \
            "${ALSO[@]}"

      # On failure, each VM's libvirt state, console and guest journal go into the upload below (see the collector's docstring).
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics

      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "e2e-workers-${{ matrix.os-image }}-s${{ matrix.shard }}" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-workers-${{ matrix.os-image }}-s${{ matrix.shard }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
            packages/e2e-tests/reports/bridge/
            packages/e2e-tests/reports/bridge-logs/
          retention-days: 3
          if-no-files-found: ignore

      # T1.6 (PLAN-ci-time-budget): per-spec-file durations, for budget_report.py
      # --refresh (T3.2) to read. A dedicated, separately-named upload rather than
      # folding into the artifact above: budget_report.py matches an artifact by
      # the `unit-durations-<lane>-` NAME PREFIX alone, and this leg's own
      # run-e2e.sh writes one `unit-durations*.json` per `npx playwright test`
      # invocation it starts (see run-e2e.sh's own T1.6 comment) -- all of them are
      # globbed into this one artifact, and parse_unit_duration_artifact sums the
      # durations of same-named units across every member it finds.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-durations-test-e2e-workers-${{ matrix.os-image }}-s${{ matrix.shard }}-${{ github.sha }}
          path: packages/e2e-tests/reports/bridge-logs/unit-durations*.json
          retention-days: 3
          if-no-files-found: ignore

      # ops up runs unprivileged here (the harness spawns renet directly), so
      # the chown is normally a no-op — kept for parity with the other cached
      # jobs and as a guard should the harness ever run under sudo.
      - name: Fix VM image ownership for cache save
        if: always() && steps.bake.outputs.hit != 'true'
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      # The save guard: a baked leg never saves. Its restore step was skipped,
      # so cache-hit is empty, and without the hit test it would save an empty
      # $RUNNER_TEMP/renet/disks under the stock key.
      - name: Save VM base image cache
        if: always() && steps.bake.outputs.hit != 'true' && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  test-e2e-ceph:
    name: E2E Ceph
    # Logs into ghcr with github.token and PULLS only (the credential is then
    # copied to the root docker config so the test`s root-run rdc/renet pull
    # through it). Never pushes, so read rather than write.
    permissions:
      contents: read
      packages: read
    if: inputs.full_suite == 'true' && inputs.run_e2e_ceph != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: ''
      VM_CEPH_NODES: '21 22 23'
      CEPH_MODE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # T2.3 (PLAN-ci-time-budget): started in the background here, joined
      # immediately before Setup KVM Host, so the cleanup overlaps the setup
      # work in between instead of blocking it in the foreground.
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      # No CLI build or global `rdc` install here (spec W, PLAN-ci-time-budget).
      # The Ceph suites drive renet over SSH through BridgeTestRunner, and the only consumer of the CLI bundle or `rdc` on PATH is CliRunner, which no suite under tests/ceph imports.
      # The E2E Workers jobs keep both steps.

      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Same VM base-image cache as the E2E Workers ubuntu leg: this job
      # sets no VM_IMAGE, so it downloads only the Ubuntu default image and
      # can share that cache entry (same key, same disks-dir path).
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup

      - name: Create E2E Test Environment
        run: PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env --ceph --renet-path /usr/bin/renet --output packages/e2e-tests/.env

      - name: Run E2E Tests (Ceph)
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.ceph.config.ts --fail-on-skip

      # On failure, each VM's libvirt state, console and guest journal go into the upload below (see the collector's docstring).
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics

      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "e2e-ceph" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-ceph-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
            packages/e2e-tests/reports/bridge-ceph/
            packages/e2e-tests/reports/bridge-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  # Combined workers + Ceph topology: a worker consuming a Ceph RBD datastore
  # (suite 13) and multi-client read-only RBD + per-client COW (suite 14). Fits
  # a 16 GB runner via per-role RAM (bridge 1024 + 2x2560 worker + 2x2560 ceph =
  # 10.9 GB) and a lowered osd_memory_target (~1.6 GB, PBKDF2/FastKDF since
  # renet #78 removed the old 4 GB LUKS-unlock floor). 2 Ceph OSDs (not 3):
  # SetPoolDefaultsForTopology pins pool size/min_size for sub-3-OSD topologies,
  # and neither suite 13 nor 14 asserts a 3-OSD count or size=3 (spec W L4).
  test-e2e-ceph-workers:
    name: E2E Ceph Workers
    # Logs into ghcr with github.token and PULLS only (the credential is then
    # copied to the root docker config so the test`s root-run rdc/renet pull
    # through it). Never pushes, so read rather than write.
    permissions:
      contents: read
      packages: read
    if: inputs.full_suite == 'true' && inputs.run_e2e_ceph_workers != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 18 # budget cap, deferral #153aace7 DEFAULT (measured max 15.1)
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      VM_CEPH_NODES: '21 22'
      CEPH_MODE: 'true'
      VM_RAM_WORKER: '2560'
      VM_RAM_CEPH: '2560'
      CEPH_OSD_MEMORY_TARGET: '1717986918'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # T2.3 (PLAN-ci-time-budget): started in the background here, joined
      # immediately before Setup KVM Host, so the cleanup overlaps the setup
      # work in between instead of blocking it in the foreground.
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global

      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Same VM base-image cache as the E2E Workers ubuntu leg: this job sets
      # no VM_IMAGE, so it downloads only the Ubuntu default image and can share
      # that cache entry (same key, same disks-dir path).
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup

      # Explicit --vm-workers AND --vm-ceph-nodes (NOT --ceph, which zeroes
      # workers). Per-role RAM + osd_memory_target are passed through so the
      # combined topology fits the runner.
      - name: Create E2E Test Environment
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env \
            --renet-path /usr/bin/renet \
            --output packages/e2e-tests/.env \
            --vm-workers "11 12" \
            --vm-ceph-nodes "21 22" \
            --vm-ram-worker "$VM_RAM_WORKER" \
            --vm-ram-ceph "$VM_RAM_CEPH" \
            --ceph-osd-memory-target "$CEPH_OSD_MEMORY_TARGET"

      - name: Run E2E Tests (Ceph Workers)
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.ceph-workers.config.ts --fail-on-skip

      # On failure, each VM's libvirt state, console and guest journal go into the upload below (see the collector's docstring).
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics

      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "e2e-ceph-workers" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-ceph-workers-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
            packages/e2e-tests/reports/bridge-ceph-workers/
            packages/e2e-tests/reports/bridge-ceph-workers-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  # ============================================================================
  # NON-APT CEPH AND GPU (PLAN-renet-ceph-gpu-non-apt.md, box P6, decision D6)
  # renet installs the pinned Ceph client with dnf and zypper too. Three jobs
  # prove it, and they run on the nightly schedule (and its rehearsal dispatch)
  # and on a pull request only when it touches a watched path: the Ceph/GPU
  # renet files, the pin, or the matrix script (renet_pkg_matrix.py's
  # CONSOLE_PATHS and RENET_PATHS), or when the PR carries the `full-ci` label.
  # They do not read the scope engine's run_* inputs: their own path filter is
  # narrower than any of its surfaces, and keeping the ubuntu E2E Ceph Workers
  # key's greenlight evidence to that one job is what lets it still greenlight.
  # ============================================================================

  # One cheap decision for both jobs below. On a pull request it diffs the
  # merge commit against its first parent and, when the private/renet pointer
  # moved, the submodule between the two pointers; every other event is a hit.
  renet-pkg-scope:
    name: Renet pkg scope
    permissions:
      contents: read
    if: inputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.scope.outputs.hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest
      - name: Fetch secrets from Bitwarden
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        if: github.event_name == 'pull_request'
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      # Depth 2: the merge commit and its base parent. The token stays in the
      # submodule's config so the scope step can fetch the base's renet pointer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Decide the Renet pkg scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.renet_pkg_matrix scope --event "$EVENT_NAME" --labels "$PR_LABELS"

  # One container per distro: the renet built here is mounted into it and
  # renet_pkg_matrix.py runs `renet ceph install` for three profiles, the
  # installed-version, podman and lock checks, the drift check (the pinned
  # build still resolves from its repository: OBS keeps only its latest build,
  # plan D2), on the nightly the OBS upstream check (opensuse-16.0 only), and
  # the GPU resolve-only installs. Rocky 10 and CentOS Stream 10 have no btrfs,
  # so this is the only CI proof they get.
  renet-pkg-matrix:
    name: Renet pkg matrix (${{ matrix.distro }})
    # Docker Hub only (Bitwarden credentials), never ghcr, so no packages
    # scope. Submodules ride the readonly-preset App token.
    permissions:
      contents: read
    needs: [renet-pkg-scope]
    if: needs.renet-pkg-scope.outputs.hit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        distro:
          - fedora-43
          - oracle-10
          - rocky-10
          - centos-stream-10
          - opensuse-16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest
      - name: Fetch secrets from Bitwarden
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # Three of the five images come from Docker Hub.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      # A plain static `go build`, not build_renet: these flows need no
      # embedded assets, and a static binary runs in every container's libc.
      # Never uploaded (console is public).
      - name: Build renet
        working-directory: private/renet
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/renet" ./cmd/renet
      # EVENT_NAME is the CALLER's event (a reusable workflow inherits ci.yml's
      # github context). The zypper leg's upstream check (OBS origin primary vs
      # the Leap pin) runs only on `schedule`, so an OBS rebuild reddens the
      # nightly and never an unrelated PR; every other event prints a SKIP line.
      - name: Run the package matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.renet_pkg_matrix run --distro "${{ matrix.distro }}" --renet "$RUNNER_TEMP/renet" --event "$EVENT_NAME"

  # E2E Ceph Workers on the three non-apt distros with btrfs kernels: Ceph-only
  # node prep, Docker CE on the Ceph-only nodes, the client install on the
  # workers and the full suite. A SIBLING of test-e2e-ceph-workers rather than
  # a matrix on it, so the ubuntu job keeps its exact display name and steps
  # (budget samples and the greenlight closure key on "E2E Ceph Workers").
  # "non-apt" keeps the name off skip-plan-reconcile.cjs's e2e_ceph_workers
  # match (the exact name, or the name followed by " ("): these legs follow
  # the path filter, not that scope key, and a planned-run key whose matching
  # leg skipped is a hard reconcile failure.
  # The VM base image cache is RESTORE-ONLY here, the same per-distro key E2E
  # Workers saves: the cache is over quota, and a miss downloads the stock
  # image rather than writing a new entry.
  test-e2e-ceph-workers-rpm:
    name: E2E Ceph Workers non-apt (${{ matrix.os-image }})
    # Logs into ghcr with github.token and PULLS only (the credential is then
    # copied to the root docker config so the test`s root-run rdc/renet pull
    # through it). Never pushes, so read rather than write.
    permissions:
      contents: read
      packages: read
    needs: [renet-pkg-scope]
    if: needs.renet-pkg-scope.outputs.hit == 'true'
    runs-on: ubuntu-latest
    # A named exemption from the 15-minute job budget, every matrix leg: p90 16
    # / timeout-minutes 20 (operator ruling #fc4f34f8, 2026-09-30). Measured
    # max 16.4 min.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os-image:
          - fedora-43
          - oracle-10
          - opensuse-16.0
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      VM_CEPH_NODES: '21 22'
      VM_IMAGE: ${{ matrix.os-image }}
      CEPH_MODE: 'true'
      VM_RAM_WORKER: '2560'
      VM_RAM_CEPH: '2560'
      CEPH_OSD_MEMORY_TARGET: '1717986918'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest
      - name: Fetch secrets from Bitwarden
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global
      # Restore-only, same key as ci-build-renet.yml and the other VM jobs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet
      # The stock image cache E2E Workers saves for this distro
      # (vm-base-image-e2e-<distro>-YYYY-MM). Restore only, never saved here.
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-${{ matrix.os-image }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}
      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait
      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup
      - name: Create E2E Test Environment
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env \
            --renet-path /usr/bin/renet \
            --output packages/e2e-tests/.env \
            --vm-workers "11 12" \
            --vm-ceph-nodes "21 22" \
            --vm-ram-worker "$VM_RAM_WORKER" \
            --vm-ram-ceph "$VM_RAM_CEPH" \
            --ceph-osd-memory-target "$CEPH_OSD_MEMORY_TARGET"
      - name: Run E2E Tests (Ceph Workers)
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.ceph-workers.config.ts --fail-on-skip
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics
      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "e2e-ceph-workers-${{ matrix.os-image }}" --status ${{ job.status }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-ceph-workers-${{ matrix.os-image }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
            packages/e2e-tests/reports/bridge-ceph-workers/
            packages/e2e-tests/reports/bridge-ceph-workers-logs/
          retention-days: 3
          if-no-files-found: ignore

  test-e2e-k8s:
    name: E2E K8s
    # Logs into ghcr with github.token and PULLS only (the credential is then
    # copied to the root docker config so the test`s root-run rdc/renet pull
    # through it). Never pushes, so read rather than write.
    permissions:
      contents: read
      packages: read
    if: inputs.full_suite == 'true' && inputs.run_e2e_k8s != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11'
      VM_CEPH_NODES: ''
      K8S_MODE: '1'
      VM_RAM_WORKER: '4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # T2.3 (PLAN-ci-time-budget): started in the background here, joined
      # immediately before Setup KVM Host, so the cleanup overlaps the setup
      # work in between instead of blocking it in the foreground.
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global

      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Same Ubuntu VM base-image cache as the E2E Workers ubuntu leg (no
      # VM_IMAGE set -> Ubuntu default image, same key + disks-dir path).
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup

      # Single worker, no Ceph: a k8s repo runs a self-contained k3s inside a
      # datastore-backed image. VM_RAM_WORKER=4096 gives k3s + a workload pod room.
      - name: Create E2E Test Environment
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env \
            --renet-path /usr/bin/renet \
            --output packages/e2e-tests/.env \
            --vm-workers "11" \
            --vm-ram-worker "$VM_RAM_WORKER"

      - name: Run E2E Tests (K8s)
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.k8s.config.ts --fail-on-skip

      # On failure, each VM's libvirt state, console and guest journal go into the upload below (see the collector's docstring).
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics

      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "e2e-k8s" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-k8s-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
            packages/e2e-tests/reports/bridge-k8s/
            packages/e2e-tests/reports/bridge-k8s-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

