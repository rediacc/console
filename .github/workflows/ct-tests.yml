name: Console CT - Tests

on:
  workflow_call:
    inputs:
      renet_tag:
        type: string
        required: false
      web_tag:
        type: string
        required: false
      e2e_browsers:
        type: string
        required: false
        default: 'chromium'
      provision_vms:
        type: boolean
        required: false
        default: true
    secrets:
      APP_PRIVATE_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      ACCOUNT_ED25519_PRIVATE_KEY:
        required: false
      ACCOUNT_ED25519_PUBLIC_KEY:
        required: false
      ACCOUNT_SERVER_API_KEY:
        required: false
      ACCOUNT_JWT_SECRET:
        required: false
      STRIPE_SANDBOX_SECRET_KEY:
        required: false
      STRIPE_SANDBOX_WEBHOOK_SECRET:
        required: false

permissions:
  contents: read
  packages: read    # GHCR pull for test images

env:
  E2E_BROWSERS: ${{ inputs.e2e_browsers }}

jobs:
  # ============================================================================
  # COLUMN 4: TESTS + INFRA
  # Jobs: test-unit, test-e2e-workers, test-e2e-ceph, test-e2e-ceph-workers,
  #       test-e2e-k8s, test-e2e-k8s-ceph, test-e2e-k8s-multinode, test-e2e-migrate,
  #       test-fork-isolation, test-renet, test-account-e2e
  # ============================================================================
  test-unit:
    name: Unit
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: .ci/scripts/setup/install-deps.sh
      - run: .ci/scripts/setup/build-packages.sh
      - run: .ci/scripts/test/run-unit.sh --coverage

  test-e2e-workers:
    name: E2E Workers (${{ matrix.os-image }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os-image:
          - ubuntu-24.04
          - debian-13
          - fedora-43
          - opensuse-16.0
          - oracle-10
          # NOTE: rocky-10 intentionally excluded. RHEL 10's stock kernel
          # ships without the btrfs module and Rediacc's storage backend
          # requires btrfs; Oracle Linux 10 works because UEK retains btrfs.
          # Full explanation and operator guidance:
          #   packages/www/src/content/docs/en/requirements.md (Why UEK?)
          #   packages/www/src/content/docs/en/limits.md (Why not Rocky 10?)
          #   packages/www/src/content/docs/en/troubleshooting.md (btrfs module missing)
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      VM_CEPH_NODES: ''
      VM_IMAGE: ${{ matrix.os-image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Free Disk Space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h / || true
      - run: .ci/scripts/setup/install-deps.sh
      - run: .ci/scripts/setup/build-packages.sh
      - run: .ci/scripts/build/build-cli.sh
      - name: Install CLI Globally
        run: .ci/scripts/setup/install-cli-global.sh

      - name: Install clang for BPF compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        run: |
          pull_with_retry() {
            local image="$1"
            local platform="${2:-}"
            local args=""
            [ -n "$platform" ] && args="--platform $platform"
            for i in 1 2 3; do
              if docker pull $args "$image"; then
                return 0
              fi
              echo "Pull failed for $image $platform, retrying in $((i * 30))s..."
              sleep $((i * 30))
            done
            echo "Failed to pull $image $platform after 3 attempts"
            return 1
          }
          pull_with_retry debian:bookworm linux/amd64
          pull_with_retry debian:bookworm-slim linux/arm64
          pull_with_retry ubuntu:24.04 linux/amd64
          pull_with_retry ubuntu:24.04 linux/arm64
      - name: Build renet
        run: .ci/scripts/infra/build-renet.sh --nolicense
      - name: Install renet
        run: sudo cp $RENET_BINARY /usr/bin/renet && sudo chmod +x /usr/bin/renet

      - name: Free Disk Space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h / || true

      # VM base-image cache, one entry per matrix distro. The disks dir is
      # cached whole because every leg also downloads the Ubuntu default image
      # (prepareDriver runs EnsureBaseImage unconditionally) in addition to the
      # VM_IMAGE distro. Monthly key: several of these URLs are moving
      # pointers. Restored before any sudo step touches $RUNNER_TEMP/renet so
      # extraction happens as the runner user.
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-${{ matrix.os-image }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Setup KVM Host
        run: sudo $RENET_BINARY ops host setup

      - name: Create E2E Test Environment
        run: .ci/scripts/env/create-e2e-env.sh --renet-path /usr/bin/renet --output packages/e2e-tests/.env

      - name: Run E2E Tests (Workers)
        run: .ci/scripts/test/run-e2e.sh --workers 1

      - if: always()
        run: .ci/scripts/signal/create-complete.sh --name "e2e-workers-${{ matrix.os-image }}" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-workers-${{ matrix.os-image }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            packages/e2e-tests/reports/bridge/
            packages/e2e-tests/reports/bridge-logs/
          retention-days: 3
          if-no-files-found: ignore

      # ops up runs unprivileged here (the harness spawns renet directly), so
      # the chown is normally a no-op — kept for parity with the other cached
      # jobs and as a guard should the harness ever run under sudo.
      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  test-e2e-ceph:
    name: E2E Ceph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: ''
      VM_CEPH_NODES: '21 22 23'
      CEPH_MODE: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Free Disk Space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h / || true
      - run: .ci/scripts/setup/install-deps.sh
      - run: .ci/scripts/setup/build-packages.sh
      - run: .ci/scripts/build/build-cli.sh
      - name: Install CLI Globally
        run: .ci/scripts/setup/install-cli-global.sh

      - name: Install clang for BPF compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        run: |
          pull_with_retry() {
            local image="$1"
            local platform="${2:-}"
            local args=""
            [ -n "$platform" ] && args="--platform $platform"
            for i in 1 2 3; do
              if docker pull $args "$image"; then
                return 0
              fi
              echo "Pull failed for $image $platform, retrying in $((i * 30))s..."
              sleep $((i * 30))
            done
            echo "Failed to pull $image $platform after 3 attempts"
            return 1
          }
          pull_with_retry debian:bookworm linux/amd64
          pull_with_retry debian:bookworm-slim linux/arm64
          pull_with_retry ubuntu:24.04 linux/amd64
          pull_with_retry ubuntu:24.04 linux/arm64
      - name: Build renet
        run: .ci/scripts/infra/build-renet.sh --nolicense
      - name: Install renet
        run: sudo cp $RENET_BINARY /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Same VM base-image cache as the E2E Workers ubuntu leg: this job
      # sets no VM_IMAGE, so it downloads only the Ubuntu default image and
      # can share that cache entry (same key, same disks-dir path).
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Setup KVM Host
        run: sudo $RENET_BINARY ops host setup

      - name: Create E2E Test Environment
        run: .ci/scripts/env/create-e2e-env.sh --ceph --renet-path /usr/bin/renet --output packages/e2e-tests/.env

      - name: Run E2E Tests (Ceph)
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.ceph.config.ts

      - if: always()
        run: .ci/scripts/signal/create-complete.sh --name "e2e-ceph" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-ceph-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            packages/e2e-tests/reports/bridge-ceph/
            packages/e2e-tests/reports/bridge-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  # Combined workers + Ceph topology: a worker consuming a Ceph RBD datastore
  # (suite 13) and multi-client read-only RBD + per-client COW (suite 14). Fits
  # a 16 GB runner via per-role RAM (bridge 1024 + 2x2560 worker + 3x2560 ceph =
  # 13.5 GB) and a lowered osd_memory_target (~1.6 GB, PBKDF2/FastKDF since
  # renet #78 removed the old 4 GB LUKS-unlock floor).
  test-e2e-ceph-workers:
    name: E2E Ceph Workers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      VM_CEPH_NODES: '21 22 23'
      CEPH_MODE: 'true'
      VM_RAM_WORKER: '2560'
      VM_RAM_CEPH: '2560'
      CEPH_OSD_MEMORY_TARGET: '1717986918'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Free Disk Space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h / || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h / || true
      - run: .ci/scripts/setup/install-deps.sh
      - run: .ci/scripts/setup/build-packages.sh
      - run: .ci/scripts/build/build-cli.sh
      - name: Install CLI Globally
        run: .ci/scripts/setup/install-cli-global.sh

      - name: Install clang for BPF compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        run: |
          pull_with_retry() {
            local image="$1"
            local platform="${2:-}"
            local args=""
            [ -n "$platform" ] && args="--platform $platform"
            for i in 1 2 3; do
              if docker pull $args "$image"; then
                return 0
              fi
              echo "Pull failed for $image $platform, retrying in $((i * 30))s..."
              sleep $((i * 30))
            done
            echo "Failed to pull $image $platform after 3 attempts"
            return 1
          }
          pull_with_retry debian:bookworm linux/amd64
          pull_with_retry debian:bookworm-slim linux/arm64
          pull_with_retry ubuntu:24.04 linux/amd64
          pull_with_retry ubuntu:24.04 linux/arm64
      - name: Build renet
        run: .ci/scripts/infra/build-renet.sh --nolicense
      - name: Install renet
        run: sudo cp $RENET_BINARY /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Same VM base-image cache as the E2E Workers ubuntu leg: this job sets
      # no VM_IMAGE, so it downloads only the Ubuntu default image and can share
      # that cache entry (same key, same disks-dir path).
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Setup KVM Host
        run: sudo $RENET_BINARY ops host setup

      # Explicit --vm-workers AND --vm-ceph-nodes (NOT --ceph, which zeroes
      # workers). Per-role RAM + osd_memory_target are passed through so the
      # combined topology fits the runner.
      - name: Create E2E Test Environment
        run: |
          .ci/scripts/env/create-e2e-env.sh \
            --renet-path /usr/bin/renet \
            --output packages/e2e-tests/.env \
            --vm-workers "11 12" \
            --vm-ceph-nodes "21 22 23" \
            --vm-ram-worker "$VM_RAM_WORKER" \
            --vm-ram-ceph "$VM_RAM_CEPH" \
            --ceph-osd-memory-target "$CEPH_OSD_MEMORY_TARGET"

      - name: Run E2E Tests (Ceph Workers)
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.ceph-workers.config.ts

      - if: always()
        run: .ci/scripts/signal/create-complete.sh --name "e2e-ceph-workers" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-ceph-workers-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            packages/e2e-tests/reports/bridge-ceph-workers/
            packages/e2e-tests/reports/bridge-ceph-workers-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  test-e2e-k8s:
    name: E2E K8s
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11'
      VM_CEPH_NODES: ''
      K8S_MODE: '1'
      VM_RAM_WORKER: '4096'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/app-token
