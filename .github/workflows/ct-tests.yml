      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # T2.3 (PLAN-ci-time-budget): started in the background here, joined
      # immediately before Setup KVM Host, so the cleanup overlaps the setup
      # work in between instead of blocking it in the foreground.
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global

      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Add renet to PATH
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # VM base-image cache shared with the OPS Provision / E2E jobs. Key and
      # path MUST match those jobs exactly (`vm-base-image-e2e-ubuntu-24.04-<YYYY-MM>`
      # over the whole disks/ dir) or the same Ubuntu image is stored twice under
      # two keys, doubling its footprint in the 10GB/repo pool and hastening the
      # LRU eviction that forces live upstream re-downloads. Restored before any
      # sudo step touches $RUNNER_TEMP/renet so extraction happens as the runner user.
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup
      - name: Generate SSH keypair
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          cp ~/.ssh/id_ed25519 ~/.ssh/id_rsa
          cp ~/.ssh/id_ed25519.pub ~/.ssh/id_rsa.pub
      - name: Provision VM
        run: sudo -E "$RENET_BINARY" ops up --force --parallel
        env:
          VM_NET_BASE: ${{ env.VM_NET_BASE }}
          VM_WORKERS: '11'
          VM_CEPH_NODES: ''
          VM_BRIDGE: '1'
      - name: Fix renet data dir ownership
        run: sudo chown -R "$USER:$USER" "$RUNNER_TEMP/renet"
      - name: Wait for VM SSH readiness
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.wait_for_vm_ssh "${VM_NET_BASE}.1" "${VM_NET_BASE}.11"
      - name: Run concurrent-fork isolation test
        run: PYTHONPATH=.ci python3 -m rediacc_ci.private.concurrent_fork_isolation_test
        env:
          VM_NET_BASE: ${{ env.VM_NET_BASE }}
          VM_WORKERS: '11'

      # Curated-repo healthcheck convergence smoke test. Deploys
      # app-postgres on the worker and asserts the db container's
      # pg_isready healthcheck (probing localhost) reaches `healthy`.
      # Catches integration regressions that pure unit-level eBPF
      # tests can miss — the class of bug that hid nextcloud-talk's
      # 3-day silent failure.
      - name: Run compose healthcheck smoke test
        run: PYTHONPATH=.ci python3 -m rediacc_ci.private.compose_healthcheck_smoke_test
        env:
          VM_NET_BASE: ${{ env.VM_NET_BASE }}
          VM_WORKERS: '11'

      # On failure, each VM's libvirt state, console and guest journal go into the upload below (see the collector's docstring).
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics

      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "fork-isolation" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-fork-isolation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  # ============================================================================
  # RENET, split in two per PLAN-ci-time-budget T2.14: go tests (`go test`, unit +
  # subscription + root-privileged + BTRFS tiers) and integration tests (pytest,
  # `private/renet/scripts/ci-test.sh`), because the plan's own measurement is that
  # the go side (2.5-3.2 min) is NOT the long pole -- integration (12.9 min) is. A
  # single `test-renet` job sharded as one unit would have split the cheap half
  # and left the expensive half whole, so each half gets its own job and its own
  # shard manifest (`.ci/config/shards/test-renet-go.json`,
  # `.ci/config/shards/test-renet-integration.json`), matching the lane names
  # `scripts/ci-runner/lanes.ts`'s `TEST_LANE_WORKFLOWS` already reserves for them.
  #
  # LEG NAMES keep the `Renet (<kind>, <i>/<of>)` shape (plan section 5): the base
  # `Renet` is unchanged, so `.ci/scripts/ci/skip-plan-reconcile.cjs`'s
  # `renet: ['Tests + Infra / Renet']` entry still matches every leg under its
  # existing "equal, or starts with + ' ('" rule and needs no edit. It does NOT
  # cover `.ci/scripts/ci/greenlight.cjs`, whose `renet.jobNames` is an EXACT list
  # (`['Renet']` today) rather than a prefix match -- that file is not owned by
  # this box and needs `jobNames: ['Renet (go, 1/2)', 'Renet (go, 2/2)', 'Renet
  # (integration, 1/3)', 'Renet (integration, 2/3)', 'Renet (integration, 3/3)']`
  # (plus its own comment, which counts leaf display names), reported rather than
  # applied here.
  # ============================================================================
  test-renet-go:
    name: Renet (go, ${{ matrix.shard }}/2)
    # Docker Hub only (Bitwarden credentials), never ghcr, so no packages
    # scope. Submodules ride the readonly-preset App token.
    permissions:
      contents: read
    if: inputs.full_suite == 'true' && inputs.run_renet != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 2 legs from the committed .ci/config/shards/test-renet-go.json (83 `go
        # list ./pkg/... ./cmd/...` packages, round-robin). The subscription,
        # root-privileged and BTRFS tiers are each one indivisible setup rather
        # than a package list, so they are pinned to leg 1 below instead of
        # being split.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The first renet legs of the split (spec W T2.14) are profiled from day one; the pre-split test-renet job was on the shrink-only allowlist.
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      # Login to Docker Hub to avoid rate limiting
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json

      # Unit tests
      - name: Run renet tests
        env:
          # Declares that this job has no account server, so renet's
          # subscription system tests are expected NOT to run here. Without
          # this declaration run-tests.sh now FAILS rather than warning, because
          # a job that silently omits the only real-licence-issuance tests looks
          # exactly like one that ran and passed them.
          #
          # This job has no `services:` block and provisions no server; the
          # enforcing-licence coverage lives in the License Enforcement leg
          # below, against a per-run ephemeral key. Giving this job a real
          # account server is T1's remaining tier in
          # docs/config-universe-follow-up/03-testing-pillar.md.
          RENET_EXPECT_NO_ACCOUNT_SERVER: >-
            test-renet-go provisions no account server; real-issuance coverage is
            tracked as T1 tier 2 and the enforcing-binary path is covered by the
            License Enforcement job.
          # PLAN-ci-time-budget T2.14: the subscription/root-privileged/BTRFS
          # tiers are each one setup cost, not a package list -- paying it on
          # every leg would cost more than it saves, so only leg 1 runs them.
          RENET_TEST_EXTRA_TIERS: ${{ matrix.shard == 1 && 'true' || 'false' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.private.run_renet test --shard-manifest .ci/config/shards/test-renet-go.json --shard "${{ matrix.shard }}/2"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-renet-coverage-s${{ matrix.shard }}-${{ github.sha }}
          path: private/renet/coverage.out
          retention-days: 3
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-renet-results-s${{ matrix.shard }}-${{ github.sha }}
          path: private/renet/test-results.xml
          retention-days: 3
          if-no-files-found: ignore

      # T1.6 (PLAN-ci-time-budget): the SAME gotestsum junit file, uploaded a
      # second time under the `unit-durations-<lane>-` name budget_report.py
      # --refresh (T3.2) matches on -- the artifact above is named for a human
      # reading the Actions UI, not for T3.2's prefix match, so it needed a
      # sibling rather than a rename.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-durations-test-renet-go-s${{ matrix.shard }}-${{ github.sha }}
          path: private/renet/test-results.xml
          retention-days: 3
          if-no-files-found: ignore

      # eBPF isolation tests. PINNED TO LEG 1 (T2.14): not a package this
      # job's own shard manifest spreads across legs, so it runs once, not
      # twice.
      - name: Test eBPF
        if: matrix.shard == 1
        run: |
          cd private/renet
          sudo go test ./pkg/ebpf/ -v -timeout 60s

      # eBPF socket-isolation behavioral regression tests (ebpf_e2e tag). Loud-skip
      # guard + bpffs mount live in the script so it runs identically on a dev box.
      # Verified locally 2026-07-16: 5/5 pass once bpffs is mounted.
      # PINNED TO LEG 1 (T2.14), same reasoning as "Test eBPF" above.
      - name: Test eBPF socket isolation (ebpf_e2e)
        if: matrix.shard == 1
        run: sudo .ci/scripts/private/renet-ebpf-e2e.sh

      # Root-tagged renet repository state tests (SaveState/LoadState). They
      # t.Fatal off-root, so under sudo they must run and PASS.
      # Verified locally 2026-07-16: 3/3 pass.
      # PINNED TO LEG 1 (T2.14), same reasoning as "Test eBPF" above.
      - name: Test renet repository (root-tagged)
        if: matrix.shard == 1
        run: sudo .ci/scripts/private/renet-root-tests.sh

      # CSI driver conformance (csi-sanity, spec 09 §12) on a scratch loop-BTRFS
      # datastore. Two ruled deviations (spec 09 §16) stay red by design and are
      # skipped in the script. Verified locally 2026-07-16: 48/50 pass.
      # PINNED TO LEG 1 (T2.14), same reasoning as "Test eBPF" above.
      - name: Test renet CSI driver (csi-sanity conformance)
        if: matrix.shard == 1
        run: sudo .ci/scripts/private/renet-csi-sanity.sh

  test-renet-integration:
    name: Renet (integration, ${{ matrix.shard }}/3)
    # Docker Hub only (Bitwarden credentials), never ghcr, so no packages
    # scope. Submodules ride the readonly-preset App token.
    permissions:
      contents: read
    if: inputs.full_suite == 'true' && inputs.run_renet != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3 legs from the committed .ci/config/shards/test-renet-integration.json
        # (the pytest files under private/renet/tests/integration).
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The first renet legs of the split (spec W T2.14) are profiled from day one; the pre-split test-renet job was on the shrink-only allowlist.
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      # Login to Docker Hub to avoid rate limiting
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json

      # Integration tests (needs sudo for KVM). PLAN-ci-time-budget T2.14: this
      # leg's file list comes straight from the committed shard manifest --
      # `jq` (preinstalled on the runner image) reads this leg's `ids`, strips
      # the `renet-integration:` id prefix `scripts/ci-runner/unit-enumerators.ts`
      # (`renetIntegrationUnits`) puts on them, and hands the plain filenames to
      # `ci-test.sh` (via `.ci/scripts/private/renet-integration.sh`, unchanged)
      # as RENET_INTEGRATION_FILES. `sudo env VAR=... cmd`, not `sudo -E`: the
      # value is set directly on the command sudo execs, so nothing else in this
      # step's environment is exposed to the root-run script that was not
      # already reaching it before this box.
      - name: Run integration tests
        run: |
          FILES=$(jq -r --argjson idx "${{ matrix.shard }}" \
            '.legs[] | select(.index == $idx) | .ids | map(sub("^renet-integration:"; "")) | join(" ")' \
            .ci/config/shards/test-renet-integration.json)
          echo "Shard ${{ matrix.shard }}/3 files: $FILES"
          # sudo resets the environment, so the switches ride in explicitly. RENET_PYTEST_JUNIT=1 makes ci-test.sh write the --junit-xml the unit-durations and results uploads below read (before it, both found no file on every run). CI itself stays unset: under root it turns on LUKS/fstab Go integration tests this runner cannot pass. RENET_SKIP_GO_UNIT_TESTS=1: the Renet (go, i/2) legs already run ./pkg/..., so these legs do not repeat it.
          sudo env "RENET_PYTEST_JUNIT=1" "RENET_SKIP_GO_UNIT_TESTS=1" "RENET_INTEGRATION_FILES=$FILES" .ci/scripts/private/renet-integration.sh --no-cleanup

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-renet-integration-s${{ matrix.shard }}-${{ github.sha }}
          path: private/renet/test-results.xml
          retention-days: 3
          if-no-files-found: ignore

      # T1.6 (PLAN-ci-time-budget): the SAME pytest --junit-xml file (already
      # emitted by ci-test.sh's `--junit-xml=test-results.xml`, gated on `CI`,
      # which GitHub Actions sets by default), uploaded a second time under the
      # `unit-durations-<lane>-` name budget_report.py --refresh (T3.2) matches
      # on -- see the identical comment on test-renet-go, above.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-durations-test-renet-integration-s${{ matrix.shard }}-${{ github.sha }}
          path: private/renet/test-results.xml
          retention-days: 3
          if-no-files-found: ignore

  # ============================================================================
  # LICENSE ENFORCEMENT: prove a release-shaped renet really refuses unlicensed
  # work and really accepts a valid licence, against a key minted for this run.
  #
  # Every other leg in this file builds --nolicense, so the only licensing code
  # CI has ever executed is the stub in runtime_nolicense.go, which returns
  # success unconditionally for all three validators. renet's unit tests cover
  # the crypto negatives well but never execute cmd/renet, so nothing proved the
  # command wiring, the ldflags key injection, or the exit-10 contract.
  #
  # DELIBERATELY UNLIKE ITS SIBLINGS, and each omission was measured:
  #   - no embed-assets cache. pkg/embed/assets is gitignored, and a fresh
  #     checkout carries the committed .gitkeep placeholders that keep the
  #     `//go:embed assets/<arch>/base/*` patterns matching. Proven in a
  #     throwaway git worktree: the enforcing binary links in 4.6s at 44MB with
  #     no payload staged, against 233MB with it. Nothing here reads an embedded
  #     asset.
  #   - no Docker Hub login, no VM, no BTRFS, no LUKS. The licence gate fires
  #     before any storage work, so acceptance shows up as renet getting past
  #     the gate and then failing at the same later point an unlicensed twin
  #     fails at.
  # Whole battery measured at ~11s locally against an asset-free checkout.
  #
  # `sudo` is required only to install the licence fixtures: RepoLicenseDir is
  # the hardcoded /var/lib/rediacc/license/repos with no env override.
  # ============================================================================
  test-license-enforcement:
    name: License Enforcement
    # Checkout, with the private submodules on the readonly-preset App token.
    # No registry, no GitHub API.
    permissions:
      contents: read
    if: inputs.full_suite == 'true' && inputs.run_license_enforcement != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          # Both module graphs: renet's, and the mint tool's own (it imports the
          # real pkg/license and pkg/subscription through a replace directive so
          # the licence payload cannot drift from the verifier).
          cache-dependency-path: |
            private/renet/go.sum
            .ci/scripts/private/license-mint/go.sum

      # The script IS the local-dev entry point; there is no CI-only variant to
      # drift from. It mints its own throwaway key when ACCOUNT_ED25519_PUBLIC_KEY
      # is unset, which is the case here on purpose: no production key is
      # involved, and nothing it signs outlives the job.
      - name: Run the license enforcement battery
        run: .ci/scripts/private/license-e2e.sh

  # ============================================================================
  # ACCOUNT E2E: Full Playwright E2E tests for the account portal
  # Spins up account server + RustFS via Docker, runs Playwright tests
  # ============================================================================
  test-account-e2e:
    name: Account E2E (${{ matrix.shard }}/4)
    # Checkout, with the private submodules on the readonly-preset App token.
    # No registry, no GitHub API.
    permissions:
      contents: read
    if: inputs.full_suite == 'true' && inputs.run_account_e2e != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # T2.13 (PLAN-ci-time-budget): 4 legs from the committed
        # .ci/config/shards/test-account-e2e.json. Leg 1 carries the 10-stripe
        # mutex unit (only that leg starts `stripe listen`) and leg 2 carries
        # the @webauthn coverage-floor bundle; run-account-e2e.sh derives both
        # from the leg's actual file list rather than trusting these numbers,
        # so this comment is documentation, not a contract the script relies on.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ACCOUNT_ED25519_PRIVATE_KEY > BWS_ACCOUNT_ED25519_PRIVATE_KEY
            ACCOUNT_ED25519_PUBLIC_KEY > BWS_ACCOUNT_ED25519_PUBLIC_KEY
            ACCOUNT_JWT_SECRET > BWS_ACCOUNT_JWT_SECRET
            ACCOUNT_SERVER_API_KEY > BWS_ACCOUNT_SERVER_API_KEY
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            STRIPE_SANDBOX_WEBHOOK_SECRET > BWS_STRIPE_SANDBOX_WEBHOOK_SECRET
            GITHUB_APP_ID > BWS_APP_ID
            ROOT_EMAIL > BWS_ROOT_EMAIL
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
      - run: npm run build:packages
      # T2.13 cache half (PLAN-ci-time-budget): setup-workspace's own cache-root/
      # cache-account steps already cover the three `npm ci` trees this job needs
      # (root, private/account, private/account/web, private/account/e2e) --
      # that mechanism predates this box. What was still uncached, and paid four
      # times over (once per shard), is Playwright's own browser download:
      # run-account-e2e.sh's `npx playwright install "$browser"` writes into
      # `~/.cache/ms-playwright` and re-downloads it from scratch on every leg
      # with no cache. Keyed on the e2e lockfile, which is what pins
      # `@playwright/test` (and so the browser build playwright installs) --
      # a version bump there changes the hash and forces a fresh download,
      # exactly as intended. All four shards share one key: a Playwright
      # version does not vary by shard, matching this file's own
      # renet-embed-assets cache, which is likewise shared across several
      # concurrent jobs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('private/account/e2e/package-lock.json') }}
      - name: Install Stripe CLI
        # Leg 1 holds the 10-stripe mutex unit (test-account-e2e.json); the
        # other three never call `stripe`, so skipping the install there is a
        # pure time saving -- run-account-e2e.sh's own file-derived check is
        # what actually keeps a second `stripe listen` off the sandbox.
        if: env.STRIPE_SANDBOX_SECRET_KEY != '' && matrix.shard == 1
        run: |
          # -f, and retries: `-s` alone makes an HTTP error SILENT and pipes the
          # error page into gpg, and a single attempt makes one network blip a
          # hard job failure. Same class as the sm-action download that killed
          # run 33753814832.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 \
            https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          # Pinned: an unpinned install pulled 1.52.0, whose `stripe listen` refuses to start without an event selector, and broke this leg silently (run 36288155344). A bump is a deliberate edit here, with run-account-e2e.sh checked against the new CLI.
          sudo apt-get update -qq && sudo apt-get install -y -qq stripe=1.52.0
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ env.BWS_STRIPE_SANDBOX_SECRET_KEY }}
      - name: Run Account Portal E2E tests
        run: .ci/scripts/test/run-account-e2e.sh --shard-manifest .ci/config/shards/test-account-e2e.json --shard "${{ matrix.shard }}/4"
        env:
          ACCOUNT_ED25519_PRIVATE_KEY: ${{ env.BWS_ACCOUNT_ED25519_PRIVATE_KEY }}
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ env.BWS_ACCOUNT_ED25519_PUBLIC_KEY }}
          ACCOUNT_SERVER_API_KEY: ${{ env.BWS_ACCOUNT_SERVER_API_KEY }}
          ACCOUNT_JWT_SECRET: ${{ env.BWS_ACCOUNT_JWT_SECRET }}
          ROOT_EMAIL: ${{ env.BWS_ROOT_EMAIL }}
          STRIPE_SANDBOX_SECRET_KEY: ${{ env.BWS_STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ env.BWS_STRIPE_SANDBOX_WEBHOOK_SECRET }}
      - name: Upload E2E report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: account-e2e-report-s${{ matrix.shard }}-${{ github.sha }}
          path: |
            private/account/e2e/reports/e2e/
            private/account/e2e/test-results/
          retention-days: 3

      # T1.6 (PLAN-ci-time-budget): per-spec-file durations, for budget_report.py
      # --refresh (T3.2) to read. A SEPARATE step from "Upload E2E report" above
      # (that one is `if: failure()`, kept narrow on purpose) because T3.2 samples
      # GREEN runs only, so the run this artifact needs to exist on is exactly the
      # one the failure-only upload would skip. Playwright's own `json` reporter
      # (private/account/e2e/playwright.config.ts) writes results.json whether the
      # run passed or failed, so `always()` + `ignore` here only covers a crash
      # before Playwright ever started.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: unit-durations-test-account-e2e-s${{ matrix.shard }}-${{ github.sha }}
          path: private/account/e2e/reports/e2e/results.json
          retention-days: 3
          if-no-files-found: ignore

  # ============================================================================
  # DRILLS: the two headless campaign drills (`./run.sh drill <name>`), which
  # until now only ever ran on an operator's box.
  #
  #   universe  the config-as-a-universe battery: source labels, --config vs
  #             REDIACC_CONFIG precedence, cross-config isolation asserted by
  #             md5, per-config token files created and removed by login/logout.
  #             42 assertions, 31s locally.
  #   transfer  the config-storage battery: seed-on-enable, offline read from
  #             the encrypted cache with the staleness warning on STDERR, the
  #             fail-CLOSED write, and a second device enrolling through the
  #             password slot over the real two-factor challenge.
  #             33 assertions, 32s locally.
  #
  # WHY A JOB AND NOT A GATE. Both drive the REAL `./rdc.sh` against a REAL
  # `./run.sh account dev` gateway and assert on its stdout/stderr separately.
  # That is precisely the surface unit tests cannot see, and it is the surface
  # both drills were written to catch defects in (each one's header names the
  # bugs it found). Nothing in CI executed either of them before this leg.
  #
  # COST. No VMs, no privileged operations. The two drills themselves are ~65s;
  # the wall time is dominated by the gateway (each drill restarts it, because
  # tsx does not hot-reload) and by the renet build `./rdc.sh` performs before
  # it will run anything.
  #
  # THE RENET BUILD IS NOT OPTIONAL, and it is why this leg carries the Go
  # toolchain and the embed-assets cache it otherwise would not need: `rdc.sh`
  # calls ensure_renet_built unconditionally (rdc.sh:188), which runs
  # `build.sh dev` -> embed_assets. With the cache warm the receipt check makes
  # staging a verified no-op; on a miss it falls back to the Docker extraction,
  # which is what the 30-minute budget covers. Same key as ci-build-renet.yml,
  # restore-only: this leg must not be the writer of a cache the VM legs depend
  # on. Neither drill touches renet.
  #
  # DOCKER is a REAL prerequisite, not a nicety: `drill transfer` needs the
  # RustFS container `./run.sh account dev` starts, because the config store is
  # backed by it. Without Docker that drill fails fast rather than reporting a
  # green that skipped everything (transfer.sh:26-30).
  #
  # NO ACCOUNT SECRETS. Locally `./run.sh account dev` binds the DEV keys from
  # Bitwarden (`bws_env exec --profile account-dev`); this leg instead mints a
  # throwaway ed25519/x25519 pair, API key and JWT secret into the job
  # environment (`rediacc_ci.core.account mint-dev-keys`), and the shell wins, so
  # no store fetch happens. It needs the app token for the submodules and nothing else.
  # ============================================================================
  test-drills:
    name: Drills
    # Docker Hub only (Bitwarden credentials), never ghcr, so no packages
    # scope. Submodules ride the readonly-preset App token.
    permissions:
      contents: read
    if: inputs.full_suite == 'true' && inputs.run_drills != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      # account: the drills log in against `./run.sh account dev`, which serves
      # the gateway from private/account and the portal from private/account/web.
      - uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          natives: 'true'
          build-packages: 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      # Only reached on an embed-assets cache miss, where staging pulls the
      # renet image. Anonymous pulls are rate-limited; a 429 here would read as
      # a drill failure.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}

      # Each drill restarts the gateway itself (drill_gateway_restart), so the
      # two runs are independent and the second is not measuring the first's
      # server. `set -o pipefail` is load-bearing: GitHub runs `bash -e`, not
      # `-eo pipefail`, so without it `tee` would swallow a red drill.
      # `--keep-work` is load-bearing for the collector below, and an env var
      # cannot replace it: lib.sh assigns DRILL_KEEP_WORK=0 at script level,
      # overwriting anything inherited, so only the flag survives. Without it
      # drill_teardown rm -rf's the work dir on EXIT and the gateway log is gone
      # before any later step can read it. The runner is ephemeral, so keeping
      # the dir costs nothing.
      - name: Mint throwaway dev account keys
        # Into $GITHUB_ENV, so every drill step (and every gateway restart inside
        # one) signs with the same key and bakes the same public key into renet.
        # Prints the six NAMES only.
        run: PYTHONPATH=.ci python3 -m rediacc_ci.core.account mint-dev-keys

      - name: drill universe
        run: |
          set -o pipefail
          ./run.sh drill universe --keep-work 2>&1 | tee "$RUNNER_TEMP/drill-universe.log"

      # DECLARED, not skipped silently. Every phase of this drill enrolls a
      # device, and enrollment writes its slot secret to the OS keyring
      # (secure-storage.ts uses keyctl @u, for the password method as much as for
      # passkeys). A runner job has no accessible session keyring, so the CLI
      # fails with `keyctl_read_alloc: Permission denied` four assertions deep
      # and blames the config store. Without this declaration the drill REDS
      # rather than passing quietly — that is the point of the variable.
      - name: drill transfer
        env:
          DRILL_EXPECT_NO_KEYRING: >-
            GitHub runners give the job no accessible session keyring, so
            keyctl @u is unwritable and device enrollment cannot run here
        run: |
          set -o pipefail
          ./run.sh drill transfer --keep-work 2>&1 | tee "$RUNNER_TEMP/drill-transfer.log"

      # The chunk-store backup drill: session mint from a licence blob, the
      # quota boundary, lease accounting, idempotent commit, the delete-free
      # grant, a point-in-time restore read THROUGH A READ GRANT, and the
      # 60-day retain-on-cancel promise. 86 assertions, 19s locally.
      #
      # Added after the drill was run green end to end locally, never before:
      # a drill nobody has seen pass is indistinguishable from a broken one.
      # Running it is also what found the defect it now guards — a
      # backup-intent session could mint a READ grant, which handed an uploader
      # back the read authority the write/read action split had just removed.
      - name: drill backup
        run: |
          set -o pipefail
          ./run.sh drill backup --keep-work 2>&1 | tee "$RUNNER_TEMP/drill-backup.log"

      - name: collect drill diagnostics
        if: failure()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_drill_diagnostics

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: test-drills-${{ github.sha }}
          path: |
            ${{ runner.temp }}/drill-universe.log
            ${{ runner.temp }}/drill-transfer.log
            ${{ runner.temp }}/drill-backup.log
            ${{ runner.temp }}/drill-diagnostics
          retention-days: 3
          if-no-files-found: ignore
