        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  test-e2e-k8s-multinode:
    name: E2E K8s Multinode
    # Logs into ghcr with github.token and PULLS only (the credential is then
    # copied to the root docker config so the test`s root-run rdc/renet pull
    # through it). Never pushes, so read rather than write.
    permissions:
      contents: read
      packages: read
    if: inputs.full_suite == 'true' && inputs.run_e2e_k8s_multinode != 'false'
    runs-on: ubuntu-latest
    # 100 -> 30: a named exemption from the 15-minute job budget, p90 25 /
    # timeout-minutes 30 (Exemption caps 2026-09-28, #d5ba825c; D-W3 keeps
    # kube/17-multinode-cluster whole). Measured max 27.1 min since 2026-09-28.
    timeout-minutes: 30
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      VM_CEPH_NODES: '21 22 23'
      K8S_MODE: '1'
      VM_RAM_WORKER: '3072'
      VM_RAM_CEPH: '2560'
      CEPH_OSD_MEMORY_TARGET: '1717986918'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      # T2.3 (PLAN-ci-time-budget): started in the background here, joined
      # immediately before Setup KVM Host, so the cleanup overlaps the setup
      # work in between instead of blocking it in the foreground.
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      # `account: 'true'` is BACK here, and only here, of the eight VM/E2E jobs
      # the comment above test-e2e-workers stripped it from. That comment's
      # reason was that no E2E suite touches private/account -- true when it was
      # written, and no longer true for this job: the cluster-licensing suite
      # (24) needs a real account server, which the step below starts from
      # private/account. The cost the comment names is real and accepted here:
      # this job's setup cache key now hashes the three account lockfiles, so an
      # account-side dependency change invalidates it. That is the honest
      # dependency, not an accident.
      - uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global

      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      # Same Ubuntu VM base-image cache as the E2E Workers ubuntu leg (no
      # VM_IMAGE set -> Ubuntu default image, same key + disks-dir path).
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-ubuntu-24.04-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup

      # Multi-node k8s topology (2 k3s workers = server + agent, 3 ceph nodes).
      # Explicit
      # --vm-workers AND --vm-ceph-nodes (NOT --ceph, which zeroes workers);
      # per-role RAM + osd_memory_target keep the 14.5G fleet inside the runner.
      - name: Create E2E Test Environment
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env \
            --renet-path /usr/bin/renet \
            --output packages/e2e-tests/.env \
            --vm-workers "11 12" \
            --vm-ceph-nodes "21 22 23" \
            --vm-ram-worker "$VM_RAM_WORKER" \
            --vm-ram-ceph "$VM_RAM_CEPH" \
            --ceph-osd-memory-target "$CEPH_OSD_MEMORY_TARGET"

      # Suite 24's ACCOUNT tier: an account server and a subscription token, no
      # VMs. Its assertions are all pre-flight refusals (`assertMachineSlotsAvailable`
      # runs BEFORE anything is provisioned), so the whole tier costs a server
      # start and spends nothing on the fleet.
      #
      # LOUD, NEVER SKIPPED. The script exits non-zero with the server log
      # attached on every path that does not produce a token, and suite 24's own
      # `declaredSkip` gate turns an unsatisfied ACCOUNT tier into a RED test
      # rather than a skip. There is no arrangement here where the tier silently
      # does not run.
      - name: Start account server for the cluster-licensing suite
        run: .ci/scripts/test/start-account-for-e2e.sh --port 4900

      # --grep-invert excludes suite 24's VM TIER by its describe title, and the
      # reason is not squeamishness about cost:
      #
      #   * that tier adopts an EXISTING cluster named by E2E_CLUSTER_NAME. The
      #     only cluster this job builds is suite 17's `mnprod`, which suite 17's
      #     last test and its afterAll tear down completely (kube uninstall,
      #     datastore detach + delete, ceph pool delete). By the time project
      #     `k8s-multinode-24` runs there is nothing to adopt.
      #   * suite 17 builds it through raw `renet` over the bridge, so no rdc
      #     config ever holds a `clusters` entry for it; `cluster fork mnprod`
      #     could not resolve it even if the cluster still stood.
      #   * every renet on this fleet is built --nolicense, so the on-machine
      #     licence blobs its test 1 asserts on do not exist by construction.
      #
      # E2E_EXPECT_NO_CLUSTER_VMS is set anyway, and the pair is deliberate:
      # --grep-invert keeps the tier out of the RUN (a declared skip would still
      # be a skip, and --fail-on-skip forbids those), while the declaration makes
      # the omission loud on stderr and keeps the suite fail-closed if the grep
      # is ever removed.
      - name: Run E2E Tests (K8s Multinode)
        env:
          # Lights project `k8s-multinode-24` in playwright.k8s-multinode.config.ts.
          CLUSTER_LICENSING_SUITE: '1'
          E2E_EXPECT_NO_CLUSTER_VMS: >-
            suite 17 tears its cluster down in its own last test, and this fleet
            runs --nolicense renet, so there is no licensed cluster to adopt;
            the VM tier is excluded from the run rather than skipped inside it.
        # ONE LINE, deliberately. check-e2e-coverage's registry self-check scans
        # workflows line by line and only pairs a `--config` with a `run-e2e.sh`
        # on the SAME line; folding this across lines makes it read the call as a
        # bare default-config invocation and fail with "playwright.k8s-multinode
        # .config.ts is in LIVE_CONFIG_REGISTRY but NO workflow runs it".
        run: .ci/scripts/test/run-e2e.sh --workers 1 --config playwright.k8s-multinode.config.ts --grep-invert "licensing on the fleet" --fail-on-skip

      # On failure, each VM's libvirt state, console and guest journal go into the upload below (see the collector's docstring).
      - name: Collect VM diagnostics
        if: failure()
        timeout-minutes: 6
        run: PYTHONPATH=.ci python3 -m rediacc_ci.diagnostics.collect_vm_diagnostics

      - if: always()
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci_signal.create_complete --name "e2e-k8s-multinode" --status ${{ job.status }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-e2e-k8s-multinode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/complete.txt
            ${{ runner.temp }}/vm-diagnostics/
            ${{ runner.temp }}/account-for-e2e.log
            packages/e2e-tests/reports/bridge-k8s-multinode/
            packages/e2e-tests/reports/bridge-k8s-multinode-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  test-e2e-migrate:
    name: E2E Migrate
    # Logs into ghcr with github.token and PULLS only (the credential is then
