          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Setup KVM Host
        run: sudo $RENET_BINARY ops host setup

      # Group A .env drives the harness global setup (source fleet). Group B is
      # booted separately below; both auto-detect the same RENET_DATA_DIR
