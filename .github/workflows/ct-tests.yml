        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      # Pre-pulled only on a cache miss: a hit means build_renet's embed_assets
      # step is a verified no-op (see above), so the multi-arch base images this
      # exists to avoid buildx auth issues for are never fetched by that build.
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
