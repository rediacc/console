name: Claude Review (reusable)

# The single source of truth for automated Claude PR review, callable from
# console itself AND from the private submodule repos (console is public, so
# cross-repo `uses:` works). The caller's github context governs which repo's
# PR gets reviewed; the gate/prompts/marker/cost logic always comes from
# console@main via an explicit checkout, so there is exactly one copy to
# maintain.
#
# required_check semantics:
#   - non-empty (console: "CI Complete"): the pull_request path requires that
#     check green on the current head -- the draft-until-green flow.
#   - empty (submodules): no PR CI exists in those repos (their validation
#     runs inside console CI), so the green gate is deliberately skipped and
#     the marker/dedup machinery alone bounds cost.

on:
  workflow_call:
    inputs:
      required_check:
        description: 'Check-run name that must be green on the PR head; empty skips the green gate'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'PR number for workflow_dispatch re-reviews'
        required: false
        type: string
        default: ''
      model:
        description: 'Model for the review round. Optional: submodule callers omit it and get the default.'
        required: false
        type: string
        default: 'claude-sonnet-5'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # track_progress makes the ACTION post/update the report comment, but it
      # is REJECTED (hard error, whole review dies) for any event outside this
      # list -- mirrored from the action's own validateTrackProgressEvent
      # (src/modes/detector.ts). workflow_run is an automation context, so the
      # flag has to follow the trigger; "Post review report" below covers the
      # events where the action cannot post for us.
      # FORCED OFF, and this is a security control rather than a preference.
      #
      # With track_progress true the action takes its "tag" path, which runs its
      # own `git fetch origin --depth=20 <branch>` inside the workspace. That
      # fetch is what fails on a PRIVATE repo (renet #95: "could not read
      # Username for 'https://github.com'"), and the tempting fix -- persisting
      # credentials on the PR-head checkout -- is the one thing this job must not
      # do. See the Checkout PR head step for why.
      #
      # With it false the action never fetches, so no credential is needed at
      # all. This is not an untested path: it is the ONLY path that has worked.
      # TRACK_PROGRESS was already false for `workflow_run`, and every review
      # that has actually succeeded on this repo ran that way.
      #
      # Cost, stated plainly: no live "Claude is working..." comment on the two
      # pull_request entry points. The `Post review report` step below already
      # covers that case; it is gated on TRACK_PROGRESS != 'true', which now
      # always holds.
      TRACK_PROGRESS: 'false'
      # ONE definition, TWO consumers: the claude_args actually sent, and the
      # CLAUDE_ARGS_SENT line that claims what was sent. They were two
      # hardcoded copies of `--model claude-sonnet-5`, which is a log that can
      # lie about the run it is describing the moment one of them changes.
      # The caller's `model` input flows through here or nowhere.
      REVIEW_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
    permissions:
      contents: read
      pull-requests: write # inline review comments + summary comment
      issues: write # marker comment upsert (issue-comment endpoint on PRs)
      checks: read # required_check lookup on the pull_request path
    steps:
      # ORDER IS THE WHOLE FIX. The caller repo lands at the WORKSPACE ROOT
      # FIRST, and the review tooling is fetched into a subdirectory AFTER it.
      #
      # It used to be the other way round, guarded by `clean: false` on this
      # step. That guard does not do what it was believed to do. `clean: false`
      # only suppresses `git clean -ffdx` on an ALREADY-INITIALISED repo; when
      # actions/checkout initialises a fresh clone into a non-empty directory it
      # empties that directory regardless. The log says so in as many words,
      # with the flag set:
      #
      #     clean: false
      #     Deleting the contents of '/home/runner/work/console/console'
      #
      # So `.review-scripts` was destroyed on EVERY run, and the two callers
      # failed differently:
      #
      #   - Submodule callers (rediacc/account) fell through to the bootstrap,
      #     which only exists in console, and died at exit 127 before any review
      #     could run. Observed on rediacc/account#68 (run 30264668660) and
      #     again on #69 (run 30318251767).
      #   - console-as-caller "worked", but only because the bootstrap copied
      #     the CALLER checkout's scripts into .review-scripts -- and on a
      #     pull_request that checkout is the PR's own merge ref. Verified on
      #     run 30317293249: `HEAD is now at d1d1812 Merge 7020ff44 into
      #     7000f21cf`, i.e. the review of PR #541 ran on review logic taken
      #     from PR #541. A PR could have edited its own reviewer, which is
      #     exactly the property this file claims to guarantee.
      #
      # Reversing the order removes the failure mode instead of guarding it:
      # nothing runs after the .review-scripts checkout that could delete it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Review tooling always comes from console@main -- one copy, no drift, and
      # never the reviewed PR's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rediacc/console
          ref: main
          path: .review-scripts
          persist-credentials: false

      # Fail loudly if the tooling is not where it must be. This replaces a
      # "bootstrap" fallback that copied the caller's own scripts in when
      # .review-scripts was missing -- which is precisely how the PR-reviews-
      # itself hole above stayed invisible. A missing reviewer must stop the
      # run, never be silently substituted.
      - name: Assert review tooling came from console@main
        run: |
          test -f .review-scripts/.ci/scripts/review/claude-review-gate.sh ||
            { echo "::error::review tooling missing from console@main checkout"; exit 1; }

      - name: Review gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED_CHECK: ${{ inputs.required_check }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .review-scripts/.ci/scripts/review/claude-review-gate.sh

      # The anthropics action resets the workspace's UNTRACKED files while it
      # runs, which deletes .review-scripts before the post-review steps —
      # proven on run 30085984306: the gate step above used it, then
      # "Post inline findings" hit ENOENT (exit 127) and the marker never
      # posted. Stage the TRUSTED copy into $RUNNER_TEMP now (outside
      # $GITHUB_WORKSPACE, untouched by any checkout or action) and run the
      # post steps from there. Trusted = whatever fed the gate above (console@
      # main post-merge, the bootstrap copy pre-merge), so a PR's own tree can
      # never substitute the marker/inline-posting logic.
      - name: Stage review scripts outside the workspace
        if: steps.gate.outputs.go == 'true'
        run: |
          rm -rf "${{ runner.temp }}/review-scripts"
          mkdir -p "${{ runner.temp }}/review-scripts"
          cp -r .review-scripts/.ci "${{ runner.temp }}/review-scripts/.ci"

      # Full history so `git diff <last_reviewed>..<head>` works in follow-ups.
      - name: Checkout PR head
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          fetch-depth: 0
          # blob:none: the diff below opens only the changed files, which a partial
          # clone fetches on demand. Downloading 5.7 GB of historical blobs to
          # read a PR diff was pure waste.
          filter: blob:none
          clean: false
          # persist-credentials MUST stay false here. This checkout takes
          # PR-AUTHORED content (`ref: head_sha`), and the model then runs over
          # it with Read enabled and `Bash(gh pr comment:*)` / `Bash(gh api:*)`
          # allowlisted, under `pull-requests: write` + `issues: write`.
          #
          # An earlier fix set this true to unblock the private-repo fetch. The
          # justification was that the credential is this job's GITHUB_TOKEN,
          # already present in the environment, so persisting it does not widen
          # exposure. That conflates two different things. The token's
          # CAPABILITIES are already exposed; persisting additionally writes the
          # RAW BEARER STRING into $GITHUB_WORKSPACE/.git/config as
          # `http.https://github.com/.extraheader`, in a directory the model can
          # read, with two egress tools available. Capability-bounded-by-job
          # becomes exfiltratable-credential. That is a genuine widening, on the
          # one job whose entire purpose is to read attacker-authored text.
          #
          # The private-repo fetch is fixed at the source instead: TRACK_PROGRESS
          # is forced false above, so the action never fetches and needs no
          # credential. The assertion step below makes a silent re-introduction
          # of this fail loudly.
          persist-credentials: false

      # github_token is passed explicitly: comments post as github-actions,
      # whose events never trigger workflows (anti-recursion), and the run
      # does not depend on the Claude GitHub App's repo selection.
      # TRIPWIRE. The comment above is an argument; this is a test. If anyone
      # re-introduces persisted credentials on the PR-head checkout, the job dies
      # here instead of quietly handing a bearer token to a model that is reading
      # attacker-authored files.
      - name: Assert no credential was persisted into the workspace
        if: steps.gate.outputs.go == 'true'
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader' >/dev/null 2>&1; then
            echo "::error::The PR-head checkout persisted a credential into .git/config."
            echo "::error::This job reads PR-authored content with egress tools available."
            echo "::error::Fix the fetch at its source (TRACK_PROGRESS) instead."
            exit 1
          fi
          echo "No persisted credential in the workspace."

      - name: Claude review
        id: claude
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@fa7e2f0a29a126f0b81cdcf360561b36e44cf608 # v1.0.180
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The prompt is what makes this a REVIEW rather than an @claude
          # mention bot: without it the action auto-detects tag mode and skips
          # every run that carries no mention ("No trigger was met for
          # @claude"). With track_progress on an entity event the action still
          # forces tag mode -- that is intended, the prompt then rides along as
          # <custom_instructions> and the action owns the report comment.
          prompt: ${{ steps.gate.outputs.prompt }}
          # track_progress: the ACTION posts/updates the report comment via
          # github_token -- model-side posting proved undeliverable (SDK
          # permission denials, three attempts) and stays best-effort only.
          # Per-event, because the action rejects the flag outright elsewhere.
          track_progress: ${{ env.TRACK_PROGRESS }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "mcp__github_inline_comment__create_inline_comment",
                  "Bash(gh pr view:*)",
                  "Bash(gh pr diff:*)",
                  "Bash(gh pr comment:*)",
                  "Bash(gh api:*)",
                  "Bash(git diff:*)",
                  "Bash(git log:*)"
                ]
              }
            }
          # Turn budget from the gate, scaled to diff size (50/80/140).
          # NO SUB-AGENTS, and this is a cost fix rather than a style rule.
          # Observed on PR #543: the model spawned THREE background review
          # agents, ran out of turns, and posted "Waiting on the three
          # background review agents to finish before synthesizing findings"
          # as its final report. Nothing joins those agents, so every token
          # they spent was thrown away and the PR got a placeholder instead
          # of a review. A review has a fixed turn budget and no join point,
          # so the work must happen inline: delegation is only cheaper when
          # something collects the result.
          claude_args: |
            --model ${{ env.REVIEW_MODEL }}
            --max-turns ${{ steps.gate.outputs.review_turns }}
            --disallowed-tools Task,Agent

      # `always()` on both steps below, and that is the point of them: what was
      # asked for, and what it cost, are most interesting on the round that
      # FAILED, which is exactly when an implicit success() would skip them.
      - name: Record the review invocation
        if: always() && steps.gate.outputs.go == 'true'
        env:
          CLAUDE_ARGS_SENT: |
            --model ${{ env.REVIEW_MODEL }}
            --max-turns ${{ steps.gate.outputs.review_turns }}
            --disallowed-tools Task,Agent
        # INLINE ON PURPOSE, and this is the trap it fell into. The review
        # tooling is checked out from rediacc/console@main (`ref: main` above),
        # deliberately, so PR-authored review scripts can never execute. The
        # workflow, however, comes from the PR. So a workflow step may call only
        # script arms that ALREADY EXIST ON MAIN.
        #
        # The first version of this step called
        # `claude-review-gate.sh --record-invocation`, an arm added on this
        # branch. `git show origin/main:...claude-review-gate.sh | grep -c
        # record-invocation` returns 0, so on run 30552035566 the step failed
        # instantly (started and completed at 14:35:57) and took the job red.
        # The arm cannot work until it is on main, which is a chicken-and-egg
        # this step must not be caught by.
        #
        # Two lines of shell is under check-workflows.sh's 8-logic-line cap, so
        # inlining is legitimate here rather than an evasion.
        run: |
          printf '%s\n' "$CLAUDE_ARGS_SENT"
          { echo '### Review invocation (the action does not log claude_args itself)'; echo '```'; printf '%s\n' "$CLAUDE_ARGS_SENT"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      # Persist the execution file. It carries total_cost_usd, num_turns and the
      # per-model `modelUsage` breakdown, and until now it was written to
      # RUNNER_TEMP, read inline by the steps below, then thrown away with the
      # runner. Every question about a past review's cost or model had to be
      # answered from one formatted comment line, which is how spike S-1 came to
      # hinge on parsing "(claude-sonnet-5)" out of a comment rather than
      # reading the JSON that produced it.
      #
      # It also left a finding undiagnosable: on run 30527484990 the per-model
      # token count rendered empty, so modelUsage[].outputTokens was 0 or absent
      # while usage.output_tokens was 30313 on the same result object. Retained,
      # the next occurrence is readable instead of re-derived.
      #
      # 7 days because this is a debugging aid, not a record.
      # `if-no-files-found: ignore` keeps a skipped or crashed review from
      # failing the job over a missing artifact.
      - name: Preserve the review execution file
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: claude-review-execution-${{ steps.gate.outputs.head_sha }}
          path: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          if-no-files-found: ignore
          retention-days: 7

      # Without track_progress the action ran in AGENT mode, which creates no
      # tracking comment at all -- the report exists only as the model's final
      # text in the execution file. Post it here so the workflow_run entry
      # point yields the same report shape as the ready-flip one; the two
      # steps below (and the review cap, and the report-reply gate) all read
      # that comment. Ordering is load-bearing: this must precede
      # --post-findings, which parses the findings fence out of it.
      - name: Post review report
        if: steps.gate.outputs.go == 'true' && env.TRACK_PROGRESS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: ${{ runner.temp }}/review-scripts/.ci/scripts/review/claude-review-gate.sh --post-report

      # Line-anchored severity-badged comments, posted deterministically from
      # the machine-readable findings block in the report (the model's final
      # text is the only channel proven to escape the action sandbox).
      # Advisory: per-comment failures are skipped, never fail the job.
      - name: Post inline findings
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: ${{ runner.temp }}/review-scripts/.ci/scripts/review/claude-review-gate.sh --post-findings

      # Mark only AFTER a successful review step, and only when output
      # actually posted (the guard verifies; at-least-once semantics). Also
      # appends cost + token usage parsed from the execution file.
      # `always()` HERE AND NOWHERE ELSE (operator decision 2026-07-30). This
      # step is the ACCOUNTING RECORD, and it has to run precisely when the
      # review failed, because that is the case it exists to charge for.
      #
      # Without it the leak was unbounded: the review step failed, implicit
      # success() skipped this and the two steps above, no marker was written,
      # and the cap counts POSTED reports, so a spent pass counted as zero and
      # the same SHA was re-reviewed at full price on every later green push.
      # Measured on PR #546 run 30552035566: error_max_turns, zero
      # github-actions comments, no marker.
      #
      # The sibling post-report and post-findings steps deliberately stay on
      # implicit success(): when the model produced nothing there is nothing for
      # them to post, so running them would only add two more ways to fail the
      # job. REVIEW_OUTCOME tells --mark which path to take; anything other than
      # "success" records a SPENT ATTEMPT, which consumes budget without ever
      # claiming the SHA was reviewed.
      - name: Record reviewed SHA
        if: always() && steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          REVIEW_OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: ${{ runner.temp }}/review-scripts/.ci/scripts/review/claude-review-gate.sh --mark

      # workflow_dispatch's own head_sha (and therefore the head_sha that
      # review-status.yml would read off github.event.workflow_run.head_sha
      # once THIS run completes) is the ref it was dispatched against, never
      # the PR head -- documented GitHub Actions behavior, not a bug here.
      # review-status.yml's commits/.../pulls lookup finds nothing for that
      # SHA and silently no-ops. Tell it directly which PR to re-check
      # instead of relying on SHA inference for this one entry point.
      # Verified live 2026-08-01: PR #550's marker updated correctly on a
      # workflow_dispatch review, but no check-run from that downstream
      # workflow appeared until this was worked around by hand.
      # Hardcoded to rediacc/console (never github.repository): this
      # reusable is also called from the private submodule repos, where
      # github.repository reads rediacc/account or similar, but
      # review-status.yml exists only in console.
      - name: Nudge review-status.yml with the resolved PR
        if: always() && steps.gate.outputs.go == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run review-status.yml --repo rediacc/console --ref main \
            -f pr_number="${{ steps.gate.outputs.pr_number }}"
