name: Housekeeping

# Nightly cleanup, decoupled from the release pipeline. This previously ran
# inline on every push-to-main (a job in ci.yml), which meant version/R2/GHCR
# cleanup raced live releases — including the orphan sweep that can delete a
# version's bytes. Running it only on a schedule (or manual dispatch) guarantees
# it never overlaps a release, so the sentinel+tag bijection is the sole guard
# for R2 orphans and IN_FLIGHT_VERSION is intentionally NOT set.
#
# Two independent jobs:
#   cleanup        — .ci/scripts/housekeeping/cleanup-versions.sh (releases, tags,
#                    GHCR, deployments, CF Pages, envs, D1, Turnstile, R2 orphans,
#                    branches, workflow runs/artifacts/cache).
#   stripe-cleanup — Stripe sandbox orphan sweep + per-region webhook verification.

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC (clear of CI '0 1' and promote-stable '0 6')
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview deletions without deleting (cleanup job only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: housekeeping
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup versions
    # ubuntu-latest, not ubuntu-slim: slim has a hard 15-minute platform
    # cap, so the 60-minute timeout below was unreachable -- a long run was
    # silently CANCELLED at 15 rather than timing out. Found by CHECK 3 in
    # .ci/scripts/security/check-workflow-gates.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            CLOUDFLARE_BREAKPOINT_TUNNEL_TOKEN > BWS_CLOUDFLARE_BREAKPOINT_TUNNEL_TOKEN
            CLOUDFLARE_R2_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_ENDPOINT > BWS_CLOUDFLARE_R2_ENDPOINT
            CLOUDFLARE_R2_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY CLOUDFLARE_BREAKPOINT_TUNNEL_TOKEN CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_ENDPOINT CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_CLOUDFLARE_BREAKPOINT_TUNNEL_TOKEN: ${{ secrets.BREAKPOINT_TUNNEL_TOKEN }}
          GH_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GH_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: housekeeping
          repositories: console,renet,elite,account

      # Retry BEFORE the cleanups: a run this reruns may itself be a cleanup
      # (that is the measured case -- Cleanup PR Preview), so giving it the
      # night's own window to succeed is better than reaping around it.
      - name: Retry retryable failed runs
        run: .ci/scripts/housekeeping/retry-failed-runs.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Cleanup old releases, tags, packages, previews, R2 orphans, branches
        run: .ci/scripts/housekeeping/cleanup-versions.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # IN_FLIGHT_VERSION intentionally unset: nightly never overlaps a
          # release, so Phase 8d's sentinel+tag bijection is the correct guard.
          # The ${IN_FLIGHT_VERSION:-} default in the script no-ops when absent.

      # Reap breakpoint tunnels whose in-job teardown never ran. Two paths skip
      # `if: always()` entirely -- the CI watchdog's force-cancel and a runner
      # crash -- so this is the ONLY backstop for them. Terminal run state is
      # the primary signal (the tunnel name encodes the run id); age is a
      # secondary guard; an inconclusive GitHub answer is never acted on.
      #
      # Age-guarded nightly rather than workflow_run-triggered on purpose:
      # cleanup-on-ci-cancel.yml was exactly that reactive shape and it deleted
      # in-flight release binaries (9384e046c). Same lesson, shorter floor.
      #
      # Continues past a failure of the step above: an unrelated R2 hiccup must
      # not leave a live tunnel up for another 24 hours.
      - name: Reap orphaned breakpoint tunnels
        if: ${{ !cancelled() }}
        run: .ci/breakpoint/scripts/reap-breakpoint-orphans.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOUDFLARE_BREAKPOINT_TUNNEL_TOKEN: ${{ secrets.BREAKPOINT_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  stripe-cleanup:
    name: Stripe sandbox cleanup
    # ubuntu-latest, not ubuntu-slim: slim has a hard 15-minute platform
    # cap, so the 30-minute timeout below was unreachable -- a long run was
    # silently CANCELLED at 15 rather than timing out. Found by CHECK 3 in
    # .ci/scripts/security/check-workflow-gates.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY STRIPE_SANDBOX_SECRET_KEY CLOUDFLARE_API_TOKEN
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: .ci/scripts/ci/shadow-compare.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - uses: ./.github/actions/app-token
        id: app-token-stripe
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - name: Initialize account submodule
        run: git submodule update --init private/account

      - name: Install account dependencies
        run: npm install
        working-directory: private/account

      - name: Cleanup orphaned Stripe sandbox resources
        run: npx tsx scripts/cleanup-orphans.ts
        working-directory: private/account
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}

      - name: Verify Stripe sandbox webhook endpoints (per-region)
        run: |
          jq -r '.regions[] | .edgeDomain' regions.json | while read -r domain; do
            echo "Verifying sandbox webhook for ${domain}..."
            npx tsx private/account/scripts/verify-webhook.ts --sandbox --expected-url "https://${domain}/account/api/v1/webhooks/stripe"
          done
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
