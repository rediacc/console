name: Console CT - E2E Dependency Probe

# T2.12 (PLAN-ci-time-budget). The E2E Workers shard wiring (ct-tests.yml's
# `test-e2e-workers` job, T2.10's committed shard manifest) assumes every
# spec file is independent enough to land on any leg. The config comment
# "Order maintained by workers:1 + fullyParallel:false"
# (packages/e2e-tests/playwright.config.ts) says some of that independence
# may not be real, so this probes it directly: run each unit the shard
# manifest currently ships ALONE, on its own fresh VM, and let
# e2e-probe-edges.ts turn "failed alone" into a proposed `needs` edge.
#
# NEVER TOUCHES THE MANIFEST. This workflow only measures and reports; a
# human reviews the aggregate job's printed/uploaded edges and applies them
# to unit-enumerators.ts by hand. A unit that fails alone fails its leg, and
# ci.yml's CI Complete reads this call's result as soft-required, so the PR
# that introduces a hidden dependency between spec files is the one that goes
# red. ci.yml calls it whenever E2E Workers runs (no PR label gates it, ruling
# 2026-10-14); it re-provisions one full VM topology per unit, which is the
# price of that verdict on every such run.
#
# MIRRORS ct-tests.yml's `test-e2e-workers` JOB, deliberately, one distro
# (ubuntu-24.04) and one unit per leg instead of a shard's worth: same
# composite actions, same renet build, same VM bridge topology, so the only
# variable is which unit the leg selects.

on:
  workflow_call:
    secrets:
      # Bitwarden machine-account token for the shadow secret fetch
      # (.github/actions/bws-secrets). Every caller must pass it.
      BWS_ACCESS_TOKEN:
        required: true

permissions: {}

jobs:
  # ==========================================================================
  # List the exact unit set T2.10's committed shard manifest ships today, so
  # the probe measures what CI actually shards rather than a fresh
  # enumeration that could silently disagree with it (a unit the manifest
  # does not run yet has no "passes in the full suite" baseline to probe
  # against). One entry per manifest UNIT: the describe-group buckets
  # `13-postgres-fork-isolation.test.ts#part1/2/3` are three legs here, each
  # selected by the grep E2E Workers uses, because the whole file ran 15.7
  # minutes alone (run 36311800722), past this job's 15-minute timeout.
  # ==========================================================================
  list-files:
    name: E2E Probe / List Files
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      units: ${{ steps.list.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-slim

      - name: Derive the probe unit list from the committed shard manifest
        id: list
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci.list_e2e_probe_files

  # Stages renet's embed assets on a cache miss under its own budget, so the consumer
  # below restores a hit and its "Build renet" is the go build alone (modeled on
  # ct-tests.yml's renet-embed-assets; check-lane-budget.ts check 8 reds a consumer
  # that loses the needs: edge).
  renet-embed-assets:
    name: Renet embed assets
    # Checkout, with the private submodules on the readonly-preset App token,
    # and Docker Hub pulls for the staging build. No ghcr, no GitHub API.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/profiler
        with:
          runner-label: ubuntu-latest

      - name: Fetch secrets from Bitwarden
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      # lookup-only: a hit downloads nothing here; the dependents restore it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
          lookup-only: true
      # Everything below runs on a miss only, and is the consumers' own chain.
      - name: Login to Docker Hub
        if: steps.embed-cache.outputs.cache-hit != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.embed-cache.outputs.cache-hit != 'true'
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        if: steps.embed-cache.outputs.cache-hit != 'true'
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - name: Stage renet embed assets
        id: build-renet
        if: steps.embed-cache.outputs.cache-hit != 'true'
        env:
          RENET_EMBED_CACHE_HIT: ${{ steps.embed-cache.outputs.cache-hit }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Only a tree this job staged itself and build.sh's receipt vouches for
        # (rediacc_ci.infra.renet_embed_cache), as at every other save site.
        if: always() && steps.build-renet.outputs.embed-cacheable == 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}

  # ==========================================================================
  # One leg per unit, ubuntu-24.04 only (T2.12: "one distro"). Provisioning
  # steps are ct-tests.yml's test-e2e-workers job, unchanged, down to the
  # embed-assets cache key so a run here can share that cache with a
  # concurrent real CI run instead of paying to stage it twice.
  # ==========================================================================
  probe-file:
    name: E2E Probe (${{ matrix.probe.unit }})
    permissions:
      contents: read
      packages: read
    needs: [list-files, renet-embed-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        probe: ${{ fromJson(needs.list-files.outputs.units) }}
    env:
      CI: 'true'
      BRIDGE_TIMEOUT: 240000
      VM_BRIDGE: '1'
      VM_WORKERS: '11 12'
      VM_CEPH_NODES: ''
      VM_IMAGE: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}
      - name: Propagate Docker Hub credentials to root
        run: sudo mkdir -p /root/.docker && sudo cp ~/.docker/config.json /root/.docker/config.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - name: Free Disk Space (start)
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'
      - run: PYTHONPATH=.ci python3 -m rediacc_ci.build.build_cli
      - name: Install CLI Globally
        run: PYTHONPATH=.ci python3 -m rediacc_ci.setup.install_cli_global

      - name: Prefer archive.ubuntu.com
        uses: ./.github/actions/apt-mirror

      - name: Install clang for BPF compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      - name: Pre-pull Docker base images (avoid buildx auth issues)
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.docker_prepull debian:bookworm=linux/amd64 debian:bookworm-slim=linux/arm64 ubuntu:24.04=linux/amd64 ubuntu:24.04=linux/arm64
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Build renet
        id: build-renet
        env:
          RENET_EMBED_CACHE_HIT: ${{ steps.embed-cache.outputs.cache-hit }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Only a tree this job staged itself and build.sh's receipt vouches for
        # (rediacc_ci.infra.renet_embed_cache): a skipped restore once saved the
        # bare checkout skeleton under this immutable key.
        if: always() && steps.build-renet.outputs.embed-cacheable == 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Install renet
        run: sudo cp "$RENET_BINARY" /usr/bin/renet && sudo chmod +x /usr/bin/renet

      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-e2e-probe-${{ env.VM_IMAGE }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: Free Disk Space (wait)
        uses: ./.github/actions/free-disk-space
        with:
          mode: wait

      - name: Prefer archive.ubuntu.com
        uses: ./.github/actions/apt-mirror

      - name: Setup KVM Host
        run: sudo "$RENET_BINARY" ops host setup

      - name: Create E2E Test Environment
        run: PYTHONPATH=.ci python3 -m rediacc_ci.env.create_e2e_env --renet-path /usr/bin/renet --output packages/e2e-tests/.env

      - name: Run E2E unit alone (${{ matrix.probe.unit }})
        id: run
        # An empty PROBE_GREP is a whole-file unit: the runner adds no --grep for an empty value.
        env:
          PROBE_TEST: ${{ matrix.probe.test }}
          PROBE_GREP: ${{ matrix.probe.grep }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.testrun.e2e --workers 1 --test "tests/$PROBE_TEST" --grep "$PROBE_GREP"

      - name: Record outcome
        if: always()
        # job.status, not steps.run.outcome: no continue-on-error is set
        # above (banned by check:ci-workflows), so a real failure already
        # marks the job failed and every later `if: always()` step,
        # including this one, still runs -- the same pattern
        # test-e2e-workers' own create_complete step relies on.
        env:
          PROBE_UNIT: ${{ matrix.probe.unit }}
          JOB_STATUS: ${{ job.status }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.ci.record_e2e_probe_outcome "$PROBE_UNIT" "$JOB_STATUS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: e2e-probe-result-${{ matrix.probe.slug }}-${{ github.sha }}
          path: ${{ runner.temp }}/e2e-probe/result.json
          retention-days: 3
          if-no-files-found: error

      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks
          key: ${{ steps.vm-image-key.outputs.key }}

  # ==========================================================================
  # THE SHARD AGGREGATOR (same shape as ci-quality.yml's `quality-complete`):
  # a matrix leg reports one roll-up result each, so this is the only place
  # that reads every leg's own outcome and turns the set of them into a
  # verdict. `!cancelled()` so a leg that died still lets the rest report,
  # matching the sibling job's own reasoning.
  # ==========================================================================
  aggregate:
    name: E2E Probe / Aggregate
    needs: [probe-file]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Download probe leg results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: e2e-probe-result-*-${{ github.sha }}
          path: /tmp/e2e-probe-results

      - name: Compute proposed needs edges
        run: |
          npx tsx scripts/ci-runner/e2e-probe-edges.ts --results-dir /tmp/e2e-probe-results \
            > e2e-probe-edges.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: e2e-probe-edges-${{ github.sha }}
          path: e2e-probe-edges.json
          retention-days: 3
          if-no-files-found: error
