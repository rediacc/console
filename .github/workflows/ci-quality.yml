  quality-cli-examples:
    name: CLI Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: .ci/scripts/setup/install-deps.sh
      # The tree first: nine validators (this job's included) read command-tree.json as
      # their model of the CLI, and a stale one fails OPEN — they keep passing while
      # checking a CLI that no longer exists.
      - run: npm run check:ci-command-tree
      - run: npm run check:cli-examples
      # Three CLI-shape gates that only ever ran locally. check:ci-design-tree
      # was RED at HEAD when first run here: `backup strategy bind|unbind`
      # shipped in #524 and the as-built transcript was never updated.
      - run: npm run check:ci-command-planes
      - run: npm run check:ci-design-tree
      - run: npm run check:ci-schema-coverage

  quality-ebpf:
    name: eBPF Objects
    runs-on: ubuntu-latest
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - name: Install clang
        # `apt-get update` is mandatory before install: the Azure runner image
        # ships with stale apt metadata referencing a kernel ABI that may have
        # already rotated out of the Ubuntu pool, causing
        # `linux-headers-generic` to 404 on the matching versioned headers
        # package. Refresh metadata first, then install.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      - name: Verify BPF objects are up-to-date
        run: |
          cd private/renet
          go generate ./pkg/ebpf/...
          git diff --exit-code pkg/ebpf/
      - name: Verify BPF verifier accepts program
        run: |
          cd private/renet
          go test ./pkg/ebpf/ -run TestBPFVerifier -v
      - name: Run eBPF unit tests
        run: |
          cd private/renet
          go test ./pkg/ebpf/ -v

  quality-renet:
    name: Renet
    runs-on: ubuntu-latest
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      - name: Run renet quality
        run: .ci/scripts/private/run-renet.sh quality

      - name: Check Go dependency freshness
        if: "!(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'no-external-quality'))"
        run: npm run check:ci-go-deps

      - name: Check renet types freshness
        run: npm run check:ci-renet-types

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: .ci/scripts/setup/install-deps.sh

      - name: Check subscription schema consistency
        run: .ci/scripts/quality/check-subscription-schema.sh

      # Needs the renet submodule (Dockerfile ARGs + pkg/embed sources), so it
      # runs here rather than in quality-security (submodule-less checkout).
      - name: Check embed credits consistency
        run: npm run check:ci-embed-credits

      # Same submodule requirement: reads private/renet/embed-assets.lock.json.
      # Asserts every embedded component is pinned for every architecture it
      # declares — the dimension nothing carried when arm64 criu silently became
      # a different version from amd64 criu.
      - name: Check embed arch parity
        run: npm run check:ci-embed-arch-parity

      # Freshness of the embedded-binary version pins vs upstream. GITHUB_TOKEN
      # raises the API rate limit; the gate fails SOFT on any network/rate-limit
      # error, so a missing token or a blip never reddens the build — only a
      # confirmed-stale pin does.
      - name: Check embed-asset upstream freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:ci-embed-asset-freshness

  quality-account:
    name: Account Server
    runs-on: ubuntu-latest
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      - name: Build shared package (required for subscription types)
        run: |
          npm ci --workspace=@rediacc/shared
          npm run install:natives
          npm run build --workspace=@rediacc/shared

      - name: Install account dependencies
        working-directory: private/account
        run: npm ci && cd ../.. && npm run install:natives

      - name: Check config token auth requires org membership
        run: npm run check:ci-account-config-auth

      - name: Check no admin user role (must be root)
        run: npm run check:ci-account-no-admin-role

      - name: Check scope registry audit
        run: npm run check:ci-account-scope-audit

      - name: Run account integration tests
        run: .ci/scripts/private/run-account.sh test

      - name: Run Go cross-language signature tests
        working-directory: private/renet
        run: go test -v ./pkg/subscription/... -run TestCrossLanguage
      - name: Assert no NODE_ENV branching in account routes
        run: npm run check:ci-account-no-node-env-routes

  quality-account-portal:
