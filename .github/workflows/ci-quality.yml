      - name: Check E2E test coverage for all renet functions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_e2e_coverage.py
      - name: Check prose style (the work, not the person)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_prose_style.py
      - name: CSS DOM references
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
