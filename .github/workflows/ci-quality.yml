name: Console CI - Quality

# ==============================================================================
# TEN LANES, NOT THIRTY-THREE JOBS
# ==============================================================================
# This workflow used to be 33 one-gate-per-job entries. Measured on run
# 30064285223: 4307s of runner time, of which 3042s (73%) was setup rather than
# gate work, against a hard 20-slot free-tier concurrency cap that was pegged at
# exactly 20/20 for the whole phase (the last job started 2m19s late purely from
# queueing). The gates themselves were 1153s.
#
# Two structural fixes, applied together:
#   1. ./.github/actions/setup-workspace caches node_modules instead of
#      rebuilding it 24 times (see that action for the measurements).
#   2. Gates are grouped into lanes by SETUP CLASS -- what a gate needs on disk
#      (bare checkout / node / node+submodules / node+build / go), not by
#      subject matter. A lane pays the setup cost once for all of its gates.
#
# RULES FOR EDITING A LANE, in order of how easy they are to get wrong:
#
#   a. Every gate step carries `if: ${{ !cancelled() && steps.setup.outcome ==
#      'success' }}`. The `!cancelled()` half is what makes a lane report ALL of
#      its failures in one round instead of stopping at the first -- without it,
#      grouping would make CI strictly less informative than it was. The
#      `steps.setup` half stops a failed install from cascading into twenty
#      confusing gate failures. `continue-on-error` is banned by
#      check-workflows.sh and is NOT the same thing: it would make the lane pass.
#
#   b. A lane takes the STRICTEST requirement of its members: runner, app-token
#      preset, submodule checkout, timeout. Never widen a token to fit a gate
#      into a lane -- move the gate, or leave it alone. quality-branch is alone
#      precisely because it is the only `push`-preset token in CI.
#
#   c. ubuntu-slim has a HARD 15-minute job cap that kills the job as
#      "cancelled" with no failed step. Slim lanes therefore declare
#      `timeout-minutes: 12` so they fail with their own message first. This is
#      enforced by CHECK 3 in .ci/scripts/security/check-workflow-gates.sh; a
#      slim job without a <=12 timeout is a red gate, not a style nit.
#
#   d. Job names are load-bearing for the watchdog:
#      WATCHDOG_NO_RETRY_PATTERNS is 'Quality,Review Gate' matched with
#      String.includes, so every job here is no-retry by name. Keep the
#      `Quality / ` prefix.
# ==============================================================================

on:
  workflow_call:
    inputs:
      # DO NOT DELETE as "always false". A dead-code sweep will correctly
      # observe that ci.yml is the only caller and already gates this workflow
      # on `is_bot != 'true'` (ci.yml quality job), making every downstream
      # `if: inputs.is_bot != 'true'` constant-true. Deleting them anyway
      # removes the second half of a release-LOOP breaker.
      #
      # CD pushes bot commits straight to main: cd-v2.yml's contract-floor
      # ratchet and .ci/scripts/release/update-homebrew-tap.sh both
      # `git push origin HEAD:main` with user.name = vars.GIT_BOT_NAME, which
      # is literally "github-actions[bot]" — the exact string
      # .ci/scripts/ci/initialize.sh matches to set is_bot.
      #
      # Two independent defenses stop those commits re-triggering a release:
      #   1. ci.yml's initialize job `if:` — github.actor + "[skip ci]"
      #   2. is_bot — derived from head_commit.author.name
      # They are not equivalent. Those pushes use the CI App token, so
      # github.actor is the App, not github-actions[bot]; "[skip ci]" in the
      # message is what actually fires. If a bot commit ever ships without
      # "[skip ci]", is_bot is the only remaining backstop against
      # bot commit -> CI -> release -> bot commit.
      is_bot:
        type: string
        required: false
        default: 'false'
      next_version:
        type: string
        required: false
      # Three-state control for externally-dependent gates, computed by
      # ci.yml's initialize: 'hard' (normal PR: failures block), 'skip' (PR
      # with the no-external-quality label: steps do not run), 'soft'
      # (schedule/dispatch: run-external-gate.sh downgrades a failure to a
      # ::warning:: so external drift cannot redden the nightly). Default
      # 'hard' fails closed if a caller forgets to pass it.
      external_quality:
        type: string
        required: false
        default: 'hard'
      # Two-state control for the gates that read in-flight tutorial media,
      # computed by ci.yml's initialize: 'hard' (normal PR and every non-PR
      # event: failures block) or 'skip' (PR carrying the no-media-quality
      # label, while a re-recording pass leaves the media tree temporarily
      # inconsistent). No soft state and no wrapper: these gates read this
      # tree, not the outside world, so there is no drift to downgrade.
      # Default 'hard' fails closed if a caller forgets to pass it, and both
      # consuming jobs run announce-gate-skips.sh so a skip is never silent.
      media_quality:
        type: string
        required: false
        default: 'hard'
    secrets:
      # Bitwarden machine-account token for the shadow secret fetch
      # (.github/actions/bws-secrets). Every caller must pass it.
      BWS_ACCESS_TOKEN:
        required: true
      APP_PRIVATE_KEY:
        required: false
      CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID:
        required: false
      CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY:
        required: false
      CLOUDFLARE_R2_MEDIA_ENDPOINT:
        required: false
      # Optional on purpose: without it the Docker Hub freshness gate falls back to the
      # anonymous rate limit, and its own logic REFUSES on a limited response rather than
      # reporting everything current. A fork without the secret gets an honest failure, not
      # a vacuous pass.
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # L1 STATIC -- no node, no dependencies, bare checkout.
  # Absorbs: editorconfig, compose-env, audit-coverage, shell, attribution,
  #          pr-description.
  # ============================================================================
  quality-static:
    name: Static
    runs-on: ubuntu-slim
    timeout-minutes: 12
    if: inputs.is_bot != 'true'
    steps:
      - id: setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # Only pr-description needs a token, and only on a PR. Minting it here
      # keeps the lane at the narrowest preset any member requires.
      - uses: ./.github/actions/app-token
        id: app-token
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: pr-read   # gh api reads in check-pr-description.sh
          repositories: console

      - name: Load gate toolchain pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # ONE definition of every gate tool's version, shared with the host and
        # the devbox image. --env emits only KEY=value lines: $GITHUB_ENV rejects
        # anything else, so `cat toolchain.env >> "$GITHUB_ENV"` would fail the
        # job on this file's comments.
        #
        # The shfmt install that used to live here is GONE. It was
        # `curl -sS https://webi.sh/shfmt | sh` -- unpinned, so CI silently
        # tracked whatever was latest while the image built its own copy from
        # `go install ...@latest`. The gate now acquires shfmt at the pin itself
        # (.ci/scripts/lib/toolchain.sh), which is the only way host, container
        # and CI can be shown to agree.
        run: |
          .ci/scripts/lib/toolchain.sh --env >> "$GITHUB_ENV"
          .ci/scripts/lib/toolchain.sh --report

      - name: Install ruff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Pinned, and VERIFIED after install for the same reason the shfmt step
        # above is: an installer that exits 0 without producing a binary turns
        # into a bare "ruff is not available" in a later step, which the
        # watchdog cannot classify as a network fault.
        run: |
          python3 -m pip install --user --disable-pip-version-check "ruff==${RUFF_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ruff" --version

      - name: EditorConfig
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-editorconfig.sh

      - name: Compose env
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-compose-env.sh

      - name: Check audit logging coverage for CLI operations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-audit-coverage.sh

      - name: Shell lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/security/shellcheck.sh

      # Self-test for the mutation runner. Cheap on purpose: it drives
      # mutate-check.sh through all four of its verdicts against a miniature
      # fixture suite, so it costs seconds rather than the 8-plus minutes two
      # passes of the real suite would. It does NOT force a mutation per test
      # case, which is not gateable; it stops the instrument rotting into
      # something that always says OK.
      - name: Mutation runner self-test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-mutate-check.sh

      - name: Shell format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/security/shfmt.sh

      - name: Python lint + format (ruff)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-python-lint.sh

      # Offline by construction: compares committed baseline durations against
      # the timeout-minutes in the workflow files. The network lives only in its
      # --refresh mode, which is not run here.
      - name: CI job timeout headroom
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_job_timeout_headroom.py

      # Offline by construction, same split: the committed profiler baseline
      # against the `runs-on:` in the workflow files. The network lives only in
      # --refresh, which harvests the profiler's own annotations.
      - name: Runner sizing advice
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-runner-advice

      # Offline by construction: compares the committed record against the
      # secrets each workflow references. The network lives only in --refresh.
      # A hook whose script has been renamed or deleted does not error — it
      # silently stops firing, and every run afterwards looks clean. No token
      # or submodule needed, so this belongs in the static lane.
      - name: Hooks resolvable
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_hooks_resolvable.py

      # A guard that calls a shared-lib function it never sourced dies at runtime
      # with "command not found" on stderr -- which a warn/block test's "expect
      # non-empty output" assertion cannot tell apart from a real warning. Proven
      # live 2026-08-28: renaming warn-stale-index.sh's sourced hook_scan_target
      # produced exactly that crash, and it would have passed the guard's own
      # "warn" test case.
      - name: Guard feature completeness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_guard_feature_completeness.py

      # An apt source rewritten to ONE mirror must carry a fallback to another.
      # Retrying a single point of failure is still a single point of failure:
      # on 2026-08-19 a dead azure.archive.ubuntu.com took down four consecutive
      # CI attempts because every source pointed at it and all five retries hit
      # the same host. Static text analysis, no network, so it belongs here.
      - name: Dockerfile mirror resilience
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_dockerfile_mirror_resilience.py

      # A job that READS submodule source must CHECK IT OUT. Tests + Infra /
      # Unit parsed private/renet/pkg/prune/datastore.go with a bare checkout,
      # failed on a file it never fetched, and cancelled 26 siblings; the ENOENT
      # named a test file, so the evidence pointed at the wrong thing entirely.
      # Reads workflow YAML only, so it needs no token and no submodule, which
      # is why it belongs in the static lane.
      # Both of these read workflow YAML and need PyYAML, so one install serves
      # both and the assert stays with it.
      - name: Python gate deps
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_python_gate_deps.py

      - name: Workflow submodule deps
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # PyYAML is installed HERE and pinned, and the version is asserted so a
        # silent install failure cannot become a bare "no module named yaml"
        # three lines later. Its sibling check_job_timeout_headroom.py
        # deliberately hand-rolls a regex parser to avoid this dependency, and
        # that is right for two fixed keys at one indentation level. This gate
        # reads nested jobs, steps, uses and with blocks, where a hand-rolled
        # parser would be a correctness risk in the one place that cannot afford
        # one: a gate whose whole value is not lying about what it saw. A
        # yaml-if-available-else-regex fallback was rejected outright, because
        # two parsers means the gate means different things in CI and locally,
        # which is the exact bug shape this wave already paid for twice.
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_workflow_submodule_deps.py

      - name: No inline Python in JS/TS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_inline_python.py

      - name: Shell commands exist on the runner image
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/security/check-commands.sh

      # 57 gate scripts follow one registration convention and NOTHING enforced it,
      # so the 58th broke it. A reviewer caught that one; this catches the next.
      - name: Gate registration follows the gates/ convention
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-gate-id-convention

      # A gate test that writes into the real tree must run in run-all.sh's serial
      # W chain. Left in the parallel pool it corrupts a concurrent reader and
      # presents as an unrelated gate going red in a file that parses clean on the
      # serial re-run -- a concurrency artifact, the most expensive failure shape
      # here. test-generate-tag-inputs.sh was misfiled that way until 2026-08-17.
      - name: Pool-registered tests do not write the real tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-pool-writer-safety

      # A review that runs out of turns posts NOTHING and still spends an attempt against a
      # finite allowance, so an under-resourced budget is the expensive failure, not the
      # cheap one. Asserts the budget cannot starve any diff size it is willing to route.
      - name: Review turn budget cannot starve a routed review
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-review-turn-capacity

      # The gate and review-status must cap on the SAME numerator. When they did
      # not, the gate stopped reviewing while review-status kept demanding one,
      # and PR #553 became green, ready and permanently unmergeable.
      - name: Review cap is measured coherently
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-review-cap-coherence

      # The Stop hook's reachability probe once returned False for all 191 gates,
      # telling sessions their wired gates were unwired. Keeps it honest.
      - name: Gate-reachability probe agrees with registrations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-gate-reachability-coverage

      # Catches `aws s3 ls | wc -l`-style pipelines that abort a `set -eo
      # pipefail` script on empty input. Written after three such outages in
      # one day.
      - name: Silent-failure patterns
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-silent-failures

      # `agent-browser open` returns 1 when its stdout is REDIRECTED and 0 on a terminal,
      # for a URL that loads correctly either way. Under `set -e` that kills a harness at
      # its first page with no error text. No script may let that status decide flow.
      - name: agent-browser exit status
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-agent-browser-exit

      # A runner checks out tracked files only, so a step reaching into a gitignored path
      # runs against a file that is not there. Five separate stops proposed exactly that.
      - name: CI executes only tracked paths
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-scans-tracked-paths

      # Runtime sidecars must never be tracked. They have no static markers in
      # source -- they exist only while a session runs -- so every other gate is
      # blind to them by construction and `git ls-files` is the only observable
      # that can tell. A committed .waiter-* heartbeat tells a fresh clone a
      # waiter is running when none is, so that session goes silently deaf to
      # peer messages. A `git add -A` swept two of them in on 2026-08-05.
      - name: Tracked runtime sidecars
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tracked-sidecars

      # Unit tests for shell helpers. Deterministic, no network.
      - name: Write-once guard tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-write-once-guard.sh

      - name: Install-script tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-install-script.sh

      # Pure bash, so these two are called by path: this lane has no
      # node_modules and `npm run` would need one. check-ci-parity.ts resolves
      # the path against the manifest, so both directions still agree.
      - name: install.sh config tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-install-sh-config.sh

      # Its sibling above ran in CI from the day it was written; this one ran
      # only locally, for the same reason and with the same shape. Neither the
      # forward gate nor the reverse one could see the asymmetry.
      - name: rdc.sh env tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-rdc-sh-env.sh

      # Exercises the ABSENT case of a dependency probe, which is untested by
      # construction everywhere else: on a developer box RustFS is always up, so
      # the dead-port branch never runs. It shipped returning ALIVE for a dead
      # port on 2026-08-04. Self-fails if its own control cannot fire.
      - name: Dev-stack liveness probes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-account-probes.sh

      # A drill that asserts NOTHING must not print PASSED. Exit codes cannot see
      # this: the exit code was already correct: the claim was the bug.
      - name: Drill verdict logic
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-drill-verdicts.sh

      # A capability probe must exercise the operations its consumer depends on.
      # A runner permits `keyctl add` and denies `keyctl pipe`, so a write-only
      # probe reports "usable" and the consumer fails anyway.
      - name: Capability-probe parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-probe-parity.sh

      - name: Check for Claude attribution
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: .ci/scripts/quality/check-claude-attribution.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Beside the attribution check deliberately: same trigger, same oracle shape (the
      # PR's commit list over the API), and the same fail-closed rule -- an unreadable
      # API refuses rather than reporting a clean PR.
      - name: Commit author identity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: .ci/scripts/quality/check-commit-identity.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Check PR description freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: .ci/scripts/quality/check-pr-description.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Here, and not in quality-branch, because assertions A0 and A6 read only
      # the working tree -- so this lane's depth-1 checkout is enough AND the
      # gate keeps running on the nightly, which quality-branch (pull_request
      # only) does not. When A1 lands -- no box may VANISH between base and head
      # -- it needs a merge-base and the step moves. See
      # agent/PLAN-plan-file-lifecycle.md.
      # In the static lane because it reads only committed files. It exists because
      # the constraint it checks lives in repository SETTINGS, so the failure it
      # prevents surfaces only after a push, at action RESOLUTION, in a message that
      # names no secret and no script (run 33690518859).
      - name: Actions allowlist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-actions-allowlist

  # ============================================================================
  # L2 BRANCH -- read-only, and kept in its own job.
  # It used to be the ONLY `push`-preset app token in CI, because
  # check-branch.sh rebased and republished the PR branch from here. That is
  # gone: the script only REPORTS now, so this job runs on the default
  # contents:read token with no app token at all. Do not hand it a writable
  # token again -- its code comes from the PR itself, and the app bypasses the
  # main-branch ruleset.
  # ============================================================================
  quality-branch:
    name: Branch
    runs-on: ubuntu-slim
    timeout-minutes: 12
    if: inputs.is_bot != 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job needs commit topology, never a historical file's CONTENT.
          # A plain fetch-depth:0 downloads every blob in history and took 299s
          # here to run a 1-second script; blob:none fetches commits and trees
          # only -- measured 1.93s bare, 10.37s with a working tree -- and
          # lazily fetches any blob a command actually opens. Keep the flag even
          # as the pack shrinks: the win is not fetching what is never read, and
          # that is true at any pack size. (A pack-size figure lived here and
          # went stale, which is why this reasons from the ACCESS PATTERN
          # instead.)
          filter: blob:none
          # LOAD-BEARING. The default checkout for a pull_request event is the
          # MERGE ref, which already contains the base branch -- so
          # `HEAD..origin/<base>` would be empty and this gate could never
          # report a behind branch. It must look at the PR head itself.
          ref: ${{ github.head_ref }}
      - name: Check whether the branch is behind its base
        run: .ci/scripts/quality/check-branch.sh
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      # MOVED HERE from quality-static when A1-A5 landed. This is the only lane
      # with BOTH fetch-depth 0 and the PR head ref, which is exactly what "did a
      # box open at the merge-base survive at HEAD" needs. The cost is that
      # quality-branch is pull_request-only, so A1-A5 do not run on push; A0 and
      # A6 read only the working tree and are unaffected. The gate SAYS when the
      # transition rules did not run, so a skip can never read as a clean result.
      - name: Plan checkbox ledger
        if: ${{ !cancelled() }}
        run: npm run check:ci-plan-boxes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  # NOTE: PR reviews come from the Claude Review workflow (claude-review.yml),
  # which fires only when CI Complete is green and the PR is non-draft; the
  # review-gate job in ci.yml enforces thread resolution afterwards.

  # ============================================================================
  # SUBMODULE BRANCH VALIDATION (L3)
  # ============================================================================
  # PURPOSE: Ensures submodule branches match console branch when coordinated
  #          changes are expected (submodule pointer differs from origin/main),
  #          and verifies submodule PRs are linked.
  #
  # AI TROUBLESHOOTING:
  #   If this job fails, check the error message for specific fix commands.
  #
  #   Branch errors:
  #   - Create missing branch: cd private/<sm> && git checkout -b <branch>
  #   - Push branch: git push -u origin <branch>
  #   - Checkout existing: cd private/<sm> && git checkout <branch>
  #
  #   PR linking errors:
  #   - No open PR: cd private/<sm> && gh pr create --title "..." --body "..."
  #   - PR not linked: Edit console PR description to include submodule PR URL
  #
  # WHEN SUBMODULES STAY ON MAIN:
  #   If submodule pointer matches origin/main, no branch coordination needed.
  #   The submodule will stay on main and this check passes.
  #
  # Alone rather than in a lane: it is the only gate needing full history AND
  # submodules AND a PR-metadata token, and it is 6 seconds of work once the
  # checkout stops downloading historical blobs it never reads.
  # ==============================================================================
  quality-submodule-branches:
    name: Submodule Branches
    runs-on: ubuntu-slim
    timeout-minutes: 12
    # Runs on PRs (the coordinated-branch rules) AND on main (the stronger rule
    # that every gitlink is reachable from the submodule's own origin/main). The
    # script's header claimed push-to-main coverage for a long time while this
    # condition granted only `pull_request`, so the invariant it advertised was
    # enforced nowhere. On a pull_request `github.ref` is refs/pull/N/merge, so
    # the first clause covers PRs and the second picks up push, schedule and the
    # nightly rehearsal on main.
    if: inputs.is_bot != 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: pr-read   # gh pr list in check-submodule-branches.sh
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none   # see quality-branch
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Validate submodule branches
        run: .ci/scripts/quality/check-submodule-branches.sh
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # NOTE: Review checks (resolved threads + unreplied comments) are in
  # review-gate job in ci.yml. They enforce whatever threads the Claude
  # review (or a human) left on the PR.

  # ============================================================================
  # L4 CODE -- node + submodules + account deps. The source-shape lane.
  # Absorbs: versions, format, lint, typescript, cli-examples, workflows.
  # ============================================================================
  quality-code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # Runs before node on purpose: it reads .npmrc as text, and a broken
      # .npmrc is exactly what would make the install below lie.
      - name: Block legacy-peer-deps workarounds
        run: .ci/scripts/quality/check-npmrc.sh

      # THE INSTALL THE COMMENT ABOVE ALREADY REFERRED TO. Most steps in this job
      # are shell scripts needing no node, but two are tsx -- check:ci-gate-manifest
      # and check:ci-runner-selftest -- and without a node_modules tree they die
      # with `sh: 1: tsx: not found`, exit 127. Measured on run 33125687081: that
      # 127 failed Quality / Code and the watchdog cancelled seven sibling jobs,
      # so a missing dependency read as a broad CI failure.
      #
      # Defaults deliberately: no account submodule, no natives, no package build.
      # This job needs only node plus the cached tree, which untars in ~2.5s.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Text + a hermetic scratch git repo; no network, no submodule access.
      # Guards the bootstrap scripts against silently swallowing failures again.
      - name: Devcontainer script stderr visibility
        run: .ci/scripts/quality/check-devcontainer-scripts.sh

      # Hermetic: greps the setup helpers and runs `setup --check`, which is
      # report-only. Installs nothing and needs no docker.
      - name: Setup path idempotency
        run: .ci/scripts/quality/check-setup-idempotency.sh

      # One definition per gate-tool version, and nothing acquired unpinned.
      # Before this, ruff was pinned twice, PyYAML four times, and shfmt and
      # shellcheck not at all -- so the same gate reached different verdicts on
      # a host, in the devbox and here.
      - name: Shell file size
        run: .ci/scripts/quality/check-shell-size.sh

      - name: Devbox exec invocation
        run: .ci/scripts/quality/check-devbox-exec.sh

      - name: Toolchain pins
        run: .ci/scripts/quality/check-toolchain-pins.sh

      - name: Toolchain env/Dockerfile sync
        run: .ci/scripts/quality/check-toolchain-env-dockerfile-sync.sh

      # The pinned-tools definition and the host-toolchain runtime guard's call
      # sites are two independently maintained lists; a tool added to one and
      # not the other is invisible until someone hits it by hand.
      - name: Host toolchain runtime coverage
        run: .ci/scripts/quality/check-host-toolchain-coverage.sh

      # A git identity capture (branch/ref/sha) guarded against empty but not
      # against a command's own misleading sentinel value is invisible to a
      # gate that only watches whether git itself succeeded.
      - name: Git-op conditional guards
        run: .ci/scripts/quality/check-git-op-conditionals.sh

      # A script that INSTALLS a go tool must be able to FIND it. `go install`
      # writes to $(go env GOPATH)/bin, which is on no PATH by default, so a
      # bare invocation dies at 127 the line after a successful install. CI
      # never sees it -- actions/setup-go adds that directory itself -- which is
      # exactly why four instances accumulated in the submodule unnoticed.
      - name: Go tool PATH
        run: .ci/scripts/quality/check-go-tool-path.sh

      # check:ci-parity proves a gate is WIRED into a workflow. It says nothing
      # about whether the JOB it landed in can execute it -- wired and runnable
      # are different claims, and only the first was checked. Run 33125687081
      # cost seven cancelled sibling jobs to that gap.
      - name: Gate prerequisites
        run: npm run check:ci-gate-prerequisites

      # A step invoking a PR_HEAD_REF-preferring script must set it. Found by
      # hand three times in one session before this gate existed.
      - name: PR_HEAD_REF completeness
        run: npm run check:ci-pr-head-ref-completeness

      # A guard must refuse a COMMAND, never a SENTENCE about one. Probes each
      # pre-bash guard with prose built from its own pattern; anchoring is the
      # fix, never deleting the pattern.
      - name: Guard mention anchoring
        run: npm run check:ci-guard-mention-anchoring

      # The enforcement layer cannot quietly disarm itself: guards are
      # inventoried shrink-only, and each must keep a case proving it blocks
      # AND one proving it allows. Block-only coverage cannot see
      # over-blocking, and an over-blocking guard is one that gets deleted.
      - name: Hook integrity
        run: .ci/scripts/quality/check-hook-integrity.sh

      # The manifest decides which gates the PRE-PUSH lane runs, so a wrong
      # `slow` marking or a path set that omits a gate's own implementation
      # silently shrinks local coverage. Both directions are pinned in its
      # --selftest, which this step runs first.
      - name: Gate manifest self-consistency
        run: npm run check:ci-gate-manifest

      # TRAPS.md is the ledger of which instrument protects what. Every entry
      # names a pointer that must RESOLVE and be LIVE, or declares
      # JUDGMENT-ONLY and says what nothing reaches. The gate plants its own
      # defects first and refuses to judge the tree if any control misbehaves.
      - name: Trap registry dispositions
        run: npm run check:ci-trap-registry

      # The ci-runner's own controls. They ran on ONE side until now: `npm run
      # ci` executed them locally and nothing in CI did, which is the exact
      # asymmetry check:ci-parity exists to name.
      - name: CI runner selftest
        run: npm run check:ci-runner-selftest

      # Hermetic text check: the canonical CI-watch loop must live in one
      # place and be attempt-stable. Nine divergent copies existed before this,
      # several handing out a form that exits on the first `completed` -- which
      # a watchdog re-run makes a superseded attempt's verdict.
      - name: CI-watch recipe has one source
        run: .ci/scripts/quality/check-ci-watch-recipe.sh

      # `producer | grep -q` under pipefail is a RACE, not a test: grep -q exits
      # at its first match, SIGPIPEs the producer, and pipefail makes that 141
      # the verdict. The step above shipped exactly that in both of its
      # detectors and certified "124 file(s) clean" over a real offender.
      - name: No racing pipefail/grep -q detectors
        run: npm run check:ci-pipefail-grep-q

      # Every CLI flag a script has must be taught in its canonical doc, or a
      # flag exists that no session reading only the doc would ever learn.
      - name: CLI docs stay in sync with their scripts' real flags
        run: .ci/scripts/quality/check-cli-doc-coverage.sh

      # Meta-gate: a control built by pattern substitution must prove the plant
      # landed, or a reworded target line turns the control green against
      # unmutated source.
      - name: Control-first gates prove their plant landed
        run: .ci/scripts/quality/check-control-vacuity.sh

      # Also text-only and also before node: a script that cannot execute
      # fails with exit 126 before emitting anything, which is invisible to
      # any caller that counts output rather than exit codes.
      - name: Block non-executable invoked scripts
        run: .ci/scripts/quality/check-script-exec-bit.sh

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: .ci/scripts/version/bump.sh --version ${{ inputs.next_version }}

      # account: knip scans the account submodule trees and needs their deps to
      # resolve imports there; check:ci-dead-bash's corpus includes private/**.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'

      # Runs AFTER setup-workspace on purpose: this one is TypeScript and needs tsx,
      # unlike the two text-only checks above it in this job. Placing it beside them
      # cost a CI cycle to "tsx: not found" (exit 127).
      #
      # Reads the committed naturalization provenance. private/growth is a separate
      # repo and gitignored here, so the ledger is the only place CI can see which
      # model actually ran.
      - name: Naturalization model policy
        run: npm run check:ci-naturalization-model-policy

      # TypeScript, so it belongs AFTER setup-workspace for the same reason the
      # step above says so. Pairs with "Block legacy-peer-deps workarounds"
      # earlier in this job: that one keeps ignore-scripts=true in .npmrc, this
      # one keeps every root-workspace installer rebuilding the natives that
      # flag blocks. The developer path was the blind spot -- `./run.sh setup`
      # and `ensure_deps` both shipped a bare `npm install`.
      - name: Native modules rebuilt after every root install
        run: npm run check:ci-native-rebuild

      # TypeScript, so it sits after setup-workspace for the same reason the
      # steps above do. Guards .claude/hooks/stop/wl_git.py, which is the only
      # module permitted to drive a force push: it assembles an argv inside
      # Python and hands it to git via subprocess, so every pre-bash guard is
      # structurally blind to it and this static check is the only watcher.
      - name: Mediated git tool stays lease-only and dry-run by default
        run: npm run check:ci-git-tool-safety

      # ./run.sh setup is meant to be re-run freely. When setup() shelled out to
      # npm directly instead of going through ensure_deps, every invocation
      # recompiled cpu-features through node-gyp on an unchanged machine.
      - name: Bootstrap paths install through the dependency stamp
        run: npm run check:ci-bootstrap-idempotency

      # allow_squash_merge is false on all five repos, so a prescribed --squash
      # is a command that cannot succeed -- and two of the five sites were hook
      # refusal messages, which carry the most authority and the least checking.
      - name: Instruction files do not prescribe a rejected merge method
        run: npm run check:ci-merge-method-prose

      # An undeclared binary is a mute exit 127, not a missing feature: it kills
      # the script before its own error paths can speak. Cost one live incident
      # in review-status.sh on a host without unzip.
      - name: CI scripts declare the binaries they execute
        run: npm run check:ci-shell-declared-commands

      # The description's epic block drives the per-epic review, so it must
      # agree with agent/pr/<branch>.md. PR_NUMBER lets it check the live body;
      # without it the gate still validates the snapshot and says so.
      - name: PR epic block matches the published worklist
        run: npm run check:ci-pr-epic-block
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sibling of the same gap: the script itself already prefers
          # PR_HEAD_REF (scripts/check-pr-epic-block.ts:114), but nothing set
          # it, so on this workflow_call chain's detached checkout it fell all
          # the way to `git branch --show-current` (empty) and the check
          # silently reported "skipped: on an unknown branch" instead of
          # actually validating the epic block.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # The local hook cannot read a -F message, so this is where the trailer
      # rule is actually enforced, against the commits that really landed.
      - name: Every commit names its epic
        run: npm run check:ci-pr-task-trailers
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: origin/${{ github.event.pull_request.base.ref }}

      # Text-only on purpose: it reads the pin file and the Go constant, never the
      # registry. A gate that needs the network fails for reasons unrelated to what
      # it guards.
      - name: Ceph image pin freshness
        run: npm run check:ci-ceph-image-pin

      - name: Verify no peer dependency conflicts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-peer-deps.sh

      - name: Versions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run version:check

      # An npm-10 vs npm-11 lockfile drift only ever surfaced as a red `npm ci`
      # in a later job.
      - name: Lockfile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-lockfile

      # Beside Lockfile deliberately: both gates are about files INSIDE
      # private/account, and this is a job whose checkout sets submodules: true.
      # It first landed in quality-branch, which checks out none, where it turned
      # two correct exclusions into 'dead entry' findings (job 100494921545).
      - name: syncpack source coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-syncpack-sources

      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:format

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:lint

      - name: Unused exports (knip)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint:unused

      - name: Check account route layer isolation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-layer-isolation

      # knip's own ignore entries are BLOCKER-gated.
      - name: knip BLOCKER reasons
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-knip-blockers

      # Bash had no dead-code detector at all; this is the analogue of the knip
      # run above. It is a `tsx` gate (needs node_modules, CI died with
      # `tsx: not found`, exit 127) and its corpus includes private/**, so
      # without submodules it silently scans a smaller tree and under-asserts.
      - name: Dead bash
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-dead-bash

      # Before TypeScript, not after: this asserts the chain below actually POINTS at
      # every tsconfig in the repo. A project nobody runs cannot fail, so a green
      # TypeScript step says nothing about it.
      # The Nth copy of a shape. SEEDED at scripts/data/shape-duplication-seed.json, so
      # the 219-span standing backlog is silent and only a NEW shape reaching 3 copies
      # reports. Draining that backlog is separate, measured work.
      # Every www build must pass github.token. Found and fixed by hand at two of
      # three call sites, twice, before the third reddened job 99839065246.
      # A calibrated rubric may not change without being re-calibrated. Editing one
      # is cheap and silent; re-calibrating costs 14 live model calls.
      - name: Rubric calibration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-rubric-calibration

      - name: www build token
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-www-build-token

      - name: Shape duplication
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-shape-duplication

      - name: Fetch retry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-fetch-retry

      - name: Judged rule wiring
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-judged-rule-wiring

      - name: Review prompt render
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-review-prompt-render

      - name: Git history depth
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-git-history-depth

      - name: Typecheck scope coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-typecheck-scope-coverage

      - name: TypeScript
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck

      # The tree first: nine validators (this lane's included) read
      # command-tree.json as their model of the CLI, and a stale one fails OPEN
      # — they keep passing while checking a CLI that no longer exists.
      - name: Command tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-command-tree

      - name: CLI examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:cli-examples

      - name: Command planes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-command-planes

      - name: Design tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-design-tree

      - name: Schema coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-schema-coverage

      - name: Shared constant duplication
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-shared-constant-duplication

      - name: Runtime imports are dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-runtime-imports-are-deps

      - name: Backup manifest shape parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-backup-manifest-shape-parity

      - name: CI fetch integrity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-fetch-integrity

      - name: AWS credential bridge
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-aws-credential-bridge

      - name: Worker secret names
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-worker-secret-names

      - name: Builder env contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-builder-env-contract

      - name: Backup bucket conformance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-backup-bucket-conformance

      - name: Backup protocol conformance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-backup-protocol-conformance

      - name: No client-side key composition
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-no-client-key-composition

      - name: Retention knob parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-retention-knob-parity

      - name: Test suites are CI-reachable
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-test-scripts-reachable

      - name: Every source file reaches a linter
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_lint_scope_coverage.py

      - name: Workflow banned patterns
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-workflows.sh

      # Prevents GHA transitive-skip propagation (finding J) from silently
      # disabling downstream jobs, enforces the reusable-workflow secret
      # contract, and enforces the ubuntu-slim timeout rule (CHECK 3).
      - name: Workflow structural gates
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-workflow-gates

      - name: Greenlight closure paths
        run: npm run check:ci-greenlight-closures

      # .ci/breakpoint/ is VENDORED into other repos, so a local edit here is
      # invisible to them and a local edit THERE is silently reverted by the
      # next re-vendor. This proves the copy matches its manifest, and also
      # cmp's workflow/breakpoint.yml against the live .github/ copy -- which
      # matters because every other workflow gate scans .github/ only, so the
      # template would otherwise be unreviewed by any of them.
      - name: Breakpoint drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-breakpoint-drift

      # Keep the CI App off `administration`, which gates environment CRUD.
      - name: App admin permission
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-app-admin-perm

      # Pinned-action freshness + BLOCKER validation of
      # .actions-upgrade-blocklist. GITHUB_TOKEN is REQUIRED, not a nicety:
      # unauthenticated calls hit the 60 req/h GitHub API limit, and the script
      # then reports those actions as "unknown" and still exits 0 — a silent
      # fail-open that would make this gate meaningless exactly when it is rate
      # limited.
      # Parses workflow YAML rather than grepping it: `${{ }}` expression syntax
      # and types, matrix property references, runner labels, action input
      # names. Catches the class where a bad expression makes a run start with
      # ZERO jobs and no error message anywhere -- which reached main and was
      # only found by dispatching the workflow. Also the only gate that sees
      # workflow TEMPLATES under .ci/*/workflow/, which .github-scoped gates
      # cannot.
      - name: Workflow lint (actionlint)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-actionlint

      - name: Action freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}

      # The proven rediacc/console#549 instance: this gate sat in the local
      # chain and in no workflow, so nothing in CI ever ran its real scan. It is
      # NAMED by test-gate-anti-vacuity.sh:104, and that test ran green for
      # weeks while the scan never executed once -- which is why mentioning a
      # script never counts as coverage in check-ci-parity.ts.
      - name: jq boolean defaults
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-jq-boolean-default

  # ============================================================================
  # L5 CONTENT -- node + submodules. Content, tutorials, and every gate that
  # touches the public network.
  # Absorbs: content, locale-tutorial-assets, tutorial-casts,
  #          tutorial-caption-sync, tutorial-parity, e2e-coverage, deps,
  #          external-links, dkim-notify.
  #
  # The three network gates (check:deps, check:ci-external-links,
  # check:ci-dkim-notify) are concentrated HERE deliberately: quality jobs never
  # auto-retry (WATCHDOG_NO_RETRY_PATTERNS), so a transient DNS or registry blip
  # reddens a lane with no second chance. Keeping all three in one lane bounds
  # that blast radius to one lane instead of three.
  # ============================================================================
  quality-content:
    name: Content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY DOCKERHUB_TOKEN
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - id: setup
        uses: ./.github/actions/setup-workspace

      - name: Check content for AI slop patterns
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-content-quality.sh

      - name: Verify NIS2 directive quotations match the official source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-nis2-quotes

      # Source-only content gate. check:ci-seo/-redirects/-cta-bolt all need a
      # built www, so they live in quality-www-build instead.
      - name: CSS DOM references
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-css-dom-refs
      - name: SVG theme reach
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-svg-theme-reach
      - name: Dead CSS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          npm run check:ci-dead-css
          npm run check:ci-viewport-unit-mixing
          npm run check:ci-illustration-contract
      # Gate 1 of the sentence-wrapping pair: asserts every multi-sentence catalog
      # value rendered in text position goes through <Sentences>, which makes each
      # sentence an atomic line-breaking unit. Source-level, sub-second. The step name
      # must match the manifest `step` byte for byte or check:ci-parity fails.
      - name: Sentence wrapping
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-sentence-wrapping
      # Every doc needs a hand-authored browse thumbnail; there is no regenerate
      # script, so a gap ships a blank card in all 13 locales silently.
      - name: Docs thumbnail coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-thumb-coverage
      # A copy button on a bare `}` or a YAML key hands the reader something they
      # cannot paste; the classifier is lifted out of DocsLayout.astro and judged
      # against the real corpus.
      - name: Docs code-block copy units
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-copy-units
      # Structural cover for three fixes a browser would otherwise have to catch: the
      # sr-only tally, one shared heading rule, and the pre-paint category decision.
      - name: Docs browse invariants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-browse-invariants
      # Skills an agent edits itself are capped, so improving one means sharpening
      # it rather than appending to it.
      - name: Self-improving skill size
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-skill-size
      # The language picker must stay out of Plyr's quality pane, which plays a
      # language nobody chose, and inside the player frame.
      - name: Video player invariants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-video-player-invariants
      # Fourth pin kind to join the shared soak window, after npm deps, embedded assets
      # and GitHub Actions. DOCKERHUB_TOKEN keeps Docker Hub's anonymous rate limit from
      # making this vacuous; without it a limited response is reported as unknown and the
      # gate FAILS rather than pretending everything is current.
      - name: Docker image freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: npm run check:ci-docker-image-freshness
      - name: Baseline key semantics
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-baseline-key-semantics
      - name: Test-gate wiring
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-test-gate-wiring
      - name: Pricing consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-pricing-consistency

      - name: Validate per-locale tutorial video assets exist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-locale-tutorial-assets

      - name: Validate tutorial card fonts cover every locale
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # This gate reads real font files, so the faces the cards are mapped to
          # must exist here. DejaVu Sans is vendored in-tree; these three are not.
          # Package names verified against the apt index, not guessed.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-jetbrains-mono fonts-wqy-zenhei
          npm run check:ci-tutorial-card-fonts

      - name: Validate localized solution videos exist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-solution-videos

      # Existence is not currency. The gate above passes on a video that exists; this one
      # asserts the manifest records the CURRENT narration engine. Added after a live
      # marketing page was found still playing Qwen3-TTS months after the VoxCPM2
      # migration, with 207 of 273 pairs stale and nothing anywhere saying so.
      - name: Validate solution narration engine is current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-solution-video-engine

      # media_quality: reads the recorded .cast files themselves, so a
      # re-recording pass in flight makes it red on media that is already
      # being repaired. Skipped ONLY on a no-media-quality PR; the announcer
      # step at the end of this job names it when that happens.
      - name: Block fallback hacks and error output in tutorial recordings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.media_quality != 'skip' }}
        run: npm run check:ci-tutorial-casts

      - name: Validate published tutorial word-timing sync (real ASR alignment, not estimated)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-caption-sync

      # Field-aware: validates card.commandFull and teardownCommand against the
      # live CLI tree. Runs BEFORE parity because a storyboard command that does
      # not exist is a worse failure than one that merely disagrees with its
      # recording -- teardownCommand is executed by the harness, and
      # card.commandFull is generated into the portal's first-run flow.
      - name: Validate tutorial storyboard commands against the live CLI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-commands

      # Tutorial scripts run headless inside asciinema. A command that stops to
      # ask "are you sure?" never returns, and `2>/dev/null || true` hides the
      # question rather than preventing it -- one such line hung a re-record for
      # six hours.
      - name: Validate tutorial commands are non-interactive
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-noninteractive

      # A local run is the promise that a developer finds CI failures before
      # pushing, and the promise has to hold in BOTH directions: a gate wired
      # into a workflow but not into the local set breaks it forwards, and a
      # gate that runs only locally is a gate CI never enforces. This one gate
      # replaced the two that each checked one direction; the third relation
      # (local-only, rediacc/console#549) had no gate at all.
      #
      # The step NAME here deliberately no longer contains a literal npm
      # invocation. The old name did, and matching whole workflow text for
      # `npm run ci` made the entire gate set look CI-executed, which reported
      # perfect parity forever.
      - name: Validate parity between the local gate set and the CI quality surface
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-parity

      # Tutorials are EXECUTABLE documentation: CI runs the sequence against real
      # VMs and customers follow the same steps by hand. A renamed command or flag
      # otherwise surfaces 20 minutes into a provisioned job, or in public.
      - name: Tutorial CLI validity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_tutorial_cli_validity.py

      # getCombinedOutput() lowercases, so an assertion expecting a capital can
      # NEVER match and reports the product broken while it is behaving. Four of
      # these shipped in one wave, each costing a five-distro CI round.
      - name: E2E case-blind assertions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_e2e_case_blind_assertions.py

      # A tutorial is executable documentation, so a skipped one is a
      # customer-facing page nothing verifies. Skipping is denied outright:
      # fix the tutorial rather than excusing it from the run.
      - name: Tutorials cannot skip themselves
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_tutorial_no_skips.py

      # knip has no class-member issue type, so an unused method on an exported
      # singleton service is invisible to it. Nine of them had accumulated.
      - name: Dead service methods
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-dead-service-methods

      # A gate can be green over files the RENDERER ignores: 12 locales of the
      # cheat sheet were corrected while the page served hardcoded English
      # teaching retired commands. This checks what a reader is taught.
      - name: Retired commands in docs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-retired-commands

      # media_quality: cross-checks the recordings against their storyboards
      # and transcripts, so it fails on any half-finished re-recording pass.
      # Same narrow, announced hold as the cast gate above.
      - name: Validate tutorial cast/storyboard/transcript/mdx parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.media_quality != 'skip' }}
        run: npm run check:ci-tutorial-parity

      - name: Validate account onboarding splash against canonical tutorials
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-onboarding

      - name: Check E2E test coverage for all renet functions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-e2e-coverage.sh

      - name: i18n value types match English
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_i18n_value_types.py

      - name: Enabled lint rules can actually fire
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_lint_rule_liveness.py

      - name: Agent hints can actually fire
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_agent_hint_liveness.py

      # Static half of the zero-skip contract: every topology subdir of tests/
      # must be excluded by the base playwright.config.ts, so the E2E Workers
      # job never collects-then-skips a foreign-topology suite. The runtime half
      # is run-e2e.sh --fail-on-skip in the E2E jobs themselves.
      - name: Check E2E skip hygiene (no collected-then-skipped suites)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-e2e-skip-hygiene

      # external_quality (not the old inline label expression): hard on a
      # normal PR, absent on a labelled one, soft on the nightly. The old
      # guard was PR-only, so this gate never ran on schedule at all; now it
      # runs there too, warning instead of blocking.
      - name: External dependency freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:deps
        env:
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}

      - name: External links
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:ci-external-links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}

      # Same external_quality treatment as external-links: both do live
      # public-network lookups, so both skip on a labelled PR (offline branch
      # work) and soften on the nightly.
      - name: DKIM notify DNS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:ci-dkim-notify
        env:
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}

      # Runs unconditionally, and is NOT behind media_quality: a skipped step
      # is invisible (the job still reports success), so without this the two
      # holds above would leave no trace anywhere in the log. It also refuses
      # an unrecognised media_quality value, which is the only place a typo in
      # that wiring is ever reported -- the step `if:` above would silently
      # treat it as "run".
      - name: Announce media gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.media_quality }}
        run: .ci/scripts/quality/announce-gate-skips.sh no-media-quality check:ci-tutorial-casts check:ci-tutorial-parity

  # ============================================================================
  # L6 PACKAGES -- node + submodules + built packages + native modules.
  # Absorbs: account-portal, config-migrations, shared-tests, cli-unit-tests.
  # ============================================================================
  quality-packages:
    name: Packages
    runs-on: ubuntu-latest
    # 15 -> 20 for the Stop-hook worklist suite added below (MEASURED 4m6s,
    # 693 assertions, 2026-08-15). ubuntu-latest has no hard cap, unlike the
    # slim lanes, so raising it here is meaningful rather than cosmetic; the
    # neighbouring www-build and security lanes already sit at 20.
    timeout-minutes: 20
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      # natives: config-migrations loads the CLI's runtime imports, which pull
      # in ssh2/cpu-features. build-packages: the cluster services import
      # @rediacc/provisioning through its dist/, and check-account-portal.sh
      # typechecks against @rediacc/shared's dist.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          natives: 'true'
          build-packages: 'true'

      - name: Check account portal (typecheck + build)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-account-portal.sh

      - name: Account portal unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-test-account-web

      - name: Check config-migration runner + fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-config-migrations.sh

      - name: Shared ESM resolvable
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-shared-esm-resolvable

      - name: Run shared package tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test --workspace=@rediacc/shared

      - name: Run www unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:unit --workspace=@rediacc/www

      # This gate drives a real browser via `agent-browser`, and this job never
      # installed one -- it never ran in CI before today (see the manifest.ts
      # comment on check:test:tutorial-player), only locally on a devbox that
      # already has it. Installed from $HOME, not the repo checkout: this
      # repo's own .npmrc sets ignore-scripts=true, which silently skips the
      # postinstall that selects and chmods the platform binary.
      - name: Install agent-browser
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cd "$HOME" && npm install -g agent-browser@latest --ignore-scripts=false

      # A silent-install failure (a broken postinstall, a PATH the shell that
      # ran npm install cannot see, a platform binary that never got selected)
      # would otherwise surface downstream as the browser gate's own confusing
      # symptom -- exactly the "root cause invisible" shape a stop-hook judge
      # sweep named 2026-08-30. This makes the environment check its own
      # named, explicit step: a broken install fails HERE, with its real
      # cause, instead of two steps later as an unrelated-looking test error.
      - name: Verify agent-browser is functional
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: agent-browser --version

      # Video assets under packages/www/public/assets/tutorials/ are gitignored (see
      # CLAUDE.md's Media Assets section) -- a fresh CI checkout has none of them, and
      # without this var the plugin that embeds tutorial videos
      # (packages/www/src/plugins/remark-tutorial-embed.ts) falls back to a local path
      # that can never resolve here. Without it this gate could not ever observe real
      # playback: the <video> src 404s, readyState never leaves 0, and every scenario's
      # "did not enter playing state" assertion fails deterministically, indistinguishable
      # from a real player regression. cd-deploy-worker.yml sets the same var for the
      # same reason (its "Build pages" step) -- confirmed reachable: `curl -sI
      # https://media.rediacc.com/tutorials/video/en/tutorial-production-mode.mp4` -> 200.
      - name: Tutorial player release gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:test:tutorial-player
        env:
          PUBLIC_VIDEO_CDN_BASE_URL: https://media.rediacc.com

      # THE EVIDENCE WAS BEING COLLECTED AND THROWN AWAY. The gate writes a summary,
      # screenshots and (on a navigation timeout) the browser's pending requests plus the
      # dev server's own output into artifacts/ -- and nothing uploaded them, so every one
      # of the three observed failures died with the runner naming only "Operation timed
      # out". At an ~8% failure rate the cause is a handful of runs away, but only if the
      # run that fails leaves something behind.
      - name: Upload tutorial player gate artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tutorial-player-release-gate-${{ github.run_attempt }}
          path: artifacts/tutorial-player-release-gate/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run CLI unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:unit --workspace=@rediacc/cli

      # Runs the CLI tests against a deliberately broken copy of the source and
      # requires them to FAIL. The unit step above reports that the tests pass;
      # it is blind to whether any assertion pins the behaviour it names, which
      # is how a vacuous wrapProse test and a colWidths crash shipped together.
      - name: Guard mutations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-guard-mutations

      # A tutorial app healthcheck sized while watching a fast machine aborts the
      # whole non-resumable 18-cast recording on a slower one. Static, because no
      # CI gate can afford to record 18 casts against a VM fleet.
      - name: Tutorial healthcheck headroom
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-healthcheck-headroom

      # The stop hook's own suite (693 assertions). It lives in this lane, not
      # in Static, for two reasons: it IS a test suite like its neighbours, and
      # Static runs on ubuntu-slim whose HARD 15-minute cap kills the job as
      # "cancelled" with no failed step. Raising a slim timeout past 14 is
      # therefore meaningless and is refused by check-workflow-gates.sh CHECK 3.
      # Measured 4m6s locally on 2026-08-15.
      #
      # check:ci-mutate-check does NOT cover this: it drives a miniature
      # fixture-suite to prove the mutation RUNNER still reports four verdicts,
      # and never runs the real suite.
      - name: Stop-hook worklist suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .claude/hooks/stop/test-worklist-v5.sh

      # The generated CLI contract drives the web console, `rdc --proxy` and
      # the executor. It was RED at HEAD when first run here: a stale value
      # leaked into the `backup list --storage` example and merged green.
      - name: CLI contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-cli-contract

  # ============================================================================
  # L7 i18n -- alone. Needs full history (translation freshness diffs against
  # origin/main), the account submodule, built packages, AND a ~100s R2 audio
  # restore that no other gate wants.
  # ============================================================================
  quality-i18n:
    name: i18n
    # ubuntu-latest, not ubuntu-slim: this job restores the tutorial-narration
    # audio cache from R2 (see the step below), which needs the AWS CLI. Every
    # other `aws s3` consumer in this repo already runs on ubuntu-latest, and
    # ubuntu-slim is a minimal image -- check-workflow-gates.sh notes pyyaml is
    # absent from it by default, and check-commands.sh exists precisely because
    # commands "may not be available in ubuntu-slim". Without the restore the
    # per-file audio assertion silently disables itself, which is the false
    # green this change removes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID
            CLOUDFLARE_R2_MEDIA_ENDPOINT > BWS_CLOUDFLARE_R2_MEDIA_ENDPOINT
            CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID CLOUDFLARE_R2_MEDIA_ENDPOINT CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID }}
          GH_CLOUDFLARE_R2_MEDIA_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_MEDIA_ENDPOINT }}
          GH_CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,account
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # validate:translation-freshness computes `git diff origin/main...HEAD`
          # to detect which English docs changed in this PR. A shallow clone
          # with a branch that's many commits ahead of main silently produces
          # an empty diff, so the script becomes a no-op. Full history is
          # required for the freshness gate to actually fire.
          fetch-depth: 0
          filter: blob:none   # see quality-branch
      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account
      # build-packages: check:i18n runs check:cli-docs, which imports the
      # LIVE Commander tree (packages/cli/src/cli.js) rather than a
      # hand-maintained list. That import pulls in kvm-provisioner.ts ->
      # @rediacc/provisioning, whose package main is ./dist/index.js. Without
      # this the gate does not fail — it CRASHES with ERR_MODULE_NOT_FOUND,
      # which is why it went unnoticed locally, where dist/ is already warm.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          build-packages: 'true'

      # check:ci-i18n-media -> validate:content-media -> validate:tutorial-audio
      # asserts that every narration .mp3 referenced by a tutorial timeline
      # exists on disk. The audio cache is gitignored and lives in R2, so
      # without this restore AUDIO_TREE_PRESENT is false
      # (validate-tutorial-audio.js:63) and that assertion silently skips --
      # the gate has never once run it in CI. Failing here is deliberate: a
      # skip is exactly the false-green this step exists to remove.
      #
      # Deliberately NOT held by media_quality: it is a setup step, not a
      # gate. On a labelled PR it restores a cache nothing then reads, which
      # costs a little time and removes one more way for the label to change
      # what the job does beyond the three gates it is allowed to hold.
      - name: Restore tutorial-narration audio cache from R2
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_MEDIA_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_MEDIA_ENDPOINT }}
        run: .ci/scripts/deploy/sync-media-from-r2.sh --audio-only

      - name: i18n
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:i18n

      # The three tutorial-media validators (transcripts, narration audio,
      # cast output), split out of check:i18n so the no-media-quality label
      # can hold exactly these without touching the rest of the i18n surface.
      # check:i18n no longer chains them, so this step is the only thing that
      # runs them in CI -- check:ci-parity holds the step name and the
      # manifest entry to each other in both directions.
      - name: Tutorial media
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.media_quality != 'skip' }}
        run: npm run check:ci-i18n-media

      # Unconditional, for the same reason as the twin in quality-content: a
      # held gate that prints nothing is indistinguishable from a passing one.
      - name: Announce media gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.media_quality }}
        run: .ci/scripts/quality/announce-gate-skips.sh no-media-quality check:ci-i18n-media

      - name: Search index
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-search-index

      - name: i18n placeholders
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-placeholders

      - name: i18n untranslated
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-untranslated

      - name: i18n command parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-command-parity

      # This is the gate whose planted-defect selftest shipped behind a flag
      # nothing invoked (2026-07-29). It then spent its life in the local chain
      # and in no workflow, so the CI half was inert for a second, independent
      # reason. Both halves are closed now: the key runs the real scan, and this
      # step runs the key.
      - name: i18n cross-locale
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-cross-locale

      - name: Docs structure parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-structure-parity

      - name: Locale sources
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-locale-sources

      # Source-level complement to Docs render parity in quality-www-build: a page or
      # layout under packages/www/src that imports a markdown file via `?raw`, or names
      # src/content/docs/en/ by path, is serving one language to thirteen routes by
      # construction. No build, so it belongs in this lane rather than behind an astro
      # build. `?raw` on a stylesheet stays legal -- a stylesheet has no language.
      - name: Page locale imports
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-page-locale-imports

      # A TENANT of this lane, not an i18n gate. It is here for one property:
      # the fetch-depth 0 checkout above is the only deep one in a job that also
      # runs on the NIGHTLY. On a shallow checkout `git log -- <plan>` returns the
      # GRAFT commit for every file and this gate would report a confident "none
      # over 33 days" forever -- so it REFUSES a shallow checkout rather than
      # answering. A clock-driven gate also needs the nightly, or a plan crossing
      # the threshold first surfaces by ambushing an unrelated PR.
      - name: Plan file housekeeping
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-plan-housekeeping

  # ============================================================================
  # L8 BUILT-WWW GATES -- alone. One astro build is the expensive input.
  #
  # check:ci-redirects HARD-requires packages/www/dist/route-manifest.json and
  # check:ci-seo's built-HTML link scan self-skips without packages/www/dist. No
  # CI job built www, so both gates lived in `npm run ci` and ran nowhere -- the
  # redirect table that fronts every marketing URL was validated only on a
  # laptop. One astro build buys both gates at full strength.
  # ============================================================================

  quality-www-build:
    name: Built-www Gates
    # Standard runner (not ubuntu-slim), for the same reason build-www in
    # ci-build-docker.yml already uses one: an astro build of the 13-locale site
    # does not reliably fit on 1 vCPU.
    #
    # Measured across eight consecutive runs 2026-07-27: it finished in 4, 4, 4,
    # 5 and 7 minutes when it fitted, and was KILLED at 14 and 15 minutes when it
    # did not. Roughly a one-in-four failure rate on a required quality lane.
    #
    # The kill is worse than a timeout. `timeout-minutes: 12` never fired,
    # because the runner could not interrupt the build: the job ran 15.2 minutes
    # and the platform's hard 15-minute slim cap ended it, which surfaces as
    # `cancelled` with NO failed step. The log's last words were the runner
    # terminating orphan `npm run build:www` / `node` / `esbuild` processes. A
    # cancelled job and a passing job look identical in a run summary, so this
    # read as noise rather than as a job that never finished.
    #
    # Per CHECK 3 in .ci/scripts/security/check-workflow-gates.sh, a bigger
    # timeout is NOT the fix: "the number is not a dial, it is an assertion that
    # this job fits on this runner." It does not fit, so it moves.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # Submodules are for the workers/www tests below, not for the www build:
      # workers/www/src/index.ts imports private/account/src/{app,db/schema,types/env}.js
      # directly, so vitest cannot resolve them without the account submodule.
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          build-packages: 'true'

      - name: Build www (produces dist/route-manifest.json)
        id: build-www
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build:www
        env:
          # REQUIRED, not a nicety. `downloads.astro` fetches the latest release
          # from the GitHub API at build time and deliberately THROWS rather than
          # shipping a downloads page with no downloads on it. Unauthenticated
          # that call is capped at 60/hour per runner IP, which is shared, so the
          # build fails intermittently with "403 rate limit exceeded" for reasons
          # that have nothing to do with the commit under test. Observed live on
          # run 32223128728, where the error message named this exact fix.
          # `github.token` is injected automatically and is read-only.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Redirects
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-redirects
      # Runs inside the official Playwright container, so the runner needs no browser and
      # no `playwright install`. The image comes from mcr.microsoft.com, which serves it
      # anonymously and does NOT rate limit, so this needs no docker login and cannot fail
      # with "toomanyrequests". See .ci/scripts/quality/browser-smoke.sh.
      - name: Browser smoke
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-browser-smoke

      # Guards what browser-smoke cannot see: a page can render perfectly, log nothing,
      # and still offer the visitor no way to act while reserving space it never fills.
      # A captcha-gated form must handle the captcha never arriving. Six forms shipped a
      # guard that fired while its widget was absent, stranding the visitor.
      - name: Captcha recovery
        run: npm run check:ci-captcha-recovery

      - name: Page density
        run: npm run check:ci-page-density
      # One <main> per built page. The duplicate-landmark defect sat on 1,120 of 1,842
      # pages through nine waves because no gate looked at document structure.
      - name: Landmarks
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-landmarks
      # Each locale's BUILT html must carry that locale's strings. A browser-driven check
      # cannot see this: hydration corrects the text before it looks.
      - name: SSR locale
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-ssr-locale

      - name: SEO
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-seo

      # The only gate that reads what a READER is served. Every other i18n gate roots
      # at src/content/docs, so all of them stayed green for months while thirteen
      # locale routes rendered one English document. It compares each locale source's
      # `## ` headings against the .article-content body of its built page -- scoped to
      # that container deliberately, because the German TOC in dist carries the ENGLISH
      # heading text and would satisfy a whole-page assertion by accident.
      - name: Docs render parity
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-docs-render-parity

      # Scans the BUILT HTML for duplicate CTA anchors, so it needs dist too --
      # its source-literal grep only mentions src/i18n/translations/en.json,
      # which is how it was first mis-placed in the content lane.
      - name: CTA bolt
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-cta-bolt

      # These need BOTH of this job's expensive inputs, which is why they live
      # here and not with the other unit tests: the account submodule (imports
      # above) and packages/www/dist/route-manifest.json, which
      # redirect-aliases.test.ts imports directly.
      - name: Worker unit tests (workers/www)
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm ci --prefix workers/www && npm run check:test-workers

  # ============================================================================
  # L9 SECURITY -- alone. 291s of meta-gate unit tests makes this the phase's
  # wall-clock pole; grouping anything with it only makes that worse.
  # ============================================================================
  quality-security:
    name: Security
    # ubuntu-latest, not ubuntu-slim: this job's runtime grew past the slim
    # runner's hard ~15-minute cap during the 0722-1 wave (8 -> 12 -> 18 min;
    # the cap kills the job as "cancelled" with no failed step, poisoning
    # CI Complete). Two such kills in three runs. The growth itself (gate
    # tests + submodule checkout + upstream freshness queries) is a separate
    # follow-up; the capped runner just makes it a coin flip.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No label opt-out at JOB level any more: that guard skipped four fully
    # OFFLINE gates (overrides/syncpack reasons, suppression liveness, the
    # quality-gate battery) along with the one external step it aimed at.
    # The Audit step below carries the external_quality skip itself.
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # Submodules are load-bearing here, not incidental. Without them this job
      # ran FIVE degraded checks and reported success for all of them:
      #   - test-embed-asset-freshness.sh, test-embed-credits.sh and
      #     test-renet-deadcode.sh each printed "renet submodule not present --
      #     skipping" and exited 0, so they had never asserted anything in CI;
      #   - check:ci-suppression-liveness skipped its .go-deps-upgrade-blocklist
      #     and .embed-assets-upgrade-blocklist probes (oracles are renet's
      #     go.mod and Dockerfile), leaving 4 entries "NOT proven clean".
      # The three tests only became visible once run-all.sh started failing a
      # test that exits 0 without a single assertion.
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - id: setup
        uses: ./.github/actions/setup-workspace

      # external_quality 'skip' only, deliberately NO soft mode: a new
      # production advisory against main's unchanged lockfile is a real
      # signal about main, so the nightly stays red on it (operator decision
      # 2026-08-04). The label skip survives for offline branch work.
      - name: Audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: .ci/scripts/security/audit.sh
        env:
          # Authenticates `gh api /advisories/...` calls inside audit.sh so the
          # GHSA detail fetch uses the 1000/hr github.token limit instead of
          # the 60/hr anonymous limit.
          GH_TOKEN: ${{ github.token }}

      - name: BLOCKER validator — package.json overrides
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-overrides-reasons

      - name: BLOCKER validator — syncpack versionGroups
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-syncpack-reasons

      # The BLOCKER validators above prove every suppression HAS a reason. This
      # one proves the reason is still TRUE — i.e. the thing being suppressed
      # still exists. Electron left the tree and 101 entries justified by
      # electron chains stayed behind; nothing noticed.
      - name: Suppression liveness — are our allowlist entries still needed?
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-suppression-liveness

      # Every other Dockerfile gate asserts the build SUCCEEDS, and a build
      # succeeds perfectly well while installing a substituted artifact. Five
      # downloads in .devcontainer/Dockerfile were hand-fixed on 2026-09-01 (go,
      # glab, bottom, openvscode, and ttyd — which was pinned by a MUTABLE tag);
      # before that, bw was the only verified fetch in the file, and nothing
      # would have stopped a sixth. Offline, no network, no token.
      - name: Check every Dockerfile download is cryptographically verified
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-unverified-downloads

      # The scope map's scripts/ carve-outs were traced by hand once. This
      # catches the next file that becomes reachable from a gated job and would
      # otherwise be narrowed silently -- a job skipped on the very delta that
      # changed its dependency, which reads as a faster green rather than a gap.
      - name: Scope map — reachable scripts/ paths force full CI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-scope-scripts-reachability

      # These two need the SUBMODULES, so they live here rather than in
      # quality-static: that job checks out without a token, and the private
      # siblings cannot be cloned without one ("repository not found"). This
      # job already checks out submodules with an app token.
      #
      # Scope completeness runs FIRST: three gates were measured returning 0
      # about a submodule that was not on disk, so it converts twelve quiet
      # partial scans into one loud failure before any verdict is trusted.
      - name: Scope completeness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_scope_completeness.py

      # Offline by construction: compares the committed record against the
      # secrets each workflow references. The network lives only in --refresh.
      - name: Secret reachability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # PyYAML, pinned and asserted, for the same reason the two static-lane
        # steps install it: this gate must know which secret reads are a
        # reusable's own DECLARED INPUTS rather than org secrets, and that lives
        # in nested `on.workflow_call.secrets`. (Naming the read form literally
        # here made CHECK 2 in check-workflow-gates.sh match its own prose and
        # report this file as reading an undeclared secret -- a detector
        # matching a comment about it is a documented trap in TRAPS.md.)
        # Hand-rolling a parser for nested
        # YAML is the correctness risk a gate cannot afford, and a
        # yaml-if-available-else-regex fallback would make the gate mean
        # different things here and locally.
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_secret_reachability.py

      # The Bitwarden-side replacement for check-workflow-gates CHECK 2, which
      # goes structurally vacuous once secrets arrive as $GITHUB_ENV injections.
      - name: Bitwarden secret map
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_bws_map.py

      # Catches a test file that CI reaches through nothing. ci-parity and
      # gate-reachability both ask "is what we declared wired up?"; an
      # undeclared file is absent from both sides of parity, so it agrees and
      # passes. This asks the other question.
      - name: Test-file orphan check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-test-file-orphans

      # PR_HEAD_REF, not GITHUB_HEAD_REF: measured 2026-08-28 on this exact
      # step, `GITHUB_HEAD_REF` does not reliably materialise here (this job
      # runs inside a workflow_call chain), which is the same reason
      # block-untagged-commit.sh's own gate step (above, "Every commit names
      # its epic") already sets this custom variable instead of trusting the
      # default one. `test-hooks.sh`'s untagged-commit fixture (UT_BR) reads
      # it to derive the real branch and locate `agent/pr/<branch>.md`;
      # without it, a detached CI checkout resolves no branch at all and that
      # fixture looks at the wrong snapshot path. (wl_git.py --selftest, also
      # run from this step, no longer needs this: its force-push probe-reach
      # controls now run against a throwaway fixture repo instead of the
      # ambient checkout, precisely because depending on ambient submodule
      # branch state was itself the earlier defect here.)
      - name: Quality-gate unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-quality-gates
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: quality-security-${{ github.sha }}
          path: audit-report.json
          retention-days: 3

  # ============================================================================
  # L10 GO -- everything needing a Go toolchain and the renet/account submodules.
  # Absorbs: renet, ebpf-objects, account-server.
  # ============================================================================
  quality-go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to renet's own declared toolchain rather than 'stable'. This job runs
          # golangci-lint, whose typecheck must DECODE the toolchain's export data; a
          # 'stable' that races ahead of the pinned linter fails with "export data version
          # 4 is greater than maximum supported version 2". Go 1.27.0 broke this job on
          # 2026-08-20 while go.mod still declared 1.25. Build/test jobs may float; the
          # ones feeding a linter may not.
          go-version-file: private/renet/go.mod
          cache: true
          cache-dependency-path: private/renet/go.sum

      - name: Install clang
        # `apt-get update` is mandatory before install: the Azure runner image
        # ships with stale apt metadata referencing a kernel ABI that may have
        # already rotated out of the Ubuntu pool, causing
        # `linux-headers-generic` to 404 on the matching versioned headers
        # package. Refresh metadata first, then install.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic

      # natives: run-account.sh test and the shared build both need the
      # compiled ssh2/cpu-features bindings. account: the integration tests run
      # out of private/account's own tree.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          natives: 'true'
          build-packages: 'true'

      - name: Run renet quality
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/private/run-renet.sh quality

      - name: Check Go dependency freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:ci-go-deps
        env:
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}

      # NOT behind external_quality: this reads only the local worktree, so
      # unlike go-deps it cannot be affected by an upstream registry being
      # unreachable, and skipping it would hide a defect we caused ourselves.
      - name: Check Go module sync against the renet worktree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-go-module-sync

      - name: Check renet types freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-renet-types

      - name: Check subscription schema consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check-subscription-schema.sh

      # Needs the renet submodule (Dockerfile ARGs + pkg/embed sources), so it
      # runs here rather than in the security lane (submodule-less checkout).
      - name: Check embed credits consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-embed-credits

      # Same submodule requirement: reads private/renet/embed-assets.lock.json.
      # Asserts every embedded component is pinned for every architecture it
      # declares — the dimension nothing carried when arm64 criu silently became
      # a different version from amd64 criu.
      - name: Check embed arch parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-embed-arch-parity

      # Recovery functions must not receive a context the work path can cancel.
      # A cold backup that stops containers and restarts them passed the WORK
      # context into the restart; SIGTERM (how systemd stops a unit) cancelled it,
      # every call inside failed instantly, and the repositories stayed STOPPED.
      # The unit test covers that one call site; this covers the CLASS. Offline,
      # static, and it skips loudly when the renet submodule is absent.
      - name: Check recovery functions get an uncancellable context
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-recovery-context

      # The ONLY embed gate that opens the artifact. Every other one compares a
      # declaration to a declaration (pin vs upstream, ARG vs lockfile, credits
      # vs lockfile), so a rebuild that silently failed to update the binary
      # passed all of them -- which is exactly what happened to the rsync
      # 3.4.4 -> 3.5.0 bump on 2026-08-15. This decompresses each staged asset
      # and asks the binary its own version. It is offline and needs no token.
      # It SKIPS loudly (never silently) when no asset is staged, which is the
      # normal case for a job that has not run `./build.sh embed_assets`; its
      # comparison controls still run on every invocation.
      - name: Check embedded asset versions match their pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-embed-asset-versions

      # Freshness of the embedded-binary version pins vs upstream. GITHUB_TOKEN
      # raises the API rate limit; the gate fails SOFT on any network/rate-limit
      # error, so a missing token or a blip never reddens the build — only a
      # confirmed-stale pin does. external_quality softens even that confirmed
      # case on the nightly: a new rclone release reddened 3 consecutive
      # nightlies (2026-08-02..04) with zero commits on main.
      - name: Check embed-asset upstream freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:ci-embed-asset-freshness

      # The same question for .devcontainer/Dockerfile, which until this gate had
      # NOTHING watching it: check-deps sees npm, check-go-deps sees go.mod, and
      # the embed gate above is hardcoded to private/renet/Dockerfile. Same soak,
      # same soft-fail, same external_quality treatment -- a new Bitwarden release
      # is external drift by definition, so it must not redden the nightly that
      # validates main.
      - name: Check devcontainer pin upstream freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXTERNAL_QUALITY_MODE: ${{ inputs.external_quality }}
        run: .ci/scripts/quality/run-external-gate.sh npm run check:ci-devcontainer-pins

      # Kept inline (3 logic lines, under check-workflows.sh's limit) rather than
      # extracted: a check-*.sh path would make check-ci-parity's R2 demand a
      # manifest entry for it, which would newly require clang + libbpf on a
      # developer machine. Same coverage, no new local prerequisite.
      - name: Verify BPF objects are up-to-date
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cd private/renet
          go generate ./pkg/ebpf/...
          git diff --exit-code pkg/ebpf/

      - name: Verify BPF verifier accepts program
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: private/renet
        run: go test ./pkg/ebpf/ -run TestBPFVerifier -v

      - name: Run eBPF unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: private/renet
        run: go test ./pkg/ebpf/ -v

      - name: Check config token auth requires org membership
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-config-auth

      - name: Check no admin user role (must be root)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-no-admin-role

      - name: Check scope registry audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-scope-audit

      - name: Assert no NODE_ENV branching in account routes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-no-node-env-routes

      - name: Run account integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/private/run-account.sh test

      - name: Run Go cross-language signature tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: private/renet
        run: go test -v ./pkg/subscription/... -run TestCrossLanguage
