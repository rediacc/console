      # joins the region in the W2.6 lane cutover, with the rest.
      - name: Doc region parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-doc-region-parity


      - name: PR epic block matches the published worklist
        run: npm run check:ci-pr-epic-block
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sibling of the same gap: the script itself already prefers
          # PR_HEAD_REF (scripts/gates/check-pr-epic-block.ts:114), but nothing set
          # it, so on this workflow_call chain's detached checkout it fell all
          # the way to `git branch --show-current` (empty) and the check
          # silently reported "skipped: on an unknown branch" instead of
          # actually validating the epic block.
          #
          # `|| github.ref_name` is the second half, and it is the same
          # one-clause remedy as f1ce6911f. This lane's caller (ci.yml) also
          # runs on push, schedule and the nightly workflow_dispatch, and
          # neither job `if:` narrows by event -- so on those three the first
          # clause is EMPTY and the check degraded to the same
          # indistinguishable-from-broken skip. On them ci.yml runs against
          # main, so the fallback resolves to `main` and the reader takes its
          # explicit `skipped: on main; the epic block is a PR artefact` path.
          # On pull_request the first clause wins, so ref_name's `<n>/merge`
          # can never shadow it.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

