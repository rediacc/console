      - name: SVG theme reach
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-svg-theme-reach
      - name: Test-gate wiring
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-test-gate-wiring
      - name: Tutorial CLI validity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_tutorial_cli_validity.py
      - name: Tutorials cannot skip themselves
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_tutorial_no_skips.py
      - name: Validate account onboarding splash against canonical tutorials
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-onboarding
      - name: Validate parity between the local gate set and the CI quality surface
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-parity
      - name: Validate tutorial commands are non-interactive
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-noninteractive
      - name: Validate tutorial storyboard commands against the live CLI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-commands
      - name: Verify NIS2 directive quotations match the official source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-nis2-quotes
      - name: Video player invariants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-video-player-invariants
      # <<< gate-bind



      - name: Dead CSS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          npm run check:ci-dead-css
          npm run check:ci-viewport-unit-mixing
          npm run check:ci-illustration-contract
      - name: Validate per-locale tutorial video assets exist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-locale-tutorial-assets

      - name: Validate tutorial card fonts cover every locale
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # This gate reads real font files, so the faces the cards are mapped to
          # must exist here. DejaVu Sans is vendored in-tree; these three are not.
          # Package names verified against the apt index, not guessed.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-jetbrains-mono fonts-wqy-zenhei
          npm run check:ci-tutorial-card-fonts

      - name: Validate localized solution videos exist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-solution-videos

      # Existence is not currency. The gate above passes on a video that exists; this one
      # asserts the manifest records the CURRENT narration engine. Added after a live
      # marketing page was found still playing Qwen3-TTS months after the VoxCPM2
      # migration, with 207 of 273 pairs stale and nothing anywhere saying so.
      - name: Validate solution narration engine is current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-solution-video-engine

      # media_quality: reads the recorded .cast files themselves, so a
      # re-recording pass in flight makes it red on media that is already
      # being repaired. Skipped ONLY on a no-media-quality PR; the announcer
      # step at the end of this job names it when that happens.
      - name: Block fallback hacks and error output in tutorial recordings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.media_quality != 'skip' }}
        run: npm run check:ci-tutorial-casts

      - name: Validate published tutorial word-timing sync (real ASR alignment, not estimated)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-caption-sync

      - name: Validate tutorial cast/storyboard/transcript/mdx parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.media_quality != 'skip' }}
        run: npm run check:ci-tutorial-parity






      # The external gates of this job ask hosts outside the repository:
      # check:deps the npm registry, External links every linked host, and
      # DKIM notify DNS the public resolvers. Each one is hard on every
      # cadence and fails closed (operator rulings 2026-10-13 and 2026-10-14,
      # "Extend to all seven"): an upstream that did not answer after three
      # tries is red, on the nightly too, with the sentence ci-trace.py --why
      # reads as an outage. The no-external-quality label on a pull request
      # is the one hold (each step carries it as its gate-bind `when:`
      # conjunct, in this job's gate-bind region); a skipped step prints
      # nothing by itself, so this announcer names the held gates in the log.
      - name: Announce external gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.external_quality == 'skip' && 'skip' || 'hard' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.announce_gate_skips no-external-quality check:deps check:ci-external-links check:ci-dkim-notify

      # Runs unconditionally, and is NOT behind media_quality: a skipped step
      # is invisible (the job still reports success), so without this the two
      # holds above would leave no trace anywhere in the log. It also refuses
      # an unrecognised media_quality value, which is the only place a typo in
      # that wiring is ever reported -- the step `if:` above would silently
      # treat it as "run".
      - name: Announce media gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.media_quality }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.announce_gate_skips no-media-quality check:ci-tutorial-casts check:ci-tutorial-parity

  # ============================================================================
  # L6 PACKAGES -- node + submodules + built packages + native modules.
  # Absorbs: account-portal, config-migrations, shared-tests, cli-unit-tests.
  # ============================================================================
  quality-packages:
    name: Packages
    runs-on: ubuntu-latest
    # 20 -> 13 (T4.1, PLAN-ci-time-budget, 2026-09-30). The 20 was bought for
    # the Stop-hook worklist suite, since ported to pytest. Measured max 6.1
    # min since 2026-09-28 and 12.6 before the port; 13 clears both.
    timeout-minutes: 13
    # Checkout plus local gates; the private submodules come in on the
    # readonly-preset App token. The github.token uses left in this job are
    # public or global endpoints (release freshness, /advisories, external
    # links) held only to avoid the anonymous rate limit.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      # natives: config-migrations loads the CLI's runtime imports, which pull
      # in ssh2/cpu-features. build-packages: the cluster services import
      # @rediacc/provisioning through its dist/, and check_account_portal.py
      # typechecks against @rediacc/shared's dist.
      - name: Load well-known
        run: grep '^WK_' .ci/config/well-known.env >> "$GITHUB_ENV"

      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          natives: 'true'
          build-packages: 'true'

      - name: Check account portal (typecheck + build)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_account_portal.py

      - name: Account portal unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-test-account-web

      - name: Check config-migration runner + fixtures
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_config_migrations.py

      - name: Shared ESM resolvable
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-shared-esm-resolvable

      - name: Run shared package tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test --workspace=@rediacc/shared

      - name: Run www unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:unit --workspace=@rediacc/www

      # The two unit suites `rediacc_ci.testrun.unit` has always driven and
      # the manifest never registered. Found 2026-09-06 by set difference: that
      # runner covers shared, cli:unit, provisioning and e2e-tests:unit, while
      # the manifest carried cli, shared, www and workers. 11 tests over 2 files
      # and 63 over 4, neither previously in `npm run ci` OR in this workflow.
      #
      # `check:test*` is the namespace check:ci-test-gate-wiring polices, and its
      # rule is the reason these are steps rather than local-only: an unwired
      # entry in that namespace is a silent coverage hole, not a convenience
      # alias. Registering them without this step would have satisfied the
      # manifest and left the hole exactly where it was.
      - name: Run provisioning unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:test-provisioning

      - name: Run e2e-tests unit suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:test-e2e-unit

      # This gate drives a real browser via `agent-browser`, and this job never
      # installed one -- it never ran in CI before today (see the manifest.ts
      # comment on check:test:tutorial-player), only locally on a devbox that
      # already has it. Installed from $HOME, not the repo checkout: this
      # repo's own .npmrc sets ignore-scripts=true, which silently skips the
      # postinstall that selects and chmods the platform binary.
      #
      # PINNED through the devcontainer: the version is .devcontainer/Dockerfile's
      # ARG AGENT_BROWSER_VERSION, the site the pins registry bumps. An unpinned
      # `@latest` here once let CI change with no commit behind it, and a second
      # literal copy here once stayed at 0.39.2 after a bump moved the images.
      - name: Install agent-browser
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # The version is the devcontainer's ARG, the pin registry's site, so a bump moves CI with it.
        # The cutoff is computed BEFORE the cd, from the checkout: --before holds the live resolution to the release-age window.
        run: |
          AGENT_BROWSER_VERSION="$(sed -n 's/^ARG AGENT_BROWSER_VERSION=["'"'"']\{0,1\}\([0-9][0-9.]*\).*/\1/p' .devcontainer/Dockerfile)"
          [ -n "$AGENT_BROWSER_VERSION" ] || { echo "AGENT_BROWSER_VERSION not found in .devcontainer/Dockerfile" >&2; exit 1; }
          before="$(PYTHONPATH=.ci python3 -m rediacc_ci.core.release_age npm-before)"
          cd "$HOME" && npm install -g "agent-browser@$AGENT_BROWSER_VERSION" --ignore-scripts=false --before "${before}"

      # A silent-install failure (a broken postinstall, a PATH the shell that
      # ran npm install cannot see, a platform binary that never got selected)
      # would otherwise surface downstream as the browser gate's own confusing
      # symptom -- exactly the "root cause invisible" shape a stop-hook judge
      # sweep named 2026-08-30. This makes the environment check its own
      # named, explicit step: a broken install fails HERE, with its real
      # cause, instead of two steps later as an unrelated-looking test error.
      - name: Verify agent-browser is functional
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: agent-browser --version

      # Video assets under packages/www/public/assets/tutorials/ are gitignored (see
      # CLAUDE.md's Media Assets section) -- a fresh CI checkout has none of them, and
      # without this var the plugin that embeds tutorial videos
      # (packages/www/src/plugins/remark-tutorial-embed.ts) falls back to a local path
      # that can never resolve here. Without it this gate could not ever observe real
      # playback: the <video> src 404s, readyState never leaves 0, and every scenario's
      # "did not enter playing state" assertion fails deterministically, indistinguishable
      # from a real player regression. cd-deploy-worker.yml sets the same var for the
      # same reason (its "Build pages" step) -- confirmed reachable: `curl -sI
      # https://media.rediacc.com/tutorials/video/en/tutorial-production-mode.mp4` -> 200.
      - name: Tutorial player release gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:test:tutorial-player
        env:
          PUBLIC_VIDEO_CDN_BASE_URL: ${{ env.WK_MEDIA_ORIGIN }}

      # THE EVIDENCE WAS BEING COLLECTED AND THROWN AWAY. The gate writes a summary,
      # screenshots and (on a navigation timeout) the browser's pending requests plus the
      # dev server's own output into artifacts/ -- and nothing uploaded them, so every one
      # of the three observed failures died with the runner naming only "Operation timed
      # out". At an ~8% failure rate the cause is a handful of runs away, but only if the
      # run that fails leaves something behind.
      - name: Upload tutorial player gate artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tutorial-player-release-gate-${{ github.run_attempt }}
          path: artifacts/tutorial-player-release-gate/
          retention-days: 3
          if-no-files-found: ignore

      - name: Run CLI unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run test:unit --workspace=@rediacc/cli

      # Runs the CLI tests against a deliberately broken copy of the source and
      # requires them to FAIL. The unit step above reports that the tests pass;
      # it is blind to whether any assertion pins the behaviour it names, which
      # is how a vacuous wrapProse test and a colWidths crash shipped together.
      - name: Guard mutations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-guard-mutations

      # A tutorial app healthcheck sized while watching a fast machine aborts the
      # whole non-resumable 18-cast recording on a slower one. Static, because no
      # CI gate can afford to record 18 casts against a VM fleet.
      # PyYAML IS NOT ACQUIRED HERE, and the attempt to add it is recorded because it
      # would have BROKEN CI. This gate imports yaml and exits 1 with "PyYAML is
      # required for this gate but is not installed", so the failure mode is loud, not
      # silent; the only exposure is to whatever the runner image ships. Adding the same
      # pinned install its siblings use (ci-quality.yml:273 and :295) does not work in
      # THIS lane: PYYAML_VERSION is exported by the "Load gate toolchain pins" step
      # (python3 -m rediacc_ci.core.toolchain pairs >> $GITHUB_ENV), and quality-packages has no
      # such step -- measured 0 occurrences -- so the pin would expand to empty and
      # `PyYAML==` would fail every run. Fixing it properly means giving this lane the
      # toolchain-pin load, which belongs with the W2.6 lane work, not to a one-line edit.
      - name: Tutorial healthcheck headroom
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tutorial-healthcheck-headroom

      # The generated CLI contract drives the web console, `rdc --proxy` and
      # the executor. It was RED at HEAD when first run here: a stale value
      # leaked into the `backup list --storage` example and merged green.
      - name: CLI contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-cli-contract

  # ============================================================================
  # L7 i18n -- alone. Needs full history (translation freshness diffs against
  # origin/main), the account submodule, built packages, AND a ~100s R2 audio
  # restore that no other gate wants.
  # ============================================================================
  quality-i18n:
    name: i18n
    # ubuntu-latest, not ubuntu-slim: this job restores the tutorial-narration
    # audio cache from R2 (see the step below), which needs the AWS CLI. Every
    # other `aws s3` consumer in this repo already runs on ubuntu-latest, and
    # ubuntu-slim is a minimal image -- check_workflow_gates.py notes pyyaml is
    # absent from it by default, and check-commands.sh exists precisely because
    # commands "may not be available in ubuntu-slim". Without the restore the
    # per-file audio assertion silently disables itself, which is the false
    # green this change removes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Checkout plus local gates; the private submodules come in on the
    # readonly-preset App token. The github.token uses left in this job are
    # public or global endpoints (release freshness, /advisories, external
    # links) held only to avoid the anonymous rate limit.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:ci-plan-housekeeping reads commit TOPOLOGY (a plan file's age is
          # the age of its first commit), so a shallow checkout makes it refuse:
          # "99 commit(s) reachable, .git/shallow holds 1 graft(s)". blob:none, like
          # quality-branch: this needs commits and trees, never a historical file's
          # content, and a plain fetch-depth:0 downloads every blob in history.
          fetch-depth: 0
          filter: blob:none

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID > BWS_CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID
            CLOUDFLARE_R2_MEDIA_ENDPOINT > BWS_CLOUDFLARE_R2_MEDIA_ENDPOINT
            CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY > BWS_CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          repositories: console,account
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # validate:translation-freshness computes `git diff origin/main...HEAD`
          # to detect which English docs changed in this PR. A shallow clone
          # with a branch that's many commits ahead of main silently produces
          # an empty diff, so the script becomes a no-op. Full history is
          # required for the freshness gate to actually fire.
          fetch-depth: 0
          filter: blob:none   # see quality-branch
      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account
      # build-packages: check:i18n runs check:cli-docs, which imports the
      # LIVE Commander tree (packages/cli/src/cli.js) rather than a
      # hand-maintained list. That import pulls in kvm-provisioner.ts ->
      # @rediacc/provisioning, whose package main is ./dist/index.js. Without
      # this the gate does not fail — it CRASHES with ERR_MODULE_NOT_FOUND,
      # which is why it went unnoticed locally, where dist/ is already warm.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          build-packages: 'true'

      - name: Install the pinned aws CLI
        id: aws
        uses: ./.github/actions/setup-aws
        with:
          export-env: 'false'

      # check:ci-i18n-media -> validate:content-media -> validate:tutorial-audio
      # asserts that every narration .mp3 referenced by a tutorial timeline
      # exists on disk. The audio cache is gitignored and lives in R2, so
      # without this restore AUDIO_TREE_PRESENT is false
      # (validate-tutorial-audio.js:63) and that assertion silently skips --
      # the gate has never once run it in CI. Failing here is deliberate: a
      # skip is exactly the false-green this step exists to remove.
      #
      # Deliberately NOT held by media_quality: it is a setup step, not a
      # gate. On a labelled PR it restores a cache nothing then reads, which
      # costs a little time and removes one more way for the label to change
      # what the job does beyond the three gates it is allowed to hold.
      - name: Restore tutorial-narration audio cache from R2
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.aws.outcome == 'success' }}
        env:
          AWS_BIN: ${{ steps.aws.outputs.aws-bin }}
          CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID: ${{ env.BWS_CLOUDFLARE_R2_MEDIA_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY: ${{ env.BWS_CLOUDFLARE_R2_MEDIA_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_MEDIA_ENDPOINT: ${{ env.BWS_CLOUDFLARE_R2_MEDIA_ENDPOINT }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.deploy.sync_media_from_r2 --audio-only

      - name: i18n
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:i18n

      # The three tutorial-media validators (transcripts, narration audio,
      # cast output), split out of check:i18n so the no-media-quality label
      # can hold exactly these without touching the rest of the i18n surface.
      # check:i18n no longer chains them, so this step is the only thing that
      # runs them in CI -- check:ci-parity holds the step name and the
      # manifest entry to each other in both directions.
      - name: Tutorial media
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.media_quality != 'skip' }}
        run: npm run check:ci-i18n-media

      # Unconditional, for the same reason as the twin in quality-content: a
      # held gate that prints nothing is indistinguishable from a passing one.
      - name: Announce media gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.media_quality }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.announce_gate_skips no-media-quality check:ci-i18n-media

      # >>> gate-bind (generated by scripts/gate-bind.ts --write; do not edit inside)
      # Steps here are EMITTED from each gate's own `---- gate ----` header. Edit the
      # header, then run `npm run gate:bind -- --write --lane quality-i18n`.
      #
      # PLACED AFTER THE FOUR HAND-WRITTEN STEPS ABOVE, not directly after `- id: setup`.
      # Those four stay hand-written and none is emitted: the R2 audio-cache restore is a
      # prerequisite rather than a gate, `i18n` and `Tutorial media` are composite npm
      # chains with no gate file to carry a header, and the announce step exists to make a
      # LABEL-HELD gate say so out loud. A region above them would reorder the restore
      # behind gates that follow it.
      #
      # NO EXCEPTIONS IN THIS LANE. All eight emitted gates carry the standard guard and a
      # single-line run, checked before the region was placed -- unlike quality-security,
      # where `Audit` had to be held out for an `if:` condition and an `env:` a generated
      # step cannot express.
      - name: Docs structure parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-structure-parity
      - name: i18n command parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-command-parity
      - name: i18n placeholders
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-placeholders
      - name: i18n untranslated
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-untranslated
      - name: Locale sources
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-locale-sources
      - name: Page locale imports
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-page-locale-imports
      - name: Plan file housekeeping
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_plan_housekeeping.py
      - name: Search index
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-search-index
      # <<< gate-bind

      - name: i18n cross-locale
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-i18n-cross-locale

  quality-www-build:
    name: Built-www Gates
    # Standard runner (not ubuntu-slim), for the same reason build-www in
    # ci-build-docker.yml already uses one: an astro build of the 13-locale site
    # does not reliably fit on 1 vCPU.
    #
    # Measured across eight consecutive runs 2026-07-27: it finished in 4, 4, 4,
    # 5 and 7 minutes when it fitted, and was KILLED at 14 and 15 minutes when it
    # did not. Roughly a one-in-four failure rate on a required quality lane.
    #
    # The kill is worse than a timeout. `timeout-minutes: 12` never fired,
    # because the runner could not interrupt the build: the job ran 15.2 minutes
    # and the platform's hard 15-minute slim cap ended it, which surfaces as
    # `cancelled` with NO failed step. The log's last words were the runner
    # terminating orphan `npm run build:www` / `node` / `esbuild` processes. A
    # cancelled job and a passing job look identical in a run summary, so this
    # read as noise rather than as a job that never finished.
    #
    # Per CHECK 3 in .ci/scripts/security/check_workflow_gates.py, a bigger
    # timeout is NOT the fix: "the number is not a dial, it is an assertion that
    # this job fits on this runner." It does not fit, so it moves.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Checkout plus local gates; the private submodules come in on the
    # readonly-preset App token. The github.token uses left in this job are
    # public or global endpoints (release freshness, /advisories, external
    # links) held only to avoid the anonymous rate limit.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          build-packages: 'true'

      - name: Build www (produces dist/route-manifest.json)
        id: build-www
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build:www
        env:
          # REQUIRED, not a nicety. `downloads.astro` fetches the latest release
          # from the GitHub API at build time and deliberately THROWS rather than
          # shipping a downloads page with no downloads on it. Unauthenticated
          # that call is capped at 60/hour per runner IP, which is shared, so the
          # build fails intermittently with "403 rate limit exceeded" for reasons
          # that have nothing to do with the commit under test. Observed live on
          # run 32223128728, where the error message named this exact fix.
          # `github.token` is injected automatically and is read-only.
          GITHUB_TOKEN: ${{ github.token }}

      # >>> gate-bind (generated by scripts/gate-bind.ts --write; do not edit inside) guard: build-www
      # Steps here are EMITTED from each gate's own `---- gate ----` header. Edit the
      # header, then run `npm run gate:bind -- --write --lane quality-www-build`.
      #
      # `guard: build-www` IS LOAD-BEARING AND IS WHY THIS LANE NEEDED A CODE CHANGE.
      # Every gate here hangs on `steps.build-www.outcome`, not on setup, because each
      # reads the `dist/` that the step above produces. The emitter hardcoded the setup
      # guard until 2026-09-06; emitting these under it would have silently re-pointed all
      # seven, so they would run when the BUILD failed, against a missing dist/ --
      # check-landmarks.ts:89 refuses outright without it, and a gate that finds nothing
      # because its subject is absent is the failure this programme exists to remove.
      #
      # PLACED AFTER THE BUILD for the same reason, not after `- id: setup`.
      - name: Browser smoke
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.browser_smoke
      - name: Captcha recovery
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-captcha-recovery
      - name: Docs render parity
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-docs-render-parity
      - name: Landmarks
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-landmarks
      - name: Page density
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.page_density
      - name: Player CSS scope
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-player-css-scope
      - name: SSR locale
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-ssr-locale
      # <<< gate-bind

      - name: Redirects
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-redirects

      - name: SEO
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-seo

      - name: CTA bolt
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm run check:ci-cta-bolt

      # These need BOTH of this job's expensive inputs, which is why they live
      # here and not with the other unit tests: the account submodule (imports
      # above) and packages/www/dist/route-manifest.json, which
      # redirect-aliases.test.ts imports directly.
      - name: Worker unit tests (workers/www, workers/proxy)
        if: ${{ !cancelled() && steps.build-www.outcome == 'success' }}
        run: npm ci --prefix workers/www && npm ci --prefix workers/proxy && npm run check:test-workers

  # ============================================================================
  # L9 SECURITY -- split three ways (PLAN-ci-time-budget.md T2.15, 2026-09-26).
  # The two heavy suites this job used to carry sequentially, `Python package
  # tests` (20.9-22.5 min, check:ci-pytest) and the bash gate-test battery
  # (10.1-12.9 min), each got their own job, so a slow suite no longer blocked
  # the other's start or borrowed its timeout headroom. The battery's job was
  # retired with the last bash gate test (2026-10-09); `quality-pytest` below
  # runs the pytest ports. What is left here -- the gate-bind region's meta-gate
  # checks, Audit and Suppression liveness -- measures about 4 minutes on its own.
  # ============================================================================
  quality-security:
    name: Security
    # ubuntu-latest, not ubuntu-slim: this job's runtime grew past the slim
    # runner's hard ~15-minute cap during the 0722-1 wave, back when this job
    # still carried the two heavy suites split out above. Left as is rather than
    # narrowed to ubuntu-slim: that runner choice is a separate change T2.15
    # did not ask for, now that the remaining steps measure about 4 minutes.
    runs-on: ubuntu-latest
    # 45 -> 15 on 2026-09-26 (T2.15): the two steps this ceiling used to cover
    # for, `Python package tests` and `Quality-gate unit tests`, moved to their
    # own jobs below with their own ceilings. What is left is the gate-bind
    # region plus Audit and Suppression liveness, measured at about 4 minutes,
    # so 15 keeps the 1.5x-plus headroom `check:ci-timeout-headroom` would ask
    # for even though that gate does not watch this job (its baseline names only
    # `Validate Promotion` and `Stage Artifacts`).
    timeout-minutes: 15
    # Checkout plus local gates; the private submodules come in on the
    # readonly-preset App token. The github.token uses left in this job are
    # public or global endpoints (release freshness, /advisories, external
    # links) held only to avoid the anonymous rate limit.
    permissions:
      contents: read
      actions: read # CI time budget freshness reads ci.yml and housekeeping.yml runs, jobs and artifacts
    # No label opt-out at JOB level any more: that guard skipped fully OFFLINE
    # gates (overrides/syncpack reasons, suppression liveness) along with the
    # one external step it aimed at.
    # The Audit step below carries the external_quality skip itself.
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DEEP, because the suppression-liveness checks in this job read commit
          # TOPOLOGY. audit.py calls entry_age_days through rediacc_ci.core.age and
          # check_go_deps.py through rediacc_ci.core.age too; both ask
          # `git log --diff-filter=A` when a blocklist or
          # allowlist line was ADDED. On a depth-1 checkout every line is attributed to
          # the graft boundary, so measured 2026-09-03 the docker/docker blocklist entry
          # read 195 days here and 2 days there, with AGE_WARN_DAYS at 180. The gate whose
          # whole job is expiring stale suppressions expired nothing, in green.
          # blob:none, like quality-i18n: this needs commits and trees, never a historical
          # file's content.
          fetch-depth: 0
          filter: blob:none
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - id: setup
        uses: ./.github/actions/setup-workspace
        # DEFAULTS ONLY (no account, no build-packages): those two inputs were
        # for the pytest suite alone (see quality-pytest below, split out by
        # T2.15) and nothing left in this job needs the account submodule's own
        # npm trees or the built shared/provisioning packages.

      - name: Load gate toolchain pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # THIS JOB WAS MISSING IT, and the failure named the wrong thing. The
        # "Secret reachability" step below installs "PyYAML==${PYYAML_VERSION}",
        # and that variable comes from here. Without this step it expanded to
        # EMPTY, so pip was handed the literal `PyYAML==` and answered
        # "Could not find a version that satisfies the requirement PyYAML==" --
        # a message about pip, in a step about secrets, in a job that had simply
        # never loaded the pins quality-static loads.
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.core.toolchain pairs >> "$GITHUB_ENV"
          PYTHONPATH=.ci python3 -m rediacc_ci.core.toolchain report

      # >>> gate-bind (generated by scripts/gate-bind.ts --write; do not edit inside)
      # Steps here are EMITTED from each gate's own `---- gate ----` header. Edit the
      # header, then run `npm run gate:bind -- --write --lane quality-security`.
      #
      # PLACED HERE, NOT DIRECTLY AFTER `- id: setup`, and the difference matters. The
      # step above exports PYYAML_VERSION into $GITHUB_ENV, and the emitted "Secret
      # reachability" step installs `PyYAML==${PYYAML_VERSION}`. A region above it would
      # expand that to `PyYAML==` and fail every run -- the same defect this job already
      # hit once, when it had no toolchain-pin step at all and pip's complaint arrived in
      # a step about secrets.
      #
      # ONE GATE IN THIS LANE IS DELIBERATELY NOT HERE. `Audit` declares `emit: false`
      # because its step carries an extra `if:` condition and a GH_TOKEN `env:` that a
      # generated step cannot express, and both losses would be invisible in a diff.
      - name: Account env files retired
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_account_env_retired.py
      - name: Backup credential isolation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_backup_credential_isolation.py
      - name: Bitwarden secret map
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_bws_map.py
      - name: BLOCKER validator — package.json overrides
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-overrides-reasons
      - name: BLOCKER validator — syncpack versionGroups
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-syncpack-reasons
      - name: BWS rotation notice
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_bws_rotation_notice.py
      - name: Check every Dockerfile download is cryptographically verified
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-unverified-downloads
      - name: Config server key constant confined
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_config_server_key_constant.py
      - name: GitHub Actions variables
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_actions_vars.py
      - name: Override ranges
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-override-ranges
      - name: PR-condition ledger is current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:ci-pr-condition-ledger
      - name: Release key canonical
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_release_key_canonical.py
      - name: Release signing coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_release_signing_coverage.py
      - name: Retired terms
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_retired_terms.py
      - name: Scope completeness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_scope_completeness.py
      - name: Scope map, reachable scripts/ paths force full CI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_scope_scripts_reachability.py
      - name: Secret reachability
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for attempt in 1 2 3; do python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}" && break; [ "$attempt" = 3 ] && exit 1; sleep 10; done
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_secret_reachability.py
      - name: Secret scope
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-secret-scope
      - name: Staging tag guard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.staging_tag_guard
      - name: Test-file orphan check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_test_file_orphans.py
      - name: Tracked credentials
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-tracked-credentials
      # <<< gate-bind

      # external_quality 'skip' only, deliberately NO soft mode: a new
      # production advisory against main's unchanged lockfile is a real
      # signal about main, so the nightly stays red on it (operator decision
      # 2026-08-04). The label skip survives for offline branch work.
      - name: Audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.security.audit
        env:
          # Authenticates `gh api /advisories/...` calls inside the audit so the
          # GHSA detail fetch uses the 1000/hr github.token limit instead of
          # the 60/hr anonymous limit.
          GH_TOKEN: ${{ github.token }}

      # Bound to PR CI on 2026-10-04: the committed lane-durations.json and
      # gate-costs.json are compared with the newest runs and captures on every
      # PR, not only in housekeeping's nightly budget-check. Drift fails the
      # open PR, which refreshes the file (budget_report / gate_costs --refresh).
      #
      # PULL REQUESTS ONLY (PLAN-plan-per-pr-loop R1). The check compares the committed
      # file with a ROLLING sample of the newest runs, so on main's push and scheduled
      # runs it reds as the sample moves, with no commit to blame and no PR open to
      # refresh it: the nightly Console CI was red on this step on 2026-10-06/07/08
      # (runs 37101760904, 37583863183, 37740799683), which kept
      # nightly_tested_edge's waiver from ever firing. Nobody is left unwatched:
      # housekeeping's budget-check job runs the same registry nightly and posts an issue.
      - name: CI time budget freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: npm run check:ci-budget-freshness
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Suppression liveness — are our allowlist entries still needed?
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-suppression-liveness

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: quality-security-${{ github.sha }}
          path: audit-report.json
          retention-days: 3

  # ============================================================================
  # L9b PYTEST -- split out of quality-security (PLAN-ci-time-budget.md T2.15,
  # 2026-09-26), then split AGAIN into 3 shard legs (spec W, 2026-09-27): the
  # unsharded leg measured 1389s ("Python package tests") against a job p90 of
  # 24 min, well over the plan's 12-min-per-job budget. `qualityPytestUnits`
  # (`scripts/ci-runner/unit-enumerators.ts`), the enumerator T2.7/T2.8 already
  # named for this lane, lists one unit per `test_*.py` file (520 today); the
  # committed `.ci/config/shards/quality-pytest.json` balances them into 4 legs
  # by LONGEST-PROCESSING-TIME-FIRST over each file's measured duration: the
  # mean of its recorded lane-duration p90 and its median over recent runs, both
  # from the per-leg junit XML the legs upload (rebalanced 2026-09-28; the
  # earlier balance by `--collect-only` item count left leg 3 at 9.5-12 min
  # while legs 1 and 2 ran about 7), with
  # three cross-file xdist groups kept whole on one leg each so `--dist
  # loadgroup` (pyproject.toml addopts) never has to serialise two of a group's
  # files across two SEPARATE runners' checkouts --
  # measured 2026-09-27 by grepping every `XDIST_GROUP =`/`pytest.mark.xdist_group(`
  # declaration in the corpus (`.ci/rediacc_ci/xdist_groups.py`,
  # `.ci/scripts/quality/check_pool_writer_safety.py`): "ports"
  # (test_core_account.py, test_core_ports.py), "real-tree" (the four modules
  # declaring `XDIST_GROUP = xdist_groups.REAL_TREE_GROUP` plus
  # test_gate_runner_advice.py, whose `BASH_TWIN` resolves into the same group
  # through the lock's `tree:` declarations), and "hooks-guards"
  # (test_guards_differential.py and test_hooks_procs.py, which marks three of
  # its own items with that module's `XDIST_GROUP`). Every other declared group
  # in the corpus is confined to one file already, so keeping it whole needs no
  # placement care. `check:ci-shard-manifest-coverage` verifies the manifest's
  # ids match the enumerator's exactly (set coverage, no phantom, no overlap);
  # it does not know about the xdist groups above, which is why they are
  # recorded here instead.
  #
  # `check:ci-inner-timeout-reachable` ties `timeout-minutes` here to
  # `check_pytest.py`'s own `RUN_TIMEOUT_S`, and both move together: 1800s/40min
  # (unsharded) -> 600s/15min per leg was the FIRST projection (1800s bounded a
  # measured 1389s, 1.30x; a leg holds roughly a third of that corpus,
  # 1389/3*1.30 ~= 600) and it undershot: driven for real the same day against
  # this manifest, legs 2 and 3 were KILLED at 600s having reached 98% and
  # 99%+ of their own progress bars. 600s/15min -> 900s/20min on that
  # measurement, keeping the same ~1.3x kill-timer-to-job-ceiling ratio the
  # un-split value held (1800s/2400s) -- see `check_pytest.py`'s own comment on
  # `RUN_TIMEOUT_S` for the full derivation and what still corrects it (a
  # completed green leg, not the 98%-in progress bar this number is sized
  # against today).
  # ============================================================================
  quality-pytest:
    name: Pytest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    strategy:
      fail-fast: false
      matrix:
        # 4 legs from the committed .ci/config/shards/quality-pytest.json (520
        # test_*.py files balanced by measured per-file duration, not count --
        # see the block comment above this job for the numbers, the method and
        # which three xdist groups are kept whole). This is a hand-written
        # matrix, not a `gate-bind --write` shard-strategy region:
        # quality-pytest is not in SHARD_COUNTS (scripts/ci-runner/lanes.ts),
        # the same "hand-written job, no emitted region" shape test-renet-go
        # and test-account-e2e already use in ct-tests.yml.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite's own dependency-inventory and twin-parity differentials
          # read commit topology (test_twin_parity.py, rediacc_ci.core.age), the
          # same reason quality-security takes a deep checkout.
          fetch-depth: 0
          filter: blob:none
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - id: setup
        uses: ./.github/actions/setup-workspace
        # BOTH INPUTS ARE LOAD-BEARING, and their absence produced two of the 56
        # pytest failures in run 34970782616 -- the first run in this wave that
        # let this lane finish. This job runs the whole pytest suite, which
        # drives the real tree, and a bare setup gave it neither.
        #
        # account: the dependency-inventory differential analyses all four real
        # packages. Without it the twin dies with
        # `✗ @rediacc/account: .../private/account/node_modules missing`, so
        # test_the_real_repository_agrees_in_table_format and its json twin fail
        # on the inventory never being built rather than on any disagreement.
        #
        # build-packages: runs rediacc_ci.setup.build_packages, which runs
        # `npm run build:packages` = `npm run build -w @rediacc/shared &&
        # npm run build -w @rediacc/provisioning`. test_proxies_unit_tests drives
        # `npm run test:unit -w @rediacc/e2e-tests`, which imports
        # `@rediacc/provisioning/renet`; unbuilt, vitest reports
        # `Error: Cannot find package '@rediacc/provisioning/renet'` and two
        # suites fail to load. That is a gate CRASHING rather than failing -- it
        # reports no finding because it never got far enough to have one -- and
        # it is invisible on any developer machine, where dist/ is always warm.
        #
        # Not a new pattern: quality-packages, quality-i18n and quality-www-build
        # already pass exactly these two.
        with:
          account: 'true'
          build-packages: 'true'

      - name: Load gate toolchain pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # RUFF_VERSION for the "Install ruff" step below.
        run: |
          PYTHONPATH=.ci python3 -m rediacc_ci.core.toolchain pairs >> "$GITHUB_ENV"
          PYTHONPATH=.ci python3 -m rediacc_ci.core.toolchain report

      - name: Packaging toolchain for the linux-packages differential
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # SIXTEEN OF THIS SUITE'S EIGHTEEN SKIPS, and skips are not free here:
        # `check:ci-pytest` refuses `passed != collected` outright, so a skipped
        # test keeps this lane red exactly as a failing one does.
        #
        # `test_proxies_linux_packages.py` skips every case with "packaging
        # toolchain absent (createrepo_c); both sides would report 77, proving
        # nothing" -- an honest skip, and a real hole: the rpm-repository half of
        # that differential has never been exercised in CI.
        #
        # `apt-get update` first, for the reason the clang/libbpf step below
        # gives: a runner image ships stale apt metadata and a bare install can
        # 404 against a rotated pool.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq createrepo-c

      - name: CLI bundle for the rdc-update differential
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # ONE MORE SKIP, and it costs about five seconds to retire.
        # `rediacc_ci.proxies.rdc_update` falls back to `packages/cli/dist/cli-bundle.cjs`
        # when no RDC_BINARY is exported, and without it the proxy reports
        # CANNOT RUN (1 of 5 requirement(s) missing) and the differential skips.
        #
        # This is the BUNDLE, not the SEA executable: `node bundle.mjs` is an
        # esbuild step measured at under a second here, on top of the ~4s `tsc`.
        # The real `Build (CLI)` job takes ~58s because it also does SEA
        # packaging and embeds the renet binaries, none of which this proxy's
        # fallback path needs.
        run: npm run build:cli

      - name: Install ruff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # `resolve_ruff()` in .ci/rediacc_ci/quality/python_lint.py is exactly
        # three branches -- $RUFF_BIN, a PATH binary AT THE PIN, then uvx -- and
        # its comment names this step as where CI gets it, deliberately, "so the
        # network is not on the critical path there".
        #
        # NOT a skip-if-absent guard: check_pytest.py's verdict() refuses
        # `passed != collected` with no skip allowance at all, so skipping this
        # would turn the seven ruff-dependent cases into a red gate anyway while
        # hiding the gap.
        #
        # Verbatim from quality-static, pins included, and VERIFIED after install
        # for the reason that step gives: an installer that exits 0 without
        # producing a binary turns into a bare "ruff is not available" in a later
        # step, which the watchdog cannot classify as a network fault.
        run: |
          for attempt in 1 2 3; do python3 -m pip install --user --disable-pip-version-check "ruff==${RUFF_VERSION}" && break; [ "$attempt" = 3 ] && exit 1; sleep 10; done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ruff" --version

      - name: Python package tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # PYTEST_RUN_TIMEOUT_S is not set here: check_pytest.py's own per-leg
        # default (RUN_TIMEOUT_S, 840s; see the constant's comment for the
        # derivation) applies uniformly to all four legs. An unsharded local
        # run is bounded by the four legs' budget instead.
        run: |
          bash .ci/bootstrap.sh
          npm run check:ci-pytest -- --shard-manifest .ci/config/shards/quality-pytest.json --shard "${{ matrix.shard }}/4"

      # T1.6 (PLAN-ci-time-budget): per-test durations, for budget_report.py
      # --refresh (T3.2) to read. `always()` and `ignore`, not `failure()`: T3.2
      # reads GREEN runs, so the run this artifact needs to exist on is exactly
      # the one a failure-only condition would skip. check_pytest.py writes this
      # file itself before `main()` returns, win or lose, so `ignore` only
      # covers the case where the step above never reached pytest at all (the
      # bootstrap failing, or a control refusing the run before it starts).
      #
      # NAMED PER LEG (T2.10), matching test-renet-go's own
      # `unit-durations-test-renet-go-s${{ matrix.shard }}-` shape:
      # `budget_report.py`'s `collect_unit_durations` matches by the
      # `unit-durations-quality-pytest-` PREFIX alone, so three separate
      # per-leg artifacts are read and summed into one lane exactly as three
      # separate renet-go leg artifacts already are.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: unit-durations-quality-pytest-s${{ matrix.shard }}-${{ github.sha }}
          path: .ci/cache/quality-pytest/
          # `.ci` is a dot directory, which upload-artifact skips by default; with `if-no-files-found: ignore` below that skip would be silent and the lane's durations would vanish.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore

  # ============================================================================
  # L10 GO -- everything needing a Go toolchain and the renet/account submodules.
  # Absorbs: renet, ebpf-objects, account-server.
  # ============================================================================
  quality-go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 14
    # Checkout plus local gates; the private submodules come in on the
    # readonly-preset App token. The github.token uses left in this job are
    # public or global endpoints (release freshness, /advisories, external
    # links) held only to avoid the anonymous rate limit.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_GITHUB_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_GITHUB_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # DEEP, because the suppression-liveness checks in this job read commit
          # TOPOLOGY. audit.py calls entry_age_days through rediacc_ci.core.age and
          # check_go_deps.py through rediacc_ci.core.age too; both ask
          # `git log --diff-filter=A` when a blocklist or
          # allowlist line was ADDED. On a depth-1 checkout every line is attributed to
          # the graft boundary, so measured 2026-09-03 the docker/docker blocklist entry
          # read 195 days here and 2 days there, with AGE_WARN_DAYS at 180. The gate whose
          # whole job is expiring stale suppressions expired nothing, in green.
          # blob:none, like quality-i18n: this needs commits and trees, never a historical
          # file's content.
          fetch-depth: 0
          filter: blob:none
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to renet's own declared toolchain rather than 'stable'. This job runs
          # golangci-lint, whose typecheck must DECODE the toolchain's export data; a
          # 'stable' that races ahead of the pinned linter fails with "export data version
          # 4 is greater than maximum supported version 2". Go 1.27.0 broke this job on
          # 2026-08-20 while go.mod still declared 1.25. Build/test jobs may float; the
          # ones feeding a linter may not.
          go-version-file: private/renet/go.mod
          cache: true
          cache-dependency-path: private/renet/go.sum

      - name: Prefer archive.ubuntu.com
        uses: ./.github/actions/apt-mirror

      - name: Install clang
        # `apt-get update` is mandatory before install: the Azure runner image
        # ships with stale apt metadata referencing a kernel ABI that may have
        # already rotated out of the Ubuntu pool, causing
        # `linux-headers-generic` to 404 on the matching versioned headers
        # package. Refresh metadata first, then install.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic

      # natives: the account test stage and the shared build both need the
      # compiled ssh2/cpu-features bindings. account: the integration tests run
      # out of private/account's own tree.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          natives: 'true'
          build-packages: 'true'

      - name: Run renet quality
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.private.run_renet quality

      # Its own step since 2026-10-21 (PLAN-plan-per-pr-loop R1 B): an advisory
      # published after the commit landed is drift, and the nightly soak waiver
      # (rediacc_ci.release.nightly_tested_edge GOVULNCHECK_STEP) judges by step
      # name. Fails closed on every cadence and is held by no label.
      - name: Renet govulncheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.private.run_renet govulncheck

      # Hard on every cadence and fails closed, like the pin gates below: a
      # module proxy or an OSV that did not answer after three tries is red,
      # on the nightly too. The announcer below names it under the label.
      - name: Check Go dependency freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        run: npm run check:ci-go-deps

      # NOT behind external_quality: this reads only the local worktree, so
      # unlike go-deps it cannot be affected by an upstream registry being
      # unreachable, and skipping it would hide a defect we caused ourselves.
      - name: Check Go module sync against the renet worktree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-go-module-sync

      - name: Check renet types freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-renet-types

      # Every committed .ci/config/shards/<lane>.json against the lane's real unit set. This lane is the one with both Go (renet go list) and node (playwright --list). Found suite 25 and pkg/infra/vmsnapshot running in no CI job on its first run.
      - name: Shard manifest coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-shard-manifest-coverage

      - name: Check subscription schema consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_subscription_schema.py

      # Needs the renet submodule (Dockerfile ARGs + pkg/embed sources), so it
      # runs here rather than in the security lane (submodule-less checkout).
      - name: Check embed credits consistency
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-embed-credits

      # Same submodule requirement: reads private/renet/embed-assets.lock.json.
      # Asserts every embedded component is pinned for every architecture it
      # declares — the dimension nothing carried when arm64 criu silently became
      # a different version from amd64 criu.
      - name: Check embed arch parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-embed-arch-parity

      # Recovery functions must not receive a context the work path can cancel.
      # A cold backup that stops containers and restarts them passed the WORK
      # context into the restart; SIGTERM (how systemd stops a unit) cancelled it,
      # every call inside failed instantly, and the repositories stayed STOPPED.
      # The unit test covers that one call site; this covers the CLASS. Offline,
      # static, and it skips loudly when the renet submodule is absent.
      - name: Check recovery functions get an uncancellable context
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-recovery-context

      # The ONLY embed gate that opens the artifact. Every other one compares a
      # declaration to a declaration (pin vs upstream, ARG vs lockfile, credits
      # vs lockfile), so a rebuild that silently failed to update the binary
      # passed all of them -- which is exactly what happened to the rsync
      # 3.4.4 -> 3.5.0 bump on 2026-08-15. This decompresses each staged asset
      # and asks the binary its own version. It is offline and needs no token.
      # It SKIPS loudly (never silently) when no asset is staged, which is the
      # normal case for a job that has not run `./build.sh embed_assets`; its
      # comparison controls still run on every invocation.
      - name: Check embedded asset versions match their pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-embed-asset-versions

      # THE EXTERNAL GATES ARE HARD ON EVERY CADENCE (operator rulings
      # 2026-10-13, "Everything fails closed, nightly included", and
      # 2026-10-14, "Extend to all seven"). The Go dependency gate above and
      # the three pin freshness gates below ask upstream, and each one fails
      # closed: an upstream answer not obtained after three tries is a red
      # finding that names the thing asked and the host
      # (scripts/lib/upstream.ts). Nothing wraps them to soften an exit
      # code, so `external_quality: soft` on the nightly and on a
      # dispatch does not downgrade them: a stale pin and an unreachable
      # upstream are red there exactly as on a pull request. The
      # `inputs.external_quality != 'skip'` conjunct stays, so the
      # no-external-quality label on a pull request still holds them, and
      # this announcer names them in the log when it does. A skipped step
      # prints nothing by itself. `soft` and `hard` both read as enforced here.
      - name: Announce external gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.external_quality == 'skip' && 'skip' || 'hard' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.announce_gate_skips no-external-quality check:ci-go-deps check:ci-embed-asset-freshness check:ci-devcontainer-pins check:ci-real-provider-pins

      # Freshness of the embedded-binary version pins vs upstream
      # (api.github.com and download.samba.org). GITHUB_TOKEN raises the API
      # rate limit. Until 2026-10-13 this step was soft on the nightly, after a
      # new upstream release reddened 3 consecutive nightlies (2026-08-02..04)
      # with zero commits on main; the ruling above takes that red back on
      # purpose.
      - name: Check embed-asset upstream freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:ci-embed-asset-freshness

      # The same question for .devcontainer/Dockerfile, which until this gate had
      # NOTHING watching it: check-deps sees npm, check-go-deps sees go.mod, and
      # the embed gate above is hardcoded to private/renet/Dockerfile. Same soak,
      # same fail-closed network handling, hard on every cadence.
      - name: Check devcontainer pin upstream freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:ci-devcontainer-pins

      # And for private/account/e2e/real-provider.lock.json: the Bitwarden
      # browser extension and the Vaultwarden server the account E2E suite runs
      # config-storage setup against. A stable upstream release newer than the
      # pin and past the release-age window fails here; the message names the
      # bump command. Hard on every cadence, like the two steps above.
      - name: Check real-provider pin upstream freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.external_quality != 'skip' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:ci-real-provider-pins

      # Kept inline (3 logic lines, under check-workflows.sh's limit) rather than
      # extracted: a check-*.sh path would make check-ci-parity's R2 demand a
      # manifest entry for it, which would newly require clang + libbpf on a
      # developer machine. Same coverage, no new local prerequisite.
      - name: Verify BPF objects are up-to-date
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cd private/renet
          go generate ./pkg/ebpf/...
          git diff --exit-code pkg/ebpf/

      - name: Verify BPF verifier accepts program
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: private/renet
        run: go test ./pkg/ebpf/ -run TestBPFVerifier -v

      - name: Run eBPF unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: private/renet
        run: go test ./pkg/ebpf/ -v

      - name: Check config token auth requires org membership
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-config-auth

      - name: Check no admin user role (must be root)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-no-admin-role

      - name: Check scope registry audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-scope-audit

      # J3 (PLAN-backup-program): the backup-* account test files by themselves, so a
      # red backup path names itself in this step instead of hiding inside the
      # whole-suite step below.
      - name: Run account backup tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-backup

      # J2 (PLAN-backup-program): the chunk-store data plane, non-root, counted
      # (the gate refuses a green that ran fewer tests than its floor).
      - name: Run chunkstore unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-renet-chunkstore-unit

      - name: Assert no NODE_ENV branching in account routes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-no-node-env-routes

      - name: Run account integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.private.run_account test

      - name: Run Go cross-language signature tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: private/renet
        run: go test -v ./pkg/subscription/... -run TestCrossLanguage

  # ============================================================================
  # L11 WIRING -- node, nothing else, and NEVER a shard.
  #
  # WHY A TWELFTH JOB RATHER THAN A STEP IN AN EXISTING LANE. The gates here
  # police the lane structure of this very file, so a lane that can be sharded
  # is the one place they cannot run: `scripts/gate-bind.ts` ANDs
  # `matrix.shard == N` onto every step of a sharded lane's region, so the
  # aggregation step would land on ONE leg and skip on the others -- a gate
  # that watches a matrix from inside a leg of it, reporting green on the legs
  # where it never ran. T-SCHED B2 D5's second clause is exactly that trap.
  #
  # WHY NOT `quality-branch`, the home of the other structural gates. It runs
  # on ubuntu-slim, which has no node, and it has no `- id: setup`, so per
  # invariant 11 it can host no region and its gates must be hand-registered.
  # That lane answers the never-sharded half and fails the node half; every
  # node-having lane today answers node and is a live `SHARD_COUNTS`
  # candidate. No existing lane answers both, which is why this one exists.
  #
  # NEVER SHARDED IS ASSERTED, NOT INTENDED. `check:ci-quality-complete`
  # refuses its own lane appearing in `SHARD_COUNTS`, so the trap cannot be
  # re-entered by populating a constant in another file.
  #
  # HAND-WRITTEN, AND IT STAYS THAT WAY: no `# >>> gate-bind` region here.
  # A region would put the step back under the emitter, and the whole point of
  # the lane is a step the emitter never conjuncts. The step is therefore
  # registered by hand in the ci-runner manifest like the lane's
  # capabilities themselves, and `check:ci-parity` holds the two together.
  # ============================================================================
  quality-wiring:
    name: Wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the working tree and nothing else: no API call, no App token, no
    # Bitwarden secret, exactly like the quick lane above.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defaults deliberately: no submodules, no natives, no package build.
      # The gates here read the workflow, the lock and the manifest, all of
      # which are in the bare checkout; node is the whole requirement.
      - id: setup
        uses: ./.github/actions/setup-workspace

      - name: Quality shard aggregation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-quality-complete

  # ============================================================================
  # SECURE STORAGE AGAINST THE REAL BACKENDS, one leg per OS. The CLI keeps the
  # config-store slot secret in the kernel keyring (Linux), the Keychain (macOS)
  # or a DPAPI blob (Windows), and until this job every test of that layer
  # mocked the module: the unit suite ran on ubuntu only, and the macOS and
  # Windows runners built the SEA binary and read its version.
  #
  # A GREEN LEG CANNOT MEAN "SKIPPED". SECURE_STORAGE_REQUIRE_NATIVE=1 turns the
  # suite's unreachable-backend skip into a failure, and the suite writes a
  # receipt naming the backend it exercised and how many native tests ran. The
  # last step reads the receipt against the matrix, so a misspelled variable
  # (no receipt) or a leg that fell back to the file backend is red.
  #
  # LINUX: A READABLE KEYRING. A runner job's session keyring does not link the
  # user keyring, so `keyctl add ... @u` succeeds and the read is refused with
  # `keyctl_read_alloc: Permission denied` (the Drills job in ct-tests.yml
  # recorded it). `keyctl session -` starts a fresh session keyring the step
  # owns and `keyctl link @u @s` makes @u possessed for everything it execs.
  # Reproduced on a workstation in both directions; on a hosted runner it is
  # UNVERIFIED until this job's first run.
  #
  # MACOS: a throwaway keychain is created, unlocked and made the default, so
  # the leg does not depend on the state of the runner's login keychain.
  # WINDOWS: the backend shells out to Windows PowerShell with -Command, which
  # the execution policy does not govern.
  #
  # Its own job, not a step of quality-packages: the three legs need three
  # runners, and no gate step lives here, so the lane tables do not list it.
  # ============================================================================
  quality-secure-storage:
    name: Secure Storage (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Checkout and local tests only. No API call, no App token, no secret.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    strategy:
      # fail-fast: false, so a red leg does not cancel the other two operating
      # systems before they report.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: keyctl
          - os: macos-latest
            backend: keychain
          - os: windows-latest
            backend: dpapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-packages: secure-storage.ts imports @rediacc/shared/paths through
      # its dist/. No submodules and no natives: the module needs neither.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'

      # `shell: bash` runs with -eo pipefail, so any refused security call
      # stops the step. No arguments after the path in set-keychain-settings:
      # no lock on sleep and no lock timeout.
      - name: Throwaway default keychain (macOS)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'macOS' }}
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/secure-storage-test.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

      - name: keyctl is installed (Linux)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          command -v keyctl >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq keyutils; }
          keyctl --version

      # Linux runs inside a fresh session keyring that links the user keyring;
      # see the block comment above this job.
      - name: Secure storage native tests (Linux, readable keyring)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        env:
          SECURE_STORAGE_REQUIRE_NATIVE: '1'
          SECURE_STORAGE_NATIVE_RECEIPT: ${{ runner.temp }}/secure-storage-receipt.json
        run: keyctl session - sh -c 'keyctl link @u @s && exec npm run test:secure-storage-native --workspace=@rediacc/cli'

      - name: Secure storage native tests (macOS, Windows)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os != 'Linux' }}
        shell: bash
        env:
          SECURE_STORAGE_REQUIRE_NATIVE: '1'
          SECURE_STORAGE_NATIVE_RECEIPT: ${{ runner.temp }}/secure-storage-receipt.json
        run: npm run test:secure-storage-native --workspace=@rediacc/cli

      # The verdict on vacuity. The suite writes the receipt only under
      # SECURE_STORAGE_REQUIRE_NATIVE, as one JSON line whose key order is fixed
      # (platform, backend, reachable, declared, ran), so a missing file means
      # the requirement never reached it and `cat` fails the step. The suite
      # itself fails when a declared native test did not run; this step holds
      # the backend to the matrix.
      - name: Receipt names the native backend
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          SECURE_STORAGE_NATIVE_RECEIPT: ${{ runner.temp }}/secure-storage-receipt.json
        run: |
          cat "$SECURE_STORAGE_NATIVE_RECEIPT"
          grep -q '"backend":"${{ matrix.backend }}","reachable":true' "$SECURE_STORAGE_NATIVE_RECEIPT" || { echo "::error::the receipt does not name a reachable ${{ matrix.backend }} backend"; exit 1; }

  # ============================================================================
  # THE SHARD AGGREGATOR. A matrix job reports ONE roll-up result for every leg,
  # so a leg that was never created is indistinguishable from a leg that passed:
  # drop half the `shard:` list and `Quality / Code` still reports success having
  # run half its gates. That is the failure this job exists for, and the lane
  # above cannot serve it -- `quality-wiring` runs the STATIC half (the workflow
  # agrees with SHARD_COUNTS) before any leg has run, while this one judges the
  # RECEIPTS each leg wrote about itself.
  #
  # `!cancelled()` RATHER THAN THE DEFAULT, deliberately. A job with `needs:`
  # skips when its dependency fails, which would take the aggregator out
  # precisely when a leg died -- reporting nothing about the run that needed
  # reporting on. The receipts themselves carry each leg's conclusion, and
  # `judgeReceipts` refuses anything other than `success`, so the verdict is
  # made here rather than inherited from the job graph.
  #
  # NO RECEIPTS IS A FAILURE, NOT AN EMPTY PASS. The download is allowed to find
  # nothing; `check:ci-quality-complete` then reds on four declared shards and
  # zero reported, which is the state a cancelled or never-created matrix leaves
  # behind. A green here means four legs wrote four receipts naming themselves.
  # ============================================================================
  quality-complete:
    name: Shard receipts
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads artifacts and the working tree: no API call, no App token, no
    # Bitwarden secret, exactly like the wiring lane above.
    permissions:
      contents: read
    if: ${{ !cancelled() && inputs.is_bot != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defaults deliberately: no submodules, no natives, no package build. The
      # gate reads the lock, the workflow and the receipts, all of which are in
      # the bare checkout or the artifact.
      - id: setup
        uses: ./.github/actions/setup-workspace

      # One directory per leg, which is the shape `readReceipts` already walks.
      - name: Download shard receipts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: quality-shard-*
          path: /tmp/quality-shards

      - name: Quality shard receipts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-quality-complete -- --receipts /tmp/quality-shards
