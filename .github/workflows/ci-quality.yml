          # it, so on this workflow_call chain's detached checkout it fell all
          # the way to `git branch --show-current` (empty) and the check
          # silently reported "skipped: on an unknown branch" instead of
          # actually validating the epic block.
          #
          # `|| github.ref_name` is the second half, and it is the same
          # one-clause remedy as f1ce6911f. This lane's caller (ci.yml) also
          # runs on push, schedule and the nightly workflow_dispatch, and
          # neither job `if:` narrows by event -- so on those three the first
          # clause is EMPTY and the check degraded to the same
          # indistinguishable-from-broken skip. On them ci.yml runs against
          # main, so the fallback resolves to `main` and the reader takes its
          # explicit `skipped: on main; the epic block is a PR artefact` path.
          # On pull_request the first clause wins, so ref_name's `<n>/merge`
          # can never shadow it.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

      # The local hook cannot read a -F message, so this is where the trailer
      # rule is actually enforced, against the commits that really landed.
      - name: Every commit names its epic
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-pr-task-trailers
        env:
          # `|| github.ref_name` for the same reason as the step above, and it
          # also retires PR_BASE_REF's own empty-on-push shape without touching
          # it: `origin/` alone is non-empty garbage, but the reader's
          # `branch === 'main'` skip is taken first and never reaches it.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_BASE_REF: origin/${{ github.event.pull_request.base.ref }}




      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:format

      # One biome process over the whole tree (3-4 s), so it is a plain hand-written step like `Format` above rather than a gate-bind step: there is no script file to carry a gate header any more, and `check:ci-lint-scope-coverage` holds the command's scope in place.
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:lint


      - name: Check account route layer isolation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-account-layer-isolation

      # Bash had no dead-code detector at all; this is the analogue of the knip
      # run above. It is a `tsx` gate (needs node_modules, CI died with
      # `tsx: not found`, exit 127) and its corpus includes private/**, so
      # without submodules it silently scans a smaller tree and under-asserts.
      - name: Dead bash
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-dead-bash


      - name: TypeScript
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck



      - name: Command planes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-command-planes

















      - name: Workflow structural gates
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-workflow-gates

      - name: Breakpoint drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-breakpoint-drift


      # External gates are hard on every cadence and fail closed (operator
      # rulings 2026-10-13 and 2026-10-14): an action whose latest release
      # was not obtained after three tries is red, on the nightly too, and so
      # is a toolchain or devcontainer pin no other gate compares. Their
      # steps, `Action freshness` and `Pin upstream freshness`, are emitted
      # into this job's gate-bind region with the label hold as their `when:`
      # conjunct; the no-external-quality label on a pull request is the one
      # hold, and this announcer names the gates when it applies. It runs in
      # every shard because gate-bind may move the gates between shards.
      - name: Announce external gates held by label
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_SKIP_MODE: ${{ inputs.external_quality == 'skip' && 'skip' || 'hard' }}
        run: PYTHONPATH=.ci python3 -m rediacc_ci.quality.announce_gate_skips no-external-quality check:actions check:ci-pin-freshness

  quality-content:
    name: Content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Checkout plus local gates; the private submodules come in on the
    # readonly-preset App token. The github.token uses left in this job are
    # public or global endpoints (release freshness, /advisories, external
    # links) held only to avoid the anonymous rate limit.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
