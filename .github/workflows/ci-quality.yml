name: Console CI - Quality

# ==============================================================================
# TEN LANES, NOT THIRTY-THREE JOBS
# ==============================================================================
# This workflow used to be 33 one-gate-per-job entries. Measured on run
# 30064285223: 4307s of runner time, of which 3042s (73%) was setup rather than
# gate work, against a hard 20-slot free-tier concurrency cap that was pegged at
# exactly 20/20 for the whole phase (the last job started 2m19s late purely from
# queueing). The gates themselves were 1153s.
#
# Two structural fixes, applied together:
#   1. ./.github/actions/setup-workspace caches node_modules instead of
#      rebuilding it 24 times (see that action for the measurements).
#   2. Gates are grouped into lanes by SETUP CLASS -- what a gate needs on disk
#      (bare checkout / node / node+submodules / node+build / go), not by
#      subject matter. A lane pays the setup cost once for all of its gates.
#
# RULES FOR EDITING A LANE, in order of how easy they are to get wrong:
#
#   a. Every gate step carries `if: ${{ !cancelled() && steps.setup.outcome ==
#      'success' }}`. The `!cancelled()` half is what makes a lane report ALL of
#      its failures in one round instead of stopping at the first -- without it,
#      grouping would make CI strictly less informative than it was. The
#      `steps.setup` half stops a failed install from cascading into twenty
#      confusing gate failures. `continue-on-error` is banned by
#      check-workflows.sh and is NOT the same thing: it would make the lane pass.
#
#   b. A lane takes the STRICTEST requirement of its members: runner, app-token
#      preset, submodule checkout, timeout. Never widen a token to fit a gate
#      into a lane -- move the gate, or leave it alone. quality-branch is alone
#      precisely because it is the only `push`-preset token in CI.
#
#   c. ubuntu-slim has a HARD 15-minute job cap that kills the job as
#      "cancelled" with no failed step. Slim lanes therefore declare
#      `timeout-minutes: 12` so they fail with their own message first. This is
#      enforced by CHECK 3 in .ci/scripts/security/check-workflow-gates.sh; a
#      slim job without a <=12 timeout is a red gate, not a style nit.
#
#   d. Job names are load-bearing for the watchdog:
#      WATCHDOG_NO_RETRY_PATTERNS is 'Quality,Review Gate' matched with
#      String.includes, so every job here is no-retry by name. Keep the
#      `Quality / ` prefix.
# ==============================================================================

on:
  workflow_call:
    inputs:
      # DO NOT DELETE as "always false". A dead-code sweep will correctly
      # observe that ci.yml is the only caller and already gates this workflow
      # on `is_bot != 'true'` (ci.yml quality job), making every downstream
      # `if: inputs.is_bot != 'true'` constant-true. Deleting them anyway
      # removes the second half of a release-LOOP breaker.
      #
      # CD pushes bot commits straight to main: cd-v2.yml's contract-floor
      # ratchet and .ci/scripts/release/update-homebrew-tap.sh both
      # `git push origin HEAD:main` with user.name = vars.GIT_BOT_NAME, which
      # is literally "github-actions[bot]" — the exact string
      # .ci/scripts/ci/initialize.sh matches to set is_bot.
      #
      # Two independent defenses stop those commits re-triggering a release:
      #   1. ci.yml's initialize job `if:` — github.actor + "[skip ci]"
      #   2. is_bot — derived from head_commit.author.name
      # They are not equivalent. Those pushes use the CI App token, so
      # github.actor is the App, not github-actions[bot]; "[skip ci]" in the
      # message is what actually fires. If a bot commit ever ships without
      # "[skip ci]", is_bot is the only remaining backstop against
      # bot commit -> CI -> release -> bot commit.
      is_bot:
        type: string
        required: false
        default: 'false'
      next_version:
        type: string
        required: false
      # Three-state control for externally-dependent gates, computed by
      # ci.yml's initialize: 'hard' (normal PR: failures block), 'skip' (PR
      # with the no-external-quality label: steps do not run), 'soft'
      # (schedule/dispatch: run-external-gate.sh downgrades a failure to a
      # ::warning:: so external drift cannot redden the nightly). Default
      # 'hard' fails closed if a caller forgets to pass it.
      external_quality:
        type: string
        required: false
        default: 'hard'
      # Two-state control for the gates that read in-flight tutorial media,
      # computed by ci.yml's initialize: 'hard' (normal PR and every non-PR
      # event: failures block) or 'skip' (PR carrying the no-media-quality
      # label, while a re-recording pass leaves the media tree temporarily
      # inconsistent). No soft state and no wrapper: these gates read this
      # tree, not the outside world, so there is no drift to downgrade.
      # Default 'hard' fails closed if a caller forgets to pass it, and both
      # consuming jobs run announce-gate-skips.sh so a skip is never silent.
      media_quality:
        type: string
        required: false
        default: 'hard'
    secrets:
      # Bitwarden machine-account token for the shadow secret fetch
      # (.github/actions/bws-secrets). Every caller must pass it.
      BWS_ACCESS_TOKEN:
        required: true
      # Optional on purpose: without it the Docker Hub freshness gate falls back to the
      # anonymous rate limit, and its own logic REFUSES on a limited response rather than
      # reporting everything current. A fork without the secret gets an honest failure, not
      # a vacuous pass.
# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
# This is a reusable workflow. A callee can never exceed what the calling job
# grants, so each job's block below is also the contract its callers must meet.
permissions: {}

jobs:
  # ============================================================================
  # L0 QUICK -- the quick lane's PLAN, not a second run of the gates.
  #
  # WHAT THIS JOB IS NOT, because the obvious reading is the harmful one. It does
  # NOT execute `npm run ci:quick`'s gate set. Measured on a real bare-node
  # checkout (node_modules installed, no submodules, no packages/shared build):
  # `npm run ci:quick` selected 383 gates and reported `327 ok, 54 failed, 2
  # BLOCKED`. Those 54 failures span EIGHT of the ten lanes below, so a job that
  # ran them would need the UNION of eight lanes' setup -- and that union does
  # not exist, because quality-branch checks out `github.head_ref` at
  # fetch-depth 0 while every other lane takes the depth-1 merge ref. One
  # checkout cannot be both. So "one job runs the whole quick lane" is not
  # expensive, it is impossible, and the ten-lane split above is the answer to
  # the question it was asking.
  #
  # WHAT IT IS. The runner's own contract, executed early and cheaply on the
  # exact npm key developers are told to run. `npm run ci:quick -- --list` runs
  # `run.ts --selftest` for real (28 assertions) and then PRINTS the quick plan
  # instead of executing it: 1.4s wall, and the only thing in CI that proves the
  # key resolves, the manifest loads, and the --quick demotion fixpoint has not
  # collapsed the lane. `check:ci-runner-selftest` covers the selftest alone,
  # inside quality-code, which is the largest and slowest lane; this reaches the
  # same red in under a minute instead of behind 98 steps.
  #
  # IT BLOCKS, and there is no way to make it not block: ci.yml's `quality` job
  # rolls up every job in this file, and `ci-complete` aggregates `quality`.
  # `check_ci_job_aggregation.py` reads ci.yml's TOP-LEVEL jobs only, so nothing
  # here needs wiring into it and nothing here can be exempted from it. That is
  # the second reason this job plans rather than runs: a blocking job must be
  # able to be green.
  # ============================================================================
  ci-quick:
    name: Quick Lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the working tree and nothing else: no API call, no App token, no
    # Bitwarden secret. `contents: read` is the entire contract, which is why
    # this job is also the cheapest thing a caller has to grant.
    permissions:
      contents: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Defaults deliberately: no account submodule, no natives, no package
      # build. This job runs the RUNNER, never the gates, so node plus the
      # cached node_modules tree is the whole requirement.
      - id: setup
        uses: ./.github/actions/setup-workspace

      - name: Quick lane plan
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          # A FLOOR, NOT THE LIVE COUNT, and deliberately far below it. The live
          # number is 383 today and moves every time a gate is registered or its
          # `slow:` flips; a floor that tracked it would have to be regenerated,
          # and a regenerated number is one nobody rechecks. What this catches is
          # COLLAPSE: a manifest that did not load, a demotion fixpoint that
          # swallowed the lane, a --quick that silently selected nothing. Seen
          # firing: driven against a one-entry fixture manifest it printed
          # `quick lane: 1 gate(s) planned` and exited 1.
          QUICK_LANE_FLOOR: '200'
        # No pipe on the first line ON PURPOSE. `npm ... | tee` would hand the
        # step tee's exit status and swallow a failed selftest, which is the
        # swallowed-failure class check-swallowed-failures.sh exists for.
        run: |
          npm run --silent ci:quick -- --list > "$RUNNER_TEMP/quick-plan.txt"
          planned=$(grep -c '^gate ' "$RUNNER_TEMP/quick-plan.txt" || :)
          echo "quick lane: $planned gate(s) planned, floor $QUICK_LANE_FLOOR; $(head -1 "$RUNNER_TEMP/quick-plan.txt")"
          if [ "$planned" -lt "$QUICK_LANE_FLOOR" ]; then
            echo "::error::the quick lane planned $planned gate(s), under its floor of $QUICK_LANE_FLOOR. The runner is not seeing the manifest, so a green here would mean nothing."
            exit 1
          fi

  # ============================================================================
  # L1 STATIC -- no node, no dependencies, bare checkout.
  # Absorbs: editorconfig, compose-env, audit-coverage, shell, attribution,
  #          pr-description.
  # ============================================================================
  quality-static:
    name: Static
    runs-on: ubuntu-slim
    timeout-minutes: 12
    # This job hits pulls endpoints with github.token, so it declares the scope
    # those endpoints document. It passed without the grant only because console
    # is a public repo, and public-ness is not a permission grant.
    # The ci.yml caller carries pull-requests: read to match; a callee can never
    # exceed its caller.
    permissions:
      contents: read
      pull-requests: read
    if: inputs.is_bot != 'true'
    steps:
      - id: setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - uses: ./.github/actions/app-token
        id: app-token
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: pr-read   # gh api reads in check-pr-description.sh
          repositories: console

      - name: Load gate toolchain pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # ONE definition of every gate tool's version, shared with the host and
        # the devbox image. --env emits only KEY=value lines: $GITHUB_ENV rejects
        # anything else, so `cat toolchain.env >> "$GITHUB_ENV"` would fail the
        # job on this file's comments.
        #
        # The shfmt install that used to live here is GONE. It was
        # `curl -sS https://webi.sh/shfmt | sh` -- unpinned, so CI silently
        # tracked whatever was latest while the image built its own copy from
        # `go install ...@latest`. The gate now acquires shfmt at the pin itself
        # (.ci/scripts/lib/toolchain.sh), which is the only way host, container
        # and CI can be shown to agree.
        run: |
          .ci/scripts/lib/toolchain.sh --env >> "$GITHUB_ENV"
          .ci/scripts/lib/toolchain.sh --report

      - name: Install ruff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Pinned, and VERIFIED after install for the same reason the shfmt step
        # above is: an installer that exits 0 without producing a binary turns
        # into a bare "ruff is not available" in a later step, which the
        # watchdog cannot classify as a network fault.
        run: |
          python3 -m pip install --user --disable-pip-version-check "ruff==${RUFF_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ruff" --version

      - name: EditorConfig
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_editorconfig.py





      - name: PyYAML for the ported gate battery
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      # >>> gate-bind (generated by scripts/gate-bind.ts --write; do not edit inside)
      # Steps between these markers are EMITTED from each gate's own `---- gate ----`
      # header. Edit the header, then run `npm run gate:bind -- --write`; a hand edit
      # here is reported by check:ci-gate-bind and overwritten by the next --write.
      #
      # The region is placed by hand, once per lane, and the binder never moves it: a
      # generator that owns the whole file would fight 258 hand-written steps, and this
      # repo's other generate-and-check pairs (contract.generated.ts) are region-scoped
      # for the same reason.
      - name: Actions allowlist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_actions_allowlist.py
      - name: agent-browser exit status
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_agent_browser_exit.py
      - name: Allowlist key matching
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_allowlist_key_matching.py
      - name: Battery clean-tree guard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_battery_clean_tree.py
      - name: Capability-probe parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_probe_parity.py
      - name: Check audit logging coverage for CLI operations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_audit_coverage.py
      - name: Checkout cone covers what steps run
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_checkout_cone.py
      - name: CI job timeout headroom
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_job_timeout_headroom.py
      - name: Compose env
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_compose_env.py
      - name: Control plant proofs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_plant_proofs.py
      - name: Dead Python
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_dead_python.py
      - name: Dev-stack liveness probes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_account_probes.py
      - name: Dockerfile mirror resilience
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_dockerfile_mirror_resilience.py
      - name: Drill verdict logic
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_drill_verdicts.py
      - name: Env file adoption
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_env_file_adoption.py
      - name: Env manifest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_env_manifest.py
      - name: Environment names
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_environment_names.py
      - name: Gate registration follows the gates/ convention
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_gate_id_convention.py
      - name: Gate-reachability probe agrees with registrations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_gate_reachability_coverage.py
      - name: Git history depth
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_git_history_depth.py
      - name: Guard feature completeness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_guard_feature_completeness.py
      - name: Hook cross-OS seams
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_hook_cross_os.py
      - name: Hook exec baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_hook_exec_baseline.py
      - name: Hooks resolvable
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_hooks_resolvable.py
      - name: Install table
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/rediacc_ci/setup/tools.py
      - name: Install-script tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-install-script.sh
      - name: install.sh config tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-install-sh-config.sh
      - name: Language policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_language_policy.py
      - name: Mutation runner self-test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_mutate_check.py
      - name: No inline Python in JS/TS
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_inline_python.py
      - name: Pathspec scope
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_pathspec_scope.py
      - name: Policy inventory
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_policy_inventory.py
      - name: Pool-registered tests do not write the real tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_pool_writer_safety.py
      - name: Python control plants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_python_control_plants.py
      - name: Python env registry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_python_env_registry.py
      - name: Python gate deps
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_python_gate_deps.py
      - name: Python lint + format (ruff)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_python_lint.py
      - name: rdc.sh wrapper budget and --native arms
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_rdc_native.py
      - name: Review cap is measured coherently
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_review_cap_coherence.py
      - name: Review turn budget cannot starve a routed review
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_review_turn_capacity.py
      - name: Runner sizing advice
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_runner_advice.py
      - name: Schema call sites
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_schema_call_sites.py
      - name: Secret supply
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_secret_supply.py
      - name: Setup port parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/rediacc_ci/setup/port_parity.py
      - name: Shell commands exist on the runner image
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/security/check-commands.sh
      - name: Shell format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/security/shfmt.sh
      - name: Shell lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/security/shellcheck.sh
      - name: Silent-failure patterns
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_silent_failure_patterns.py
      - name: Tracked runtime sidecars
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_tracked_sidecars.py
      - name: Vendored blocker derivation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_vendored_blocker_derivation.py
      - name: W7P5-a real-run blocklist
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_w7p5a_real_run_blockers.py
      - name: Workflow env provision
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_workflow_env_provision.py
      - name: Workflow submodule deps
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "PyYAML==${PYYAML_VERSION}"
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          .ci/scripts/quality/check_workflow_submodule_deps.py
      - name: Worklist env registry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_worklist_env_registry.py
      - name: Write-once guard tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-write-once-guard.sh
      # <<< gate-bind







      - name: CI executes only tracked paths
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-scans-tracked-paths


      - name: rdc.sh env tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/test/test-rdc-sh-env.sh


      - name: Check for Claude attribution
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: .ci/scripts/quality/check_claude_attribution.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Beside the attribution check deliberately: same trigger, same oracle shape (the
      # PR's commit list over the API), and the same fail-closed rule -- an unreadable
      # API refuses rather than reporting a clean PR.
      - name: Commit author identity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: .ci/scripts/quality/check_commit_identity.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Check PR description freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: .ci/scripts/quality/check_pr_description.py
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  quality-branch:
    name: Branch
    runs-on: ubuntu-slim
    timeout-minutes: 12
    # Confirmed NOT a pusher: the old `push` app-token preset was deleted and
    # this job now only REPORTS that a rebase is needed. Its one remote
    # operation is a read-only `git fetch origin`.
    permissions:
      contents: read
    if: inputs.is_bot != 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job needs commit topology, never a historical file's CONTENT.
          # A plain fetch-depth:0 downloads every blob in history and took 299s
          # here to run a 1-second script; blob:none fetches commits and trees
          # only -- measured 1.93s bare, 10.37s with a working tree -- and
          # lazily fetches any blob a command actually opens. Keep the flag even
          # as the pack shrinks: the win is not fetching what is never read, and
          # that is true at any pack size. (A pack-size figure lived here and
          # went stale, which is why this reasons from the ACCESS PATTERN
          # instead.)
          filter: blob:none
          # LOAD-BEARING. The default checkout for a pull_request event is the
          # MERGE ref, which already contains the base branch -- so
          # `HEAD..origin/<base>` would be empty and this gate could never
          # report a behind branch. It must look at the PR head itself.
          ref: ${{ github.head_ref }}
      - name: Check whether the branch is behind its base
        run: .ci/scripts/quality/check_branch.py
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      # MOVED HERE from quality-static when A1-A5 landed. This is the only lane
      # with BOTH fetch-depth 0 and the PR head ref, which is exactly what "did a
      # box open at the merge-base survive at HEAD" needs. The cost is that
      # quality-branch is pull_request-only, so A1-A5 do not run on push; A0 and
      # A6 read only the working tree and are unaffected. The gate SAYS when the
      # transition rules did not run, so a skip can never read as a clean result.
      - name: Plan checkbox ledger
        if: ${{ !cancelled() }}
        run: npm run check:ci-plan-boxes
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      # HAND-WRITTEN, and it must stay that way: quality-branch has no `- id: setup`
      # step, so per invariant 11 a gate-bind region here would emit steps whose
      # `steps.setup.outcome` guard evaluates empty -- every one would SKIP while the
      # job reported green. That is why check_plan_record.py carries no gate header.
      - name: Plan records
        if: ${{ !cancelled() }}
        run: npm run check:ci-plan-record
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      # Hand-written for the same reason as its neighbour: quality-branch has no
      # `- id: setup`, so per invariant 11 a generated region here would emit steps
      # whose guard evaluates empty and skip every one while reporting green.
      - name: Plan citations
        if: ${{ !cancelled() }}
        run: npm run check:ci-plan-citations
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      # HAND-WRITTEN, like its neighbours, and the reason is invariant 11:
      # quality-branch has no `- id: setup`, so `scripts/gate-bind.ts:289-300` refuses to
      # emit a region here. A generated step would carry a guard on a step that does not
      # exist, evaluate empty, and skip every gate while the job reported green.
      - name: Decision ids
        if: ${{ !cancelled() }}
        run: npm run check:ci-decision-ids
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Resource profile (previous run's captures)
        if: ${{ !cancelled() }}
        run: npm run check:ci-resprofile
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  # NOTE: PR reviews come from the Claude Review workflow (claude-review.yml),
  # which fires only when CI Complete is green and the PR is non-draft; the
  # review-gate job in ci.yml enforces thread resolution afterwards.

  # ============================================================================
  # SUBMODULE BRANCH VALIDATION (L3)
  # ============================================================================
  # PURPOSE: Ensures submodule branches match console branch when coordinated
  #          changes are expected (submodule pointer differs from origin/main),
  #          and verifies submodule PRs are linked.
  #
  # AI TROUBLESHOOTING:
  #   If this job fails, check the error message for specific fix commands.
  #
  #   Branch errors:
  #   - Create missing branch: cd private/<sm> && git checkout -b <branch>
  #   - Push branch: git push -u origin <branch>
  #   - Checkout existing: cd private/<sm> && git checkout <branch>
  #
  #   PR linking errors:
  #   - No open PR: cd private/<sm> && gh pr create --title "..." --body "..."
  #   - PR not linked: Edit console PR description to include submodule PR URL
  #
  # WHEN SUBMODULES STAY ON MAIN:
  #   If submodule pointer matches origin/main, no branch coordination needed.
  #   The submodule will stay on main and this check passes.
  #
  # Alone rather than in a lane: it is the only gate needing full history AND
  # submodules AND a PR-metadata token, and it is 6 seconds of work once the
  # checkout stops downloading historical blobs it never reads.
  # ==============================================================================
  quality-submodule-branches:
    name: Submodule Branches
    runs-on: ubuntu-slim
    timeout-minutes: 12
    # Every PR read here (gh pr list / gh pr view across five repos) runs on
    # the pr-read-preset App token, not github.token.
    permissions:
      contents: read
    # Runs on PRs (the coordinated-branch rules) AND on main (the stronger rule
    # that every gitlink is reachable from the submodule's own origin/main). The
    # script's header claimed push-to-main coverage for a long time while this
    # condition granted only `pull_request`, so the invariant it advertised was
    # enforced nowhere. On a pull_request `github.ref` is refs/pull/N/merge, so
    # the first clause covers PRs and the second picks up push, schedule and the
    # nightly rehearsal on main.
    if: inputs.is_bot != 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: pr-read   # gh pr list in check-submodule-branches.sh
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none   # see quality-branch
          submodules: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Validate submodule branches
        run: .ci/scripts/quality/check_submodule_branches.py
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # NOTE: Review checks (resolved threads + unreplied comments) are in
  # review-gate job in ci.yml. They enforce whatever threads the Claude
  # review (or a human) left on the PR.

  # ============================================================================
  # L4 CODE -- node + submodules + account deps. The source-shape lane.
  # Absorbs: versions, format, lint, typescript, cli-examples, workflows.
  # ============================================================================
  quality-code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job hits pulls endpoints with github.token, so it declares the scope
    # those endpoints document. It passed without the grant only because console
    # is a public repo, and public-ness is not a permission grant.
    # The ci.yml caller carries pull-requests: read to match; a callee can never
    # exceed its caller.
    permissions:
      contents: read
      pull-requests: read
    if: inputs.is_bot != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY

      - name: Block legacy-peer-deps workarounds
        run: .ci/scripts/quality/check_npmrc.py

      # THE INSTALL THE COMMENT ABOVE ALREADY REFERRED TO. Most steps in this job
      # are shell scripts needing no node, but two are tsx -- check:ci-gate-manifest
      # and check:ci-runner-selftest -- and without a node_modules tree they die
      # with `sh: 1: tsx: not found`, exit 127. Measured on run 33125687081: that
      # 127 failed Quality / Code and the watchdog cancelled seven sibling jobs,
      # so a missing dependency read as a broad CI failure.
      #
      # Defaults deliberately: no account submodule, no natives, no package build.
      # This job needs only node plus the cached tree, which untars in ~2.5s.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Text + a hermetic scratch git repo; no network, no submodule access.
      # Guards the bootstrap scripts against silently swallowing failures again.
      - name: Devcontainer script stderr visibility
        run: .ci/scripts/quality/check_devcontainer_scripts.py

      # Hermetic: greps the setup helpers and runs `setup --check`, which is
      # report-only. Installs nothing and needs no docker.
      - name: Setup path idempotency
        run: .ci/scripts/quality/check_setup_idempotency.py

      # One definition per gate-tool version, and nothing acquired unpinned.
      # Before this, ruff was pinned twice, PyYAML four times, and shfmt and
      # shellcheck not at all -- so the same gate reached different verdicts on
      # a host, in the devbox and here.
      - name: Shell file size
        run: .ci/scripts/quality/check_shell_size.py

      - name: Devbox exec invocation
        run: .ci/scripts/quality/check_devbox_exec.py

      - name: Toolchain pins
        run: .ci/scripts/quality/check_toolchain_pins.py

      - name: Toolchain env/Dockerfile sync
        run: .ci/scripts/quality/check_toolchain_env_dockerfile_sync.py

      # The pinned-tools definition and the host-toolchain runtime guard's call
      # sites are two independently maintained lists; a tool added to one and
      # not the other is invisible until someone hits it by hand.
      - name: Host toolchain runtime coverage
        run: .ci/scripts/quality/check_host_toolchain_coverage.py

      # A git identity capture (branch/ref/sha) guarded against empty but not
      # against a command's own misleading sentinel value is invisible to a
      # gate that only watches whether git itself succeeded.
      - name: Git-op conditional guards
        run: .ci/scripts/quality/check_git_op_conditionals.py

      # A script that INSTALLS a go tool must be able to FIND it. `go install`
      # writes to $(go env GOPATH)/bin, which is on no PATH by default, so a
      # bare invocation dies at 127 the line after a successful install. CI
      # never sees it -- actions/setup-go adds that directory itself -- which is
      # exactly why four instances accumulated in the submodule unnoticed.
      - name: Go tool PATH
        run: .ci/scripts/quality/check_go_tool_path.py

      # check:ci-parity proves a gate is WIRED into a workflow. It says nothing
      # about whether the JOB it landed in can execute it -- wired and runnable
      # are different claims, and only the first was checked. Run 33125687081
      # cost seven cancelled sibling jobs to that gap.
      - name: Gate prerequisites
        run: npm run check:ci-gate-prerequisites

      # A step invoking a PR_HEAD_REF-preferring script must set it. Found by
      # hand three times in one session before this gate existed.
      - name: PR_HEAD_REF completeness
        run: npm run check:ci-pr-head-ref-completeness

      # A guard must refuse a COMMAND, never a SENTENCE about one. Probes each
      # pre-bash guard with prose built from its own pattern; anchoring is the
      # fix, never deleting the pattern.
      - name: Guard mention anchoring
        run: npm run check:ci-guard-mention-anchoring

      # The enforcement layer cannot quietly disarm itself: guards are
      # inventoried shrink-only, and each must keep a case proving it blocks
      # AND one proving it allows. Block-only coverage cannot see
      # over-blocking, and an over-blocking guard is one that gets deleted.
      - name: Hook integrity
        run: .ci/scripts/quality/check_hook_integrity.py

      # The manifest decides which gates the PRE-PUSH lane runs, so a wrong
      # `slow` marking or a path set that omits a gate's own implementation
      # silently shrinks local coverage. Both directions are pinned in its
      # --selftest, which this step runs first.
      - name: Gate manifest self-consistency
        run: npm run check:ci-gate-manifest

      # TRAPS.md is the ledger of which instrument protects what. Every entry
      # names a pointer that must RESOLVE and be LIVE, or declares
      # JUDGMENT-ONLY and says what nothing reaches. The gate plants its own
      # defects first and refuses to judge the tree if any control misbehaves.
      - name: Trap registry dispositions
        run: npm run check:ci-trap-registry

      # The ci-runner's own controls. They ran on ONE side until now: `npm run
      # ci` executed them locally and nothing in CI did, which is the exact
      # asymmetry check:ci-parity exists to name.
      - name: CI runner selftest
        run: npm run check:ci-runner-selftest

      # Hermetic text check: the canonical CI-watch loop must live in one
      # place and be attempt-stable. Nine divergent copies existed before this,
      # several handing out a form that exits on the first `completed` -- which
      # a watchdog re-run makes a superseded attempt's verdict.
      - name: CI-watch recipe has one source
        run: .ci/scripts/quality/check_ci_watch_recipe.py

      # `producer | grep -q` under pipefail is a RACE, not a test: grep -q exits
      # at its first match, SIGPIPEs the producer, and pipefail makes that 141
      # the verdict. The step above shipped exactly that in both of its
      # detectors and certified "124 file(s) clean" over a real offender.
      - name: No racing pipefail/grep -q detectors
        run: npm run check:ci-pipefail-grep-q

      - name: Control-first gates prove their plant landed
        run: .ci/scripts/quality/check_control_vacuity.py

      # Also text-only and also before node: a script that cannot execute
      # fails with exit 126 before emitting anything, which is invisible to
      # any caller that counts output rather than exit codes.
      - name: Block non-executable invoked scripts
        run: .ci/scripts/quality/check_script_exec_bit.py

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Apply version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: .ci/scripts/version/bump.sh --version ${{ inputs.next_version }}

      # account: knip scans the account submodule trees and needs their deps to
      # resolve imports there; check:ci-dead-bash's corpus includes private/**.
      - id: setup
        uses: ./.github/actions/setup-workspace
        with:
          account: 'true'

      # Runs AFTER setup-workspace on purpose: this one is TypeScript and needs tsx,
      # unlike the two text-only checks above it in this job. Placing it beside them
      # cost a CI cycle to "tsx: not found" (exit 127).
      #
      # Reads the committed naturalization provenance. private/growth is a separate
      # repo and gitignored here, so the ledger is the only place CI can see which
      # model actually ran.
      # OUTSIDE the gate-bind region ON PURPOSE. This is infrastructure, not a gate:
      # nothing emits it from a `---- gate ----` header, so inside the region
      # `gate-bind --write` refuses it as a step "REMOVED from a region and re-emitted
      # by nothing". Both ways of silencing that were wrong: `--allow-drop` DELETES the
      # step, and giving an install script a gate header registers a non-gate as a gate.
      # After `id: setup`, before the region, so it still precedes every emitted step.
      # `check:lint:web` lints `workers/`, and eslint's type-aware rules need those
      # projects' own node_modules to resolve `@cloudflare/workers-types`. Without
      # them `RequestInfo` degrades to an error type that acts as `any` and the
      # type-aware rules report against the degraded types rather than the code.
      # This install used to happen only in the knip step further down, i.e. AFTER
      # this one.
      - name: Install worker project deps
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/typecheck-workers.sh --install
      # >>> gate-bind (generated by scripts/gate-bind.ts --write; do not edit inside)
      # Steps here are EMITTED from each gate's own `---- gate ----` header. Edit the
      # header, then run `npm run gate:bind -- --write`. See quality-static's region
      # for why it is placed by hand and never moved.
      #
      # PLACED AFTER `id: setup` DELIBERATELY. Every emitted step guards on
      # `steps.setup.outcome == 'success'`; a region above that step references a
      # step that has not run, the expression is empty, and every gate in the region
      # SKIPS while the job stays green.
      - name: App admin permission
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_no_app_admin_perm.py
      - name: AWS credential bridge
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-aws-credential-bridge
      - name: Backup bucket conformance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-backup-bucket-conformance
      - name: Backup manifest shape parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-backup-manifest-shape-parity
      - name: Backup protocol conformance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-backup-protocol-conformance
      - name: Bootstrap paths install through the dependency stamp
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-bootstrap-idempotency
      - name: Builder env contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-builder-env-contract
      - name: Ceph image pin freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-ceph-image-pin
      - name: Changed-file selection contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-changed-selection
      - name: CI fetch integrity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-fetch-integrity
      - name: CI job aggregation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_ci_job_aggregation.py
      - name: CI scripts declare the binaries they execute
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-shell-declared-commands
      - name: CLI docs stay in sync with their scripts' real flags
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_cli_doc_coverage.py
      - name: CLI examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:cli-examples
      - name: Command tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_command_tree.py
      - name: Controls are not written inside string literals
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-control-in-string
      - name: Design tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-design-tree
      - name: Dockerfile npm pins
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_docker_npm_pins.py
      - name: Enumeration vacuity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-enumeration-vacuity
      - name: Every source file reaches a linter
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_lint_scope_coverage.py
      - name: Fetch retry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_fetch_retry.py
      - name: Fixture event timestamps
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-fixture-event-timestamps
      - name: Format command covers its config's scope
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_format_scope.py
      - name: Gate binding
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-gate-bind
      - name: Gate cwd independence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-gate-cwd-independence
      - name: Gate-test real-file plants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_gate_test_real_file_plants.py
      - name: Generated manifest regions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-gen-manifest
      - name: Greenlight closure paths
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_greenlight_closures.py
      - name: Inner kill timers are reachable
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_inner_timeout_reachable.py
      - name: Instruction files do not prescribe a rejected merge method
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-merge-method-prose
      - name: jq boolean defaults
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-jq-boolean-default
      - name: Judged rule wiring
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_judged_rule_wiring.py
      - name: knip BLOCKER reasons
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-knip-blockers
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:lint:cli && npm run check:lint:web && npm run check:lint:tooling && npm run check:lint:account
      - name: Lockfile
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_lockfile.py
      - name: Mediated git tool stays lease-only and dry-run by default
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-git-tool-safety
      - name: Native modules rebuilt after every root install
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-native-rebuild
      - name: Naturalization model policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-naturalization-model-policy
      - name: No client-side key composition
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-no-client-key-composition
      - name: Package key budget
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-package-key-budget
      - name: Paths-origin provenance
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-paths-origin
      - name: Quality shard aggregation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-quality-complete
      - name: Retention knob parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-retention-knob-parity
      - name: Review prompt render
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_review_prompt_render.py
      - name: Rubric calibration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_rubric_calibration.py
      - name: Runtime imports are dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-runtime-imports-are-deps
      - name: Schema coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-schema-coverage
      - name: scripts/ domain partition
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-domain-partition
      - name: Shape duplication
