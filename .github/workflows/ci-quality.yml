      # rule is actually enforced, against the commits that really landed.
      - name: Every commit names its epic
        run: npm run check:ci-pr-task-trailers
        env:
          # `|| github.ref_name` for the same reason as the step above, and it
          # also retires PR_BASE_REF's own empty-on-push shape without touching
          # it: `origin/` alone is non-empty garbage, but the reader's
          # `branch === 'main'` skip is taken first and never reaches it.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_BASE_REF: origin/${{ github.event.pull_request.base.ref }}




