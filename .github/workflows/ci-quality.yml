      - name: Docker image freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DOCKERHUB_TOKEN: ${{ env.BWS_DOCKERHUB_TOKEN }}
        run: npm run check:ci-docker-image-freshness
      - name: Docs browse invariants
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-browse-invariants
      - name: Docs code-block copy units
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-copy-units
      - name: Docs thumbnail coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:ci-docs-thumb-coverage
      - name: E2E case-blind assertions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_e2e_case_blind_assertions.py
      - name: Enabled lint rules can actually fire
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: .ci/scripts/quality/check_lint_rule_liveness.py
      - name: External dependency freshness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (inputs.external_quality != 'skip') }}
