name: Cleanup PR Preview

on:
  pull_request_target: # security: approved — protected by fork guard in job condition
    types: [closed]

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  cleanup:
    name: Cleanup Preview
    runs-on: ubuntu-slim
    # Skip fork PRs (no access to secrets)
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      # Initial checkout uses the default GITHUB_TOKEN. We need this to land
      # before the local `./.github/actions/app-token` reference because
      # local composite actions are loaded from the workspace — without the
      # repo on disk first, the runner can't resolve them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            STRIPE_SANDBOX_SECRET_KEY > BWS_STRIPE_SANDBOX_SECRET_KEY
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: APP_PRIVATE_KEY STRIPE_SANDBOX_SECRET_KEY CLOUDFLARE_API_TOKEN
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GH_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          read -ra expected <<<"${SHADOW_EXPECTED_MISMATCH-}"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          is_expected() { local q="$1" e; for e in ${expected+"${expected[@]}"}; do [ "$e" = "$q" ] && return 0; done; return 1; }
          # A name excused here must be one this job actually compares, or the entry
          # sits forever excusing nothing.
          for e in ${expected+"${expected[@]}"}; do
            case " $SHADOW_NAMES " in *" $e "*) ;; *) echo "shadow $e is in SHADOW_EXPECTED_MISMATCH but not in SHADOW_NAMES -- it excuses nothing here; delete it"; rc=1 ;; esac
          done
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure, and
            # stays fatal even for an excused name: an empty is a broken fetch, not
            # the known value drift the ledger describes.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then
              # An excused name that MATCHES means the drift is gone, so the excuse must
              # go too, or exemptions outlive the reason for them.
              if is_expected "$n"; then echo "shadow $n matches, but is still excused by SHADOW_EXPECTED_MISMATCH -- the drift is resolved; delete it here and in shadow-expected-mismatches.json"; rc=1
              else echo "shadow $n match"; fi
            elif is_expected "$n"; then
              # Known drift, recorded with its evidence and its door. It does not stop
              # this job (the ledger is .ci/config/shadow-expected-mismatches.json):
            # blocking on it took the CI watchdog down on 2026-09-03 without
              # it monitoring anything, and the finding is already the operator's.
              echo "shadow $n MISMATCH (EXPECTED -- shadow-expected-mismatches.json, operator-only)"
            else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # Mint a GitHub App token scoped to console + account. The composite's
      # last step is `git config --global
      # url."https://x-access-token:$TOKEN@github.com/".insteadOf
      # "https://github.com/"`, which is what makes the later
      # `git submodule update --init private/account` authenticate.
      # actions/checkout's own token writes credentials at parent-repo local
      # scope via includeIf.gitdir, which doesn't apply to submodule gitdirs —
      # hence the "could not read Username for 'https://github.com'" failure
      # this PR is fixing.
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,account

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm run install:natives

      - name: Build shared packages
        run: npm run build:packages

      - name: Cleanup preview deployments
        run: .ci/scripts/housekeeping/cleanup-cf-preview.sh --branch "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup preview Worker
        run: npx wrangler delete --name pr-${{ github.event.pull_request.number }} --force 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup preview D1 database
        run: |
          DB_NAME="account-db-pr-${{ github.event.pull_request.number }}"
          npx wrangler d1 delete "$DB_NAME" --skip-confirmation 2>/dev/null \
            && echo "Deleted D1 database: $DB_NAME" \
            || echo "D1 database $DB_NAME not found (already deleted or never created)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Initialize account submodule
        run: git submodule update --init --depth 1 private/account

      - name: Install account dependencies
        run: npm install --prefix private/account

      - name: Cleanup Stripe sandbox
        run: npx tsx scripts/cleanup-sandbox.ts --pr-number ${{ github.event.pull_request.number }}
        working-directory: private/account
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}

      # Delete the per-PR Turnstile widget minted during deploy. The script
      # itself treats a missing widget (already deleted by the housekeeping
      # sweep, or never created) as a no-op, so this step is safe to hard-fail
      # on anything else. See deploy-preview side at ci.yml's
      # `Create PR Turnstile widget` step.
      - name: Cleanup PR Turnstile widget
        working-directory: private/account
        run: npx tsx scripts/preview-turnstile.ts delete "${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Deleting the environment OBJECT requires Administration:write, which
      # GITHUB_TOKEN can never hold -- the old `gh api -X DELETE
      # .../environments/pr-N` step here 403'd on every run while reporting
      # "already deleted". Deleting the deployment RECORDS only needs the
      # `deployments: write` permission this workflow already has, and the
      # repo's Deployments view is driven by the records, so this is what
      # actually removes pr-N from that view. The empty environment object
      # remains under Settings -> Environments (no secrets, no rules).
      #
      # Those empty objects are NOT reaped by automation and never will be.
      # cleanup-versions.sh Phase 6 exists for them but can never succeed:
      # check-no-app-admin-perm.sh is a blocking gate that forbids granting the
      # App Administration:write, deliberately, so a leaked token cannot delete
      # edge/stable. The real mechanism is a periodic manual `gh` sweep by a
      # human with an owner token -- one on 2026-08-05 removed 13 stale pr-*
      # environments with production verified surviving by name and by id.
      - name: Delete GitHub deployments for PR environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci/scripts/housekeeping/cleanup-github-deployments.sh --repo "${{ github.repository }}" --environment "pr-${{ github.event.pull_request.number }}"
