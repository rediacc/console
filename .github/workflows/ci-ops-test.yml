name: CI - OPS Tests

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  # ── Full VM provisioning test (KVM available) ──────────────────
  ops-vm-provision:
    name: OPS Provision (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-amd64
            arch: x86_64
            full_test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap

      - name: Checkout with Submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: .ci/scripts/setup/install-deps.sh
      - run: .ci/scripts/setup/build-packages.sh

      - name: Install clang for BPF compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      - name: Build renet
        run: .ci/scripts/infra/build-renet.sh --nolicense

      # eBPF socket-isolation behavioral tests. These load the production
      # BPF objects, attach to a fresh test cgroup, and exercise real
      # bind/connect rewrites. Loading cgroup_sock_addr programs requires
      # root + CAP_BPF, which the GitHub runner has via sudo.
      #
      # Regression coverage for the dual-stack [::] healthcheck bug
      # (private/renet/docs/NETWORK_ISOLATION.md): TestEBPF_Bind6DualStackReachableFromV4
      # fails if a future change re-introduces a [::] -> specific-v6
      # rewrite that breaks v4 healthchecks.
      - name: "Test: eBPF socket-isolation behavior"
        run: |
          cd private/renet
          sudo -E env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" \
            go test -tags=ebpf_e2e -v -run TestEBPF_ -timeout 2m ./pkg/ebpf/...

      - name: Build CLI
        # OTLP credentials are fetched at runtime after `rdc subscription
        # login` — no longer baked into the bundle (renet#51).
        run: npm run build -w @rediacc/cli && npm run build:bundle -w @rediacc/cli

      - name: Configure local config
        run: |
          CONFIG_DIR=$(node -e "import('./packages/shared/dist/paths/index.js').then(m=>console.log(m.getConfigDir()))")
          mkdir -p "$CONFIG_DIR"
          jq -n --arg renet "$RENET_BINARY" \
            '{id:"00000000-0000-0000-0000-000000000000",version:1,renetPath:$renet}' \
            > "$CONFIG_DIR/rediacc.json"

      # VM base-image cache: warm runs restore the Ubuntu cloud image into the
      # renet disks dir so `ops up` skips the network download entirely; the
      # bounded downloader in renet is the cold-path fallback. The key rotates
      # monthly because the noble/release URL is a moving pointer. The filename
      # is hardcoded (pkg/infra/config/images.go, GetKVMImages[0]) because the
      # macos leg has no submodule checkout for hashFiles() to read.
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-ubuntu-24.04-minimal-cloudimg-amd64-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: "Test: rdc ops setup"
        run: node packages/cli/dist/cli-bundle.cjs ops setup

      - name: "Test: rdc ops check"
        run: node packages/cli/dist/cli-bundle.cjs ops check -o json

      - name: "Test: rdc ops up --basic"
        run: |
          sudo -E node packages/cli/dist/cli-bundle.cjs ops up \
            --basic --skip-orchestration -o json

      - name: "Test: rdc ops status"
        id: status
        run: |
          STATUS=$(sudo -E node packages/cli/dist/cli-bundle.cjs ops status -o json)
          echo "$STATUS"
          BRIDGE_IP=$(echo "$STATUS" | jq -r '.data.vms[0].ip')
          echo "bridge_ip=$BRIDGE_IP" >> "$GITHUB_OUTPUT"

      - name: "Verify: ping connectivity"
        run: ping -c 3 -W 5 "${{ steps.status.outputs.bridge_ip }}"

      - name: "Verify: SSH connectivity"
        run: .ci/scripts/infra/verify-ssh.sh "${{ steps.status.outputs.bridge_ip }}"
        env:
          SSH_KEY: $RUNNER_TEMP/renet/staging/.ssh/id_rsa
          CHOWN_PATH: $RUNNER_TEMP/renet
          ATTEMPTS: 15
      - name: "Test: rdc ops down"
        if: always()
        run: sudo -E node packages/cli/dist/cli-bundle.cjs ops down -o json || true

      - name: "Verify: cleanup"
        if: always()
        run: |
          STATUS=$(sudo -E node packages/cli/dist/cli-bundle.cjs ops status -o json 2>/dev/null || echo '{"data":{"vms":[]}}')
          echo "$STATUS" | jq -e '.data.vms | length == 0' || echo "Warning: VMs still present after cleanup"

      # `ops up` ran via sudo, so the downloaded image is root-owned; chown it
      # so the (unprivileged) cache save can read it even when provisioning
      # failed after the download.
      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.vm-image-key.outputs.key }}

  # ── Full VM provisioning test (QEMU + HVF on macOS Intel) ────
  # macOS Intel runners support HVF (Hypervisor Framework), enabling
  # hardware-accelerated QEMU provisioning. Downloads pre-built renet binary.
  ops-qemu-provision:
    name: OPS Provision (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            name: macos-intel
            platform: darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: .ci/scripts/setup/install-deps.sh
        shell: bash
      - run: .ci/scripts/setup/build-packages.sh
        shell: bash

      - name: Download renet binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: renet-binaries-${{ github.sha }}
          path: private/bin/

      - name: Set renet binary path
        shell: bash
        run: |
          RENET_BIN="$(pwd)/private/bin/renet-darwin-amd64"
          chmod +x "$RENET_BIN"
          echo "RENET_BINARY=$RENET_BIN" >> "$GITHUB_ENV"

      - name: Build CLI
        shell: bash
        run: npm run build -w @rediacc/cli && npm run build:bundle -w @rediacc/cli

      - name: Configure local config
        shell: bash
        run: |
          CONFIG_DIR=$(node -e "import('./packages/shared/dist/paths/index.js').then(m=>console.log(m.getConfigDir()))")
          mkdir -p "$CONFIG_DIR"
          jq -n --arg renet "$RENET_BINARY" \
            '{id:"00000000-0000-0000-0000-000000000000",version:1,renetPath:$renet}' \
            > "$CONFIG_DIR/rediacc.json"

      - name: "Test: rdc ops setup"
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops setup

      - name: Generate SSH keypair
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
          echo "SSH keypair generated for QEMU cloud-init injection"

      # Same VM base-image cache as the linux leg (same amd64 image + key).
      - name: Compute VM image cache key
        id: vm-image-key
        shell: bash
        run: echo "key=vm-base-image-ubuntu-24.04-minimal-cloudimg-amd64-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: "Test: rdc ops check"
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops check -o json

      - name: "Test: rdc ops up --basic"
        shell: bash
        run: |
          node packages/cli/dist/cli-bundle.cjs ops up \
            --basic --skip-orchestration -o json

      - name: "Test: rdc ops status"
        id: status
        shell: bash
        run: |
          STATUS=$(node packages/cli/dist/cli-bundle.cjs ops status -o json)
          echo "$STATUS"
          # QEMU returns localhost:<port> addresses. Keep all running VMs so
          # SSH checks can fall back if one VM is slow/unreachable.
          VM_ADDRS=$(echo "$STATUS" | jq -r '[.data.vms[] | select(.status == "running") | .ip] | join(" ")')
          if [[ -z "$VM_ADDRS" ]]; then
            echo "No running VM addresses found in ops status output"
            exit 1
          fi
          echo "vm_addrs=$VM_ADDRS" >> "$GITHUB_OUTPUT"

      - name: "Verify: SSH connectivity"
        shell: bash
        run: .ci/scripts/infra/verify-ssh.sh ${{ steps.status.outputs.vm_addrs }}
        env:
          SSH_KEY: $HOME/.ssh/id_ed25519
          ATTEMPTS: 20
      - name: "Test: rdc ops down"
        if: always()
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops down -o json || true

      - name: "Verify: cleanup"
        if: always()
        shell: bash
        run: |
          STATUS=$(node packages/cli/dist/cli-bundle.cjs ops status -o json 2>/dev/null || echo '{"data":{"vms":[]}}')
          echo "$STATUS" | jq -e '.data.vms | length == 0' || echo "Warning: VMs still present after cleanup"

      # No chown needed: this leg runs ops up unprivileged.
      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.vm-image-key.outputs.key }}

  # ── Platform validation (no hardware acceleration, check only) ─
  # Downloads pre-built renet binaries from the build-renet job artifact.
  # Tests CLI ops check, renet binary execution, and QEMU availability.
  # These platforms lack KVM/HVF, so full provisioning is not tested.
  ops-platform-check:
    name: OPS Check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            platform: linux
            arch: arm64
          - runner: macos-latest
            name: macos-arm64
            platform: darwin
            arch: arm64
          - runner: windows-latest
            name: windows-amd64
            platform: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: .ci/scripts/setup/install-deps.sh
        shell: bash
      - run: .ci/scripts/setup/build-packages.sh
        shell: bash

      - name: Download renet binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: renet-binaries-${{ github.sha }}
          path: private/bin/

      - name: Set renet binary path
        shell: bash
        run: |
          PLATFORM=${{ matrix.platform }}
          ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          EXT=""
          if [ "$PLATFORM" = "windows" ]; then EXT=".exe"; fi
          RENET_BIN="$(pwd)/private/bin/renet-${PLATFORM}-${ARCH}${EXT}"
          chmod +x "$RENET_BIN" 2>/dev/null || true
          echo "RENET_BINARY=$RENET_BIN" >> "$GITHUB_ENV"

      - name: Build CLI
        shell: bash
        run: npm run build -w @rediacc/cli && npm run build:bundle -w @rediacc/cli

      - name: Configure local config
        shell: bash
        run: |
          CONFIG_DIR=$(node -e "import('./packages/shared/dist/paths/index.js').then(m=>console.log(m.getConfigDir()))")
          mkdir -p "$CONFIG_DIR"
          jq -n --arg renet "$RENET_BINARY" \
            '{id:"00000000-0000-0000-0000-000000000000",version:1,renetPath:$renet}' \
            > "$CONFIG_DIR/rediacc.json"

      - name: "Test: rdc ops setup"
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops setup

      - name: "Test: rdc ops check"
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops check -o json

      - name: "Test: renet binary runs"
        shell: bash
        run: $RENET_BINARY version

      - name: "Test: renet ops host check"
        shell: bash
        run: $RENET_BINARY ops host check || true

      - name: "Test: QEMU binary works (macOS)"
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          qemu-system-aarch64 --version || qemu-system-x86_64 --version
          qemu-img --version

      - name: "Test: renet ops host check --json (Windows)"
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          OUTPUT=$($RENET_BINARY ops host check --json)
          echo "$OUTPUT"
          echo "$OUTPUT" | jq -e '.platform == "windows"'
          echo "$OUTPUT" | jq -e '.backend == "hyperv"'
