name: CI - OPS Tests

on:
  workflow_call:
    secrets:
      BWS_ACCESS_TOKEN:
        required: true
# Every job below declares its own permissions, so this workflow-level default
# is deliberately empty: a job added without a block gets nothing and fails
# loudly, rather than silently inheriting a scope nobody audited it for.
# This is a reusable workflow. A callee can never exceed what the calling job
# grants, so each job's block below is also the contract its callers must meet.
permissions: {}

jobs:
  # ── Full VM provisioning test (KVM available) ──────────────────
  ops-vm-provision:
    # T2.16 (PLAN-ci-time-budget, D-W4): 5 shards, each a full independent
    # leg -- its own runner, its own `ops up` cluster, its own tutorial
    # slice (`.ci/tutorials/run-sequence.sh`'s `TUTORIAL_SHARD`). D-W4
    # replaces the earlier "4 contiguous segments with a `needs` chain"
    # design: every tutorial is already an independent unit at the
    # shard-planning layer (scripts/ci-runner/unit-enumerators.ts
    # opsTutorialUnits, T2.8), so a shard boundary needs no hand-off. What
    # this does NOT yet do is verify that no tutorial script actually still
    # reads state a PRECEDING tutorial left on the machine: today's
    # contiguous chunking keeps each shard's slice in website order, so an
    # undiscovered dependency between two ADJACENT tutorials assigned to the
    # same shard still happens to work, and one crossing a shard boundary is
    # the thing a live run of this workflow is what actually proves. Making
    # every tutorial script provision its own fixtures regardless of shard
    # placement is `.ci/tutorials/tutorial-*.sh` work, outside this file.
    name: OPS Provision (${{ matrix.name }}, ${{ matrix.shard }}/${{ matrix.shard_of }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # packages: read is REQUIRED and had no local declaration at all before
    # this: the ghcr login uses github.token and the credential is then copied
    # into the VM root docker config so `rdc repo up` pulls through it. This
    # file declared no permissions, so the scope came only from whatever the
    # caller happened to pass.
    permissions:
      contents: read
      packages: read
    strategy:
      # fail-fast: false, and the reason is diagnostic rather than stylistic.
      # GitHub's matrix fail-fast cancels every sibling the moment one leg fails,
      # BEFORE the watchdog is ever consulted, so a cancelled sibling never
      # reaches a verdict and never appears in the watchdog's failure roster. On
      # a branch being driven to green that turns each round into one failure
      # instead of the whole surface, which is the exact serialisation this
      # program is trying to remove. Its siblings ci-build-docker.yml and
      # ci-build-renet.yml already set it; these two were the odd ones out.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-amd64
            arch: x86_64
            full_test: true
            shard: 1
            shard_of: 5
          - runner: ubuntu-latest
            name: linux-amd64
            arch: x86_64
            full_test: true
            shard: 2
            shard_of: 5
          - runner: ubuntu-latest
            name: linux-amd64
            arch: x86_64
            full_test: true
            shard: 3
            shard_of: 5
          - runner: ubuntu-latest
            name: linux-amd64
            arch: x86_64
            full_test: true
            shard: 4
            shard_of: 5
          - runner: ubuntu-latest
            name: linux-amd64
            arch: x86_64
            full_test: true
            shard: 5
            shard_of: 5
    steps:
      # Same preinstalled-bloat removal ct-tests.yml uses (5 sites): this job
      # (VM images + renet artifacts + 18 tutorials of casts) crashed the
      # runner's own worker with ENOSPC mid-sequence (run 30017108104
      # attempt 1 -- no logs, no artifacts, diag writer itself failed).
      - name: Free runner disk (preinstalled bloat)
        # PLAN-ci-time-budget follow-up: measure free space on / first and
        # only pay for the removal (38-341s observed) when it is actually
        # needed, mirroring .github/actions/free-disk-space's guard.
        run: |
          avail_gb="$(df -BG --output=avail / | tail -n1 | tr -dc '0-9')"
          echo "Free space on /: ${avail_gb}GB (threshold: 40GB)"
          if [ -n "$avail_gb" ] && [ "$avail_gb" -lt 40 ]; then
            echo "Below threshold; removing preinstalled toolchains"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          else
            echo "At or above threshold; skipping cleanup"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch secrets from Bitwarden
        # LIVE: the BWS_ values below are read by this job's steps, flipped from
        # secrets.* by the cutover. The secrets.* reads that remain are the
        # comparator's, which must keep reading GitHub or it compares a value with
        # itself and passes forever.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            DOCKERHUB_TOKEN > BWS_DOCKERHUB_TOKEN
            DOCKERHUB_USERNAME > BWS_DOCKERHUB_USERNAME
            GITHUB_APP_PRIVATE_KEY > BWS_APP_PRIVATE_KEY
            GITHUB_APP_ID > BWS_APP_ID
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ env.BWS_APP_ID }}
          private-key: ${{ env.BWS_APP_PRIVATE_KEY }}
          preset: readonly
          repositories: console,renet,account,elite,homebrew-tap

      - name: Checkout with Submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.BWS_DOCKERHUB_USERNAME }}
          password: ${{ env.BWS_DOCKERHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      # account: this job checks out `submodules: recursive`, so install-deps.sh
      # used to install private/account's tree here as a side effect. Keeping it
      # explicit preserves that; without it the account trees would silently stop
      # being installed.
      - uses: ./.github/actions/setup-workspace
        with:
          account: 'true'
          build-packages: 'true'

      - name: Install clang for BPF compilation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic
      # Staged embed-assets cache, shared with Build (Renet) via the same key
      # (see ci-build-renet.yml). On a hit, build.sh's content-based receipt
      # makes embed_assets a verified no-op, skipping the ~10-25 min Docker
      # builder staging. The nolicense go build itself stays on-runner:
      # console is public, so dev binaries must never be uploaded as artifacts.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Build renet
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.build_renet --nolicense
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}
      - name: Make renet resolvable without config
        # The tutorial scripts below wipe ~/.config/rediacc/rediacc.json
        # (which carries renetPath) in their pre-recording setup; the CLI
        # then falls back to resolving `renet` from PATH
        # (packages/cli/src/services/renet/renet-execution.ts). A symlink in
        # /usr/local/bin covers both unprivileged steps and the sudo steps
        # (`ops down` after the wipe), which see secure_path, not GITHUB_PATH.
        run: sudo ln -sf "$RENET_BINARY" /usr/local/bin/renet

      # eBPF socket-isolation behavioral tests. These load the production
      # BPF objects, attach to a fresh test cgroup, and exercise real
      # bind/connect rewrites. Loading cgroup_sock_addr programs requires
      # root + CAP_BPF, which the GitHub runner has via sudo.
      #
      # Regression coverage for the dual-stack [::] healthcheck bug
      # (private/renet/docs/NETWORK_ISOLATION.md): TestEBPF_Bind6DualStackReachableFromV4
      # fails if a future change re-introduces a [::] -> specific-v6
      # rewrite that breaks v4 healthchecks.
      - name: "Test: eBPF socket-isolation behavior"
        run: |
          cd private/renet
          sudo -E env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" \
            go test -tags=ebpf_e2e -v -run TestEBPF_ -timeout 2m ./pkg/ebpf/...

      - name: Build CLI
        # OTLP credentials are fetched at runtime after `rdc subscription
        # login` — no longer baked into the bundle (renet#51).
        run: npm run build:cli

      - name: Configure local config
        run: |
          CONFIG_DIR=$(node -e "import('./packages/shared/dist/paths/index.js').then(m=>console.log(m.getConfigDir()))")
          mkdir -p "$CONFIG_DIR"
          jq -n --arg renet "$RENET_BINARY" \
            '{id:"00000000-0000-0000-0000-000000000000",version:1,renetPath:$renet}' \
            > "$CONFIG_DIR/rediacc.json"

      # VM base-image cache: warm runs restore the Ubuntu cloud image into the
      # renet disks dir so `ops up` skips the network download entirely; the
      # bounded downloader in renet is the cold-path fallback. The key rotates
      # monthly because the noble/release URL is a moving pointer. The filename
      # is hardcoded to match pkg/infra/config/images.go, GetKVMImages[0].
      - name: Compute VM image cache key
        id: vm-image-key
        run: echo "key=vm-base-image-ubuntu-24.04-minimal-cloudimg-amd64-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore VM base image cache
        id: vm-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.vm-image-key.outputs.key }}

      - name: "Test: rdc ops setup"
        run: node packages/cli/dist/cli-bundle.cjs ops setup

      - name: "Test: rdc ops check"
        run: node packages/cli/dist/cli-bundle.cjs ops check -o json

      - name: "Test: rdc ops up --basic"
        run: |
          sudo -E node packages/cli/dist/cli-bundle.cjs ops up \
            --basic --skip-orchestration -o json

      - name: "Test: rdc ops status"
        id: status
        run: |
          STATUS=$(sudo -E node packages/cli/dist/cli-bundle.cjs ops status -o json)
          echo "$STATUS"
          BRIDGE_IP=$(echo "$STATUS" | jq -r '.data.vms[0].ip')
          echo "bridge_ip=$BRIDGE_IP" >> "$GITHUB_OUTPUT"
          # `ops status` lists every CONFIGURED VM (absent ones included), so
          # select workers by id, never by array position. Worker 12 does not
          # exist yet at this point — its IP still resolves from the config.
          WORKER_IP=$(echo "$STATUS" | jq -r '.data.vms[] | select(.id == 11) | .ip')
          echo "worker_ip=$WORKER_IP" >> "$GITHUB_OUTPUT"
          WORKER2_IP=$(echo "$STATUS" | jq -r '.data.vms[] | select(.id == 12) | .ip')
          echo "worker2_ip=$WORKER2_IP" >> "$GITHUB_OUTPUT"

      - name: "Verify: ping connectivity"
        run: ping -c 3 -W 5 "${{ steps.status.outputs.bridge_ip }}"

      - name: "Verify: SSH connectivity"
        run: PYTHONPATH=.ci python3 -m rediacc_ci.infra.verify_ssh "${{ steps.status.outputs.bridge_ip }}"
        env:
          SSH_KEY: ${{ runner.temp }}/renet/staging/.ssh/id_rsa
          CHOWN_PATH: ${{ runner.temp }}/renet
          ATTEMPTS: 15

      # ── Tutorial sequence validation (#424) ─────────────────────
      # Runs THIS SHARD's slice of the tutorial scripts sequentially, in
      # website order, against the cluster provisioned above -- exit codes
      # are the verdict (each script is set -euo pipefail and run_cmd aborts
      # on the first failing command).
      #
      # T2.16 (D-W4): cross-tutorial machine state is no longer exercised
      # ACROSS a shard boundary -- 5 shards means 5 independently provisioned
      # clusters, each running only its own slice. It is still incidentally
      # exercised BETWEEN two tutorials the shard's contiguous slice happens
      # to keep adjacent, same as before (renet#60 escaped exactly there:
      # every command passed alone and only the sequence broke, EADDRINUSE on
      # `repo fork --up`). Per-command tests and the static
      # check:ci-tutorial-* gates are structurally blind to both.
      #
      # Single source of truth: .ci/tutorials/run-sequence.sh derives the
      # full list and order from the docs' `order:` frontmatter, fails on
      # doc<->script drift, and slices out this shard's share via
      # `TUTORIAL_SHARD`, so adding/removing/reordering a tutorial updates
      # every shard automatically. Deliberately INSIDE ops-vm-provision: a
      # separate job means a second runner reprovisioning the cluster
      # (~14 min); sharding this job already pays that cost 5 times over for
      # the parallelism, and a further split would only add a 6th.
      - name: "Tutorial prep: add second worker"
        # ssh-keys, delta-transfer, and live-migration use a second machine.
        # Idempotent over the --basic cluster: existing VMs are left alone,
        # only worker 12 is created. Ceph nodes stay disabled.
        run: |
          sudo -E env VM_CEPH_NODES= node packages/cli/dist/cli-bundle.cjs \
            ops up --skip-orchestration -o json

      - name: "Tutorial prep: Docker Hub auth on worker VMs"
        # `rdc repo up` runs renet via sudo on the worker, so image pulls
        # through the per-repo daemon read root's docker config. Written over
        # SSH as a raw file because docker is not installed on the VMs until
        # `rdc machine setup` runs inside the tutorials' preambles.
        env:
          SSH_KEY: ${{ runner.temp }}/renet/staging/.ssh/id_rsa
          WORKER_IP: ${{ steps.status.outputs.worker_ip }}
          WORKER2_IP: ${{ steps.status.outputs.worker2_ip }}
          DOCKERHUB_USERNAME: ${{ env.BWS_DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ env.BWS_DOCKERHUB_TOKEN }}
        run: |
          AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)
          for ip in "$WORKER_IP" "$WORKER2_IP"; do
            printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" |
              ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "$(whoami)@$ip" \
                'sudo mkdir -p /root/.docker && sudo tee /root/.docker/config.json >/dev/null && sudo chmod 600 /root/.docker/config.json'
          done

      - name: "Tutorial prep: default SSH identity"
        # The ssh-keys tutorial's ssh-copy-id authenticates with the caller's
        # default identity; give the runner user one.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cp "$RUNNER_TEMP/renet/staging/.ssh/id_rsa" ~/.ssh/id_rsa
          cp "$RUNNER_TEMP/renet/staging/.ssh/id_rsa.pub" ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa

      - name: "Tutorial sequence (shard ${{ matrix.shard }}/${{ matrix.shard_of }}, website order)"
        env:
          TUTORIAL_RDC_CMD: node ${{ github.workspace }}/packages/cli/dist/cli-bundle.cjs
          TUTORIAL_MACHINE_IP: ${{ steps.status.outputs.worker_ip }}
          TUTORIAL_BACKUP_HOST: ${{ steps.status.outputs.worker2_ip }}
          TUTORIAL_SSH_KEY: ${{ runner.temp }}/renet/staging/.ssh/id_rsa
          TUTORIAL_CHAR_DELAY: '0'
          TUTORIAL_LOG_DIR: ${{ runner.temp }}/tutorial-logs
          TUTORIAL_SHARD: ${{ matrix.shard }}/${{ matrix.shard_of }}
          # V8 compile cache: ~120ms of bundle compilation per rdc invocation,
          # paid ~200 times across the sequence without it.
          NODE_COMPILE_CACHE: ${{ runner.temp }}/v8-compile-cache
        run: |
          TUTORIAL_MACHINE_USER="$(whoami)"
          TUTORIAL_BACKUP_USER="$(whoami)"
          export TUTORIAL_MACHINE_USER TUTORIAL_BACKUP_USER
          .ci/tutorials/run-sequence.sh

      - name: Upload tutorial sequence logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tutorial-sequence-logs-${{ matrix.name }}-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/tutorial-logs/
          retention-days: 30
          if-no-files-found: ignore

      # T1.6 (PLAN-ci-time-budget): the same file as above, ALSO under its own
      # `unit-durations-ops-tutorials-` artifact -- the prefix
      # `budget_report.py`'s T1.6 producer-contract docstring says its
      # (not-yet-written) T3.2 reader will match artifacts by, ahead of the
      # `ops-tutorials` lane id. The human-log artifact above keeps its
      # existing name so `.ci/scripts/ci/skip-plan-reconcile.cjs` and anything
      # else already keyed on it is undisturbed; this is a second, narrower
      # upload of one file, not a rename.
      - name: Upload tutorial durations (unit-durations)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-durations-ops-tutorials-${{ matrix.name }}-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/tutorial-logs/tutorial-durations.json
          retention-days: 3
          if-no-files-found: ignore

      - name: "Test: rdc ops down"
        if: always()
        run: sudo -E node packages/cli/dist/cli-bundle.cjs ops down -o json || true

      - name: "Verify: cleanup"
        if: always()
        run: |
          STATUS=$(sudo -E node packages/cli/dist/cli-bundle.cjs ops status -o json 2>/dev/null || echo '{"data":{"vms":[]}}')
          echo "$STATUS" | jq -e '.data.vms | length == 0' || echo "Warning: VMs still present after cleanup"

      # `ops up` ran via sudo, so the downloaded image is root-owned; chown it
      # so the (unprivileged) cache save can read it even when provisioning
      # failed after the download.
      - name: Fix VM image ownership for cache save
        if: always()
        run: sudo chown -R "$(whoami)" "$RUNNER_TEMP/renet/disks" 2>/dev/null || true

      - name: Save VM base image cache
        if: always() && steps.vm-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/renet/disks/ubuntu-24.04-minimal-cloudimg-amd64.img
          key: ${{ steps.vm-image-key.outputs.key }}

  # ── Platform validation (no hardware acceleration, check only) ─
  # Downloads pre-built renet binaries from the build-renet job artifact.
  # Tests CLI ops check, renet binary execution, and QEMU availability.
  # These platforms lack KVM/HVF, so full provisioning is not tested.
  ops-platform-check:
    name: OPS Check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # Checkout and artifacts. No registry, no GitHub API.
    permissions:
      contents: read
    strategy:
      # fail-fast: false, and the reason is diagnostic rather than stylistic.
      # GitHub's matrix fail-fast cancels every sibling the moment one leg fails,
      # BEFORE the watchdog is ever consulted, so a cancelled sibling never
      # reaches a verdict and never appears in the watchdog's failure roster. On
      # a branch being driven to green that turns each round into one failure
      # instead of the whole surface, which is the exact serialisation this
      # program is trying to remove. Its siblings ci-build-docker.yml and
      # ci-build-renet.yml already set it; these two were the odd ones out.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            platform: linux
            arch: arm64
          - runner: macos-latest
            name: macos-arm64
            platform: darwin
            arch: arm64
          - runner: windows-latest
            name: windows-amd64
            platform: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace
        with:
          build-packages: 'true'

      - name: Download renet binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: renet-binaries-${{ github.sha }}
          path: private/bin/

      - name: Set renet binary path
        shell: bash
        run: |
          PLATFORM=${{ matrix.platform }}
          ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          EXT=""
          if [ "$PLATFORM" = "windows" ]; then EXT=".exe"; fi
          RENET_BIN="$(pwd)/private/bin/renet-${PLATFORM}-${ARCH}${EXT}"
          chmod +x "$RENET_BIN" 2>/dev/null || true
          echo "RENET_BINARY=$RENET_BIN" >> "$GITHUB_ENV"

      - name: Build CLI
        shell: bash
        run: npm run build:cli

      - name: Configure local config
        shell: bash
        run: |
          CONFIG_DIR=$(node -e "import('./packages/shared/dist/paths/index.js').then(m=>console.log(m.getConfigDir()))")
          mkdir -p "$CONFIG_DIR"
          jq -n --arg renet "$RENET_BINARY" \
            '{id:"00000000-0000-0000-0000-000000000000",version:1,renetPath:$renet}' \
            > "$CONFIG_DIR/rediacc.json"

      - name: "Test: rdc ops setup"
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops setup

      - name: "Test: rdc ops check"
        shell: bash
        run: node packages/cli/dist/cli-bundle.cjs ops check -o json

      - name: "Test: renet binary runs"
        shell: bash
        run: $RENET_BINARY version

      - name: "Test: renet ops host check"
        shell: bash
        run: $RENET_BINARY ops host check || true

      - name: "Test: QEMU binary works (macOS)"
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          qemu-system-aarch64 --version || qemu-system-x86_64 --version
          qemu-img --version

      - name: "Test: renet ops host check --json (Windows)"
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          OUTPUT=$($RENET_BINARY ops host check --json)
          echo "$OUTPUT"
          echo "$OUTPUT" | jq -e '.platform == "windows"'
          echo "$OUTPUT" | jq -e '.backend == "hyperv"'
