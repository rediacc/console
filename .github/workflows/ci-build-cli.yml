name: Console CI - Build (CLI Executables)

on:
  workflow_call:
    inputs:
      next_version:
        type: string
        required: false

permissions:
  contents: read

# Note: Renet binaries are built by ci-build-renet.yml and downloaded as artifact
# This workflow depends on build-renet completing first (configured in ci.yml)

jobs:
  build-cli-executables:
    name: CLI (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            timeout: 15
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            timeout: 15
          - os: macos-latest
            platform: mac
            arch: arm64
            timeout: 15
          - os: macos-15-intel
            platform: mac
            arch: x64
            timeout: 15
          - os: windows-latest
            platform: win
            arch: x64
            timeout: 20
          - os: windows-11-arm
            platform: win
            arch: arm64
            timeout: 30
          # Musl-linked Linux binaries (for Alpine/musl distros)
          # Built inside node:22-alpine Docker container on Ubuntu runners
          - os: ubuntu-latest
            platform: linux-musl
            arch: x64
            timeout: 20
          - os: ubuntu-24.04-arm
            platform: linux-musl
            arch: arm64
            timeout: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download full renet binaries (with embedded CRIU/rsync) from unified build
      - name: Download renet binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: renet-binaries-${{ github.sha }}
          path: private/bin/

      # Native build steps (skip for musl — handled inside Docker)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: matrix.platform != 'linux-musl'
        with:
          node-version: '22'
          cache: 'npm'

      - run: .ci/scripts/setup/install-deps.sh ${{ runner.os == 'Windows' && '--ignore-scripts' || '' }}
        if: matrix.platform != 'linux-musl'
        shell: bash
      - run: .ci/scripts/setup/build-packages.sh
        if: matrix.platform != 'linux-musl'
        shell: bash

      - name: Build CLI SEA executable
        if: matrix.platform != 'linux-musl'
        shell: bash
        run: .ci/scripts/build/build-cli-executables.sh --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        env:
          CLI_VERSION: ${{ inputs.next_version || '0.0.0-dev' }}

      # Musl build (runs entire build inside Alpine Docker container)
      - name: Build CLI SEA executable (musl)
        if: matrix.platform == 'linux-musl'
        shell: bash
        run: .ci/scripts/build/build-cli-musl.sh --arch ${{ matrix.arch }}
        env:
          CLI_VERSION: ${{ inputs.next_version || '0.0.0-dev' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-cli-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist/cli/
          retention-days: 3
          if-no-files-found: error
