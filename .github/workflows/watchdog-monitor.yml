name: Watchdog Monitor
run-name: "Watchdog: run ${{ inputs.target_run_id }} (gen ${{ inputs.generation }}${{ inputs.pending_rerun == 'true' && ', rerun pending' || '' }})"

# One ~8-minute generation of the chained CI watchdog. ubuntu-slim (1 vCPU)
# has a hard, non-overridable 15-minute job cap, so the old single 3-hour
# monitor job cannot run there; instead each generation polls until
# WATCHDOG_DEADLINE_SECONDS and then dispatches the next generation via
# dispatch-watchdog.sh, which also enforces the generation cap reproducing
# the old 3-hour backstop. Dispatched by ci.yml's CI Watchdog bootstrap
# (gen 1) and by itself (gen N+1). A lost dispatch fails open: the run
# finishes unwatched and ci-complete still gates on every job's real
# conclusion.
#
# The retry path lives in this same chain (the old separate Rerun Failed
# Jobs workflow existed only because the in-run watchdog died with the run
# it monitored): a transient verdict sets pending_rerun, carried through
# generations; when the run completes, the chain reruns the failed jobs
# itself and keeps monitoring attempt 2 with the generation counter reset.

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: 'CI run to monitor'
        required: true
        type: string
      generation:
        description: 'Chain generation (1-based, resets when a rerun starts a new attempt)'
        required: false
        type: string
        default: '1'
      pr_number:
        description: 'PR number for live label reads (empty on push/schedule runs)'
        required: false
        type: string
        default: ''
      head_ref:
        description: 'Head branch carrying this workflow copy (chain dispatch ref)'
        required: false
        type: string
        default: ''
      pending_rerun:
        description: 'true when a prior generation classified a failure as transient; wait for completion, then rerun failed jobs'
        required: false
        type: string
        default: 'false'

permissions:
  contents: read
  actions: write   # cancel the target run, rerun failed jobs, dispatch next generation

# One chain per monitored run: a duplicate dispatch queues behind the live
# generation, then sees the run already completed (or handled) and exits fast.
concurrency:
  group: watchdog-${{ inputs.target_run_id }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor run ${{ inputs.target_run_id }} (gen ${{ inputs.generation }})
    runs-on: ubuntu-slim
    # 14, not 15: at exactly the platform cap this timeout races the kill and
    # loses often enough to matter, and losing means CANCELLED-with-no-failed-step
    # instead of a timeout naming the step. The worst case here is 480s poll +
    # ~25s AI + <=5min force-cancel wait = 13.4m, which still fits.
    # Enforced by CHECK 3 in .ci/scripts/security/check-workflow-gates.sh.
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .ci/scripts
            .ci/prompts
            .github/actions
            .ci/config

      - name: Fetch shadow secrets from Bitwarden
        # SHADOW RUN: exports BWS_-prefixed copies that nothing consumes. The
        # live secrets.* reads below are untouched until the cutover flips them.
        uses: ./.github/actions/bws-secrets
        with:
          access-token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN > BWS_ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN
            CLOUDFLARE_API_TOKEN > BWS_CLOUDFLARE_API_TOKEN

      - name: Compare shadow secrets against GitHub
        shell: bash
        env:
          SHADOW_NAMES: ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN CLOUDFLARE_API_TOKEN
          GH_ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rc=0; read -ra names <<<"$SHADOW_NAMES"
          sha() { printf '%s' "${1-}" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d' ' -f1; }
          for n in "${names[@]}"; do
            gv="GH_$n"; bv="BWS_$n"
            # An ABSENT GitHub secret and an EMPTY Bitwarden value both hash to
            # e3b0c442..., so without this arm two nothings compare EQUAL and the
            # shadow reports "match" having verified nothing -- the exact defect
            # this whole run exists to catch. Empty on either side is a failure.
            if [ -z "${!gv-}" ] || [ -z "${!bv-}" ]; then echo "shadow $n EMPTY (github=${!gv:+set}${!gv:-unset} bitwarden=${!bv:+set}${!bv:-unset}) -- nothing was compared"; rc=1
            elif [ "$(sha "${!gv-}")" = "$(sha "${!bv-}")" ]; then echo "shadow $n match"; else echo "shadow $n MISMATCH"; rc=1; fi
          done
          exit "$rc"

      # Deterministic attempt-cap backstop, deliberately OUTSIDE the AI-driven
      # monitor process it guards: a misclassification loop cannot talk its way
      # past a separate step that just reads run_attempt. Writes SKIP_RERUN to
      # GITHUB_ENV; the monitor refuses the rerun when it is true.
      - name: Attempt cap (deterministic backstop)
        if: inputs.pending_rerun == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.target_run_id }}
        run: .ci/scripts/ci/check-rerun-attempt.sh

      - name: Monitor jobs and cancel on failure
        id: monitor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          WATCHDOG_TARGET_RUN_ID: ${{ inputs.target_run_id }}
          WATCHDOG_PR_NUMBER: ${{ inputs.pr_number }}
          WATCHDOG_PENDING_RERUN: ${{ inputs.pending_rerun }}
          WATCHDOG_SKIP_RERUN: ${{ env.SKIP_RERUN }}
          # 480s of polling plus the worst-case post-detection tail (AI
          # classification, then force-cancel waiting up to 5 minutes for
          # WATCHDOG_WAIT_PATTERNS jobs) stays under the 15-minute cap.
          WATCHDOG_DEADLINE_SECONDS: '480'
          # "Review Complete" is the OBSERVER check review-status.yml posts
          # against the head SHA; it lands in the same github-actions check
          # suite as the CI jobs, so without this exclusion the watchdog
          # reads its pre-re-review failure as a failed CI job and
          # force-cancels the very run whose green the re-review WAITS FOR
          # (deadlock, seen live 2026-07-31 on run 30660765759 after the
          # check became ruleset-required). review-status.yml's own header
          # demands acyclicity: nothing in CI may observe that check back.
          WATCHDOG_EXCLUDE_PATTERNS: 'Watchdog,CI Complete,Review Complete'
          WATCHDOG_NO_RETRY_PATTERNS: 'Quality,Review Gate'
          # Per-platform legs only. The aggregator ("Install Methods Complete")
          # downloads no binary, and it reports skipped/cancelled when its needs
          # fail, which would make the all-platforms-failed guard never fire.
          WATCHDOG_INSTALL_VALIDATION_PATTERNS: 'Validate Install Methods / Linux,Validate Install Methods / macOS,Validate Install Methods / Windows'
          # Jobs that may still be auto-retried when the failure classifier is
          # unavailable. The class is "boots a VM or pulls images across the
          # network", i.e. failures that are genuinely non-deterministic.
          # Everything else fails fast rather than being retried blind on a
          # judgment nobody made -- see issue #537 and evaluateRetryEligibility.
          # The 07-27 nightly is why: a deterministic Stage Artifacts bug bought
          # a full second attempt before being cancelled anyway.
          # Migration Test joins these because its failures are upstream by
          # construction: it drives six live D1 clones against the Cloudflare
          # API, and run 30443624545 died on Cloudflare's own internal error
          # ("internal error; reference = e_61GNS0_... [code: 7500]") on the
          # SIXTH clone after five succeeded, taking 23 jobs down with it.
          # Note what this list does and does not do: it decides whether a rerun
          # FIRES, not which jobs come back -- GitHub reruns every non-successful
          # job once triggered.
          WATCHDOG_RETRY_ALLOWLIST_PATTERNS: 'E2E,OPS,Fork Isolation,Migration Test'
          WATCHDOG_WAIT_PATTERNS: 'Migration Test'
          # Where the monitor writes failed jobs' COMPLETE logs before anything
          # reruns them. A rerun makes attempt 1's logs unreachable, so without
          # this the evidence for "real break or flake?" is destroyed by the
          # very action taken in response to it.
          WATCHDOG_LOG_CAPTURE_DIR: ${{ runner.temp }}/watchdog-logs
          # Classifier tier 1: Cloudflare / DeepSeek V4 Pro.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Classifier tier 2: Anthropic, on the org's OAuth token. Tier 1 has
          # been returning HTTP 402 (billing) continuously, which is an
          # UNAVAILABLE tier rather than a blip, so without a second provider
          # every failure fell through to the allowlist and a judgment nobody
          # made decided whether to spend a ~500-machine-minute retry.
          #
          # This used to carry an ANTHROPIC_API_KEY line as a preferred
          # x-api-key path "if it ever exists". It never will: on 2026-09-02 the
          # operator ruled out pay-as-you-go API billing, so the credential is
          # not absent-for-now, it is decided against. The reference is gone
          # rather than empty, because an empty one reads as a gap to fill.
          ANTHROPIC_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          script: return await require('./.ci/scripts/ci/watchdog-monitor.cjs')({github, context, core})

      # always(), and if-no-files-found: ignore -- most generations observe no
      # failure at all and capture nothing, which is not an error. This step
      # must also survive a red monitor step, because the generation that
      # classifies a failure is exactly the one that core.setFailed()s.
      - name: Preserve captured failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: watchdog-logs-${{ inputs.target_run_id }}-gen${{ inputs.generation }}
          path: ${{ runner.temp }}/watchdog-logs/
          if-no-files-found: ignore
          retention-days: 14

      # !cancelled(), not the implicit success(). Phase 3b (2026-08-26) made the
      # three by-design paths -- cancelled, left-uncancelled, rerun-pending --
      # exit 0 instead of core.setFailed(), so a red monitor step now means a
      # REAL watchdog error. !cancelled() is kept anyway: it is strictly wider
      # than success(), the chain must continue regardless, and narrowing it
      # would silently drop the chain the first time a genuine error appears.
      #
      # A rerun resets the generation counter: the new
      # attempt earns the full chain budget, like the old attempt-2 watchdog
      # job got a fresh 3-hour clock.
      - name: Dispatch next generation
        if: ${{ !cancelled() && steps.monitor.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          GENERATION: ${{ inputs.generation }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          PENDING_RERUN: ${{ steps.monitor.outputs.pending_rerun }}
          RERUN_EXECUTED: ${{ steps.monitor.outputs.rerun_executed }}
        run: |
          NEXT=$((GENERATION + 1))
          if [ "$RERUN_EXECUTED" = "true" ]; then NEXT=1; fi
          .ci/scripts/ci/dispatch-watchdog.sh --run-id "$TARGET_RUN_ID" \
            --generation "$NEXT" --pending-rerun "${PENDING_RERUN:-false}" \
            --pr-number "$PR_NUMBER" --head-ref "$HEAD_REF"
