name: Console CI - Build (Renet)

on:
  workflow_call:
    inputs:
      next_version:
        required: true
        type: string
      skip_build:
        description: 'Skip build if renet already exists in registry'
        required: false
        type: boolean
        default: false
      renet_tag:
        description: 'Existing bridge tag to extract renet from (when skip_build=true)'
        required: false
        type: string
        default: ''
    outputs:
      artifact_name:
        description: 'Name of the renet binaries artifact'
        value: ${{ jobs.build-renet.outputs.artifact_name || jobs.extract-renet.outputs.artifact_name }}
    secrets:
      APP_PRIVATE_KEY:
        required: false
      ACCOUNT_ED25519_PUBLIC_KEY:
        required: false
      # OTLP_AUTH_TOKEN is no longer needed: renet resolves credentials at
      # runtime via `REDIACC_OTLP_USER`/`REDIACC_OTLP_PASS` env vars
      # injected by the CLI after `rdc subscription login` (renet#51).

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  # Build full renet binaries with embedded assets. The Docker builder image
  # (private/renet/Dockerfile, via build.sh embed_assets) is the SINGLE source
  # of every embedded binary; private/renet/embed-assets.lock.json is the single
  # source of WHICH binaries, at which versions, for which architectures.
  # criu/rsync/CSI are compiled or cross-compiled from pinned commits,
  # rclone/k3s/zot are downloaded at pinned versions with sha256 verification.
  # arm64 criu is cross-compiled from the same pinned commit as amd64 — it used
  # to come from a Debian .deb, which silently shipped 3.17.1 against a declared
  # 4.2.x with a different shared-library set.
  # It also exports the raw native binaries for the runtime image, so there is
  # no separate native-* build any more.
  build-renet:
    name: Renet (Full)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_build }}
    timeout-minutes: 45
    outputs:
      artifact_name: renet-binaries-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      # Staged-embed-assets cache: the ~12-minute cost of this job is
      # `_build_docker_for_assets` (from-scratch CRIU/rsync/CSI compile, arm64
      # under QEMU) feeding embed_assets staging. The staged tree is fully
      # determined by embed-assets.lock.json (pinned versions + sha256), and
      # build.sh's content-based receipt (.staged.json: lockfile sha +
      # per-asset digests) makes embed_assets a VERIFIED no-op on a warm tree,
      # so a stale or corrupt cache blob cannot pass silently -- it just
      # triggers a full restage. Restore after the submodule checkout so
      # hashFiles can read the lockfile.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: embed-cache
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}

      # QEMU lets the Docker builder image's arm64 stages run on this amd64
      # runner (arm64 CRIU comes from a Debian .deb, so this is package
      # extraction under emulation, not a slow source compile).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Install clang for BPF compilation
        # `apt-get update` is mandatory before install: the Azure runner image
        # ships with stale apt metadata referencing a kernel ABI that may have
        # already rotated out of the Ubuntu pool, causing
        # `linux-headers-generic` to 404 on the matching versioned headers
        # package. Refresh metadata first, then install.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm libbpf-dev linux-headers-generic

      - name: Generate BPF bindings
        run: |
          cd private/renet
          go generate ./pkg/ebpf/...

      - name: Run renet unit tests (repodiff/delta/fiemap/kernel/procwalk)
        run: |
          cd private/renet
          go test ./pkg/repodiff/... ./pkg/delta/... ./pkg/fiemap/... ./pkg/kernel/... ./pkg/procwalk/...
          # cmd-level test for the process-ancestry command (compiles cmd/renet,
          # which needs the BPF bindings generated above — Linux only).
          go test ./cmd/renet/ -run TestProcessAncestry

      - name: Build full renet with embedded assets (release)
        env:
          ACCOUNT_ED25519_PUBLIC_KEY: ${{ secrets.ACCOUNT_ED25519_PUBLIC_KEY }}
          # OTLP credentials are NOT baked at build time any more — renet
          # resolves them from env vars at runtime (renet#51).
        run: |
          .ci/scripts/build/build-renet.sh \
            --version "${{ inputs.next_version }}" \
            --output ./private/bin

      # The step above states "OTLP credentials are NOT baked at build time any
      # more". Nothing verified it: check:ci-no-otlp-creds was in `npm run ci`
      # and in no workflow, and it is the ONE gate that needs built binaries, so
      # it could never have lived in a quality job. Here it inspects the real
      # release binaries, which is the only place the claim is falsifiable.
      - name: Assert no OTLP credentials baked into the built binaries
        run: .ci/scripts/quality/check-no-otlp-creds.sh

      # Save even if a later step fails (the staging work is done and valid);
      # the receipt makes a partially-staged tree self-healing on restore.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.embed-cache.outputs.cache-hit != 'true'
        with:
          path: private/renet/pkg/embed/assets
          key: renet-embed-assets-${{ hashFiles('private/renet/embed-assets.lock.json') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: renet-binaries-${{ github.sha }}
          path: |
            private/bin/renet-linux-*
            private/bin/renet-darwin-*
            private/bin/renet-windows-*
            private/bin/criu-linux-*
            private/bin/rsync-linux-*
            private/bin/rclone-linux-*
            private/bin/zot-linux-*
            private/bin/k3s-linux-*
            private/bin/csiprovisioner-linux-*
            private/bin/csisnapshotter-linux-*
            private/bin/snapshotcontroller-linux-*
            private/bin/checksums.sha256
          retention-days: 1
          if-no-files-found: error

  # Extract renet binaries from existing bridge image when build is skipped.
  # Linux binaries come from the cached bridge image; Darwin and Windows binaries
  # are cross-compiled with embedded assets (CRIU/rsync/rclone) extracted from the image.
  extract-renet:
    name: Renet (cached)
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_build && inputs.renet_tag != '' }}
    outputs:
      artifact_name: renet-binaries-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet,account,elite,homebrew-tap

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Linux binaries + cross-compile Darwin/Windows
        run: .ci/scripts/build/extract-renet-from-image.sh --tag "${{ inputs.renet_tag }}" --output ./private/bin

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: renet-binaries-${{ github.sha }}
          path: |
            private/bin/renet-linux-*
            private/bin/renet-darwin-*
            private/bin/renet-windows-*
            private/bin/checksums.sha256
          retention-days: 1
          if-no-files-found: error

  # Native macOS/Windows tests for pkg/procwalk (the process-ancestry walker
  # behind the agent-override legitimacy checks). The Linux-hosted lint/vet
  # never analyzes the darwin/windows build tags, and the real
  # kern.procargs2 / PEB ReadProcessMemory code paths only execute on their
  # native OS, so this is the sole CI coverage for them. Scope is strictly
  # ./pkg/procwalk/...: cmd/renet and pkg/ebpf need the BPF go:generate step
  # (clang/libbpf), which exists only on the Linux runners.
  platform-tests:
    name: Procwalk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ !inputs.skip_build }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: renet

      # Only the renet submodule is needed. A second full checkout with
      # submodules: true re-fetches the parent repo and clones every
      # submodule non-shallowly — the parent re-fetch reproducibly hangs on
      # macos-latest runners until the job times out.
      - name: Init renet submodule (shallow)
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_APP_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth=1 private/renet

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum

      - name: Vet procwalk
        shell: bash
        run: cd private/renet && go vet ./pkg/procwalk/...

      - name: Lint procwalk (scoped)
        shell: bash
        run: |
          cd private/renet
          # Keep the version in sync with .ci/scripts/quality/lint.sh
          GOLANGCI_VERSION="v2.9.0"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
              sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_VERSION"
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          golangci-lint run --timeout=10m --max-issues-per-linter=0 --max-same-issues=0 ./pkg/procwalk/...

      - name: Test procwalk (native syscalls)
        shell: bash
        run: cd private/renet && go test -race -count=1 ./pkg/procwalk/...

  # Cross-compile smoke: every GOOS/GOARCH target compiles WITHOUT the embed
  # payload (committed BPF .o objects satisfy linux; committed .gitkeep
  # placeholders satisfy the go:embed globs; darwin/windows resolve pkg/ebpf
  # to the !linux stub). ~1-2 min, no clang, no assets, no QEMU. Catches
  # //go:build symbol-split breaks (a real darwin one lived at minute ~13 of
  # Renet (Full) in run 29913979252) at minute ~2 instead. Runs on BOTH the
  # full and cached paths; a failure here fails the caller job and gates the
  # pipeline honestly.
  cross-compile-smoke:
    name: Renet (cross-compile smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/app-token
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: console,renet
      # submodules: true would clone ALL five submodules and the least-privilege
      # token above can only see renet -- account/elite clones 404 and fail the
      # checkout (round-3 red). Init exactly the one submodule this job needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Init renet submodule only
        run: git submodule update --init private/renet
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: private/renet/go.sum
      - name: Cross-compile all targets (no payload)
        run: |
          cd private/renet
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$t"
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" go build -tags nolicense -o /dev/null ./cmd/renet/
            echo "::endgroup::"
          done
