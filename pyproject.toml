# THE PYTHON CONFIG FOR THIS REPOSITORY, IN ONE FILE.
#
# WHY IT IS HERE AND NOT IN ruff.toml. Until W1 phase 2 the ruff tables lived in
# a root `ruff.toml` and there was no pytest config at all, because there was no
# pytest: uv, uvx, pip and pipx were all absent on the host these gates run on
# (measured 2026-09-06, recorded in .ci/bootstrap.sh). Phase 1 fixed that, and a
# second tool immediately raised the question of where ITS config goes. Three
# proposals were drafted; docs/ci-overhaul/08-driver-contract.md section 2
# settled it: ONE pyproject.toml at the repo root holding both tables.
#
# The reason is discovery, not taste. Both tools walk up from the file they are
# judging and stop at the first pyproject.toml, so a single root file is found
# from every subdirectory by both of them, with no `--config` argument anywhere.
# That is why .ci/scripts/quality/check-python-lint.sh no longer passes one: a
# `--config` flag is a second place the config path is written down, and this
# repo has already paid for split definitions more than once.
#
# THIS IS NOT A PACKAGING MANIFEST. There is no [project] table and no build
# backend, deliberately. Nothing here is published to PyPI, and `.ci/rediacc_ci`
# is imported by putting `.ci` on sys.path (see .ci/rediacc_ci/paths.py), not by
# installing it. A [project] table would invite `pip install -e .` on a host
# where pip does not exist, which is the dead end this whole workstream started
# from.

# =============================================================================
# ruff -- lint and format
# =============================================================================
# Python lint + format config. Enforced by .ci/scripts/quality/check-python-lint.sh
# (npm run check:ci-python-lint), which is reachable from `npm run ci`.
#
# WHY THIS EXISTS. Until 2026-08-06 this repo had 91 `check:ci-*` gates covering
# TypeScript, shell and Go, and ZERO covering Python -- while 13 of its 15 tracked
# .py files are the Stop-hook program that gates every agent turn. The hook
# modules already carried `# noqa: BLE001` and `# noqa: PLC0415`, so ruff had been
# run against them once, by hand, and nothing had enforced it since: suppressions
# with no gate behind them.
#
# The first thing this config caught was a live NameError in wl_checks.guided_slice
# (F821, fixed in 6e3957e9d) that BOTH hook suites -- 584 and 118 assertions --
# passed straight over, because reaching it needs root=None and a plan-subagent
# triage at once. It then failed SOFT into a bare except that replaced the whole
# worklist guide with an apology. That is the exact class this gate is for.
#
# `select = ["ALL"]` is deliberate: new ruff rules opt IN automatically, and every
# exclusion below is stated here rather than sprinkled as per-line noqa. Nothing is
# silenced to get past a finding -- `RUF100` (unused-noqa) stays ON, so if an ignore
# here ever orphans an existing suppression the gate says so.
[tool.ruff]
target-version = "py312"
line-length = 100

# private/ holds submodules and gitignored sibling repos with their own CI. The
# gate also passes an explicit file list from `git ls-files`, so this is a
# backstop against someone running bare `ruff check .`.
extend-exclude = ["private"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # -- Annotations and docstring style. ~810 ANN + ~250 D findings, all churn.
    #    The hook docstrings are load-bearing PROSE that records why a line is
    #    the way it is; D209/D205/D401 would rewrite the prose to satisfy a
    #    shape rule. Type annotations on 12.4k lines of untyped code buy 5 real
    #    findings (measured with mypy --strict: 1061 errors, 96.7% of them
    #    no-untyped-def/no-untyped-call).
    "ANN",
    "D",
    "DOC",
    "CPY001",
    # INP001: implicit namespace package.
    #
    # THE REASON, AND ITS EXPIRY DATE. `.claude/hooks/stop` is deliberately not
    # an importable package: every module there is reached by a sys.path hop to
    # its own directory, and settings.json invokes the hooks as plain scripts.
    # Adding an __init__.py to satisfy a lint rule would change how a program
    # that gates every agent turn is loaded, for no behavioural gain.
    #
    # SCHEDULED TO CHANGE IN PHASE 5, not silently dropped. W5 ports those hooks
    # into `.claude/rediacc_hooks`, a real package with a real `tests/`
    # directory, at which point the directory this ignore exists for no longer
    # exists either. Re-examine the ignore THEN -- and note that removing it is
    # not free even then, because `.ci/scripts/quality` and `scripts/dev` are
    # also flat directories of scripts and would light up.
    "INP001",

    # -- Owned by the formatter, or documented by ruff as conflicting with it.
    "E501",
    "COM812",
    "ISC001",
    "Q000",
    "Q001",
    "Q002",
    "Q003",

    # -- 373 hits and zero bug yield: "%s" % x is this program's house style,
    #    used consistently across every message catalogue.
    "UP031",

    # -- A Stop hook's stdout IS its interface; the harness parses it.
    "T201",
    "T203",

    # -- Complexity metrics. 95 findings that demand RESTRUCTURING code whose
    #    behaviour is pinned by 702 assertions. Refactoring a hook to satisfy a
    #    metric is the failure mode those suites exist to catch.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR2004",

    # -- Signature and naming churn across an API the suites pin by name.
    "FBT001",
    "FBT002",
    "FBT003",
    "N812",
    "SLF001",
    "PTH", # ~60 os.path -> pathlib rewrites, zero bug yield

    # -- Exception-message and try/except style preferences, not defects.
    "TRY003",
    "TRY300",
    "TRY301",
    "TRY400",
    "EM101",
    "EM102",
    "EM103",

    # -- bandit rules that are false positives FOR THIS PROGRAM specifically.
    "S324", # sha1 here is a cache/dedup key, never a security primitive
    "S603", # list-arg subprocess of git/gh is the design, not an injection
    "S607",
    "S108", # /tmp paths are the harness's own documented scratch contract
    "S110", # duplicates SIM105, and its "log it" advice is wrong for a hook
    #         whose silence on a poll stop is a deliberate context economy

    # -- Commented-out-code and unicode-confusable heuristics. ERA001 cannot
    #    tell prose from code in a file this heavily commented; the RUF00x
    #    confusables fire on legitimate non-ASCII in user-facing strings.
    "ERA001",
    "PERF203",
    "RUF001",
    "RUF002",
    "RUF003",
]

# WHAT A PER-FILE IGNORE IS FOR, since `select = ["ALL"]` means the list above is
# already long: a rule that is correct everywhere EXCEPT in one shape of file.
# Widening the global `ignore` to accommodate tests would switch the rule off for
# the 100 non-test Python files too, which is the opposite of what is wanted.
[tool.ruff.lint.per-file-ignores]
"**/tests/test_*.py" = [
    # S101 (assert used). `assert` IS the pytest interface: pytest rewrites the
    # statement to produce its diff output, so a test written with `if not x:
    # raise` gets a worse failure message and buys nothing. Every OTHER file in
    # this repo is still held to S101, which is the point of scoping it here --
    # an `assert` in a gate is a real finding, because gates run under -O in
    # nobody's environment and a stripped assertion is a check that vanished.
    "S101",
    # Docstring rules are already off repo-wide in the `ignore` list above (the
    # whole "D" set), so a test file needs nothing extra for missing docstrings.
    # Stated rather than listed: a redundant "D103" here would read as load
    # bearing to the next person and survive the day "D" is narrowed.
]

[tool.ruff.format]
docstring-code-format = false

# =============================================================================
# pytest -- the test runner .ci/bootstrap.sh provisions
# =============================================================================
# Run by .ci/rediacc_ci/check_pytest.py (the gate), which is what enforces the
# floors. `pytest` typed by hand from the repo root does the same thing minus
# the anti-vacuity refusals.
[tool.pytest.ini_options]
# The pin is in .devcontainer/toolchain.env; this is only a floor, and it exists
# because `pythonpath` (below) is a pytest 7+ ini key that OLDER pytest silently
# ignores. Silently: the suite would then fail with ModuleNotFoundError and the
# reason would be a version, not the code. minversion turns that into a message.
minversion = "7.0"

# WHERE THE TESTS ARE. One entry today; the driver contract's arbitration names
# three roots for the finished program -- .ci/rediacc_ci/tests, .ci/tests/gates
# and .claude/rediacc_hooks/tests -- and the other two arrive with W5 and W7.
# Add them here as they land, and to check_test_file_orphans' SEARCH_DIRS in the
# same change (that pairing is W2's, and it is one edit, not three).
testpaths = [".ci/rediacc_ci/tests", ".claude/rediacc_hooks/tests"]

# THE IMPORT PATH, IN ONE PLACE. The package directory is `.ci/rediacc_ci`, so
# the importable name is `rediacc_ci` with `.ci` on sys.path. Everything else in
# this repo achieves that with a hand-written `sys.path.insert` -- 33 of them at
# last count, in five different spellings. pytest has an ini key for exactly
# this, so the test suite uses it and the hand-written hop does not reappear
# here. Non-test consumers get the same answer from rediacc_ci.paths.
pythonpath = [".ci"]

# NOT under the repo root. `.pytest_cache/` is NOT in .gitignore (checked with
# `git check-ignore`), so the default location would put an untracked directory
# in every `git status` of a tree that several sessions share. `.ci/cache/` is
# already gitignored and already per-worktree, which is where the rest of this
# workstream's scratch lives (.ci/bootstrap.sh installs uv and pytest there).
cache_dir = ".ci/cache/pytest"

# -ra              a reason line for every non-passing outcome, so a skip is
#                  never silent -- a skipped test reads exactly like a passing
#                  one in the summary count the gate parses.
# --strict-markers an unregistered @pytest.mark typo is an error, not a marker
#                  that quietly matches nothing.
# --strict-config  an unknown key in THIS table is an error. Without it a typo
#                  here (`testpath`, `pythonpaths`) is ignored in silence, and
#                  the failure surfaces as an empty collection much later.
addopts = "-ra --strict-markers --strict-config"

# Default is ["test_*.py", "*_test.py"]. Pinned to one form so the gate's
# corpus-derived floor (which counts `def test_` in these files) and pytest's
# own collection cannot disagree about which files are in scope.
python_files = ["test_*.py"]

# A warning that is only printed is a warning nobody reads. `error` makes the
# suite fail on one instead, which is the same argument the ignore list above
# makes for RUF100: a suppression with no gate behind it is not a decision.
filterwarnings = ["error"]
