# GENERATED by `PYTHONPATH=.ci python3 -m rediacc_ci.deploy.proxy_configs` from wrangler.template.toml and regions.json; edit those and regenerate. `--check` refuses a hand edit.
name = "rediacc-proxy-asia"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# The executor is reached through the account origin's own subdomain, so a client needs no new
# trust decision: it is the domain it already logs in to, with a proxy. prefix.
routes = [
  { pattern = "proxy.asia.rediacc.com", custom_domain = true }
]

[vars]
ACCOUNT_URL = "https://asia.rediacc.com"
REGION = "asia"
ENVIRONMENT = "production"
EXECUTOR_CAP = "25"
EXECUTOR_HEAVY_CAP = "5"

# Introspection goes through this binding, not a public fetch: this Worker and the account
# Worker share the rediacc.com zone, and a same-zone subrequest never reaches another Worker
# (every caller got 401 on the first Phase 2 deploy, 2026-09-24). Same binding as workers/www.
# The named entrypoint is one only a service binding can reach: it marks the request as
# Cloudflare-internal (private/account src/utils/request.ts markServiceBindingEnv).
[[services]]
binding = "ACCOUNT"
service = "rediacc-account-asia"
entrypoint = "CloudflareInternal"

# The executor token source: the account Worker's ExecutorIssuer entrypoint mints a short-lived
# proxy:exec + audit:write token on demand (agent/plans/PLAN-proxy-cd-six-targets.md Design
# item 3), so no long-lived token is stored as a secret. Only the Worker calls it; container
# egress never reaches this binding.
[[services]]
binding = "ISSUER"
service = "rediacc-account-asia"
entrypoint = "ExecutorIssuer"

# The deployed version id, which /v1/ready reports so a deploy smoke can tell the new version
# answers rather than the old one ("deploy success means the rollout started").
[version_metadata]
binding = "CF_VERSION_METADATA"

# The `durable_object` scheduling policy entry (agent/plans/PLAN-executor-durable-object-policy.md
# Design item 2). It carries no max_instances and no
# instance_type: wrangler refuses both under this policy (spike DU6), so the cap of 25 lives in
# src/capacity.ts and each start names its own instance size.
[[containers]]
class_name = "OrgExecutor"
scheduling_policy = "durable_object"

[containers.images.executor]
dockerfile = "./Dockerfile"
build_context = "../.."

[[durable_objects.bindings]]
name = "ORG_EXECUTOR"
class_name = "OrgExecutor"

[[durable_objects.bindings]]
name = "EXECUTOR_CAPACITY"
class_name = "ExecutorCapacity"

# Each Worker script has its own Durable Object namespace, so this migration applies afresh to
# every target.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExecutorContainer"]

# v2 adds the two classes of the durable_object policy; v3 retires the class v1 created.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["OrgExecutor", "ExecutorCapacity"]

[[migrations]]
tag = "v3"
deleted_classes = ["ExecutorContainer"]

# Telemetry export: logs and traces go to the region's destination pair, which the account
# Workers of the region share. Operator ruling 2026-10-23: Cloudflare keeps no copy
# (persist = false).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
destinations = ["otlp-asia-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-asia-traces"]
persist = false
