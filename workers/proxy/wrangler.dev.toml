# The proxy Worker for LOCAL `wrangler dev` only, driven by the check:ci-proxy-wrangler-dev-e2e gate
# (.ci/rediacc_ci/quality/proxy_wrangler_dev_e2e.py). Never deployed.
#
# It differs from wrangler.toml in exactly three ways, and each is why it exists:
#   - no [[services]] ACCOUNT binding: `rediacc-account-eu` is not resolvable under `wrangler dev`,
#     and with the binding absent src/index.ts falls back to fetch(ACCOUNT_URL), which the gate
#     points at a fake account server on loopback;
#   - no routes and no custom domain;
#   - a distinct name, so a dev image tag can never be mistaken for the deployed Worker's.
# EXECUTOR_TOKEN is passed by the gate as `--var` on the command line, never written to a file here.
name = "rediacc-proxy-dev"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]

[vars]
# Overridden by the gate's `--var ACCOUNT_URL:...`; this value only keeps a hand-run from
# reaching production by accident.
ACCOUNT_URL = "http://127.0.0.1:9"

[[containers]]
class_name = "ExecutorContainer"
image = "./Dockerfile"
image_build_context = "../.."
instance_type = "basic"
max_instances = 2

[[durable_objects.bindings]]
name = "EXECUTOR"
class_name = "ExecutorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExecutorContainer"]
