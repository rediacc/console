# The proxy Worker for bench.rediacc.cloud, the internal-only environment (workers/account/wrangler.bench.toml).
# Deployed only by `PYTHONPATH=.ci python3 -m rediacc_ci.deploy.deploy_proxy --target bench`, under
# the deploy-proxy-bench Bitwarden profile. Hand-written, unlike the six generated from
# wrangler.template.toml, and held to the same shape by
# `rediacc_ci.deploy.proxy_configs.config_refusals`: the name proxy-bench, the only route
# proxy.bench.rediacc.cloud, ACCOUNT_URL https://bench.rediacc.cloud, ACCOUNT and ISSUER both bound to
# account-bench, and nothing naming a region or production. check:ci-proxy-cost-guard reads
# it too. Bench exists so PLAN-cloudflare-proxy Phase 2 runs end to end without production
# (operator order 2026-10-24).
#
# The container and Durable Object blocks are the template's: a class name is scoped to its Worker,
# so OrgExecutor here never shares state or instances with any other target's.
name = "proxy-bench"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "proxy.bench.rediacc.cloud", custom_domain = true }
]

[vars]
ACCOUNT_URL = "https://bench.rediacc.cloud"
REGION = "eu"
ENVIRONMENT = "bench"
EXECUTOR_CAP = "25"
EXECUTOR_HEAVY_CAP = "5"
# The E9 reachability drill (PLAN-org-executor-connect-timeout-relocate box E15, src/drill.ts): the
# Worker's probe of the blackholed drill address 192.0.2.10:22 reads hostinger's SSH banner instead,
# so the drill's reports count. Bench only: proxy_configs refuses this var in every other config.
EGRESS_DRILL_PROBE = "192.0.2.10:22=72.61.137.225:22"

# The same-zone reason as wrangler.template.toml: introspection goes through the binding, never a
# public fetch. The named entrypoint is one only a service binding can reach: it marks the request
# as Cloudflare-internal (private/account src/utils/request.ts markServiceBindingEnv).
[[services]]
binding = "ACCOUNT"
service = "account-bench"
entrypoint = "CloudflareInternal"

# The executor token source: account-bench's ExecutorIssuer entrypoint mints a short-lived
# token on demand (agent/plans/PLAN-proxy-cd-six-targets.md Design item 3).
[[services]]
binding = "ISSUER"
service = "account-bench"
entrypoint = "ExecutorIssuer"

# The deployed version id, which /v1/ready reports to the deploy smoke.
[version_metadata]
binding = "CF_VERSION_METADATA"

# The `durable_object` scheduling policy entry (agent/plans/PLAN-executor-durable-object-policy.md
# Design item 2). It carries no max_instances and no
# instance_type: wrangler refuses both under this policy (spike DU6), so the cap of 25 lives in
# src/capacity.ts and each start names its own instance size.
[[containers]]
class_name = "OrgExecutor"
scheduling_policy = "durable_object"

[containers.images.executor]
dockerfile = "./Dockerfile"
build_context = "../.."

[[durable_objects.bindings]]
name = "ORG_EXECUTOR"
class_name = "OrgExecutor"

[[durable_objects.bindings]]
name = "EXECUTOR_CAPACITY"
class_name = "ExecutorCapacity"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExecutorContainer"]

# v2 adds the two classes of the durable_object policy; v3 retires the class v1 created.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["OrgExecutor", "ExecutorCapacity"]

[[migrations]]
tag = "v3"
deleted_classes = ["ExecutorContainer"]

# Telemetry export (agent/plans/PLAN-telemetry-export.md T14): the bench destination pair, which
# account-bench shares. The 2026-10-23 setting kept logs and traces off only until a
# destination existed; Cloudflare still keeps no copy (persist = false).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
destinations = ["otlp-bench-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-bench-traces"]
persist = false
