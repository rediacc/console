name = "rediacc-proxy-eu"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# The executor is reached through the account origin, so a client needs no new
# hostname and no new trust decision: it is the same domain it already logs in to.
routes = [
  { pattern = "proxy.eu.rediacc.com", custom_domain = true }
]

[vars]
ACCOUNT_URL = "https://eu.rediacc.com"

# Introspection goes through this binding, not a public fetch: this Worker and the account
# worker share the rediacc.com zone, and a same-zone subrequest never reaches another Worker
# (every caller got 401 on the first Phase 2 deploy, 2026-09-24). Same binding as workers/www.
[[services]]
binding = "ACCOUNT"
service = "rediacc-account-eu"

# EXECUTOR_TOKEN is a secret, never a var:
#   npx wrangler secret put EXECUTOR_TOKEN --config workers/proxy/wrangler.toml

[[containers]]
class_name = "ExecutorContainer"
image = "./Dockerfile"
# The Dockerfile COPYs packages/* from the repo root; wrangler defaults the build context to the
# Dockerfile's own directory, so without this the image cannot build.
image_build_context = "../.."
# `basic` is 1/4 vCPU and 1 GiB. The executor is a Node process holding an SSH
# pool and a decrypted config, so `lite` (256 MiB) is too small for the runtime,
# while anything larger pays for memory this workload does not use.
instance_type = "basic"
# The only real cost risk is instances pinned awake: 20 basic instances 24/7 is
# about $150/month, 2 is about $15. One instance serves one team of one org, so 2
# covers the trial; raise it deliberately when more teams use the proxy
# (agent/plans/PLAN-cloudflare-proxy.md section 4).
max_instances = 2

[[durable_objects.bindings]]
name = "EXECUTOR"
class_name = "ExecutorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExecutorContainer"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
