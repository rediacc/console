name = "edge-rediacc-www"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "edge.rediacc.com", custom_domain = true }
]

[vars]
ENVIRONMENT = "edge"

# Operator ruling 2026-10-23: Cloudflare keeps no copy of Workers logs or traces.
# This Worker has no OTLP destination yet, so persist = false would export
# nowhere; logs and traces are off until a destination exists.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
persist = false

[observability.traces]
enabled = false
persist = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = ["/*"]

# No D1 or R2 bindings. Account API + config storage on edge.rediacc.com
# are served by the regional edge workers (edge-{eu,us,asia}.rediacc.com ->
# edge-rediacc-account-*); this worker serves marketing + static assets only.

# Service binding to the EU edge regional account worker. Routes
# /account/api/v1/{contact,newsletter} submissions from the marketing
# forms to a worker that has a DB. See wrangler.toml for the rationale.
[[services]]
binding = "ACCOUNT"
service = "edge-rediacc-account-eu"
