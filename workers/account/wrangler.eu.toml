name = "rediacc-account-eu"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "eu.rediacc.com", custom_domain = true }
]

[vars]
REGION = "eu"
WEBAUTHN_RP_ID = "eu.rediacc.com"
WEBAUTHN_ORIGIN = "https://eu.rediacc.com"

# Nightly maintenance at 03:00 UTC (off-peak): audit retention sweep + backup GC.
# Handled by `scheduled` in src/index.ts, which forwards to the account app in
# private/account/src/entry/cloudflare.ts. Without this block the handler ships
# but is never invoked and event_log grows without bound.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "account-db-eu"
database_id = "25c7d816-f2c6-49b0-9053-7ecab3dc14ed"
migrations_dir = "../../private/account/drizzle"

# EU jurisdiction: hard guarantee that data stays within the EU (GDPR compliant)
[[r2_buckets]]
binding = "CONFIG_BUCKET"
bucket_name = "rediacc-configs-eu"
jurisdiction = "eu"

# Backup chunk store (content-addressed backup storage). The bucket is an
# operator/provision step: create it before deploying with this binding.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "rediacc-backups-eu"
jurisdiction = "eu"
