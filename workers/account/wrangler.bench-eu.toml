# bench-eu.rediacc.cloud — internal-only "real Cloudflare D1" environment for the
# dev team to validate changes against actual D1/R2 before the shared regions take a change. Not
# wired into ci.yml or cd-release-edge.yml: deploys are local-only via `PYTHONPATH=.ci python3 -m rediacc_ci.ops.deploy_bench` and
# resets via `PYTHONPATH=.ci python3 -m rediacc_ci.ops.reset_bench`.
#
# Differences from account-eu:
#   - The eu bench; the us and asia benches are wrangler.bench-us.toml and wrangler.bench-asia.toml (PLAN-multi-region-bench.md)
#   - No EU jurisdiction lock on R2 (this is internal test data, not customer)
#   - Reuses prod EU SES credentials at deploy time (set by rediacc_ci.ops.deploy_bench)
#   - ENVIRONMENT = "bench" (requires schema bump in env.ts)

name = "account-bench"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# bench.rediacc.cloud is the host the eu bench had before the 2026-11-13 naming ruling; it is served beside
# bench-eu until every licence names bench-eu (PLAN-multi-region-bench M3) and is dropped in M4.
routes = [
  { pattern = "bench-eu.rediacc.cloud", custom_domain = true },
  { pattern = "bench.rediacc.cloud", custom_domain = true }
]

[vars]
REGION = "eu"
ENVIRONMENT = "bench"
ALLOWED_EMAIL_DOMAINS = "rediacc.com,rediacc.io"
WEBAUTHN_RP_ID = "bench-eu.rediacc.cloud"
WEBAUTHN_ORIGIN = "https://bench-eu.rediacc.cloud"
# The forensics evidence bucket lives in a separate Cloudflare account, so it is reached over the S3 API and not through a binding
# (agent/plans/PLAN-forensics-shipping.md D4). The endpoint and the key pair are secrets.
ACCOUNT_FORENSICS_S3_BUCKET = "forensics-bench"
ACCOUNT_FORENSICS_S3_REGION = "auto"
# Bench is test-only: no captcha for agents or humans (operator ruling 2026-10-13). Pairs with the
# empty VITE_TURNSTILE_SITE_KEY in rediacc_ci/ops/deploy_bench.py. Never add to a production config.
TURNSTILE_ENABLED = "false"
# Bench also stores each outgoing email in the captured_emails D1 table, so an agent can read a
# session elevation link, a magic link or an invitation token with `wrangler d1 execute` (operator
# ruling 2026-10-13, "Bench-only email capture in D1"). No route exposes the table. The account
# server refuses to start with this switch unless ENVIRONMENT is "bench". Never add to a production config.
EMAIL_CAPTURE_D1 = "true"

# Nightly maintenance at 03:00 UTC (off-peak): audit retention sweep + backup GC.
# Handled by `scheduled` in src/index.ts, which forwards to the account app in
# private/account/src/entry/cloudflare.ts. Without this block the handler ships
# but is never invoked and event_log grows without bound.
[triggers]
# Hourly backup maintenance and forensics compaction, the daily audit sweep and reminders at 03:00, and the five-minute forensics detector.
# private/account/src/entry/cloudflare.ts dispatches on these three exact strings.
crons = ["17 * * * *", "0 3 * * *", "*/5 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
destinations = ["otlp-bench-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-bench-traces"]
persist = false

# The keyless bench portal (no Turnstile site key) is built into ./bench/dist, never ./dist: every shared-region config
# uploads ./dist, and a bench build left there shipped a widgetless login to stable on 2026-10-28.
# rediacc_ci.ops.deploy_bench refuses to build when this directory changes (bench_assets_refusal).
[assets]
directory = "./bench/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "account-bench"
database_id = "8c260075-db26-4787-b700-b657f21a5f61"
migrations_dir = "../../private/account/drizzle"

# No jurisdiction lock — bench is not bound to GDPR data residency since it
# only holds test data created by the dev team.
[[r2_buckets]]
binding = "CONFIG_BUCKET"
bucket_name = "configs-bench"

# Backup chunk store (content-addressed backup storage). The bucket is an
# operator/provision step: create it before deploying with this binding.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "backups-bench"

# Console audit objects, one per event (private/account/src/services/audit-store.ts; agent/plans/PLAN-console-audit-r2.md D3). The bucket is an
# operator/provision step with a 730-day expiry rule: create it before deploying with this binding.
[[r2_buckets]]
binding = "AUDIT_BUCKET"
bucket_name = "audit-bench"

# The web console reaches the executor proxy through this binding, not a public fetch: both Workers
# share the rediacc.cloud zone, and a same-zone subrequest never reaches another Worker. CD sets
# EXECUTOR_MODE as a secret only after proxy-bench passes its smoke (agent/plans/PLAN-proxy-cd-six-targets.md
# Design item 2). wrangler refuses a deploy whose binding names a Worker that does not exist yet, so the
# first deploy of a target runs `deploy_account --stub` (a placeholder under this Worker's name, which the proxy
# binds back to), then the proxy (workers/proxy/wrangler.bench-eu.toml), then this Worker for real.
[[services]]
binding = "EXECUTOR"
service = "proxy-bench"

# The regional licence signer (agent/plans/PLAN-enterprise-isolation.md, Design "Bench and local dev"). account-bench holds
# no licence private key: signing goes through this binding to signer-bench-eu, which holds the production key by the
# standing bench ruling. This bench is REGION "eu". wrangler refuses a deploy whose binding names a
# missing Worker, so deploy signer-bench-eu first (rediacc_ci.deploy.deploy_signer --target bench-eu).
[[services]]
binding = "LICENSE_SIGNER"
service = "signer-bench-eu"
entrypoint = "LicenseSigner"
props = { tier = "shared", region = "eu" }

# Pushed agent-grant revocation (agent/plans/PLAN-rmcp-agent-grants.md AG-S5): the account reaches the proxy Worker's GrantRevoker
# entrypoint through this binding, so the proxy Worker must exist first, as for EXECUTOR.
[[services]]
binding = "AGENT_GRANT_REVOKER"
service = "proxy-bench"
entrypoint = "GrantRevoker"

# Replicate mode (private/account/src/services/backup-replicate.service.ts): a new snapshot, a new
# rule and the hourly sweep send a message here; `queue` in src/index.ts kicks one BackupReplicator
# per (subscription, lineage, target store), whose alarm runs the copy. DEPLOY ORDER: both queues
# are a provision step and must exist before the first deploy of this block
# (`wrangler queues create backup-replicate-bench` and `wrangler queues create backup-replicate-bench-dlq`).
# Gated by private/account/tests/integration/replicate-wiring.test.ts.
[[queues.producers]]
binding = "BACKUP_REPLICATE_QUEUE"
queue = "backup-replicate-bench"

[[queues.consumers]]
queue = "backup-replicate-bench"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "backup-replicate-bench-dlq"

# Forensics compaction (private/account/src/entry/cloudflare.ts; PLAN-forensics-shipping.md D5): the hourly and 03:00 crons enqueue one message per
# machine-hour and machine-day, and the `queue` handler in src/index.ts routes the `forensics-compact-` prefix to the account app. The queue is a provision
# step and must exist before the first deploy of this block (`wrangler queues create forensics-compact-bench`).
[[queues.producers]]
binding = "FORENSICS_COMPACT_QUEUE"
queue = "forensics-compact-bench"

[[queues.consumers]]
queue = "forensics-compact-bench"
max_batch_size = 10
max_retries = 5

[[durable_objects.bindings]]
name = "BACKUP_REPLICATOR"
class_name = "BackupReplicator"

# The per-org AI credit ledger (workers/account/src/credit-ledger.ts, PLAN-console-ai-credits.md D4): the proxy reaches it only through its CreditLedgerGate entrypoint.
[[durable_objects.bindings]]
name = "CREDIT_LEDGER"
class_name = "CreditLedger"

# Each Worker script has its own Durable Object namespace, so this migration applies afresh to
# every target.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackupReplicator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CreditLedger"]

# Telemetry mirror (PLAN-d1-scaling Z3): EventLogService writes telemetry event types to this Analytics
# Engine dataset as well as D1. The portal's reads use the SQL API with ACCOUNT_AE_READ_TOKEN.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "telemetry_bench"

# Per-tenant write caps (PLAN-d1-scaling Z6; private/account/src/middleware/tenant-write-cap.ts reads
# these binding names). Approximate per location: a false refusal answers 429 with Retry-After, so a caller that
# retries loses nothing and one that does not loses that write.
[[ratelimits]]
name = "AUDIT_WRITE_LIMIT"
namespace_id = "1104"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "CONFIG_WRITE_LIMIT"
namespace_id = "1204"
simple = { limit = 60, period = 60 }
