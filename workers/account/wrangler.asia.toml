name = "account-asia"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "asia.rediacc.cloud", custom_domain = true }
]

[vars]
REGION = "asia"
ENVIRONMENT = "edge"
WEBAUTHN_RP_ID = "asia.rediacc.cloud"
WEBAUTHN_ORIGIN = "https://asia.rediacc.cloud"

# Nightly maintenance at 03:00 UTC (off-peak): audit retention sweep + backup GC.
# Handled by `scheduled` in src/index.ts, which forwards to the account app in
# private/account/src/entry/cloudflare.ts. Without this block the handler ships
# but is never invoked and event_log grows without bound.
[triggers]
# Hourly backup maintenance, then the daily audit sweep and reminders.
# private/account/src/entry/cloudflare.ts dispatches on these exact strings.
crons = ["17 * * * *", "0 3 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
destinations = ["otlp-asia-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-asia-traces"]
persist = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "account-asia"
database_id = "a1375747-560d-45c7-b2cb-6b47df20f924"
migrations_dir = "../../private/account/drizzle"

# APAC: location hint APAC (no APAC jurisdiction available in R2, data is zero-knowledge encrypted)
[[r2_buckets]]
binding = "CONFIG_BUCKET"
bucket_name = "configs-asia"

# Backup chunk store (content-addressed backup storage). The bucket is an
# operator/provision step: create it before deploying with this binding.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "backups-asia"

# The web console reaches the executor proxy through this binding, not a public fetch: both Workers
# share the rediacc.cloud zone, and a same-zone subrequest never reaches another Worker. CD sets
# EXECUTOR_MODE as a secret only after proxy-asia passes its smoke (agent/plans/PLAN-proxy-cd-six-targets.md
# Design item 2). wrangler refuses a deploy whose binding names a Worker that does not exist yet, so the
# first deploy of a target bootstraps the proxy (workers/proxy/wrangler.asia.toml) before this Worker.
[[services]]
binding = "EXECUTOR"
service = "proxy-asia"

# The regional licence signer (agent/plans/PLAN-enterprise-isolation.md, Design "Signers"). This Worker holds no licence
# private key: every signing call goes through this binding, whose deploy-time props carry the caller's identity.
# wrangler refuses a deploy whose binding names a missing Worker, so signer-asia is deployed first
# (rediacc_ci.deploy.deploy_signer --target asia).
[[services]]
binding = "LICENSE_SIGNER"
service = "signer-asia"
entrypoint = "LicenseSigner"
props = { tier = "shared", region = "asia" }

# Replicate mode (private/account/src/services/backup-replicate.service.ts): a new snapshot, a new
# rule and the hourly sweep send a message here; `queue` in src/index.ts kicks one BackupReplicator
# per (subscription, lineage, target store), whose alarm runs the copy. DEPLOY ORDER: both queues
# are a provision step and must exist before the first deploy of this block
# (`wrangler queues create backup-replicate-asia` and `wrangler queues create backup-replicate-asia-dlq`).
# Gated by private/account/tests/integration/replicate-wiring.test.ts.
[[queues.producers]]
binding = "BACKUP_REPLICATE_QUEUE"
queue = "backup-replicate-asia"

[[queues.consumers]]
queue = "backup-replicate-asia"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "backup-replicate-asia-dlq"

[[durable_objects.bindings]]
name = "BACKUP_REPLICATOR"
class_name = "BackupReplicator"

# Each Worker script has its own Durable Object namespace, so this migration applies afresh to
# every target.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackupReplicator"]
