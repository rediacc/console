name = "rediacc-account-us"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "us.rediacc.com", custom_domain = true }
]

[vars]
REGION = "us"
WEBAUTHN_RP_ID = "us.rediacc.com"
WEBAUTHN_ORIGIN = "https://us.rediacc.com"

# Nightly maintenance at 03:00 UTC (off-peak): audit retention sweep + backup GC.
# Handled by `scheduled` in src/index.ts, which forwards to the account app in
# private/account/src/entry/cloudflare.ts. Without this block the handler ships
# but is never invoked and event_log grows without bound.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
destinations = ["otlp-us-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-us-traces"]
persist = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "account-db-us"
database_id = "073d69a9-fcac-4991-bde2-ce9139570b1a"
migrations_dir = "../../private/account/drizzle"

# US: location hint ENAM (no US jurisdiction available in R2, data is zero-knowledge encrypted)
[[r2_buckets]]
binding = "CONFIG_BUCKET"
bucket_name = "rediacc-configs-us"

# Backup chunk store (content-addressed backup storage). The bucket is an
# operator/provision step: create it before deploying with this binding.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "rediacc-backups-us"

# The web console reaches the executor proxy through this binding, not a public fetch: both Workers
# share the rediacc.com zone, and a same-zone subrequest never reaches another Worker. CD sets
# EXECUTOR_MODE as a secret only after rediacc-proxy-us passes its smoke (agent/plans/PLAN-proxy-cd-six-targets.md
# Design item 2). wrangler refuses a deploy whose binding names a Worker that does not exist yet, so the
# first deploy of a target bootstraps the proxy (workers/proxy/wrangler.us.toml) before this Worker.
[[services]]
binding = "EXECUTOR"
service = "rediacc-proxy-us"
