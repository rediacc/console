# bench-us.rediacc.cloud: the us bench account Worker (agent/plans/PLAN-multi-region-bench.md), the
# real-Cloudflare test twin of account-us. Every name, host and limit here is the `bench` object of the
# us row of regions.json; `rediacc_ci.quality.region_consistency_offline` and `rediacc_ci.deploy.proxy_configs`
# refuse a drift.
#
# NOT DEPLOYABLE YET: `database_id` is the placeholder TO-BE-CREATED-L1 and regions.json marks this bench
# `deployable: false`. The objects are created by box L1 (D1 `account-bench-us` with location enam, R2, queues), which
# replaces the placeholder and flips the flag in one commit; the consistency gate refuses either alone.
# Differences from account-us: ENVIRONMENT = "bench", no captcha, e-mail capture in D1, keyless portal in ./bench/dist.

name = "account-bench-us"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "bench-us.rediacc.cloud", custom_domain = true }
]

[vars]
REGION = "us"
ENVIRONMENT = "bench"
ALLOWED_EMAIL_DOMAINS = "rediacc.com,rediacc.io"
WEBAUTHN_RP_ID = "bench-us.rediacc.cloud"
WEBAUTHN_ORIGIN = "https://bench-us.rediacc.cloud"
# Bench is test-only: no captcha for agents or humans (operator ruling 2026-10-13). Pairs with the
# empty VITE_TURNSTILE_SITE_KEY in rediacc_ci/ops/deploy_bench.py. Never add to a production config.
TURNSTILE_ENABLED = "false"
# Bench also stores each outgoing email in the captured_emails D1 table, so an agent can read a
# session elevation link, a magic link or an invitation token with `wrangler d1 execute` (operator
# ruling 2026-10-13, "Bench-only email capture in D1"). No route exposes the table. The account
# server refuses to start with this switch unless ENVIRONMENT is "bench". Never add to a production config.
EMAIL_CAPTURE_D1 = "true"
# Stripe Checkout asks for Terms of Service consent on bench, which bills only the sandbox pair
# (STRIPE_SANDBOX_*), so the PLAN-terms-acceptance X2 checkout reads it here first. Pinned by
# test_ops_deploy_bench.py, which also refuses the switch in any other account config.
STRIPE_CONSENT_COLLECTION = "1"

# Nightly maintenance at 03:00 UTC (off-peak): audit retention sweep + backup GC.
# Handled by `scheduled` in src/index.ts, which forwards to the account app in
# private/account/src/entry/cloudflare.ts. Without this block the handler ships
# but is never invoked and event_log grows without bound.
[triggers]
# Hourly backup maintenance, then the daily audit sweep and reminders.
# private/account/src/entry/cloudflare.ts dispatches on these exact strings.
crons = ["17 * * * *", "0 3 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
destinations = ["otlp-bench-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-bench-traces"]
persist = false

# The keyless bench portal (no Turnstile site key) is built into ./bench/dist, never ./dist: every shared-region config
# uploads ./dist, and a bench build left there shipped a widgetless login to stable on 2026-10-28.
# rediacc_ci.ops.deploy_bench refuses to build when this directory changes (bench_assets_refusal).
[assets]
directory = "./bench/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "account-bench-us"
database_id = "TO-BE-CREATED-L1"
migrations_dir = "../../private/account/drizzle"

# Production us placement: no jurisdiction, location hint enam at creation (regions.json bench.r2Location).
[[r2_buckets]]
binding = "CONFIG_BUCKET"
bucket_name = "configs-bench-us"

# Backup chunk store (content-addressed backup storage). The bucket is an
# operator/provision step: create it before deploying with this binding.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "backups-bench-us"

# The web console reaches the executor proxy through this binding, not a public fetch: both Workers
# share the rediacc.cloud zone, and a same-zone subrequest never reaches another Worker. CD sets
# EXECUTOR_MODE as a secret only after proxy-bench-us passes its smoke (agent/plans/PLAN-proxy-cd-six-targets.md
# Design item 2). wrangler refuses a deploy whose binding names a Worker that does not exist yet, so the
# first deploy of a target runs `deploy_account --stub` (a placeholder under this Worker's name, which the proxy
# binds back to), then the proxy (workers/proxy/wrangler.bench.toml), then this Worker for real.
[[services]]
binding = "EXECUTOR"
service = "proxy-bench-us"

# The regional licence signer (agent/plans/PLAN-enterprise-isolation.md, Design "Bench and local dev"). account-bench-us holds
# no licence private key: signing goes through this binding to signer-bench-us, which holds the production key by the
# standing bench ruling. This bench is REGION "us". wrangler refuses a deploy whose binding names a
# missing Worker, so deploy signer-bench-us first (rediacc_ci.deploy.deploy_signer --target bench-us).
[[services]]
binding = "LICENSE_SIGNER"
service = "signer-bench-us"
entrypoint = "LicenseSigner"
props = { tier = "shared", region = "us" }

# Replicate mode (private/account/src/services/backup-replicate.service.ts): a new snapshot, a new
# rule and the hourly sweep send a message here; `queue` in src/index.ts kicks one BackupReplicator
# per (subscription, lineage, target store), whose alarm runs the copy. DEPLOY ORDER: both queues
# are a provision step and must exist before the first deploy of this block
# (`wrangler queues create backup-replicate-bench-us` and `wrangler queues create backup-replicate-bench-us-dlq`).
# Gated by private/account/tests/integration/replicate-wiring.test.ts.
[[queues.producers]]
binding = "BACKUP_REPLICATE_QUEUE"
queue = "backup-replicate-bench-us"

[[queues.consumers]]
queue = "backup-replicate-bench-us"
max_batch_size = 10
max_retries = 5
dead_letter_queue = "backup-replicate-bench-us-dlq"

[[durable_objects.bindings]]
name = "BACKUP_REPLICATOR"
class_name = "BackupReplicator"

# Each Worker script has its own Durable Object namespace, so this migration applies afresh to
# every target.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackupReplicator"]

# Telemetry mirror (PLAN-d1-scaling Z3): EventLogService writes telemetry event types to this Analytics
# Engine dataset as well as D1. The portal's reads use the SQL API with ACCOUNT_AE_READ_TOKEN.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "telemetry_bench_us"

# Per-tenant write caps (PLAN-d1-scaling Z6; private/account/src/middleware/tenant-write-cap.ts reads
# these binding names). Approximate per location: a false refusal answers 429 with Retry-After, so a caller that
# retries loses nothing and one that does not loses that write.
[[ratelimits]]
name = "AUDIT_WRITE_LIMIT"
namespace_id = "1105"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "CONFIG_WRITE_LIMIT"
namespace_id = "1205"
simple = { limit = 60, period = 60 }
