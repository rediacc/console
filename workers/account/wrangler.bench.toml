# bench.rediacc.com — internal-only "real Cloudflare D1" environment for the
# dev team to validate changes against actual D1/R2 before promoting to edge or
# production. This environment is intentionally NOT wired into ci.yml or
# cd-v2.yml — deploys are local-only via `PYTHONPATH=.ci python3 -m rediacc_ci.ops.deploy_bench` and
# resets via `PYTHONPATH=.ci python3 -m rediacc_ci.ops.reset_bench`.
#
# Differences from edge-eu:
#   - Single non-regional environment (no us / asia siblings)
#   - No EU jurisdiction lock on R2 (this is internal test data, not customer)
#   - Reuses prod EU SES credentials at deploy time (set by rediacc_ci.ops.deploy_bench)
#   - ENVIRONMENT = "bench" (requires schema bump in env.ts)

name = "rediacc-account-bench"
main = "src/index.ts"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

routes = [
  { pattern = "bench.rediacc.com", custom_domain = true }
]

[vars]
REGION = "eu"
ENVIRONMENT = "bench"
ALLOWED_EMAIL_DOMAINS = "rediacc.com,rediacc.io"
WEBAUTHN_RP_ID = "bench.rediacc.com"
WEBAUTHN_ORIGIN = "https://bench.rediacc.com"
# Bench is test-only: no captcha for agents or humans (operator ruling 2026-10-13). Pairs with the
# empty VITE_TURNSTILE_SITE_KEY in rediacc_ci/ops/deploy_bench.py. Never add to a production config.
TURNSTILE_ENABLED = "false"
# Bench also stores each outgoing email in the captured_emails D1 table, so an agent can read a
# session elevation link, a magic link or an invitation token with `wrangler d1 execute` (operator
# ruling 2026-10-13, "Bench-only email capture in D1"). No route exposes the table. The account
# server refuses to start with this switch unless ENVIRONMENT is "bench". Never add to a production config.
EMAIL_CAPTURE_D1 = "true"

# Nightly maintenance at 03:00 UTC (off-peak): audit retention sweep + backup GC.
# Handled by `scheduled` in src/index.ts, which forwards to the account app in
# private/account/src/entry/cloudflare.ts. Without this block the handler ships
# but is never invoked and event_log grows without bound.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
destinations = ["otlp-bench-logs"]
persist = false

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["otlp-bench-traces"]
persist = false

# The keyless bench portal (no Turnstile site key) is built into ./bench/dist, never ./dist: every production and
# edge config uploads ./dist, and a bench build left there shipped a widgetless login to stable on 2026-10-28.
# rediacc_ci.ops.deploy_bench refuses to build when this directory changes (bench_assets_refusal).
[assets]
directory = "./bench/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "account-db-bench"
database_id = "ac45c2de-053b-404c-bc47-9ad9cbd2bb15"
migrations_dir = "../../private/account/drizzle"

# No jurisdiction lock — bench is not bound to GDPR data residency since it
# only holds test data created by the dev team.
[[r2_buckets]]
binding = "CONFIG_BUCKET"
bucket_name = "rediacc-configs-bench"

# Backup chunk store (content-addressed backup storage). The bucket is an
# operator/provision step: create it before deploying with this binding.
[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "rediacc-backups-bench"

# The web console reaches the executor proxy through this binding, not a public fetch: both Workers
# share the rediacc.com zone, and a same-zone subrequest never reaches another Worker. CD sets
# EXECUTOR_MODE as a secret only after rediacc-proxy-bench passes its smoke (agent/plans/PLAN-proxy-cd-six-targets.md
# Design item 2). wrangler refuses a deploy whose binding names a Worker that does not exist yet, so the
# first deploy of a target bootstraps the proxy (workers/proxy/wrangler.bench.toml) before this Worker.
[[services]]
binding = "EXECUTOR"
service = "rediacc-proxy-bench"
